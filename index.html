{ id:'aws-concurrency', group:'Lambda', title:'Concurrency, scaling & throttling', animate:'partition',
  lede:"Concurrency is the unit Lambda scales and bills on — and the unit that protects (or destroys) your downstream dependencies.",
  say:"Concurrency is the number of simultaneous executions, roughly requests per second × average duration. There's an account-level limit shared by every function in the region, so an unbounded spike in one function can starve the others. Reserved concurrency both caps a function and guarantees it a slice; provisioned concurrency pre-warms environments. The critical design point is that Lambda scales far faster than a relational database can accept connections — which is exactly why RDS Proxy exists.",
  steps:[
    "<b>Concurrency ≈ requests/second × average duration in seconds.</b> 100 rps at 200ms ≈ 20 concurrent executions.",
    "There's an <b>account + region concurrency limit</b> (1,000 by default, raisable). Every function shares it.",
    "<b>Reserved concurrency</b> does two things at once: it <b>caps</b> that function's maximum concurrency, and it <b>reserves</b> that capacity so other functions can't consume it.",
    "Setting reserved concurrency to 0 is the emergency 'stop this function' switch.",
    "<b>Provisioned concurrency</b> is different: pre-initialised, always-warm environments. It doesn't cap anything; it removes cold starts.",
    "Scaling rate: Lambda now scales each function by up to <b>1,000 additional concurrent executions every 10 seconds</b>, independently per function — much faster than the old shared burst pool.",
    "When you exceed the limit, synchronous invocations get <b>429 TooManyRequestsException</b>; asynchronous invocations are retried and eventually sent to a DLQ/on-failure destination; stream sources (Kinesis/DynamoDB) back up and increase iterator age.",
    "<b>Reserved concurrency is your downstream circuit breaker</b>: cap the function that talks to a fixed-capacity resource (an RDS instance, a third-party API with a rate limit) so a traffic spike can't overwhelm it.",
    "Watch <code>ConcurrentExecutions</code>, <code>Throttles</code>, and (for streams) <code>IteratorAge</code>."
  ],
  code:`<span class="cm">// CDK: cap the DB-touching function, guarantee capacity to the critical one</span>
const reportFn = new NodejsFunction(this, 'Report', {
  reservedConcurrentExecutions: 10,      <span class="cm">// protects RDS from a spike</span>
  timeout: Duration.seconds(30)
});

const checkoutFn = new NodejsFunction(this, 'Checkout', {
  reservedConcurrentExecutions: 200      <span class="cm">// guaranteed slice of the account limit</span>
});
checkoutFn.addAlias('live', { provisionedConcurrentExecutions: 20 });  <span class="cm">// no cold starts</span>

<span class="cm">// alarm on throttles — they are silent failures for sync callers</span>
new cw.Alarm(this, 'Throttled', {
  metric: checkoutFn.metricThrottles({ period: Duration.minutes(1) }),
  threshold: 1, evaluationPeriods: 1
});`,
  traps:[
    "One runaway function consuming the account limit throttles <b>every other function in the region</b> — reserve concurrency for critical paths.",
    "Reserved concurrency also <b>subtracts</b> from the unreserved pool available to everything else; over-reserving starves the rest.",
    "Lambda scales to thousands of concurrent executions in seconds; a relational database cannot. Without RDS Proxy or a reserved cap you get connection exhaustion.",
    "Throttled <b>synchronous</b> invocations are visible as 429s to the caller; throttled <b>async</b> ones are retried for up to 6 hours and can silently duplicate work.",
    "For Kinesis/DynamoDB streams, throttling shows up as rising <code>IteratorAge</code> — data getting older, not errors.",
    "Provisioned concurrency doesn't cap concurrency; traffic above it still cold-starts."
  ],
  table:{title:'Reserved vs Provisioned', head:['','Reserved concurrency','Provisioned concurrency'], rows:[
    ['Purpose','Cap + guarantee capacity','Eliminate cold starts'],
    ['Effect on max','Sets a hard ceiling','No ceiling'],
    ['Cost','Free','Billed hourly, used or not'],
    ['Applies to','The function','A version or alias'],
    ['Use when','Protecting a downstream / isolating a function','Latency-critical user-facing path']
  ]},
  cards:[
    {q:"How do you calculate required concurrency?", a:"Roughly requests per second × average duration in seconds. 500 rps at 100ms ≈ 50 concurrent executions; the same 500 rps at 2s ≈ 1,000 — which is the whole default account limit."},
    {q:"Reserved vs provisioned concurrency?", a:"<b>Reserved</b> caps a function's maximum and guarantees it that share of the account limit — free, used for isolation and protecting downstreams. <b>Provisioned</b> pre-initialises warm environments to remove cold starts — costs money continuously, attached to an alias, and doesn't cap anything."},
    {q:"What happens when a function is throttled?", a:"Synchronous invocations return <code>429 TooManyRequestsException</code> to the caller. Asynchronous invocations are retried (up to ~6 hours) then go to a DLQ/on-failure destination. Stream sources simply fall behind — visible as rising <code>IteratorAge</code>."},
    {q:"Why is reserved concurrency a downstream protection mechanism?", a:"Lambda can scale to thousands of concurrent executions in seconds, but an RDS instance or a rate-limited third-party API cannot. Capping the function that talks to that resource turns an unbounded spike into a bounded queue instead of an outage."}
  ],
  quiz:[
    {q:"A Lambda writing to RDS gets 'too many connections' during traffic spikes. Best combination of fixes?", options:["RDS Proxy + reserved concurrency cap on that function","Increase Lambda memory","Add provisioned concurrency","Increase the Lambda timeout"], answer:0,
     why:"RDS Proxy pools and multiplexes connections so hundreds of Lambdas share a few; reserved concurrency bounds how many can exist at once. Memory, PC and timeout don't address connection count."}
  ],
  cheat:[
    "Concurrency ≈ <b>rps × duration(s)</b>. Account limit 1,000/region by default (shared!).",
    "<b>Reserved</b> = cap + guaranteed slice (free). Set to 0 = kill switch. Subtracts from the shared pool.",
    "<b>Provisioned</b> = pre-warmed envs on an alias (paid, no cap).",
    "Scaling: +1,000 concurrency per 10s, per function.",
    "Throttle behaviour: sync → <b>429</b> · async → retry then DLQ · streams → <b>IteratorAge</b> climbs.",
    "Lambda scales faster than RDS accepts connections ⇒ <b>RDS Proxy + reserved cap</b>.",
    "Alarm on <code>Throttles</code>, <code>ConcurrentExecutions</code>, <code>IteratorAge</code>."
  ]
},

{ id:'aws-lambda-gotchas', group:'Lambda', title:'Lambda gotchas that bite in production', animate:'coldstart',
  lede:"The specific behaviours that produce confusing incidents — worth knowing by name.",
  say:"The big ones: <code>callbackWaitsForEmptyEventLoop</code>, which freezes an environment mid-work if you don't understand it; the difference between synchronous, asynchronous and stream invocation and their very different retry semantics; the fact that async invocations retry twice automatically so handlers must be idempotent; and the timeout hierarchy — API Gateway's 29-second cap sits above whatever you set on the function.",
  steps:[
    "<b><code>context.callbackWaitsForEmptyEventLoop</code></b> (callback-style handlers) defaults to <code>true</code>: Lambda waits for the event loop to drain before freezing. An open DB connection or timer therefore keeps the invocation billing until timeout. Setting it to <code>false</code> returns immediately — but any unfinished async work is <b>frozen</b> and may resume, confusingly, on the next invocation.",
    "With <code>async</code> handlers you avoid the flag entirely: the invocation ends when the returned promise settles. Prefer async handlers.",
    "<b>Three invocation types with different semantics.</b> <i>Synchronous</i> (API Gateway, ALB, SDK Invoke): errors return to the caller, no automatic retry. <i>Asynchronous</i> (S3, SNS, EventBridge): Lambda retries <b>twice</b> automatically, then sends to a DLQ/on-failure destination. <i>Stream/poll-based</i> (Kinesis, DynamoDB Streams, SQS): retries until success or expiry, and for shard-ordered sources a poison message <b>blocks the shard</b>.",
    "Because of automatic retries and at-least-once delivery, <b>handlers must be idempotent</b>. Use a deterministic key (message ID, event ID) and a conditional write.",
    "<b>Timeout hierarchy</b>: API Gateway REST/HTTP APIs cap at <b>29 seconds</b> regardless of your Lambda's 15-minute maximum. ALB has its own idle timeout. Always set the function timeout below the caller's.",
    "Set a timeout <b>slightly above p99 duration</b>, not the 15-minute maximum: a hung invocation otherwise burns 15 minutes of billing and holds a concurrency slot.",
    "<b>Payload limits</b>: 6MB synchronous request/response, 256KB asynchronous. Larger payloads go via S3 with a pointer in the event.",
    "<b>SQS partial batch failure</b>: return <code>batchItemFailures</code> so only the failed messages are retried, instead of the whole batch.",
    "<b>Environment variables are visible</b> in the console and API — secrets belong in Secrets Manager/Parameter Store, fetched at init and cached."
  ],
  code:`<span class="cm">// prefer async handlers — no callbackWaitsForEmptyEventLoop foot-gun</span>
export const handler = async (event, context) =&gt; { /* … */ };

<span class="cm">// idempotent async consumer</span>
export const onOrderPlaced = async (event) =&gt; {
  for (const rec of event.Records){
    const id = rec.messageId;
    try {
      await ddb.put({ TableName: 'processed', Item: { id }, ConditionExpression: 'attribute_not_exists(id)' });
    } catch (e) {
      if (e.name === 'ConditionalCheckFailedException') continue;   <span class="cm">// already handled</span>
      throw e;
    }
    await doWork(JSON.parse(rec.body));
  }
};

<span class="cm">// SQS partial batch response — don't reprocess the whole batch</span>
export const consumer = async (event) =&gt; {
  const batchItemFailures = [];
  for (const r of event.Records){
    try { await handle(r); } catch { batchItemFailures.push({ itemIdentifier: r.messageId }); }
  }
  return { batchItemFailures };
};`,
  traps:[
    "Setting <code>callbackWaitsForEmptyEventLoop = false</code> to 'speed things up' silently abandons in-flight async work, which then resumes on a later invocation with unrelated context.",
    "A poison message on a Kinesis/DynamoDB stream <b>blocks its shard</b> until it expires — configure <code>bisectBatchOnFunctionError</code>, <code>maximumRetryAttempts</code> and an on-failure destination.",
    "Non-idempotent async handlers double-process on the automatic retries — duplicate emails, double charges.",
    "A 15-minute timeout on a function that normally takes 300ms means a hung invocation burns 15 minutes of concurrency and money.",
    "API Gateway's 29-second hard cap surprises people who set a 60-second Lambda timeout and get a 504 instead.",
    "Secrets in environment variables are readable by anyone with <code>lambda:GetFunctionConfiguration</code>."
  ],
  cards:[
    {q:"What does <code>callbackWaitsForEmptyEventLoop</code> do?", a:"With callback-style handlers it defaults to <code>true</code>, making Lambda wait for the event loop to empty before freezing the environment — so an open connection or timer keeps the invocation running (and billing) until timeout. Setting it <code>false</code> returns immediately but freezes unfinished async work, which may resume on a later invocation. Using <code>async</code> handlers avoids the issue."},
    {q:"How do retries differ across Lambda invocation types?", a:"<b>Synchronous</b>: no automatic retry, the error goes back to the caller. <b>Asynchronous</b>: Lambda retries twice, then sends to a DLQ/on-failure destination. <b>Stream/poll</b>: retries until success or record expiry, and for ordered sources a poison record blocks the shard."},
    {q:"Why must Lambda handlers be idempotent?", a:"Because async invocations retry automatically and stream/queue sources give at-least-once delivery. The same event can legitimately arrive more than once, so processing must produce the same result — typically via a conditional write on a deterministic key."},
    {q:"What's the effective timeout for a Lambda behind API Gateway?", a:"29 seconds — API Gateway's hard integration timeout — regardless of the function's configured timeout (up to 15 minutes). Anything longer needs an async pattern: return 202 with a job ID and poll, or use WebSockets/Step Functions."}
  ],
  quiz:[
    {q:"An S3-triggered Lambda occasionally processes the same object twice. Why?", options:["Async invocations retry automatically — the handler isn't idempotent","S3 sends duplicate events by design every time","Lambda is misconfigured","The bucket has versioning on"], answer:0,
     why:"S3 triggers are asynchronous invocations, which Lambda retries up to twice on error (and delivery is at-least-once). Handlers must be idempotent — typically a conditional write keyed on the object version or event ID."}
  ],
  cheat:[
    "<b>Use <code>async</code> handlers</b> → avoids <code>callbackWaitsForEmptyEventLoop</code> entirely.",
    "Invocation types: <b>sync</b> (no retry) · <b>async</b> (2 retries → DLQ) · <b>stream/poll</b> (retry till expiry; poison blocks the shard).",
    "⇒ <b>Handlers must be idempotent</b> (conditional write on a deterministic key).",
    "Timeouts: API GW hard cap <b>29s</b>; set fn timeout just above p99, never 15min by default.",
    "Payloads: 6MB sync / 256KB async → use S3 pointers for bigger.",
    "SQS: return <code>batchItemFailures</code> for partial retry. Streams: bisect on error + on-failure destination.",
    "Env vars are visible → secrets in Secrets Manager, cached at init."
  ]
},

{ id:'aws-dynamo', group:'Data', title:'DynamoDB data modelling & single-table design', animate:'partition',
  lede:"You model DynamoDB from the access patterns backwards — the opposite of relational design.",
  say:"In DynamoDB you list the access patterns first, then design keys so each pattern is a single Query on a partition. The partition key determines physical placement, the sort key gives you range queries and hierarchies within a partition, and GSIs give alternate access paths. Single-table design puts multiple entity types in one table using generic PK/SK attributes so related items sit in the same partition and can be fetched in one round trip.",
  steps:[
    "<b>Partition key (PK)</b> is hashed to choose the physical partition. <b>Sort key (SK)</b> orders items within that partition and enables range queries (<code>begins_with</code>, <code>between</code>, <code>&gt;</code>).",
    "<b>Query</b> reads items within a single partition and is efficient. <b>Scan</b> reads the entire table and is what you're trying to avoid.",
    "<b>Design from access patterns.</b> Write them down first — 'get order by id', 'list a customer's orders newest first', 'find orders by status in a date range' — then design keys so each is one Query.",
    "<b>GSI</b> (Global Secondary Index): different PK and SK, its own capacity, <b>eventually consistent only</b>, and it's a separate copy of the projected attributes. <b>LSI</b>: same PK, different SK, must be created with the table, supports strongly consistent reads, and shares the 10GB per-partition limit.",
    "<b>Single-table design</b>: generic <code>PK</code>/<code>SK</code> attributes hold different entity types, so one Query returns a parent and its children together (e.g. <code>PK=ORDER#123</code> returns the order plus all its line items).",
    "<b>Overloaded GSIs</b>: reuse <code>GSI1PK</code>/<code>GSI1SK</code> for several access patterns across entity types — the standard way to keep index count low.",
    "<b>Item size limit is 400KB</b>; large blobs go to S3 with a pointer. <b>Query returns at most 1MB per page</b>, so always handle pagination.",
    "Writes cost by size: <b>1 WCU = 1KB</b>, <b>1 RCU = 4KB strongly consistent</b> (or 8KB eventually consistent). Transactions cost double.",
    "Be honest about the trade-off: DynamoDB gives predictable single-digit-millisecond latency at any scale, but <b>new access patterns can require a new index or a migration</b> — that flexibility is what you gave up."
  ],
  code:`<span class="cm">// single table: order + its items in one partition</span>
PK              SK                    attributes
ORDER#123       META#                 { status, total, customerId, createdAt }
ORDER#123       ITEM#001              { sku, qty, price }
ORDER#123       ITEM#002              { sku, qty, price }

<span class="cm">// GSI1 overloaded: customer's orders, newest first</span>
GSI1PK          GSI1SK
CUSTOMER#42     2026-09-08T10:00Z#ORDER#123

<span class="cm">// one Query returns the order and every line item</span>
await ddb.query({
  TableName: 'app',
  KeyConditionExpression: 'PK = :pk',
  ExpressionAttributeValues: { ':pk': 'ORDER#123' }
});

<span class="cm">// customer's 20 most recent orders</span>
await ddb.query({
  TableName: 'app', IndexName: 'GSI1',
  KeyConditionExpression: 'GSI1PK = :c',
  ExpressionAttributeValues: { ':c': 'CUSTOMER#42' },
  ScanIndexForward: false, Limit: 20
});`,
  traps:[
    "Choosing a low-cardinality partition key (status, tenant, date) creates a <b>hot partition</b> and throttles even when table-level capacity is fine.",
    "<b>GSIs are eventually consistent</b> — reading your own write through a GSI can miss it. Read by primary key when you need read-after-write.",
    "A GSI with insufficient write capacity <b>throttles writes to the base table</b> in provisioned mode.",
    "Scans in production are almost always a modelling mistake; they cost the whole table and get slower as you grow.",
    "LSIs can't be added after table creation and cap a single partition key's data at 10GB.",
    "Single-table design makes analytics queries hard — export to S3/Athena or stream to a warehouse rather than scanning."
  ],
  cards:[
    {q:"How do you approach DynamoDB modelling?", a:"Access patterns first. Enumerate every read/write the application needs, then design PK/SK (and overloaded GSIs) so each pattern is a single Query on one partition. Never start from entities and relationships as you would in SQL."},
    {q:"GSI vs LSI?", a:"<b>GSI</b>: different partition key, added anytime, its own capacity, eventually consistent only, effectively a separate replicated table. <b>LSI</b>: same partition key with a different sort key, must exist at table creation, shares the base table's capacity, supports strongly consistent reads, and imposes a 10GB limit per partition key."},
    {q:"What is single-table design and why?", a:"Storing multiple entity types in one table with generic PK/SK attributes so related items share a partition and can be retrieved in one Query. It eliminates the join and the multiple round trips; the cost is a less obvious schema and harder ad-hoc analytics."},
    {q:"What's the capacity arithmetic?", a:"1 WCU = one 1KB write per second; 1 RCU = one 4KB strongly consistent read (or two 8KB eventually consistent reads) per second. Transactional operations cost double. Item limit 400KB, query page limit 1MB."}
  ],
  quiz:[
    {q:"A table is partitioned by <code>status</code> ('pending'/'shipped'). What's wrong?", options:["Very low cardinality → hot partitions and throttling","Status can't be a partition key","It needs an LSI","Nothing"], answer:0,
     why:"All 'pending' items land in one partition, so that partition's throughput limit is hit no matter how much table-level capacity you provision. Partition keys need high cardinality and even access distribution."}
  ],
  cheat:[
    "<b>Access patterns first.</b> PK = placement, SK = ordering/range within the partition.",
    "Query (one partition, good) vs <b>Scan</b> (whole table, avoid).",
    "GSI: new PK/SK, anytime, own capacity, <b>eventually consistent</b>. LSI: same PK, at creation only, strongly consistent, 10GB/partition cap.",
    "Single-table: generic PK/SK + overloaded GSIs ⇒ parent+children in one Query.",
    "Limits: item <b>400KB</b>, query page <b>1MB</b>. 1 WCU=1KB write · 1 RCU=4KB strong read. Transactions ×2.",
    "Hot partition = low-cardinality PK. Trade-off: speed & scale for <b>query flexibility</b>."
  ]
},

{ id:'aws-dynamo-ops', group:'Data', title:'DynamoDB in production: capacity, hot keys, streams', animate:'partition',
  lede:"Modelling gets you correct; capacity mode, hot-key handling and streams get you through a traffic spike.",
  say:"On-demand mode handles unpredictable traffic without capacity planning and is the sensible default; provisioned with autoscaling is cheaper for steady, predictable load. The failure mode to be able to diagnose is a hot partition: table-level capacity looks fine but one key is throttled — the fix is write sharding or a cache. DynamoDB Streams give you a change log for event-driven fan-out, and TTL gives you free expiry.",
  steps:[
    "<b>On-demand</b>: pay per request, instant scaling, no planning. Best for spiky or unknown traffic, and now much closer in price to provisioned than it used to be.",
    "<b>Provisioned + autoscaling</b>: cheaper for steady predictable load, but autoscaling reacts in minutes, so a sudden spike still throttles.",
    "<b>Adaptive capacity</b> automatically shifts throughput toward hot partitions and can isolate a very hot key, but it isn't instantaneous and won't rescue a fundamentally bad key design.",
    "<b>Hot partition symptom</b>: <code>ThrottledRequests</code> rising while consumed capacity sits well below provisioned. Use CloudWatch Contributor Insights to find the offending key.",
    "<b>Write sharding</b> fixes it: append a suffix (<code>STATUS#pending#3</code>) to spread writes across N partitions, then fan out reads across the shards.",
    "<b>DynamoDB Streams</b> emit an ordered change log per partition (24h retention), consumable by Lambda — the basis for CDC, search indexing, aggregation and the transactional outbox pattern.",
    "<b>TTL</b> deletes expired items for free (asynchronously, typically within 48 hours) — ideal for sessions, caches and short-lived data. Don't rely on it for precise timing.",
    "<b>Transactions</b> (<code>TransactWriteItems</code>) give ACID across up to 100 items, at double the capacity cost and with no long-running transaction concept.",
    "<b>DAX</b> is a write-through, microsecond-latency cache in front of DynamoDB for read-heavy workloads — but it's eventually consistent and adds an operational component."
  ],
  code:`<span class="cm">// write sharding a hot key across 10 partitions</span>
const shard = Math.floor(Math.random() * 10);
await ddb.put({ Item: { PK: \`STATUS#pending#\${shard}\`, SK: \`ORDER#\${id}\`, ... } });
<span class="cm">// reads fan out across all shards and merge</span>
const pages = await Promise.all(
  Array.from({ length: 10 }, (_, s) =&gt; ddb.query({ /* PK = STATUS#pending#s */ }))
);

<span class="cm">// conditional write = optimistic locking / idempotency</span>
await ddb.update({
  Key: { PK, SK },
  UpdateExpression: 'SET #s = :new, version = :v1',
  ConditionExpression: 'version = :v0',            <span class="cm">// fails if someone else wrote</span>
  ExpressionAttributeValues: { ':v0': current, ':v1': current + 1, ':new': 'shipped' }
});

<span class="cm">// stream → Lambda for CDC / search indexing</span>
new lambda.EventSourceMapping(this, 'Cdc', {
  eventSourceArn: table.tableStreamArn,
  startingPosition: lambda.StartingPosition.LATEST,
  batchSize: 100, bisectBatchOnError: true, retryAttempts: 3
});`,
  traps:[
    "Throttling with plenty of unused table capacity almost always means a hot partition, not insufficient provisioning.",
    "Provisioned autoscaling can't react to a spike within seconds — it scales over minutes. Use on-demand for genuinely spiky traffic.",
    "TTL deletion is asynchronous and not prompt — items can remain readable for hours past expiry, so filter on the timestamp in your query too.",
    "Stream records are ordered <b>per partition key</b>, not globally; don't assume a global ordering.",
    "A failing stream consumer blocks its shard and <code>IteratorAge</code> grows — alarm on it.",
    "<code>BatchWriteItem</code> can return <b>unprocessed items</b>; you must retry them with backoff or you silently lose writes."
  ],
  cards:[
    {q:"On-demand vs provisioned capacity — how do you choose?", a:"On-demand for spiky, unpredictable or new workloads: no planning, instant scaling, pay per request. Provisioned with autoscaling for steady predictable traffic where the cost saving is real — accepting that autoscaling reacts over minutes, not seconds."},
    {q:"How do you diagnose and fix a hot partition?", a:"Diagnose: <code>ThrottledRequests</code> rising while consumed capacity is far below provisioned; confirm the key with Contributor Insights. Fix: write sharding (suffix the partition key and fan out reads), a cache in front (DAX/ElastiCache), or a key redesign with higher cardinality."},
    {q:"What are DynamoDB Streams used for?", a:"A per-partition-key ordered change log (24h retention) that triggers Lambda — used for CDC into a search index or warehouse, materialised aggregates, cross-region replication, and the transactional outbox pattern (write the entity and the event atomically, publish from the stream)."},
    {q:"How do you implement optimistic locking in DynamoDB?", a:"Keep a <code>version</code> attribute and write with <code>ConditionExpression: 'version = :expected'</code>, incrementing it. If another writer got there first the condition fails with <code>ConditionalCheckFailedException</code> and you retry with fresh data."}
  ],
  quiz:[
    {q:"Consumed capacity is 40% of provisioned but you're seeing throttles. Cause?", options:["A hot partition — one key exceeds its partition's share","Under-provisioned table","Too many GSIs","Network issue"], answer:0,
     why:"Capacity is distributed across partitions. A single high-traffic key can exhaust its partition's share while the table as a whole looks under-used. Shard the key or cache it."}
  ],
  cheat:[
    "<b>On-demand</b> = spiky/unknown, no planning. <b>Provisioned+autoscale</b> = steady, cheaper, slow to react.",
    "Throttles + low overall usage ⇒ <b>hot partition</b>. Fix: write sharding, DAX/cache, better key.",
    "Streams: ordered per partition key, 24h, → Lambda (CDC, outbox, aggregates). Watch <code>IteratorAge</code>.",
    "TTL = free async delete (~up to 48h late) → also filter by timestamp.",
    "Optimistic locking = <code>ConditionExpression</code> on a version attribute.",
    "<code>BatchWriteItem</code> returns <b>UnprocessedItems</b> — retry with backoff.",
    "Transactions: ≤100 items, 2× cost."
  ]
},

{ id:'aws-rds', group:'Data', title:'RDS, Aurora & RDS Proxy with Lambda', animate:'rdsproxy',
  lede:"Serverless compute plus a connection-limited relational database is a well-known impedance mismatch — and RDS Proxy is the answer.",
  say:"Each Lambda execution environment opens its own database connection, and Lambda scales to hundreds or thousands of environments in seconds, while an RDS instance has a hard <code>max_connections</code>. RDS Proxy sits in between, maintaining a warm pool and multiplexing many client connections onto few database ones — which is exactly what removed our connection exhaustion during traffic spikes. It also handles failover faster because clients keep talking to the proxy endpoint.",
  steps:[
    "Postgres connections are <b>processes</b> and expensive; <code>max_connections</code> scales with instance size (a db.t3.medium is only a few hundred).",
    "Each Lambda <b>execution environment</b> holds its own connection. 500 concurrent Lambdas = 500 connections attempted.",
    "<b>RDS Proxy</b> maintains a pool of warm database connections and multiplexes client connections onto them, so a spike in Lambda concurrency doesn't translate into a spike in database connections.",
    "It also <b>speeds up failover</b> (clients keep the proxy endpoint; the proxy re-points), and can enforce IAM authentication so no password is in the function.",
    "<b>Pinning</b> is the catch: session-level state (a session variable, a prepared statement in some cases, an open transaction, temporary tables) forces the proxy to dedicate a database connection to that client, which defeats multiplexing. Watch <code>DatabaseConnectionsCurrentlySessionPinned</code>.",
    "<b>Aurora</b> is AWS's MySQL/Postgres-compatible engine with a distributed storage layer: faster replication, up to 15 read replicas, and much faster failover than standard RDS.",
    "<b>Aurora Serverless v2</b> scales capacity in fine-grained ACUs and suits spiky workloads — but understand the minimum-capacity cost floor.",
    "Route reads to the <b>reader endpoint</b> and accept replication lag; writes always go to the writer. Read-after-write on a replica is not guaranteed.",
    "Alternative directions: use DynamoDB where the access patterns allow, or the <b>Data API</b> (Aurora Serverless) which is HTTP-based and needs no persistent connection at all."
  ],
  code:`<span class="cm">// pool at module scope, small max, behind the proxy endpoint</span>
import { Pool } from 'pg';
const pool = new Pool({
  host: process.env.PROXY_ENDPOINT,      <span class="cm">// RDS Proxy, not the instance</span>
  max: 1,                                 <span class="cm">// one connection per execution environment</span>
  idleTimeoutMillis: 120_000,
  connectionTimeoutMillis: 5_000
});

export const handler = async (event) =&gt; {
  const { rows } = await pool.query('select * from orders where id = $1', [event.id]);
  return rows[0];
  <span class="cm">// do NOT pool.end() — keep it warm for the next invocation</span>
};

<span class="cm">// CDK</span>
const proxy = db.addProxy('Proxy', {
  secrets: [db.secret], vpc, requireTLS: true, iamAuth: true,
  maxConnectionsPercent: 90, borrowTimeout: Duration.seconds(30)
});`,
  traps:[
    "Calling <code>pool.end()</code> at the end of each handler throws away the connection and forces a new handshake next invocation.",
    "A large <code>max</code> pool size per Lambda multiplies: 200 environments × pool of 10 = 2,000 attempted connections. Use <code>max: 1</code> per environment.",
    "<b>Session pinning</b> silently negates RDS Proxy — long transactions, <code>SET</code> statements and temp tables are the usual causes.",
    "Reading from the reader endpoint immediately after a write can return stale data (replication lag).",
    "Putting a Lambda in a VPC to reach RDS means you also need NAT or VPC endpoints for it to reach other AWS services — a common surprise cost and failure.",
    "Aurora Serverless v2 has a minimum ACU floor, so 'scales to near zero' is not the same as 'costs nothing when idle'."
  ],
  cards:[
    {q:"Why does Lambda + RDS cause connection exhaustion?", a:"Each execution environment holds its own connection, and Lambda scales to hundreds or thousands of environments within seconds, while RDS has a fixed <code>max_connections</code> tied to instance size. The scaling models are fundamentally mismatched."},
    {q:"What does RDS Proxy actually do?", a:"Maintains a warm pool of database connections and multiplexes many client connections onto them, so client concurrency is decoupled from database connection count. It also accelerates failover (the proxy endpoint stays stable) and supports IAM auth so no password lives in the function."},
    {q:"What is session pinning and why does it matter?", a:"When a client uses session-level state — an open transaction, <code>SET</code> variables, temp tables — the proxy must dedicate a database connection to it, which defeats multiplexing. Monitor <code>DatabaseConnectionsCurrentlySessionPinned</code> and avoid session state."},
    {q:"How should a Lambda's pg pool be configured?", a:"Created at module scope so it survives across invocations, pointed at the proxy endpoint, with <code>max: 1</code> (one environment serves one request at a time anyway), a sensible idle timeout, and never <code>end()</code>-ed in the handler."}
  ],
  quiz:[
    {q:"A Lambda opens a pg Pool with <code>max: 10</code> inside the handler and calls <code>pool.end()</code> before returning. Two problems?", options:["Connection churn per invocation, and 10× connections per environment","Nothing wrong","Only the pool size","Only the end() call"], answer:0,
     why:"Creating the pool per invocation pays a TCP+TLS handshake every time and can't reuse anything; <code>max: 10</code> multiplies connections by concurrency. The pool belongs at module scope with <code>max: 1</code>, and should never be ended."}
  ],
  cheat:[
    "1 execution environment = 1 connection; Lambda scales far faster than <code>max_connections</code>.",
    "<b>RDS Proxy</b>: warm pool + multiplexing + fast failover + IAM auth. Watch <b>session pinning</b>.",
    "Pool at <b>module scope</b>, <code>max: 1</code>, never <code>end()</code>.",
    "Aurora: distributed storage, ≤15 replicas, fast failover. Serverless v2 = ACUs with a cost floor.",
    "Reader endpoint = replication lag; no read-after-write guarantee.",
    "Lambda in VPC → needs NAT or VPC endpoints for other AWS services.",
    "Also consider: DynamoDB, or the HTTP <b>Data API</b> (no persistent connections)."
  ]
},

/* ==================== MESSAGING ==================== */
{ id:'aws-messaging', group:'Messaging & orchestration', title:'SQS vs SNS vs EventBridge vs Kinesis', animate:'eventbus',
  lede:"Four services that all 'move messages' — the interview question is which one and why.",
  say:"SQS is a queue: one consumer group, work distribution, retries and a DLQ. SNS is pub/sub fan-out: push to many subscribers, no persistence. EventBridge is a routing bus with content-based filtering, schema registry and third-party sources — the right choice for decoupled event-driven architectures. Kinesis is an ordered, replayable stream for high-throughput analytics where multiple consumers read the same records at their own pace.",
  steps:[
    "<b>SQS</b> — a durable queue. One message is processed by one consumer; scaling consumers distributes work. Standard queues are at-least-once with best-effort ordering; FIFO queues give exactly-once processing and strict ordering per message group, at lower throughput.",
    "<b>SNS</b> — pub/sub fan-out. One publish is pushed to many subscribers (Lambda, SQS, HTTP, email, SMS). No retention: a subscriber that's down misses the message, which is why the <b>SNS→SQS fan-out</b> pattern exists (each subscriber gets its own durable queue).",
    "<b>EventBridge</b> — an event bus with <b>content-based routing rules</b>, a schema registry, archive and replay, scheduled events, and native SaaS/AWS-service sources. Higher latency than SNS but far richer routing.",
    "<b>Kinesis Data Streams</b> — an ordered, replayable log partitioned into shards. Multiple independent consumers can read the same records; retention is 24h up to 365 days. Built for high-throughput ingest and analytics.",
    "<b>Choosing</b>: work queue with retries → SQS. Fan-out a notification to several systems → SNS (or SNS→SQS for durability). Decoupled domain events with filtering and replay → EventBridge. Ordered, high-volume telemetry with multiple readers → Kinesis.",
    "<b>Visibility timeout</b> (SQS) must exceed the consumer's processing time, or the message reappears and is processed twice.",
    "Every queue needs a <b>DLQ</b> with a <code>maxReceiveCount</code> so a poison message is quarantined rather than retried forever, and an alarm on DLQ depth.",
    "<b>All of these are at-least-once</b> in practice — consumers must be idempotent regardless of which you pick."
  ],
  code:`<span class="cm">// SNS → SQS fan-out: each consumer gets its own durable buffer</span>
const topic = new sns.Topic(this, 'OrderPlaced');
const emailQ = new sqs.Queue(this, 'EmailQ', {
  visibilityTimeout: Duration.seconds(90),                <span class="cm">// &gt; handler timeout</span>
  deadLetterQueue: { queue: dlq, maxReceiveCount: 3 }
});
topic.addSubscription(new subs.SqsSubscription(emailQ));

<span class="cm">// EventBridge content-based routing</span>
new events.Rule(this, 'HighValueOrders', {
  eventPattern: {
    source: ['orders'],
    detailType: ['OrderPlaced'],
    detail: { total: [{ numeric: ['&gt;', 1000] }], currency: ['USD'] }
  },
  targets: [new targets.LambdaFunction(reviewFn)]
});`,
  table:{title:'Pick one', head:['','SQS','SNS','EventBridge','Kinesis'], rows:[
    ['Model','Queue','Pub/sub push','Event bus + rules','Ordered log'],
    ['Consumers','One per message','Many (push)','Many (rules)','Many, independent'],
    ['Retention','≤14 days','None','Archive/replay','24h–365d'],
    ['Ordering','FIFO queues only','No','No','Per shard'],
    ['Replay','No','No','Yes (archive)','Yes'],
    ['Filtering','No','Message attributes','Rich content patterns','Consumer-side'],
    ['Best for','Work queues','Fan-out notifications','Decoupled domain events','Telemetry / analytics']
  ]},
  traps:[
    "SNS has <b>no retention</b> — a subscriber that's down loses the message. Use SNS→SQS when delivery must survive an outage.",
    "SQS visibility timeout shorter than processing time causes duplicate processing that looks like a mysterious idempotency bug.",
    "FIFO ordering is per <b>message group ID</b>, not global — and using one group ID for everything serialises your throughput.",
    "EventBridge rules that fail to match silently drop events; test patterns and alarm on <code>FailedInvocations</code>.",
    "Kinesis throughput is per shard (1MB/s or 1,000 records/s in, 2MB/s out) — under-sharding throttles producers.",
    "No DLQ means a poison message is retried until it expires, consuming capacity and hiding the failure."
  ],
  cards:[
    {q:"SQS vs SNS in one line each.", a:"SQS: durable queue, one message → one consumer, retries and DLQ, up to 14 days retention. SNS: pub/sub push fan-out, one message → many subscribers, no retention — if a subscriber is down the message is lost."},
    {q:"Why the SNS→SQS fan-out pattern?", a:"It combines SNS's fan-out with SQS's durability and retry semantics. Each subscriber gets its own queue, so a slow or failed consumer buffers its own backlog without affecting the others, and gets DLQ handling for free."},
    {q:"When would you choose EventBridge over SNS?", a:"When you need content-based routing on the event body, a schema registry, archive and replay, scheduled rules, or native integration with AWS service events and SaaS partners. SNS is simpler and lower-latency but only filters on message attributes."},
    {q:"When is Kinesis the right choice?", a:"High-throughput ordered ingest where multiple independent consumers must read the same records at their own pace, and replay matters — clickstream, telemetry, real-time analytics. Ordering is per shard; retention is 24h to 365 days."},
    {q:"Why must consumers be idempotent regardless of the service?", a:"All of these deliver at-least-once in practice — SQS standard queues, Lambda async retries, Kinesis reprocessing after a failure. Exactly-once end-to-end is achieved by deduplicating on the consumer, not by the transport."}
  ],
  quiz:[
    {q:"An order event must reach billing, email and analytics, and none may lose it if their consumer is down for an hour. Best design?", options:["SNS topic → one SQS queue per consumer","SNS with three Lambda subscribers","One shared SQS queue","EventBridge with no targets"], answer:0,
     why:"SNS gives fan-out but no retention, so a Lambda subscriber that's down loses events. Subscribing a dedicated SQS queue per consumer adds durability, independent backlogs, retries and a DLQ each."}
  ],
  cheat:[
    "<b>SQS</b> = work queue, 1 consumer/message, ≤14d, DLQ, FIFO option.",
    "<b>SNS</b> = push fan-out, <b>no retention</b> → pair with SQS per subscriber.",
    "<b>EventBridge</b> = routing rules on content, schema registry, archive/replay, schedules, SaaS sources.",
    "<b>Kinesis</b> = ordered replayable log, per-shard ordering, many independent consumers, 24h–365d.",
    "SQS <b>visibility timeout &gt; processing time</b>, else duplicates.",
    "Always: DLQ + <code>maxReceiveCount</code> + alarm on DLQ depth.",
    "<b>Everything is at-least-once ⇒ idempotent consumers.</b>"
  ]
},

{ id:'aws-kinesis', group:'Messaging & orchestration', title:'Kinesis Data Streams in depth', animate:'kinesis',
  lede:"Sharding, partition keys and iterator age — the three things that decide whether a streaming pipeline holds up.",
  say:"A stream is split into shards; each shard takes 1MB/s or 1,000 records/s in and 2MB/s out, and ordering is guaranteed per partition key within a shard. The metric that tells you everything is <code>IteratorAge</code> — if it's climbing, consumers aren't keeping up and you're falling behind real time. Partition key choice is the equivalent of DynamoDB's hot-key problem: a low-cardinality key sends everything to one shard.",
  steps:[
    "A stream is divided into <b>shards</b>. Per shard: <b>1MB/s or 1,000 records/s in</b>, <b>2MB/s out</b> shared across standard consumers.",
    "The <b>partition key</b> is hashed to pick a shard. Records with the same partition key always go to the same shard, which is what gives you <b>per-key ordering</b>.",
    "A low-cardinality or skewed partition key creates a <b>hot shard</b> — the same failure mode as a DynamoDB hot partition. Use a high-cardinality key (call ID, device ID, user ID).",
    "<b>IteratorAge</b> = how old the record currently being processed is. Rising iterator age means consumers are behind; it's the primary alarm for any streaming pipeline.",
    "Standard consumers <b>share</b> the 2MB/s egress. <b>Enhanced fan-out</b> gives each consumer its own dedicated 2MB/s and push delivery with lower latency, at extra cost.",
    "<b>On-demand mode</b> removes shard management and scales automatically — usually the right default now unless throughput is steady and large.",
    "<b>Poison records block the shard</b>: because ordering matters, a record that always fails will retry until it expires. Configure <code>bisectBatchOnFunctionError</code>, <code>maximumRetryAttempts</code>, and an on-failure destination.",
    "<b>Kinesis vs SQS</b>: Kinesis when you need ordering, replay, or multiple independent consumers over the same records; SQS when you just need work distribution with retries.",
    "<b>Firehose</b> is the managed delivery arm — buffers and writes to S3/Redshift/OpenSearch with optional format conversion (JSON→Parquet), which is how a raw stream becomes an Athena-queryable data lake."
  ],
  code:`<span class="cm">// producer: high-cardinality partition key</span>
await kinesis.putRecords({
  StreamName: 'calls',
  Records: batch.map(e =&gt; ({
    Data: Buffer.from(JSON.stringify(e)),
    PartitionKey: e.callId            <span class="cm">// per-call ordering, well distributed</span>
  }))
});
<span class="cm">// putRecords is partial-failure capable — ALWAYS check FailedRecordCount</span>

<span class="cm">// consumer with poison-record protection</span>
new lambda.EventSourceMapping(this, 'Consumer', {
  eventSourceArn: stream.streamArn,
  startingPosition: lambda.StartingPosition.LATEST,
  batchSize: 500, maxBatchingWindow: Duration.seconds(5),
  bisectBatchOnError: true, retryAttempts: 3,
  onFailure: new destinations.SqsDestination(dlq),
  parallelizationFactor: 4                 <span class="cm">// 4 concurrent batches per shard</span>
});

<span class="cm">// alarm on falling behind</span>
new cw.Alarm(this, 'Lag', { metric: stream.metricGetRecordsIteratorAgeMilliseconds(),
  threshold: 60_000, evaluationPeriods: 2 });`,
  traps:[
    "<code>putRecords</code> can partially fail — ignoring <code>FailedRecordCount</code> silently drops data. Retry the failed subset with backoff.",
    "A hot partition key throttles one shard while the stream as a whole looks under-utilised — exactly like a DynamoDB hot partition.",
    "Standard consumers share 2MB/s per shard; adding a third consumer can starve the other two. Use enhanced fan-out.",
    "Resharding is disruptive and slow in provisioned mode — on-demand avoids the problem entirely for most workloads.",
    "<code>parallelizationFactor</code> increases throughput per shard but <b>breaks strict per-shard ordering</b> unless you're careful (it maintains order per partition key).",
    "Retention costs money beyond 24 hours — set it to what your replay requirement actually needs."
  ],
  cards:[
    {q:"What are Kinesis's per-shard limits?", a:"Ingest: 1MB/s or 1,000 records/s. Egress: 2MB/s shared across standard consumers (enhanced fan-out gives each consumer its own dedicated 2MB/s). Exceeding ingest throttles producers with <code>ProvisionedThroughputExceededException</code>."},
    {q:"What does IteratorAge tell you?", a:"How far behind real time your consumers are — the age of the record currently being processed. A climbing IteratorAge means consumers can't keep up (too few shards, slow processing, or a poison record blocking a shard). It's the primary alarm for any stream."},
    {q:"How do you choose a partition key?", a:"High cardinality and even distribution, while grouping the records that must stay ordered together. A call ID or device ID is good; a status or region field is a hot-shard generator."},
    {q:"Kinesis vs SQS?", a:"Kinesis: ordered per key, replayable, multiple independent consumers read the same records — analytics, telemetry, CDC. SQS: work distribution, one consumer per message, retries and DLQ, no replay — background jobs."}
  ],
  quiz:[
    {q:"A Kinesis pipeline shows rising IteratorAge on one shard only. Most likely cause?", options:["Skewed partition key creating a hot shard (or a poison record blocking it)","Insufficient Lambda memory globally","The stream retention is too short","Too many shards"], answer:0,
     why:"A single lagging shard points at that shard specifically — either it receives disproportionate traffic because of a low-cardinality partition key, or a record that keeps failing is blocking progress on it."}
  ],
  cheat:[
    "Shard: <b>1MB/s or 1,000 rec/s in · 2MB/s out</b> (shared). Enhanced fan-out = dedicated 2MB/s per consumer.",
    "Partition key → shard → <b>ordering per key</b>. Low cardinality = hot shard.",
    "<b><code>IteratorAge</code> is the alarm.</b> Rising = falling behind.",
    "<code>putRecords</code> partially fails → check <code>FailedRecordCount</code> and retry.",
    "Poison record blocks the shard → bisect on error, retry limit, on-failure destination.",
    "On-demand mode avoids resharding pain. Firehose → S3/Parquet → Athena.",
    "Kinesis = ordered + replay + many consumers. SQS = work distribution."
  ]
},

{ id:'aws-stepfn', group:'Messaging & orchestration', title:'Step Functions & workflow orchestration', animate:'stepfn',
  lede:"When a business process spans several steps, retries and compensations, orchestration beats a chain of Lambdas calling each other.",
  say:"Step Functions is a managed state machine: you declare states, transitions, retries and catch handlers, and it manages state, history and error handling for you. Standard workflows are durable up to a year with exactly-once execution semantics and full audit history; Express workflows are cheap and fast for high-volume short work but at-least-once. The design point is orchestration versus choreography — Step Functions when someone must own the process end to end.",
  steps:[
    "A <b>state machine</b> declares states (Task, Choice, Parallel, Map, Wait, Pass, Succeed, Fail) and transitions in Amazon States Language.",
    "<b>Built-in retry and catch</b> per state: <code>Retry</code> with backoff and jitter, <code>Catch</code> to route failures — removing a huge amount of hand-written error handling.",
    "<b>Standard workflows</b>: up to 1 year, exactly-once execution semantics, full visual execution history, priced per state transition. <b>Express workflows</b>: up to 5 minutes, at-least-once, priced by duration/memory, built for high volume.",
    "<b>Map state</b> fans out over a collection with a configurable concurrency limit; <b>Distributed Map</b> scales that to millions of items from S3.",
    "<b>Callback pattern</b> (<code>waitForTaskToken</code>) pauses the workflow until an external system — including a human — returns the token. This is how approvals and long third-party jobs are modelled.",
    "<b>Direct SDK integrations</b> let a state call DynamoDB, SQS, SNS or ECS without a Lambda in between — less code, less cost, fewer cold starts.",
    "<b>Orchestration vs choreography</b>: Step Functions centralises the process (visible, debuggable, one owner); EventBridge choreography decouples services (each reacts independently, but no single place shows the whole flow).",
    "For distributed transactions, Step Functions is the natural home for the <b>saga pattern</b>: each step has a compensating action invoked by a <code>Catch</code> on failure."
  ],
  code:`<span class="cm">// saga with compensation, in CDK</span>
const reserve = new tasks.LambdaInvoke(this, 'ReserveInventory', { lambdaFunction: reserveFn })
  .addRetry({ errors: ['States.TaskFailed'], maxAttempts: 3, backoffRate: 2, interval: Duration.seconds(2) })
  .addCatch(releaseInventory, { resultPath: '$.error' });

const charge = new tasks.LambdaInvoke(this, 'ChargeCard', { lambdaFunction: chargeFn })
  .addCatch(new sfn.Parallel(this, 'CompensateAll')
    .branch(releaseInventory).branch(refundIfNeeded), { resultPath: '$.error' });

<span class="cm">// human approval via task token</span>
new tasks.LambdaInvoke(this, 'RequestApproval', {
  lambdaFunction: notifyFn,
  integrationPattern: sfn.IntegrationPattern.WAIT_FOR_TASK_TOKEN,
  payload: sfn.TaskInput.fromObject({ token: sfn.JsonPath.taskToken, orderId: sfn.JsonPath.stringAt('$.id') }),
  heartbeat: Duration.hours(24)
});`,
  traps:[
    "Standard workflows bill <b>per state transition</b> — a loop with thousands of iterations gets expensive fast. Use Express or a Map state.",
    "State payloads are capped (256KB) — pass S3 pointers for anything large rather than the data itself.",
    "Express workflows are <b>at-least-once</b>; steps must be idempotent, unlike Standard.",
    "Putting business logic in the state machine definition rather than in Lambdas makes it hard to unit test — keep the machine about flow, not rules.",
    "Very deeply nested Choice states become unreadable; if the diagram is unintelligible, the design probably needs splitting.",
    "Forgetting a heartbeat on a <code>waitForTaskToken</code> task means a lost token hangs the execution until the overall timeout."
  ],
  cards:[
    {q:"Standard vs Express workflows?", a:"<b>Standard</b>: up to 1 year, exactly-once execution, full visual history, billed per state transition — for long-running, auditable business processes. <b>Express</b>: up to 5 minutes, at-least-once, billed by duration and memory — for high-volume short-lived orchestration where idempotency handles duplicates."},
    {q:"Orchestration vs choreography — how do you decide?", a:"Orchestration (Step Functions) when the process has a clear owner, multiple steps with compensations, and you need one place to see and debug the whole flow. Choreography (EventBridge) when services should stay decoupled and react independently — at the cost of no single view of the end-to-end process."},
    {q:"What is the callback / task-token pattern for?", a:"Pausing a workflow until an external actor completes — a human approval, a long-running third-party job, an on-premise system. The task receives a token and the workflow resumes only when <code>SendTaskSuccess</code>/<code>SendTaskFailure</code> is called with it. Always set a heartbeat/timeout."},
    {q:"How do you implement a saga in Step Functions?", a:"Each forward step has a compensating action. Attach a <code>Catch</code> to each Task that routes to the compensation branch for everything already done, in reverse order. The state machine gives you the durable state and history that a hand-rolled saga would need to build."}
  ],
  quiz:[
    {q:"A workflow loops 10,000 times per execution using Standard workflows and the bill is unexpectedly high. Why?", options:["Standard bills per state transition","Standard has a per-execution fee","Lambda is the cost","Logging is enabled"], answer:0,
     why:"Standard workflows are priced per state transition, so a high-iteration loop multiplies cost. Express workflows (priced by duration) or a Map state with batching are the usual fixes."}
  ],
  cheat:[
    "States: Task · Choice · Parallel · <b>Map</b>/Distributed Map · Wait · Pass · Succeed/Fail.",
    "Built-in <b>Retry</b> (backoff+jitter) and <b>Catch</b> per state.",
    "<b>Standard</b>: ≤1yr, exactly-once, full history, <b>per-transition billing</b>. <b>Express</b>: ≤5min, at-least-once, duration billing.",
    "<code>waitForTaskToken</code> = human approval / external callback (+ heartbeat).",
    "Direct SDK integrations avoid needless Lambdas.",
    "<b>Saga</b> = compensating action per step via Catch.",
    "Orchestration (one owner, visible) vs choreography (decoupled, no single view). Payload cap 256KB → S3 pointers."
  ]
},

{ id:'aws-apigw', group:'Platform', title:'API Gateway, authorizers & edge', animate:'apidesign',
  lede:"The front door: routing, auth, throttling and caching before a request ever reaches your code.",
  say:"HTTP APIs are cheaper and faster and cover most needs; REST APIs add request validation, per-method throttling, API keys with usage plans, WAF and caching. The two things I always configure are a Lambda or JWT authorizer with result caching — so auth isn't run on every request — and throttling plus request validation at the gateway, so malformed or abusive traffic never reaches a Lambda I pay for.",
  steps:[
    "<b>HTTP API</b>: lower cost, lower latency, JWT authorizers, simple routing — the default choice. <b>REST API</b>: request/response validation and transformation, API keys and usage plans, per-method throttling, caching, WAF, private endpoints, resource policies.",
    "<b>Authorizers</b>: <b>JWT</b> (built-in validation against a JWKS issuer, e.g. Cognito), <b>Lambda authorizer</b> (custom logic returning an IAM policy or a simple allow/deny), or <b>IAM</b> (SigV4 for service-to-service).",
    "<b>Cache authorizer results</b> (TTL keyed on the identity source) — otherwise you invoke the authorizer Lambda on every single request.",
    "<b>Throttling</b> at account, stage, and method level; <b>usage plans</b> plus API keys give per-client quotas. Reject early rather than paying for a Lambda invocation.",
    "<b>Request validation</b> against a JSON Schema model rejects malformed bodies at the gateway — cheaper and safer than validating inside the function.",
    "<b>29-second integration timeout</b> is a hard cap. Longer work must return 202 with a job id, or use WebSockets/Step Functions.",
    "<b>WebSocket APIs</b> manage persistent connections for you: <code>$connect</code>/<code>$disconnect</code>/<code>$default</code> routes, with a connection ID you store and use with <code>PostToConnection</code> to push messages.",
    "In front of it: <b>CloudFront</b> for caching and TLS termination close to users, plus <b>WAF</b> for rate-based rules and common attack patterns.",
    "Enable <b>access logs</b> with the request ID and integration latency; the gap between <code>Latency</code> and <code>IntegrationLatency</code> tells you whether the gateway or your code is slow."
  ],
  code:`<span class="cm">// CDK: HTTP API + JWT authorizer + throttling</span>
const api = new apigwv2.HttpApi(this, 'Api', {
  corsPreflight: { allowOrigins: ['https://app.example.com'], allowMethods: [CorsHttpMethod.GET, CorsHttpMethod.POST] }
});
api.addRoutes({
  path: '/orders', methods: [apigwv2.HttpMethod.POST],
  integration: new HttpLambdaIntegration('Create', createFn),
  authorizer: new HttpJwtAuthorizer('Jwt', issuerUrl, { jwtAudience: [audience] })
});
api.addStage('prod', { throttle: { rateLimit: 500, burstLimit: 1000 } });

<span class="cm">// WebSocket push</span>
await apiGwManagement.postToConnection({
  ConnectionId: connectionId, Data: Buffer.from(JSON.stringify({ token }))
});   <span class="cm">// GoneException (410) ⇒ delete the stale connection record</span>`,
  traps:[
    "No authorizer result caching means one authorizer Lambda invocation per request — doubling cost and latency.",
    "CORS misconfiguration is the most common API Gateway bug; remember OPTIONS preflight and that the error responses also need CORS headers.",
    "The 29-second timeout catches people whose Lambda timeout is set to 60s — the client gets a 504 while the function keeps running and billing.",
    "Stale WebSocket connection IDs return <code>GoneException</code>; you must delete them from your connection table or the list grows forever.",
    "Skipping request validation means paying for a Lambda invocation to reject obviously malformed input.",
    "Default throttling limits are account-wide — one noisy API can throttle the others."
  ],
  cards:[
    {q:"HTTP API vs REST API — when do you need REST?", a:"When you need request/response validation and transformation, API keys with usage plans, per-method throttling, response caching, WAF integration, private endpoints, or resource policies. Otherwise HTTP API is cheaper, faster and sufficient."},
    {q:"Why cache authorizer results?", a:"Without caching, the authorizer runs on every request — an extra Lambda invocation and its latency on the critical path for each call. Caching keyed on the identity source (the Authorization header) for a few minutes removes almost all of that."},
    {q:"What's the hard timeout, and what do you do about long work?", a:"29 seconds for API Gateway integrations, regardless of the Lambda timeout. Long work must be asynchronous: return 202 with a job ID and let the client poll, push the result over WebSockets, or run it in Step Functions."},
    {q:"How do API Gateway WebSockets work?", a:"The gateway manages the connections and routes <code>$connect</code>, <code>$disconnect</code> and custom/<code>$default</code> routes to Lambdas. You persist the connection ID (typically in DynamoDB) and push messages with <code>PostToConnection</code>; a 410 <code>GoneException</code> means the connection is gone and the record should be deleted."}
  ],
  quiz:[
    {q:"A Lambda behind API Gateway has a 60s timeout. A slow request returns 504 at 29s but CloudWatch shows the function ran for 55s. Why?", options:["API Gateway's 29s integration timeout is a hard cap","The Lambda timed out","CloudWatch is wrong","Client disconnected"], answer:0,
     why:"API Gateway gives up at 29 seconds and returns 504, but the Lambda keeps running (and billing) to completion. Set the function timeout below 29s and make long work asynchronous."}
  ],
  cheat:[
    "<b>HTTP API</b> default (cheap, fast, JWT authz). <b>REST API</b> for validation/usage plans/caching/WAF/private.",
    "Authorizers: JWT · Lambda · IAM. <b>Always enable result caching.</b>",
    "Throttle + usage plans + <b>request validation at the gateway</b> — reject before paying for Lambda.",
    "<b>29s hard integration timeout</b> → 202 + poll, WebSockets, or Step Functions.",
    "WebSocket API: <code>$connect</code>/<code>$disconnect</code>/<code>$default</code> + connection table + <code>PostToConnection</code>; 410 ⇒ delete.",
    "CloudFront + WAF in front. Compare <code>Latency</code> vs <code>IntegrationLatency</code> to locate slowness."
  ]
},

{ id:'aws-cdk', group:'Platform', title:'Infrastructure as Code with CDK', animate:'stepfn',
  lede:"Real code that synthesises CloudFormation — with the power and the footguns that implies.",
  say:"CDK constructs synthesise into CloudFormation, so you get real language features — loops, types, abstraction — while CloudFormation still does the deployment and rollback. The discipline that matters is treating construct IDs as permanent, because changing one causes a replace-and-delete of the resource, and understanding that CDK can't know values that only exist at deploy time — that's what tokens are, and why you can't branch on them.",
  steps:[
    "<b>Constructs</b> compose into <b>Stacks</b> which compose into an <b>App</b>. <code>cdk synth</code> produces CloudFormation templates; <code>cdk deploy</code> applies them.",
    "Three construct levels: <b>L1</b> (<code>Cfn*</code>, a direct 1:1 mapping of the CloudFormation resource), <b>L2</b> (sensible defaults, helper methods, IAM grants), <b>L3</b> (opinionated patterns composing several resources).",
    "<b>Logical IDs are derived from the construct path.</b> Renaming or moving a construct changes the logical ID, which CloudFormation treats as delete-and-create — data loss for stateful resources.",
    "<b>Tokens</b> are placeholders for values only known at deploy time (ARNs, generated names). You can pass them around and interpolate them, but you <b>cannot branch on them</b> at synth time.",
    "<b>Grants are the killer feature</b>: <code>table.grantReadWriteData(fn)</code> writes least-privilege IAM policy for you, which is dramatically safer than hand-writing wildcards.",
    "Use <code>RemovalPolicy.RETAIN</code> on databases, buckets and anything holding data, so a stack deletion doesn't destroy it.",
    "Test with <b>assertions</b> (template snapshot / fine-grained matchers) in CI, and <code>cdk diff</code> in the PR so reviewers see the infrastructure change.",
    "Structure stacks by <b>lifecycle and blast radius</b> — network/data (rarely changes) separate from application (changes constantly) — not by team convenience.",
    "<code>cdk bootstrap</code> per account/region creates the assets bucket and deployment roles; forgetting it is the first error everyone hits."
  ],
  code:`export class ApiStack extends Stack {
  constructor(scope: Construct, id: string, props: ApiStackProps){
    super(scope, id, props);

    const table = new dynamodb.Table(this, 'App', {          <span class="cm">// ⚠ never rename this id</span>
      partitionKey: { name: 'PK', type: dynamodb.AttributeType.STRING },
      sortKey:      { name: 'SK', type: dynamodb.AttributeType.STRING },
      billingMode: dynamodb.BillingMode.PAY_PER_REQUEST,
      removalPolicy: RemovalPolicy.RETAIN,                   <span class="cm">// don't delete my data</span>
      pointInTimeRecovery: true
    });

    const fn = new NodejsFunction(this, 'Handler', {
      runtime: lambda.Runtime.NODEJS_20_X,
      memorySize: 1024, timeout: Duration.seconds(10),
      bundling: { minify: true, sourceMap: true, externalModules: ['@aws-sdk/*'] },
      environment: { TABLE: table.tableName }
    });
    table.grantReadWriteData(fn);                            <span class="cm">// least-privilege IAM, generated</span>
  }
}`,
  traps:[
    "<b>Renaming a construct ID silently replaces the resource.</b> For a table or bucket that means the old one is deleted (unless RETAIN) — check <code>cdk diff</code> for replacements before every deploy.",
    "Branching on a token (<code>if (bucket.bucketName === 'x')</code>) doesn't work — the value is a placeholder at synth time.",
    "Cross-stack references create CloudFormation exports that <b>lock</b> the producing stack: you can't change an exported value while a consumer depends on it. Prefer passing values through props or SSM parameters.",
    "Hand-written wildcard IAM policies undo the main safety benefit — use grants.",
    "Not running <code>cdk diff</code> in CI means infrastructure changes land unreviewed.",
    "Putting stateful and stateless resources in one stack means a failed application deploy can roll back and threaten your data layer."
  ],
  cards:[
    {q:"What happens if you rename a CDK construct ID?", a:"The logical ID changes, so CloudFormation sees a new resource and deletes the old one. For stateful resources that's data loss unless <code>RemovalPolicy.RETAIN</code> is set. Always inspect <code>cdk diff</code> for replacements."},
    {q:"What is a CDK token?", a:"A placeholder for a value that only exists after deployment (an ARN, a generated name, an account ID). You can pass and interpolate tokens, but you cannot inspect or branch on them at synth time — that logic must move into CloudFormation conditions or into runtime code."},
    {q:"What are L1, L2 and L3 constructs?", a:"L1 (<code>Cfn*</code>) map 1:1 to CloudFormation resources — full control, no defaults. L2 add sensible defaults, helper methods and IAM <code>grant*</code> functions. L3 are opinionated patterns composing multiple resources into a solution."},
    {q:"How should stacks be split?", a:"By lifecycle and blast radius: long-lived network and data stacks that rarely change, separate from application stacks that deploy many times a day. That way a failed app deploy can't threaten your database, and cross-stack coupling stays minimal."}
  ],
  quiz:[
    {q:"A developer renames a DynamoDB construct from 'Table' to 'AppTable' and deploys. What happens?", options:["CloudFormation creates a new table and deletes the old one (data loss unless RETAIN)","The table is renamed in place","Nothing changes","Deployment is rejected"], answer:0,
     why:"The logical ID is derived from the construct path, so a rename looks like a different resource. CloudFormation creates the new one and deletes the old — which is why RETAIN and reading <code>cdk diff</code> matter."}
  ],
  cheat:[
    "App → Stacks → Constructs. <code>cdk synth</code> → CloudFormation; <code>cdk deploy</code> applies.",
    "L1 <code>Cfn*</code> (raw) · L2 (defaults + <code>grant*</code>) · L3 (patterns).",
    "<b>Construct IDs are permanent</b> — rename ⇒ replace ⇒ delete. Use <code>RemovalPolicy.RETAIN</code> for data.",
    "<b>Tokens</b> = deploy-time placeholders; can't branch on them at synth.",
    "<code>grant*</code> = generated least-privilege IAM. Avoid hand-written wildcards.",
    "<code>cdk diff</code> in every PR; assertion tests in CI; <code>cdk bootstrap</code> per account/region.",
    "Split stacks by <b>lifecycle/blast radius</b>, not by team."
  ]
},

{ id:'aws-obs', group:'Platform', title:'Observability & cost on AWS serverless', animate:'observability',
  lede:"What to log, what to alarm on, and the handful of levers that actually move a serverless bill.",
  say:"Structured JSON logs with a correlation ID, metrics via EMF so a log line becomes a CloudWatch metric with no extra call, and X-Ray traces to see where a request spent its time across services. For alarms I use symptom-based signals — error rate, p99 latency, DLQ depth, IteratorAge, throttles — not raw CPU. On cost, the biggest serverless levers are right-sizing Lambda memory, cutting log retention and volume, avoiding NAT gateways with VPC endpoints, and S3 lifecycle policies.",
  steps:[
    "<b>Structured logs</b>: JSON with a consistent schema — timestamp, level, correlation/request id, route, tenant, duration. Query with CloudWatch Logs Insights.",
    "<b>Correlation IDs</b> propagated through every hop are what make distributed debugging possible; generate at the edge and pass through headers and message attributes.",
    "<b>EMF (Embedded Metric Format)</b>: emit a specially structured log line and CloudWatch extracts custom metrics from it — no separate <code>PutMetricData</code> call, no extra latency or cost per metric.",
    "<b>X-Ray</b> traces a request across API Gateway, Lambda, DynamoDB and downstream HTTP calls, showing where the time went. Sample rather than tracing everything.",
    "<b>Alarm on symptoms</b>: error rate, p99 latency, throttles, DLQ depth, Kinesis <code>IteratorAge</code>, and 5xx at the gateway. Not CPU, which often means nothing in serverless.",
    "<b>Cost lever 1 — Lambda memory.</b> More memory often reduces duration enough to lower total cost; power-tune rather than assume.",
    "<b>Cost lever 2 — logs.</b> CloudWatch Logs ingestion is frequently a top-three serverless line item. Set retention (never 'never expire'), drop debug logs in production, and sample high-volume paths.",
    "<b>Cost lever 3 — NAT Gateway.</b> Hourly plus per-GB, and easy to avoid with <b>VPC endpoints</b> for S3, DynamoDB and other AWS services.",
    "<b>Cost lever 4 — storage lifecycle.</b> S3 lifecycle rules to Infrequent Access/Glacier, and DynamoDB TTL to expire data you no longer need.",
    "Tag everything by service/team/environment so Cost Explorer can attribute spend — you cannot optimise what you cannot attribute."
  ],
  code:`<span class="cm">// EMF: a log line that becomes a CloudWatch metric</span>
console.log(JSON.stringify({
  _aws: {
    Timestamp: Date.now(),
    CloudWatchMetrics: [{ Namespace: 'Orders', Dimensions: [['Service','Route']],
      Metrics: [{ Name: 'ProcessingMs', Unit: 'Milliseconds' }] }]
  },
  Service: 'orders-api', Route: 'POST /orders',
  ProcessingMs: duration, requestId, tenantId
}));

<span class="cm">// Logs Insights: p99 by route</span>
fields @timestamp, Route, ProcessingMs
| filter ispresent(ProcessingMs)
| stats pct(ProcessingMs, 99) as p99, count() by Route
| sort p99 desc

<span class="cm">// CDK: never leave retention unset</span>
new logs.LogGroup(this, 'Fn', { retention: logs.RetentionDays.TWO_WEEKS });`,
  traps:[
    "Log groups default to <b>never expire</b> — a silent, permanently growing bill.",
    "Logging entire request/response bodies is expensive and a PII risk; log identifiers and sizes, redact the rest.",
    "Alarming on averages hides the tail; alarm on p99 and error rate.",
    "A NAT Gateway added 'so Lambda can reach S3' costs hourly plus per-GB when a free VPC gateway endpoint would do.",
    "X-Ray on every request adds cost and latency at high volume — sample.",
    "Untagged resources make cost attribution impossible after the fact."
  ],
  cards:[
    {q:"What is EMF and why use it?", a:"Embedded Metric Format — a structured log line CloudWatch parses into custom metrics. You get metrics without a separate <code>PutMetricData</code> API call, so no added latency, no throttling risk, and the metric and its log context are the same record."},
    {q:"What should you alarm on in a serverless system?", a:"Symptoms users feel: error rate, p95/p99 latency, API 5xx, Lambda <code>Throttles</code>, DLQ depth, Kinesis/DynamoDB <code>IteratorAge</code>, and queue age. Not CPU or memory, which are largely meaningless signals in Lambda."},
    {q:"Name the biggest serverless cost levers.", a:"1) Right-size Lambda memory (often cheaper at higher memory). 2) CloudWatch Logs — set retention, cut debug logging, sample. 3) Replace NAT Gateway with VPC endpoints for S3/DynamoDB. 4) S3 lifecycle policies and DynamoDB TTL. 5) Reserved/provisioned concurrency only where justified."},
    {q:"Why do correlation IDs matter more in serverless?", a:"Because one user request fans out across API Gateway, several Lambdas, queues and streams, each with its own log group. Without a shared ID propagated through headers and message attributes there's no way to reconstruct what happened."}
  ],
  quiz:[
    {q:"Which is usually a surprise line item in a serverless AWS bill?", options:["CloudWatch Logs ingestion and retention","Lambda invocations","DynamoDB on-demand reads","S3 PUT requests"], answer:0,
     why:"Log groups default to infinite retention and verbose logging is cheap to add, so log ingestion and storage often become one of the largest costs — and it's the easiest to fix."}
  ],
  cheat:[
    "Structured JSON logs + <b>correlation ID</b> through every hop. Query with Logs Insights.",
    "<b>EMF</b> = metrics from a log line (no PutMetricData call). X-Ray for cross-service traces (sample it).",
    "Alarm on <b>symptoms</b>: error rate, p99, 5xx, Throttles, DLQ depth, IteratorAge.",
    "Cost: <b>power-tune memory</b> · <b>log retention + volume</b> · <b>VPC endpoints instead of NAT</b> · S3 lifecycle / DDB TTL.",
    "Log groups default to <b>never expire</b> — always set retention.",
    "Tag by service/team/env or you can't attribute spend."
  ]
},

{ id:'aws-iam', group:'Platform', title:'IAM, least privilege & serverless security', animate:'jwt',
  lede:"Almost every AWS security incident traces back to an over-permissive policy or a leaked long-lived credential.",
  say:"IAM evaluation is: explicit deny wins, then an explicit allow is required, otherwise deny by default. In serverless, each Lambda gets its own execution role scoped to exactly the resources it touches — CDK's <code>grant*</code> methods generate that automatically. No long-lived access keys anywhere: roles for compute, OIDC federation for CI/CD, and Secrets Manager or Parameter Store for anything else, fetched at init and cached.",
  steps:[
    "<b>Policy evaluation</b>: explicit <code>Deny</code> always wins → otherwise an explicit <code>Allow</code> is required → otherwise implicit deny. Add SCPs and permission boundaries as outer limits.",
    "<b>One role per function</b>, scoped to exactly the resources it needs. A shared 'lambda-role' with wildcards means any compromised function has the union of everyone's permissions.",
    "<b>CDK <code>grant*</code></b> methods generate least-privilege policies with the right actions and resource ARNs — dramatically better than hand-written policies.",
    "<b>No long-lived access keys.</b> Compute uses roles; CI/CD uses <b>OIDC federation</b> (GitHub Actions → an IAM role) so no secrets are stored; humans use SSO with short-lived credentials.",
    "<b>Secrets</b> in Secrets Manager (rotation, cross-account) or Parameter Store SecureString (cheaper), fetched at Lambda <b>init</b> and cached — never in environment variables, which are visible to anyone with <code>GetFunctionConfiguration</code>.",
    "<b>Resource policies</b> (S3 bucket policies, KMS key policies) are the other half of access control and can grant cross-account access without a role assumption.",
    "<b>Encryption</b>: TLS in transit everywhere; at rest, S3/DynamoDB/RDS encryption with KMS. Use customer-managed keys where you need key-level audit or cross-account control.",
    "<b>Audit</b>: CloudTrail for API calls, Config for drift, GuardDuty for threat detection, Access Analyzer to find resources shared outside your account.",
    "Test permissions the same way you test code: deploy with least privilege from the start rather than starting with <code>*</code> and 'tightening later', which never happens."
  ],
  code:`<span class="cm">// least privilege, generated</span>
table.grantReadData(readerFn);              <span class="cm">// dynamodb:GetItem/Query/Scan on THIS table</span>
bucket.grantPut(uploaderFn);                <span class="cm">// s3:PutObject on THIS bucket only</span>
secret.grantRead(apiFn);

<span class="cm">// fetch secrets at INIT, cache for the environment's lifetime</span>
const client = new SecretsManagerClient({});
const secret = JSON.parse((await client.send(
  new GetSecretValueCommand({ SecretId: process.env.SECRET_ARN }))).SecretString);

<span class="cm">// GitHub Actions via OIDC — no stored AWS keys</span>
- uses: aws-actions/configure-aws-credentials@v4
  with:
    role-to-assume: arn:aws:iam::123456789012:role/github-deploy
    aws-region: ap-southeast-1`,
  traps:[
    "<code>Action: \"*\"</code> or <code>Resource: \"*\"</code> in a policy is the single most common finding in an AWS security review.",
    "Secrets in Lambda environment variables are readable by anyone with <code>lambda:GetFunctionConfiguration</code> and appear in the console.",
    "Fetching a secret inside the handler adds an API call to every invocation — fetch at init and cache, with a refresh strategy for rotation.",
    "A public S3 bucket policy or an overly broad <code>Principal: \"*\"</code> is still the classic data-breach mechanism; enable Block Public Access at the account level.",
    "Long-lived IAM user access keys in CI are the usual root cause of credential leaks — use OIDC.",
    "Granting <code>iam:PassRole</code> broadly effectively grants every permission any passable role has — a well-known privilege-escalation path."
  ],
  cards:[
    {q:"How does IAM evaluate a request?", a:"Explicit <code>Deny</code> anywhere wins immediately. Otherwise an explicit <code>Allow</code> must exist (in an identity policy, resource policy, or both as required). Otherwise the request is denied by default. SCPs and permission boundaries act as outer ceilings on what can be allowed."},
    {q:"Why one IAM role per Lambda?", a:"To bound the blast radius. A shared role gives every function the union of all permissions, so compromising the least important function grants access to everything. Per-function roles scoped by CDK <code>grant*</code> keep it minimal and self-documenting."},
    {q:"Where do secrets belong in serverless?", a:"Secrets Manager (with rotation) or Parameter Store SecureString, fetched during Lambda init and cached in module scope for the environment's lifetime. Never in environment variables, which are visible to anyone who can read the function configuration."},
    {q:"How do you give CI/CD access to AWS without storing keys?", a:"OIDC federation: the CI provider (e.g. GitHub Actions) presents a signed token, and an IAM role with a trust policy scoped to that repository/branch is assumed for short-lived credentials. No long-lived access keys exist to leak."}
  ],
  quiz:[
    {q:"Which is the strongest reason to give each Lambda its own execution role?", options:["Blast radius — a compromised function only gets its own permissions","It's faster","It reduces cold starts","IAM requires it"], answer:0,
     why:"Per-function roles bound what an attacker gains from compromising any single function. A shared role hands them the union of every function's permissions."}
  ],
  cheat:[
    "Evaluation: <b>explicit Deny &gt; explicit Allow &gt; implicit deny</b>; SCPs/boundaries cap the maximum.",
    "<b>One role per function</b>, scoped by CDK <code>grant*</code>. No <code>Action:*</code>/<code>Resource:*</code>.",
    "<b>No long-lived keys</b>: roles for compute, <b>OIDC</b> for CI, SSO for humans.",
    "Secrets → Secrets Manager / SSM SecureString, fetched at <b>init</b>, cached. Never env vars.",
    "Resource policies (S3/KMS) are the other half; Block Public Access on by default.",
    "Audit: CloudTrail · Config · GuardDuty · Access Analyzer. Beware broad <code>iam:PassRole</code>."
  ]
},
