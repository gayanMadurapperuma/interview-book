{ id:'process', group:'Production', title:'process, signals & graceful shutdown', animate:'nexttick',
  lede:"How your service starts, reads config, and — most importantly — stops without dropping requests.",
  say:"On a deploy or scale-down the orchestrator sends SIGTERM and then SIGKILL after a grace period. Graceful shutdown means: stop accepting new work, finish in-flight requests, close DB and queue connections, then exit — with a hard timeout so a stuck request can't hang the pod. Skipping this is exactly why teams see intermittent 502s during every rolling deploy.",
  steps:[
    "<code>process</code> exposes <code>env</code>, <code>argv</code>, <code>pid</code>, <code>memoryUsage()</code>, <code>uptime()</code>, exit codes and lifecycle events.",
    "<code>process.env</code> values are <b>always strings</b> — <code>'false'</code> is truthy, <code>'0'</code> is truthy. Parse and validate config at startup and fail fast on missing keys.",
    "<code>process.nextTick(fn)</code> queues ahead of promise microtasks; it exists so an API can guarantee its callback is always async. Recursive use <b>starves the loop</b>.",
    "<b>SIGTERM</b> is the polite 'please stop' from Kubernetes/ECS/systemd. <b>SIGINT</b> is Ctrl-C. <b>SIGKILL</b> cannot be caught — you get whatever grace period the platform allows (k8s default 30s).",
    "Graceful shutdown order: <b>1)</b> flip readiness to failing so the LB stops sending traffic, <b>2)</b> <code>server.close()</code> to stop accepting new connections, <b>3)</b> wait for in-flight requests, <b>4)</b> close DB/cache/queue connections, <b>5)</b> exit 0 — with a hard <code>setTimeout(...).unref()</code> fallback.",
    "Add a small delay between failing readiness and closing the server — LBs need a few seconds to notice, and requests already routed must still be served.",
    "<code>process.exitCode = 1</code> is preferable to <code>process.exit(1)</code>: it lets pending I/O (like a final log flush) finish rather than truncating it.",
    "<code>uncaughtException</code> and <code>unhandledRejection</code> are last-resort <b>logging</b> hooks. Log with full context, then exit — the process state after an uncaught throw is not trustworthy."
  ],
  code:`let shuttingDown = false;
app.get('/readyz', (req, res) =&gt; res.status(shuttingDown ? 503 : 200).end());

async function shutdown(signal){
  if (shuttingDown) return;
  shuttingDown = true;
  logger.info({ signal }, 'shutting down');

  const hard = setTimeout(() =&gt; { logger.fatal('forced exit'); process.exit(1); }, 15_000);
  hard.unref();

  await sleep(5_000);                      <span class="cm">// let the LB notice /readyz failing</span>
  await new Promise(r =&gt; server.close(r)); <span class="cm">// stop new, drain in-flight</span>
  server.closeIdleConnections?.();
  await Promise.allSettled([db.end(), redis.quit(), queue.close()]);
  process.exit(0);
}
process.on('SIGTERM', () =&gt; shutdown('SIGTERM'));
process.on('SIGINT',  () =&gt; shutdown('SIGINT'));`,
  traps:[
    "<code>server.close()</code> alone doesn't close idle keep-alive sockets — without <code>closeIdleConnections()</code> shutdown can hang until the grace period expires.",
    "Kubernetes sends SIGTERM and removes the pod from endpoints <b>concurrently</b>, not in order. Without the readiness delay, requests already in flight from the LB hit a closing server.",
    "<code>process.exit()</code> truncates pending stdout writes — logs from the final moments can be lost. Prefer setting <code>exitCode</code>, or flush explicitly.",
    "Reading config lazily deep in the code means a missing env var causes a 3am failure instead of a startup crash. Validate the whole config object at boot.",
    "Long-running jobs started in a request outlive the shutdown window; move them to a queue so a restart is safe."
  ],
  terms:[
    {term:"Readiness vs liveness", desc:"Two different probes with two different meanings.", detail:"<b>Liveness</b>: is the process wedged and in need of a restart? <b>Readiness</b>: should it receive traffic right now? During shutdown you fail readiness (drain) but keep liveness passing, otherwise the orchestrator kills you mid-drain.", code:`app.get('/livez',  (_, res) =&gt; res.send('ok'));          <span class="cm">// process is alive</span>\napp.get('/readyz', (_, res) =&gt; res.status(ready() ? 200 : 503).end());`},
    {term:"Config validation at boot", desc:"Fail fast on bad configuration rather than at 3am.", detail:"Parse env once into a typed, validated object at startup and export that — never read <code>process.env</code> scattered through the codebase. A schema (zod/envalid) gives you defaults, coercion and a clear crash message.", code:`const Env = z.object({\n  PORT: z.coerce.number().default(3000),\n  DATABASE_URL: z.string().url(),\n  LOG_LEVEL: z.enum(['debug','info','warn','error']).default('info')\n});\nexport const env = Env.parse(process.env);   <span class="cm">// throws at boot</span>`},
    {term:"nextTick vs setImmediate", desc:"nextTick runs before the loop continues; setImmediate runs in the check phase.", detail:"nextTick's original purpose was to let an API defer a callback that might otherwise fire synchronously, keeping calling code's control flow predictable. Recursion in it blocks the loop entirely.", code:`function readCached(key, cb){\n  if (cache.has(key)) return process.nextTick(cb, null, cache.get(key));  <span class="cm">// always async</span>\n  fs.readFile(key, cb);\n}`}
  ],
  cards:[
    {q:"Walk through a correct graceful shutdown.", a:"1) Fail the readiness probe. 2) Wait a few seconds so the LB stops routing. 3) <code>server.close()</code> and <code>closeIdleConnections()</code> to stop new connections while in-flight requests finish. 4) Close DB/cache/queue connections. 5) <code>process.exit(0)</code>. Plus an unref'd hard-timeout that force-exits if anything hangs."},
    {q:"Why is there a delay between failing readiness and closing the server?", a:"Kubernetes removes the pod from the Service endpoints asynchronously, and load balancers cache endpoints for a few seconds. Closing immediately means traffic already routed to you gets connection-refused. The sleep covers that propagation window."},
    {q:"<code>process.exit()</code> vs <code>process.exitCode</code>?", a:"<code>exit()</code> terminates immediately and can truncate pending async writes (including your final log lines). Setting <code>exitCode</code> lets the event loop drain naturally and then exit with that code."},
    {q:"Why validate config at startup?", a:"Because <code>process.env</code> values are always strings and missing keys are silently <code>undefined</code>. Parsing everything through a schema at boot turns a 3am runtime failure into an immediate, obvious startup crash with a clear message."}
  ],
  quiz:[
    {q:"During rolling deploys a service returns intermittent 502s. The app handles SIGTERM by calling <code>process.exit(0)</code> immediately. Fix?", options:["Drain: fail readiness, stop accepting, finish in-flight, then exit","Increase replicas","Catch SIGKILL","Disable keep-alive"], answer:0,
     why:"Exiting immediately kills in-flight requests. A proper drain sequence lets the LB stop routing and lets active requests complete before the process exits. (SIGKILL cannot be caught at all.)"}
  ],
  cheat:[
    "<code>process.env</code> is <b>all strings</b> → parse + validate at boot (zod/envalid), fail fast.",
    "SIGTERM = polite stop (k8s, 30s default grace) · SIGINT = Ctrl-C · <b>SIGKILL uncatchable</b>.",
    "Shutdown: <b>fail readiness → sleep → server.close + closeIdleConnections → drain → close deps → exit</b>, with an unref'd hard timeout.",
    "Readiness = take traffic? Liveness = restart me? Fail readiness during drain, keep liveness green.",
    "<code>exitCode</code> &gt; <code>exit()</code> (don't truncate logs).",
    "<code>nextTick</code> beats promises; recursion starves the loop."
  ]
},

{ id:'node-errors', group:'Production', title:'Errors, timeouts & resilience in a Node service', animate:'errorflow',
  lede:"Uncaught errors are a decision point, not background noise — how you handle them decides whether the process stays trustworthy.",
  say:"I separate operational errors, which I handle and map to a response, from programmer errors, which should log and exit so the supervisor restarts a clean process. Every outbound call gets a timeout — no exceptions — because a hung dependency ties up a request slot indefinitely and cascades under load. And every log line carries a request ID so a crash can actually be traced back to its trigger.",
  steps:[
    "<code>uncaughtException</code> and <code>unhandledRejection</code> are last-resort hooks. Log with full context and <b>exit</b>; the process state is unknown after an uncaught throw.",
    "Since Node 15, an unhandled rejection <b>terminates the process by default</b> — treat rejections as seriously as exceptions.",
    "<b>Every outbound call needs a timeout.</b> LLM APIs, databases, internal services — a call with no deadline can hold a request and its resources forever.",
    "<code>AbortController</code> / <code>AbortSignal.timeout(ms)</code> is the standard mechanism; pass the signal into fetch, and check <code>signal.aborted</code> in your own loops.",
    "Set an <b>overall request deadline</b> and propagate the remaining budget to downstream calls, rather than giving each hop its own generous timeout that sums to minutes.",
    "<b>Retry only idempotent operations</b>, with exponential backoff plus jitter, and a bounded attempt count. Retrying a non-idempotent POST without an idempotency key double-charges customers.",
    "Add a <b>circuit breaker</b> for sustained failures so you fail fast instead of piling load onto a struggling dependency — and a <b>bulkhead</b> (separate connection pool per dependency) so one slow dependency can't exhaust the resources of all the others.",
    "Errors need context to be useful: request ID, route, user/tenant, key parameters, and the <code>cause</code> chain. Use a structured logger (pino) with a per-request child logger via <code>AsyncLocalStorage</code>."
  ],
  code:`<span class="cm">// request-scoped context without threading it through every function</span>
import { AsyncLocalStorage } from 'node:async_hooks';
export const ctx = new AsyncLocalStorage();
app.use((req, res, next) =&gt; ctx.run({ requestId: req.id, log: logger.child({ requestId: req.id }) }, next));

<span class="cm">// deadline propagation</span>
async function callLLM(prompt, deadlineMs){
  const signal = AbortSignal.timeout(Math.min(deadlineMs, 10_000));
  try { return await fetch(LLM_URL, { method:'POST', body: prompt, signal }); }
  catch (err){
    if (err.name === 'TimeoutError' || err.name === 'AbortError')
      throw new AppError('LLM timed out', { code:'LLM_TIMEOUT', status:504, cause: err });
    throw err;
  }
}

process.on('unhandledRejection', (err) =&gt; { logger.fatal({ err }, 'unhandled'); process.exit(1); });
process.on('uncaughtException',  (err) =&gt; { logger.fatal({ err }, 'uncaught');  process.exit(1); });`,
  note:{type:'warn', text:"<b>No exceptions on timeouts.</b> One outbound call without a deadline — an LLM provider having a bad day, a downstream service hanging — ties up a request indefinitely. Under load, enough hung requests exhaust the connection pool and memory for everyone else. Wrap every fetch/DB/API call with a timeout, including the ones that 'never fail in practice'."},
  traps:[
    "Retrying non-idempotent writes without an idempotency key causes duplicates — double charges, duplicate emails, duplicate orders.",
    "Retries at every layer multiply: 3 retries at three layers is 27 requests against a service already failing. Retry at one layer only.",
    "Per-hop timeouts that don't sum to the client's timeout mean the client gives up while you're still working — always propagate a deadline.",
    "Logging <code>err.message</code> only throws away the stack and the <code>cause</code> chain; log the error object with a serialiser.",
    "Swallowing errors in a <code>catch</code> that returns a default value hides outages until someone notices wrong data."
  ],
  terms:[
    {term:"AsyncLocalStorage", desc:"Request-scoped context that survives across await boundaries.", detail:"It's Node's continuation-local storage, built on async_hooks. Use it for request IDs, tenant IDs and trace context so every log line and downstream call is correlated without threading a context object through every signature. There is a small performance cost — keep the stored object small.", code:`function log(msg){ (ctx.getStore()?.log ?? logger).info(msg); }\n<span class="cm">// works inside any awaited call in the request</span>`},
    {term:"Idempotency key", desc:"A client-supplied unique ID that makes a retried write safe.", detail:"Store the key with the result; on a repeat, return the stored result instead of performing the operation again. This is what makes 'at-least-once' delivery and network retries survivable for payments and orders.", code:`const existing = await db.idempotency.findByKey(key);\nif (existing) return existing.result;\nconst result = await chargeCard(body);\nawait db.idempotency.save(key, result);`},
    {term:"Circuit breaker + bulkhead", desc:"Fail fast on sustained failure; isolate resources per dependency.", detail:"The breaker protects both the failing dependency (no extra load) and you (no threads/sockets waiting on calls that will fail). The bulkhead ensures a slow dependency exhausts only its own pool, not the shared one.", code:`if (breaker.isOpen()) throw new AppError('dependency unavailable', { code:'CIRCUIT_OPEN', status:503 });\ntry { const r = await call(); breaker.success(); return r; }\ncatch (e){ breaker.failure(); throw e; }`}
  ],
  cards:[
    {q:"What do you do with an <code>uncaughtException</code>?", a:"Log it with full context, then exit non-zero and let the supervisor (k8s, PM2, systemd) restart a clean process. Continuing risks corrupted in-memory state producing worse, harder-to-diagnose failures later."},
    {q:"Why is a timeout mandatory on every outbound call?", a:"Without one, a hung dependency holds the request, its socket, and its slot in any pool indefinitely. Under load, enough hung requests exhaust connections and memory, turning one slow dependency into a full outage."},
    {q:"When is it safe to retry?", a:"Only for idempotent operations, or non-idempotent ones protected by an idempotency key. Use exponential backoff with jitter, a bounded attempt count, and retry at exactly one layer of the stack."},
    {q:"What is AsyncLocalStorage for?", a:"Carrying request-scoped context (request ID, tenant, trace ID) across <code>await</code> boundaries without passing it through every function signature — so every log line and downstream call can be correlated to one request."}
  ],
  quiz:[
    {q:"Service A retries 3× on failure, calls B which retries 3×, which calls C. C starts failing. How many requests hit C per original request?", options:["Up to 9 — retries multiply","3","1","6"], answer:0,
     why:"Retry amplification: 3 × 3 = 9 requests to a service that's already struggling. Retry at one layer only, and use a circuit breaker so sustained failure stops the traffic entirely."}
  ],
  cheat:[
    "<b>Operational</b> (timeout, 404, validation, 503) → handle. <b>Programmer</b> (bug) → log + exit, restart.",
    "Node ≥15: unhandled rejection <b>kills the process</b> by default.",
    "<b>Timeout on every outbound call</b>: <code>AbortSignal.timeout(ms)</code>. Propagate a request deadline, don't sum per-hop timeouts.",
    "Retry only idempotent ops (or with an idempotency key) · backoff + jitter · <b>one layer only</b> (amplification!).",
    "Circuit breaker = fail fast on sustained failure. Bulkhead = separate pool per dependency.",
    "Context via <code>AsyncLocalStorage</code>; log error objects with <code>cause</code>, plus requestId/route/tenant."
  ]
},

{ id:'perf', group:'Production', title:'Profiling, diagnostics & performance', animate:'thread',
  lede:"When a Node service is slow, there are only a handful of causes — and each has a specific tool.",
  say:"I start by classifying the symptom: is the event loop blocked, is memory growing, or is it just downstream latency? Event-loop lag from perf_hooks answers the first, two heap snapshots diffed by retained size answer the second, and distributed tracing answers the third. For CPU I take a profile with <code>--cpu-prof</code> or Clinic and read the flame graph — the widest plateau is the answer.",
  steps:[
    "<b>Classify first.</b> High event-loop lag → something synchronous is blocking. Rising post-GC heap → a leak. Flat CPU with high latency → you're waiting on I/O downstream.",
    "<b>Event loop lag</b>: <code>perf_hooks.monitorEventLoopDelay</code> gives a proper histogram. Export p50/p99 as metrics and alert on them.",
    "<b>CPU profile</b>: <code>node --cpu-prof app.js</code> writes a <code>.cpuprofile</code> you open in Chrome DevTools; or <code>clinic flame</code> for a flame graph. Wide plateaus = where time goes.",
    "<b>Memory</b>: <code>process.memoryUsage()</code> gives <code>heapUsed</code> (JS objects), <code>external</code> and <code>arrayBuffers</code> (Buffers — a common leak that doesn't show in heapUsed), and <code>rss</code> (total).",
    "<b>Heap snapshots</b>: <code>v8.writeHeapSnapshot()</code> or DevTools; take two under load, diff them, sort by <b>retained size</b>, follow the retainer path.",
    "<code>clinic doctor</code> classifies the problem for you (event loop, GC, I/O, CPU) and is a fast first pass; <code>0x</code> and <code>autocannon</code> cover flame graphs and load generation.",
    "<b>Common wins</b>: enable HTTP keep-alive, add a connection pool, fix N+1 queries, cache hot reads, stream instead of buffering, move CPU work off the request path, and avoid <code>JSON.parse</code> on huge payloads.",
    "Measure before and after with a load test (<code>autocannon</code>, k6) against a realistic workload — and compare <b>p99</b>, not averages."
  ],
  code:`<span class="cm"># CPU profile → open in Chrome DevTools</span>
node --cpu-prof --cpu-prof-dir=./prof server.js

<span class="cm"># heap snapshot on demand, from a signal</span>
process.on('SIGUSR2', () =&gt; require('node:v8').writeHeapSnapshot());

<span class="cm"># classify quickly</span>
npx clinic doctor -- node server.js
npx autocannon -c 100 -d 30 http://localhost:3000/api

<span class="cm">// per-operation timing you can actually alert on</span>
import { performance } from 'node:perf_hooks';
const t0 = performance.now();
await work();
metrics.histogram('work.ms', performance.now() - t0);`,
  traps:[
    "Profiling in development with a tiny dataset finds nothing — N+1 queries and GC pressure only appear at production scale.",
    "Averages hide tail latency. A 100ms average with a 4s p99 means 1 in 100 users has a broken experience.",
    "Buffer leaks don't appear in <code>heapUsed</code> — watch <code>external</code>/<code>arrayBuffers</code> and RSS too.",
    "<code>console.log</code> in a hot path is synchronous to a TTY and surprisingly expensive; use an async structured logger.",
    "Adding an APM agent changes the numbers you're measuring — take a baseline with and without."
  ],
  terms:[
    {term:"Flame graph reading", desc:"Width = time spent, stacked by call depth.", detail:"Look for the widest bars, not the tallest stacks. A wide plateau in a single function is your hot spot; wide bars in GC frames mean allocation pressure rather than algorithmic cost.", code:`<span class="cm"># generate one</span>\nnpx 0x -- node server.js\n<span class="cm"># or clinic flame -- node server.js</span>`},
    {term:"memoryUsage fields", desc:"heapUsed vs external vs rss tell different stories.", detail:"<code>heapUsed</code> = JS objects. <code>external</code>/<code>arrayBuffers</code> = Buffers and native memory. <code>rss</code> = everything the OS has given the process. A leak visible only in RSS/external is a Buffer or native-addon leak, not a JS-object leak.", code:`setInterval(() =&gt; {\n  const m = process.memoryUsage();\n  metrics.gauge('heapUsed', m.heapUsed);\n  metrics.gauge('external', m.external);\n  metrics.gauge('rss', m.rss);\n}, 15_000);`},
    {term:"Load testing honestly", desc:"Realistic payloads, warm caches, p99 not mean.", detail:"Test against production-like data volumes and a warmed process (V8 needs time to JIT-optimise). Report p50/p95/p99 and error rate — a throughput number without a latency distribution is meaningless.", code:`npx autocannon -c 100 -d 60 -m POST \\\n  -H 'content-type: application/json' \\\n  -b '{"q":"..."}' http://localhost:3000/search`}
  ],
  cards:[
    {q:"How do you tell a blocked event loop from a slow dependency?", a:"Event-loop lag. If p99 lag is high, something synchronous is blocking the thread. If lag is low but request latency is high, you're waiting on I/O — look at downstream timings and traces instead."},
    {q:"Which memoryUsage field reveals a Buffer leak?", a:"<code>external</code> / <code>arrayBuffers</code> (and RSS). Buffers are allocated outside the V8 heap, so a Buffer leak leaves <code>heapUsed</code> flat while RSS climbs."},
    {q:"How do you read a flame graph?", a:"Width is time, not depth. Find the widest plateaus — those are the hot functions. Wide GC frames indicate allocation pressure rather than an expensive algorithm."},
    {q:"Why report p99 rather than average latency?", a:"Averages hide the tail. A service can average 100ms while 1% of requests take 4 seconds — those users experience a broken product, and at scale 1% is a lot of people. p99 surfaces exactly that."}
  ],
  quiz:[
    {q:"A service shows flat CPU, low event-loop lag, but p99 latency of 3s. Most likely cause?", options:["Waiting on a slow downstream dependency","A blocked event loop","A memory leak","GC pressure"], answer:0,
     why:"Low lag means the loop is free to run callbacks; flat CPU means you're not computing. That combination points at time spent awaiting I/O — a slow database query or downstream API."}
  ],
  cheat:[
    "Classify: <b>lag high</b> → blocking · <b>heap/RSS rising</b> → leak · <b>low CPU + high latency</b> → downstream I/O.",

{ id:'ts-basics', group:'Foundations', title:'Type system basics & the runtime gap', animate:'typeflow',
  lede:"TypeScript adds a static layer on top of JS — and every type vanishes at compile time, which is the single most important consequence to internalise.",
  say:"TypeScript is structurally typed and fully erased at compile time. That means types give you zero protection at any boundary where data actually enters the process — an API response, a queue message, a config file, an LLM output. So I type internal code with TypeScript and validate external data at runtime with a schema library like zod, deriving the static type from the same schema so the two can't drift.",
  steps:[
    "TypeScript is <b>structurally typed</b> — compatibility is by shape, not by declared name (unlike Java/C#'s nominal typing).",
    "<b>Inference</b> means most annotations are unnecessary: <code>let x = 5</code> is <code>number</code>. Annotate function boundaries and exported APIs; let bodies infer.",
    "<code>any</code> disables checking entirely and spreads — it's an escape hatch, not a type. <code>unknown</code> is the safe top type: assignable from anything, usable only after narrowing.",
    "<code>never</code> is the bottom type — the return of a function that always throws, and the type of an impossible branch, which is what makes exhaustiveness checking work.",
    "<b>Types are fully erased.</b> The emitted JavaScript contains no trace of them: zero runtime cost, and zero runtime enforcement.",
    "<code>strict: true</code> turns on the checks that make TypeScript worth using — especially <code>strictNullChecks</code>, which stops <code>null</code>/<code>undefined</code> being assignable everywhere.",
    "An <code>as</code> assertion is a <b>claim, not a check</b>. <code>JSON.parse(body) as User</code> compiles happily and crashes later if the shape is wrong.",
    "Therefore: validate at every trust boundary with a runtime schema (zod, valibot, io-ts, ajv) and derive the static type from it, so a single definition governs both."
  ],
  code:`let age = 25;                <span class="cm">// inferred number</span>
const role = 'admin';        <span class="cm">// inferred literal type 'admin'</span>

function fail(msg: string): never { throw new Error(msg); }

function handle(v: unknown){
  <span class="cm">// v.length      → error: 'v' is of type 'unknown'</span>
  if (typeof v === 'string') v.toUpperCase();   <span class="cm">// narrowed, safe</span>
}

<span class="cm">// one schema → runtime check AND static type</span>
import { z } from 'zod';
const User = z.object({ id: z.number(), email: z.string().email() });
type User = z.infer&lt;typeof User&gt;;

const parsed = User.safeParse(await res.json());
if (!parsed.success) throw new AppError('bad upstream payload', { cause: parsed.error });
const user: User = parsed.data;   <span class="cm">// now genuinely guaranteed</span>`,
  note:{type:'warn', text:"<b>The question interviewers use to separate levels:</b> “Your API returns <code>User</code> — how do you know it really is one?” TypeScript checks disappear at compile time, so an <code>as User</code> assertion or an untyped <code>await res.json()</code> is trusted by the compiler and never verified. Runtime validation at the boundary is the only actual guarantee — and deriving the type from the schema (<code>z.infer</code>) is what stops the type and the validator drifting apart."},
  traps:[
    "<code>any</code> is contagious: one <code>any</code> silently disables checking through every expression it touches. Ban it with <code>noImplicitAny</code> and lint rules; use <code>unknown</code> instead.",
    "<code>as</code> is not a cast — no conversion, no check. Double assertions (<code>x as unknown as T</code>) are a code smell that bypasses even TypeScript's sanity check.",
    "Without <code>strictNullChecks</code>, every type silently includes <code>null</code> and <code>undefined</code> — most 'cannot read property of undefined' errors in TS codebases trace back to it being off.",
    "Excess property checking only applies to <b>object literals</b> assigned directly. Assign via a variable first and extra properties pass silently.",
    "<code>typeof</code>/<code>instanceof</code> narrowing works at runtime, but interfaces and type aliases don't exist at runtime — you can't <code>instanceof</code> an interface."
  ],
  terms:[
    {term:"Structural typing", desc:"Compatibility by shape, not by name.", detail:"Two unrelated interfaces are interchangeable if the properties line up. This is why TypeScript feels flexible — and why you sometimes want <b>branded types</b> to get nominal behaviour back.", code:`interface Point { x: number; y: number }\nfunction log(p: Point){}\nlog({ x:1, y:2, z:3 });          <span class="cm">// via a variable: OK</span>\n<span class="cm">// log({x:1,y:2,z:3}) directly → excess property error</span>`},
    {term:"any vs unknown", desc:"any turns checking off; unknown forces you to prove the shape.", detail:"Use <code>unknown</code> for anything from outside your control — <code>JSON.parse</code>, API responses, <code>catch</code> clause variables (which are <code>unknown</code> under <code>useUnknownInCatchVariables</code>).", code:`try { risky(); }\ncatch (e) {          <span class="cm">// e: unknown under strict</span>\n  const msg = e instanceof Error ? e.message : String(e);\n}`},
    {term:"Runtime validation with zod", desc:"One schema produces both the check and the type.", detail:"The key property is that the type is <i>derived</i> from the schema, so they cannot drift. Validate at every boundary: HTTP handlers, queue consumers, config, third-party SDK responses, LLM tool-call arguments.", code:`const Config = z.object({\n  PORT: z.coerce.number().default(3000),\n  DATABASE_URL: z.string().url()\n});\nexport const config = Config.parse(process.env);  <span class="cm">// throws at boot</span>`}
  ],
  cards:[
    {q:"What does 'types are erased' mean in practice?", a:"The compiler removes every type annotation; the emitted JS has no type information. So types cost nothing at runtime and enforce nothing at runtime — any data crossing a process or network boundary must be validated separately."},
    {q:"<code>any</code> vs <code>unknown</code>?", a:"<code>any</code> disables type checking for that value and everything derived from it. <code>unknown</code> accepts any value but permits no operations until you narrow it with <code>typeof</code>, <code>instanceof</code>, or a type guard. Prefer <code>unknown</code> at every boundary."},
    {q:"Is <code>as User</code> a runtime check?", a:"No. It's an assertion — you telling the compiler to trust you. Nothing is verified and no code is emitted. If the data doesn't match, you get a crash far away from the assertion with no compile-time warning."},
    {q:"What does <code>never</code> represent and where is it useful?", a:"The bottom type — a value that can never occur. Return type of a function that always throws or loops forever, and the type of an unreachable branch, which is exactly what makes exhaustiveness checks on discriminated unions work."}
  ],
  quiz:[

     why:"Only a runtime schema parse executes a check. All the assertion forms are erased at compile time and verify nothing."},
    {q:"What is <code>e</code>'s type here under <code>strict</code>?", code:`try { risky(); } catch (e) { /* ? */ }`,
     options:["unknown","any","Error","never"], answer:0,
     why:"With <code>useUnknownInCatchVariables</code> (part of <code>strict</code>), catch variables are <code>unknown</code>, forcing you to narrow before use — because JS can throw anything, not just Errors."}
  ],
  cheat:[
    "<b>Structural</b> typing (shape, not name). Inference covers most locals; annotate boundaries.",
    "<code>any</code> = checking off (contagious) · <code>unknown</code> = safe top type · <code>never</code> = bottom/impossible.",
    "<b>Types are erased</b> → zero runtime cost, zero runtime protection.",
    "<code>as</code> = a claim, not a cast. No check, no conversion.",
    "<b>Validate every trust boundary</b> (HTTP, queue, config, LLM output) with zod/valibot; derive the type via <code>z.infer</code>.",
    "<code>strict: true</code>, especially <code>strictNullChecks</code> + <code>noImplicitAny</code>."
  ]
},

{ id:'ts-union', group:'Foundations', title:'Unions, intersections & narrowing', animate:'narrow',
  lede:"Union types model real-world variability; narrowing is how the compiler proves which member you're holding.",
  say:"A union means 'one of these', so only members present on every arm are accessible until you narrow. Narrowing happens via <code>typeof</code>, <code>instanceof</code>, truthiness, <code>in</code>, equality against literals, and user-defined type guards. The pattern I reach for constantly is the discriminated union — a shared literal tag — because a switch on that tag narrows the whole object and gives exhaustiveness checking via <code>never</code>.",
  steps:[
    "A <b>union</b> <code>A | B</code> means one of them; you may only access members common to <i>all</i> arms until narrowed.",
    "An <b>intersection</b> <code>A &amp; B</code> means all of both — commonly used to compose small interfaces or to add fields to a base type.",
    "<b>Narrowing</b> shrinks a union inside a branch based on a runtime check the compiler understands: <code>typeof</code>, <code>instanceof</code>, <code>in</code>, truthiness, <code>Array.isArray</code>, and equality against literal types.",
    "A <b>user-defined type guard</b> is a function returning <code>value is T</code>. The compiler takes that predicate on trust, so the implementation must actually be correct.",
    "An <b>assertion function</b> (<code>asserts value is T</code>) narrows for the rest of the enclosing scope instead of inside a branch — good for invariants.",
    "<b>Discriminated unions</b>: give every arm a shared literal property (<code>kind</code>, <code>type</code>, <code>status</code>) and a <code>switch</code> on it narrows the whole object.",
    "<b>Exhaustiveness checking</b>: in the <code>default</code> branch, assign the value to <code>never</code>. Add a new union member and the compiler immediately points at every switch you forgot.",
    "Narrowing is lost when the compiler can't prove the value is unchanged — after an intervening function call on a mutable property, or inside a callback. Destructure into a <code>const</code> first."
  ],
  code:`type Result =
  | { status: 'ok'; data: string }
  | { status: 'error'; error: Error }
  | { status: 'loading' };

function render(r: Result): string {
  switch (r.status) {
    case 'ok':      return r.data;          <span class="cm">// narrowed</span>
    case 'error':   return r.error.message;
    case 'loading': return '…';
    default:        return assertNever(r);  <span class="cm">// compile error if a case is missing</span>
  }
}
function assertNever(x: never): never { throw new Error('unhandled: ' + JSON.stringify(x)); }

<span class="cm">// user-defined guard &amp; assertion function</span>
function isUser(v: unknown): v is User {
  return typeof v === 'object' &amp;&amp; v !== null &amp;&amp; 'email' in v;
}
function assertDefined&lt;T&gt;(v: T | null | undefined, m: string): asserts v is T {
  if (v == null) throw new Error(m);
}`,
  traps:[
    "Narrowing on an <b>optional object property</b> is discarded after any function call — the compiler must assume it changed. Copy to a local <code>const</code> first.",
    "A type guard's body isn't verified. <code>function isUser(v): v is User { return true; }</code> compiles and lies.",
    "Intersecting conflicting primitives gives <code>never</code>: <code>{x: string} &amp; {x: number}</code> has <code>x: never</code>, and the error surfaces far from the definition.",
    "<code>if (x)</code> excludes <code>0</code> and <code>''</code> as well as null/undefined — use <code>x != null</code> when zero and empty string are valid.",
    "Unions of many object types without a discriminant are painful to narrow; add a tag rather than probing with <code>in</code> repeatedly."
  ],
  cards:[
    {q:"What is a discriminated union and why is it the go-to pattern?", a:"A union of object types sharing a common literal-typed property (the discriminant). A <code>switch</code> on that property narrows the entire object in each branch, and adding a <code>never</code> default gives free exhaustiveness checking when new variants are added."},
    {q:"How do you get exhaustiveness checking?", a:"In the default branch, pass the value to a function taking <code>never</code>. If any union member is unhandled, that value isn't <code>never</code> and the compiler errors — pointing you at every switch that needs updating."},
    {q:"Type guard vs assertion function?", a:"A guard (<code>v is T</code>) narrows inside the <code>if</code> branch. An assertion function (<code>asserts v is T</code>) throws on failure and narrows for the remainder of the scope. Assertion functions must have an explicit return type annotation and can't be arrow functions assigned without one."},
    {q:"When does narrowing get lost?", a:"When the compiler can't prove the value is unchanged: after a function call if the value is a mutable property, inside closures/callbacks, and across <code>await</code> for properties. Destructure into a <code>const</code> to keep the narrowing."}
  ],
  quiz:[
    {q:"Why does this error?", code:`type Shape = { kind:'c'; r:number } | { kind:'s'; s:number };\nfunction area(sh: Shape){\n  if (sh.kind === 'c') return Math.PI * sh.r ** 2;\n  return sh.r ** 2;\n}`,
     options:["In the second branch sh is the square variant, which has no <code>r</code>","<code>kind</code> isn't a valid discriminant","Math.PI is untyped","It doesn't error"], answer:0,
     why:"After the <code>if</code>, TypeScript narrows the remaining type to <code>{kind:'s'; s:number}</code>, which has no <code>r</code> property."}
  ],
  cheat:[
    "<code>A | B</code> = one of (only shared members until narrowed). <code>A &amp; B</code> = both.",
    "Narrow with: <code>typeof</code>, <code>instanceof</code>, <code>in</code>, truthiness, <code>Array.isArray</code>, literal equality, guards.",
    "Guard: <code>v is T</code> (branch). Assertion: <code>asserts v is T</code> (rest of scope, needs explicit annotation).",
    "<b>Discriminated union</b> + <code>switch</code> on the tag = the workhorse pattern.",
    "<code>assertNever(x: never)</code> in <code>default</code> ⇒ compile-time exhaustiveness.",
    "Narrowing is lost after calls / in callbacks → destructure to a <code>const</code>."
  ]
},

{ id:'ts-alias', group:'Foundations', title:'Type aliases vs interfaces', animate:'aliasvs',
  lede:"For object shapes they're near-interchangeable — the differences that matter are declaration merging and what each can express.",
  say:"A <code>type</code> can name anything — unions, tuples, primitives, function signatures, mapped and conditional types. An <code>interface</code> only describes object shapes, but it supports declaration merging, which is how you augment third-party types like Express's Request. My rule: interfaces for public object contracts that others may extend or augment, type aliases for unions and anything computed.",
  steps:[
    "A <code>type</code> alias can name <b>any</b> type: unions, intersections, tuples, primitives, function signatures, mapped and conditional types.",
    "An <code>interface</code> describes <b>object shapes</b> (including callable and construct signatures and index signatures) — it cannot express a union.",
    "<b>Interfaces merge</b>: two declarations with the same name in the same scope combine. Type aliases error on redeclaration.",
    "Declaration merging is what makes <b>module augmentation</b> possible — the standard way to add <code>req.user</code> to Express's <code>Request</code>.",
    "Interfaces use <code>extends</code> (which <i>checks</i> compatibility and errors on conflicts); type aliases compose with <code>&amp;</code> (which silently produces <code>never</code> for conflicting members).",
    "Both can be <code>implement</code>ed by a class, as long as the alias resolves to an object type.",
    "Interfaces are lazily resolved, which historically gives better error messages and slightly better compiler performance for large recursive shapes.",
    "Neither exists at runtime — both are fully erased."
  ],
  code:`interface User { id: number; name: string }
interface Admin extends User { role: 'admin' }        <span class="cm">// conflict → error</span>

type UserT  = { id: number; name: string };
type AdminT = UserT &amp; { role: 'admin' };              <span class="cm">// conflict → never (silent)</span>

type Status = 'idle' | 'loading' | 'error';           <span class="cm">// only a type alias can do this</span>
type Handler = (req: Request) =&gt; Promise&lt;void&gt;;

<span class="cm">// module augmentation — only possible with interfaces</span>
declare global {
  namespace Express {
    interface Request { user?: { id: string; roles: string[] } }
  }
}`,
  table:{title:'When to use which', head:['','interface','type'], rows:[
    ['Object shapes','✔','✔'],
    ['Unions / tuples / primitives','✘','✔'],
    ['Mapped & conditional types','✘','✔'],
    ['Declaration merging / augmentation','✔','✘'],
    ['Conflict on extend','Errors','Silently <code>never</code>'],
    ['Typical use','Public contracts, classes, augmentation','Unions, computed types, function types']
  ]},
  traps:[
    "Intersecting conflicting property types produces <code>never</code> rather than an error at the definition — the failure appears much later at the assignment site.",
    "Declaration merging is global to the module scope: an accidentally duplicated interface name silently merges instead of erroring.",
    "You can't declare a union with an interface — attempting to model 'A or B' with interfaces leads to optional-everything shapes that narrow badly.",
    "Augmenting a global namespace requires the file to be a module (have an import/export) or the <code>declare global</code> block behaves differently."
  ],
  cards:[
    {q:"Name two things a type alias can do that an interface can't.", a:"Express unions (and tuples/primitives), and be computed — mapped types, conditional types, template literal types, <code>keyof</code>-driven transformations."},
    {q:"What can an interface do that a type alias can't?", a:"Declaration merging — two interfaces with the same name combine. That's the mechanism behind module augmentation, e.g. adding <code>user</code> to Express's <code>Request</code> or extending a library's options interface."},
    {q:"What happens when you intersect conflicting property types?", a:"You get <code>never</code> for that property, silently, at the definition. The error only appears when something tries to assign to it. <code>interface extends</code> reports the conflict immediately instead."}
  ],
  quiz:[
    {q:"What is <code>C['x']</code>?", code:`type A = { x: string };\ntype B = { x: number };\ntype C = A &amp; B;`,
     options:["never","string | number","string","Error at the type C declaration"], answer:0,
     why:"An intersection requires the value to satisfy both, and no value is both string and number, so the property type collapses to <code>never</code> — silently, at declaration."}
  ],
  cheat:[
    "<code>type</code>: anything — unions, tuples, functions, mapped/conditional. <code>interface</code>: object shapes only.",
    "<b>Interfaces merge</b> → module augmentation (<code>declare global { namespace Express { interface Request {...} } }</code>).",
    "<code>extends</code> errors on conflict; <code>&amp;</code> silently yields <code>never</code>.",
    "Rule of thumb: interfaces for public/extendable contracts, aliases for unions and computed types.",
