<!DOCTYPE html>
<html lang="en" data-theme="dark" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Reference — JS · Node · TS · Frameworks · AWS</title>
<style>/* ============================================================
   Interview Reference — stylesheet
   Themes: dark (terminal) | paper (high-readability, memorisation)
   ============================================================ */
:root{
  /* ---- structural ---- */
  --bg:#12161C; --bg2:#0D1013; --panel:#181D25; --panel2:#1E252F; --line:#2A323E;
  --text:#E8EAED; --body:#C9CDD6; --sub:#8B94A3; --faint:#5F6B7A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --sel:#26313F;

  /* ---- per-track accents ---- */
  --js:#F2C879;     --jsbg:#2C2413;    --jsbd:#6B551F;
  --node:#4FCB8F;   --nodebg:#152A22;  --nodebd:#2C5C46;
  --ts:#4FA8F2;     --tsbg:#132840;    --tsbd:#2C5578;
  --fw:#E58B5B;     --fwbg:#2E1D12;    --fwbd:#6E4327;
  --aws:#F0A93B;    --awsbg:#2E2211;   --awsbd:#6E5220;
  --db:#63D8C4;     --dbbg:#0F2A28;    --dbbd:#26605A;
  --sd:#C58CF2;     --sdbg:#241A38;    --sdbd:#4A3468;
  --sec:#F2708A;    --secbg:#2E1620;   --secbd:#6E2E42;
  --ai:#F26B9A;     --aibg:#331722;    --aibd:#6B2E48;

  /* ---- semantic ---- */
  --accent:#5B8CFF;  --accentbg:#182335; --accentbd:#2E4A82;
  --tick:#F26B6B;    --tickbg:#2C1717;  --tickbd:#6B2E2E;
  --micro:#C58CF2;   --microbg:#241A2E; --microbd:#5A3F73;
  --pool:#5BD6D6;    --poolbg:#12292C;  --poolbd:#2C6666;
  --ok:#4FCB8F;      --okbg:#152A22;
  --bad:#F26B6B;     --badbg:#2C1717;

  --code-txt:#C6E27C; --code-kw:#7EA6F2; --code-fn:#F2C879; --code-str:#C6E27C; --code-cm:#5F6B7A; --code-inline:#EAD9A0;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --read: var(--mono);          /* prose font — swapped in paper theme */
  --fs:14px;                    /* base prose size */
  --lh:1.7;
  --maxw:790px;
  --scan:.035;
}

/* ---------- PAPER THEME (memorisation mode) ---------- */
html[data-theme="paper"]{
  --bg:#F7F5F0; --bg2:#EFEBE3; --panel:#FFFDF8; --panel2:#F1EDE5; --line:#DCD5C8;
  --text:#1B1A17; --body:#2E2C27; --sub:#6E6959; --faint:#95907F;
  --shadow:0 1px 2px rgba(60,50,30,.08);
  --sel:#E7E0CF;

  --js:#8A6100;     --jsbg:#FBF2DC;   --jsbd:#DCC48A;
  --node:#0F7A4A;   --nodebg:#E3F5EB; --nodebd:#9AD3B6;
  --ts:#0A5FA8;     --tsbg:#E1EEFA;   --tsbd:#9CC5E6;
  --fw:#A8501C;     --fwbg:#FBEBE0;   --fwbd:#E0B394;
  --aws:#8A5A00;    --awsbg:#FBF0DA;  --awsbd:#DEBE80;
  --db:#0B6E62;     --dbbg:#DFF3F0;   --dbbd:#95CFC7;
  --sd:#6B34A8;     --sdbg:#EFE4FA;   --sdbd:#C6A5E6;
  --sec:#A8203F;    --secbg:#FBE3E8;  --secbd:#E5A0B0;
  --ai:#A81E56;     --aibg:#FBE2EC;   --aibd:#E79FBC;

  --accent:#1E51C4;  --accentbg:#E3EAFB; --accentbd:#A6BCEE;
  --tick:#B32626;    --tickbg:#FBE3E3;  --tickbd:#E7A5A5;
  --micro:#6B34A8;   --microbg:#EFE4FA; --microbd:#C6A5E6;
  --pool:#0B6E75;    --poolbg:#DFF2F4;  --poolbd:#95CBD1;
  --ok:#0F7A4A;      --okbg:#E3F5EB;
  --bad:#B32626;     --badbg:#FBE3E3;

  --code-txt:#2E2C27; --code-kw:#0A5FA8; --code-fn:#8A6100; --code-str:#0F7A4A; --code-cm:#8A8578; --code-inline:#7A4E00;
  --read: var(--sans);
  --fs:15.5px;
  --lh:1.78;
  --scan:0;
}

/* ---------- font size scale ---------- */
html[data-fs="s"]{ --fs:13px;   --maxw:720px; }
html[data-fs="l"]{ --fs:17px;   --lh:1.85; --maxw:860px; }
html[data-fs="xl"]{ --fs:19px;  --lh:1.9;  --maxw:920px; }

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; }
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);overflow-wrap:break-word}
button,input,select{font-family:inherit}
a{color:var(--accent)}
::selection{background:var(--sel)}

.scanlines{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:var(--scan);
  background:repeating-linear-gradient(0deg,#fff 0px,#fff 1px,transparent 1px,transparent 3px)}

/* ================= chrome / header ================= */
.term-chrome{background:var(--bg2);border-bottom:1px solid var(--line);padding:7px 14px;display:flex;align-items:center;gap:12px;font-size:11.5px}
.term-dots{display:flex;gap:6px;flex:none}
.term-dots .d{width:10px;height:10px;border-radius:50%;display:block}
.term-dots .d.red{background:#F26B6B}.term-dots .d.yellow{background:#F2B84B}.term-dots .d.green{background:#4FCB8F}
.term-path{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.term-path .sep{color:var(--faint)}
.term-path .cmd{color:var(--node)}
.cursor{display:inline-block;width:7px;height:12px;background:var(--node);margin-left:4px;vertical-align:-2px;animation:blink 1s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.chrome-right{display:flex;gap:6px;align-items:center;flex:none}
.mini-btn{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:3px 8px;font-size:10.5px;cursor:pointer;white-space:nowrap}
.mini-btn:hover{color:var(--text);border-color:var(--sub)}
.mini-btn.on{background:var(--accentbg);border-color:var(--accentbd);color:var(--accent)}

/* ================= topbar ================= */
.topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:0 14px;display:flex;align-items:center;gap:10px;min-height:52px;flex-wrap:wrap}
.brand{font-size:13.5px;font-weight:700;margin:0;white-space:nowrap;color:var(--text)}
.brand .prompt{color:var(--node);margin-right:5px}
.tabs{display:flex;gap:3px;overflow-x:auto;flex:1;padding:6px 0;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.tab{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid transparent;color:var(--sub);transition:all .2s;white-space:nowrap;background:none}
.tab:hover{color:var(--text)}
.tab.active{border-color:currentColor}
.tab.js.active{background:var(--jsbg);color:var(--js);border-color:var(--jsbd)}
.tab.node.active{background:var(--nodebg);color:var(--node);border-color:var(--nodebd)}
.tab.ts.active{background:var(--tsbg);color:var(--ts);border-color:var(--tsbd)}
.tab.fw.active{background:var(--fwbg);color:var(--fw);border-color:var(--fwbd)}
.tab.aws.active{background:var(--awsbg);color:var(--aws);border-color:var(--awsbd)}
.tab.db.active{background:var(--dbbg);color:var(--db);border-color:var(--dbbd)}
.tab.sd.active{background:var(--sdbg);color:var(--sd);border-color:var(--sdbd)}
.tab.sec.active{background:var(--secbg);color:var(--sec);border-color:var(--secbd)}
.tab.ai.active{background:var(--aibg);color:var(--ai);border-color:var(--aibd)}

/* mode bar */
.modebar{position:sticky;top:52px;z-index:29;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:7px 14px;flex-wrap:wrap}
.modes{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.mode{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--sub)}
.mode.on{background:var(--accent);color:#fff}
html[data-theme="paper"] .mode.on{color:#fff}
.mode:not(.on):hover{color:var(--text)}
.searchwrap{position:relative;flex:1;min-width:150px;max-width:340px}
.searchwrap input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:12.5px;padding:6px 10px 6px 26px;font-family:var(--mono)}
html[data-theme="paper"] .searchwrap input{background:var(--panel)}
.searchwrap input:focus{outline:none;border-color:var(--accent)}
.searchwrap::before{content:'⌕';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px;pointer-events:none}
.searchres{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;max-height:60vh;overflow-y:auto;z-index:40;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.searchres:empty{display:none}
.sr-item{padding:8px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line);color:var(--body)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover,.sr-item.sel{background:var(--panel2)}
.sr-item b{color:var(--text);display:block;font-size:12.5px}
.sr-item .sr-tab{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;opacity:.75}
.stat-pill{font-size:10.5px;color:var(--sub);white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.stat-pill b{color:var(--text)}

/* ================= shell ================= */
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - 100px)}
@media (max-width:860px){.shell{grid-template-columns:1fr}}
.sidebar{border-right:1px solid var(--line);padding:14px 9px 40px;position:sticky;top:100px;height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin}
@media (max-width:860px){.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px;padding:10px}}
.side-group{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);padding:12px 11px 5px;font-weight:700}
@media (max-width:860px){.side-group{width:100%;padding:6px 2px 0}}
.side-item{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:none;color:var(--sub);font-family:var(--mono);font-size:12.5px;padding:7px 10px;border-radius:7px;cursor:pointer;margin-bottom:1px;transition:background .15s,color .15s;line-height:1.35}
@media (max-width:860px){.side-item{width:auto}}
.side-item .n{font-size:9.5px;color:var(--faint);flex:none;min-width:16px}
.side-item .lbl{flex:1}
.side-item:hover{background:var(--panel2);color:var(--text)}
.side-item.active{color:var(--text);font-weight:600}
.side-item.active.js{background:var(--jsbg);color:var(--js)}
.side-item.active.node{background:var(--nodebg);color:var(--node)}
.side-item.active.ts{background:var(--tsbg);color:var(--ts)}
.side-item.active.fw{background:var(--fwbg);color:var(--fw)}
.side-item.active.aws{background:var(--awsbg);color:var(--aws)}
.side-item.active.db{background:var(--dbbg);color:var(--db)}
.side-item.active.sd{background:var(--sdbg);color:var(--sd)}
.side-item.active.sec{background:var(--secbg);color:var(--sec)}
.side-item.active.ai{background:var(--aibg);color:var(--ai)}
.side-item .dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--line);flex:none}
.side-item .dot.done{background:var(--ok);border-color:var(--ok)}
.side-item .dot.part{background:var(--js);border-color:var(--js)}
.play-badge{display:inline-block;margin-left:5px;font-size:9px;padding:1px 6px;border-radius:10px;background:var(--accentbg);color:var(--accent);border:1px solid var(--accentbd)}

main{padding:26px 28px 90px;max-width:var(--maxw)}
@media (max-width:640px){main{padding:20px 15px 60px}}

/* ================= content typography ================= */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eyebrow.js{color:var(--js)}.eyebrow.node{color:var(--node)}.eyebrow.ts{color:var(--ts)}.eyebrow.fw{color:var(--fw)}
.eyebrow.aws{color:var(--aws)}.eyebrow.db{color:var(--db)}.eyebrow.sd{color:var(--sd)}.eyebrow.sec{color:var(--sec)}.eyebrow.ai{color:var(--ai)}
h2{font-size:22px;font-weight:700;margin:0 0 10px;line-height:1.3;font-family:var(--read)}
h2::before{content:'> ';color:var(--node)}
html[data-theme="paper"] h2::before{content:''}
.lede{color:var(--sub);font-size:calc(var(--fs) + .5px);line-height:1.62;margin:0 0 20px;font-family:var(--read)}
h3{font-size:13px;font-weight:700;margin:28px 0 10px;color:var(--text);text-transform:uppercase;letter-spacing:.6px;font-family:var(--mono);display:flex;align-items:center;gap:8px}
h3::after{content:'';flex:1;height:1px;background:var(--line)}
p{font-size:var(--fs);line-height:var(--lh);color:var(--body);margin:0 0 12px;font-family:var(--read)}
code{background:var(--bg2);padding:1.5px 5px;border-radius:5px;font-family:var(--mono);font-size:.87em;color:var(--code-inline);word-break:break-word}
html[data-theme="paper"] code{background:var(--bg2);border:1px solid var(--line)}
b,strong{color:var(--text)}

.visual{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;min-height:110px;overflow:hidden}

/* the 30-second answer */
.say{border:1px solid var(--nodebd);background:var(--nodebg);border-radius:11px;padding:13px 15px;margin:0 0 20px}
.say .say-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--node);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.say p{margin:0;font-size:var(--fs);line-height:1.65;color:var(--text)}

.steps{list-style:none;margin:0;padding:0;counter-reset:step}
.steps li{counter-increment:step;position:relative;padding:3px 0 13px 32px;font-size:var(--fs);line-height:var(--lh);color:var(--body);font-family:var(--read)}
.steps li::before{content:counter(step);position:absolute;left:0;top:3px;width:21px;height:21px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:600}

pre{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7;margin:13px 0}
pre code{background:none;padding:0;border:none;color:var(--code-txt);font-size:12.5px}
.kw{color:var(--code-kw)}.fn{color:var(--code-fn)}.str{color:var(--code-str)}.cm{color:var(--code-cm)}

.callout{border-radius:10px;padding:12px 14px;font-size:calc(var(--fs) - .5px);line-height:1.62;margin:16px 0;border:1px solid;font-family:var(--read)}
.callout-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-right:6px;font-weight:700;opacity:.9}
.callout.warn{background:var(--jsbg);border-color:var(--jsbd);color:var(--js)}
.callout.warn b{color:var(--js)}
.callout.info{background:var(--accentbg);border-color:var(--accentbd);color:var(--accent)}
.callout.info b{color:var(--accent)}
html[data-theme="paper"] .callout.warn,html[data-theme="paper"] .callout.info{color:var(--body)}

/* traps */
.traps{list-style:none;margin:0;padding:0}
.traps li{position:relative;padding:8px 12px 8px 34px;font-size:calc(var(--fs) - .5px);line-height:1.6;color:var(--body);background:var(--tickbg);border:1px solid var(--tickbd);border-radius:9px;margin-bottom:7px;font-family:var(--read)}
.traps li::before{content:'!';position:absolute;left:11px;top:9px;width:15px;height:15px;border-radius:4px;background:var(--tick);color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
html[data-theme="paper"] .traps li{background:var(--tickbg)}

/* key terms */
.term-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
@media (max-width:560px){.term-grid{grid-template-columns:1fr}}
.term{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .2s}
.term[open]{border-color:var(--accent)}
.term summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:3px}
.term summary::-webkit-details-marker{display:none}
.term summary .t-head{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);font-weight:700}
.term summary .t-head::before{content:'▸';color:var(--sub);font-size:10px;font-weight:400}
.term[open] summary .t-head::before{content:'▾'}
.term summary .t-desc{font-size:12px;color:var(--sub);line-height:1.5}
.term-expand{padding-top:10px;margin-top:8px;border-top:1px solid var(--line)}
.term-expand p{font-size:12.5px;line-height:1.62;margin:0 0 8px}
.term-expand pre{margin:0;font-size:11.5px}

/* comparison tables (used in cheat + content) */
.tbl-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
table.cmp{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top;line-height:1.55}
table.cmp th{background:var(--panel2);color:var(--text);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
table.cmp tr:last-child td{border-bottom:none}
table.cmp td{color:var(--body)}
table.cmp td:first-child{color:var(--text);font-weight:600}
table.cmp code{font-size:11.5px}

/* footer nav */
.nav-footer{display:flex;justify-content:space-between;gap:10px;margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
.nav-footer button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--mono)}
.nav-footer button:hover:not(:disabled){border-color:var(--sub)}
.nav-footer button:disabled{opacity:.3;cursor:default}
.markdone{display:flex;justify-content:center;margin-top:22px}
.markdone button{background:var(--panel2);border:1px solid var(--line);color:var(--sub);padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.markdone button.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}

/* ================= FLASHCARDS ================= */
.deck-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.deck-scope{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px}
.deck-scope button{padding:5px 11px;border-radius:6px;font-size:11.5px;border:none;background:none;color:var(--sub);cursor:pointer;font-family:var(--mono)}
.deck-scope button.on{background:var(--accent);color:#fff}
.card-shell{max-width:640px;margin:0 auto}
.flash{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;min-height:210px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.flash .fc-tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);margin-bottom:12px}
.flash .fc-q{font-size:calc(var(--fs) + 2.5px);line-height:1.55;color:var(--text);font-weight:600;font-family:var(--read)}
.flash .fc-a{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);font-size:var(--fs);line-height:1.68;color:var(--body);font-family:var(--read)}
.flash .fc-a pre{font-size:11.5px}
.flash-actions{display:flex;gap:7px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.flash-actions button{padding:9px 16px;border-radius:9px;font-size:12.5px;cursor:pointer;font-family:var(--mono);border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600}
.grade-again{border-color:var(--tickbd)!important;color:var(--tick)!important}
.grade-hard{border-color:var(--jsbd)!important;color:var(--js)!important}
.grade-good{border-color:var(--accentbd)!important;color:var(--accent)!important}
.grade-easy{border-color:var(--nodebd)!important;color:var(--ok)!important}
.flash-actions .reveal{background:var(--accent);border-color:var(--accent);color:#fff;padding:9px 26px}
.deck-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:14px;max-width:640px;margin-left:auto;margin-right:auto}
.deck-empty{text-align:center;padding:50px 20px;color:var(--sub);font-size:var(--fs)}
.deck-empty b{display:block;color:var(--text);font-size:16px;margin-bottom:8px}

/* ================= QUIZ ================= */
.quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 18px 16px;margin-bottom:14px}
.quiz-q{font-size:calc(var(--fs) + 1px);line-height:1.55;color:var(--text);font-weight:600;margin-bottom:12px;font-family:var(--read)}
.quiz-card pre{margin-top:0}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.quiz-opt{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:calc(var(--fs) - .5px);color:var(--body);cursor:pointer;font-family:var(--mono);line-height:1.5;display:flex;gap:9px}
.quiz-opt .ltr{color:var(--sub);flex:none;font-weight:700}
.quiz-opt:hover:not(:disabled){border-color:var(--sub)}
.quiz-opt.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.quiz-opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.quiz-opt:disabled{cursor:default}
.quiz-why{margin-top:12px;padding:11px 13px;border-radius:9px;background:var(--accentbg);border:1px solid var(--accentbd);font-size:calc(var(--fs) - 1px);line-height:1.62;color:var(--body);font-family:var(--read)}
.quiz-why b{color:var(--text)}
.quiz-score{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.quiz-score .sc{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.quiz-score .sc b{color:var(--text)}

/* ================= CHEAT SHEET ================= */
.cheat-sec{margin-bottom:26px;break-inside:avoid}
.cheat-h{font-size:12.5px;font-weight:700;color:var(--text);margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cheat-h .cn{font-size:9.5px;color:var(--faint)}
.cheat-list{list-style:none;margin:0;padding:0}
.cheat-list li{font-size:calc(var(--fs) - 1px);line-height:1.6;color:var(--body);padding:4px 0 4px 15px;position:relative;font-family:var(--read)}
.cheat-list li::before{content:'▪';position:absolute;left:2px;top:4px;color:var(--sub);font-size:9px}
.cheat-list li b{color:var(--text)}
.cheat-toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.mnemonic{background:var(--sdbg);border:1px solid var(--sdbd);border-radius:9px;padding:9px 12px;font-size:calc(var(--fs) - 1px);color:var(--sd);margin:8px 0;line-height:1.55;font-family:var(--read)}
html[data-theme="paper"] .mnemonic{color:var(--body)}
.mnemonic b{color:var(--sd)}
.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.numchip{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:11.5px;line-height:1.45}
.numchip b{display:block;color:var(--text);font-size:14px;font-family:var(--mono);margin-bottom:2px}
.numchip span{color:var(--sub)}

@media print{
  .topbar,.modebar,.sidebar,.term-chrome,.scanlines,.nav-footer,.cheat-toolbar,.markdone{display:none!important}
  body{background:#fff;color:#000}
  .shell{display:block}
  main{max-width:100%;padding:0;columns:2;column-gap:26px}
  .cheat-sec{break-inside:avoid}
}

/* ================= DEMO PLAYER ================= */
.dp-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px}
@media (max-width:760px){.dp-layout{grid-template-columns:1fr}}
.dp-code{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 0;font-family:var(--mono);font-size:11.5px;line-height:1.75;height:fit-content;position:sticky;top:112px;min-width:0;max-width:270px;overflow-x:auto}
@media (max-width:760px){.dp-code{position:static;max-width:100%}}
.dp-code-line{padding:1px 11px;white-space:pre;color:var(--sub);transition:background .25s,color .25s;width:max-content;min-width:100%}
.dp-code-line.active{background:var(--sel);color:var(--text);border-left:2px solid var(--accent)}
.dp-ring{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:11px}
.dp-phase{flex:1;min-width:74px;text-align:center;font-family:var(--mono);font-size:9.5px;padding:6px 3px;border-radius:7px;border:1px solid var(--line);color:var(--sub);transition:all .3s;font-weight:700}
.dp-phase.on{color:#fff;border-color:transparent;transform:scale(1.03)}
html[data-theme="paper"] .dp-phase.on{color:#fff}
.dp-grid{display:grid;gap:9px;margin-bottom:9px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.dp-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:66px}
.dp-card h4{margin:0 0 7px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--sub)}
.dp-dot{width:7px;height:7px;border-radius:50%;flex:none}
.dp-items{display:flex;flex-direction:column;gap:5px}
.dp-frame{border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:10.5px;animation:dpop .3s ease;border:1px solid;display:flex;justify-content:space-between;gap:6px;line-height:1.4}
@keyframes dpop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.dp-frame.stack{background:var(--accentbg);border-color:var(--accentbd);color:var(--accent)}
.dp-frame.heap{background:var(--nodebg);border-color:var(--nodebd);color:var(--node)}
.dp-frame.tick{background:var(--tickbg);border-color:var(--tickbd);color:var(--tick)}
.dp-frame.micro{background:var(--microbg);border-color:var(--microbd);color:var(--micro)}
.dp-frame.macro{background:var(--jsbg);border-color:var(--jsbd);color:var(--js)}
.dp-frame.pool{background:var(--poolbg);border-color:var(--poolbd);color:var(--pool)}
.dp-frame.aws{background:var(--awsbg);border-color:var(--awsbd);color:var(--aws)}
.dp-frame.db{background:var(--dbbg);border-color:var(--dbbd);color:var(--db)}
.dp-frame.sd{background:var(--sdbg);border-color:var(--sdbd);color:var(--sd)}
.dp-frame.ai{background:var(--aibg);border-color:var(--aibd);color:var(--ai)}
.dp-frame.fw{background:var(--fwbg);border-color:var(--fwbd);color:var(--fw)}
.dp-frame.bad{background:var(--badbg);border-color:var(--tickbd);color:var(--bad)}
.dp-frame .ref{color:var(--sub);font-size:9.5px;flex:none}
.dp-empty{color:var(--sub);font-size:10px;font-family:var(--mono);opacity:.6}
.dp-workers{display:flex;gap:4px;margin-bottom:6px}
.dp-worker{flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;padding:4px 2px;border-radius:5px;border:1px solid var(--line);color:var(--sub);transition:all .3s}
.dp-worker.busy{background:var(--poolbg);border-color:var(--pool);color:var(--pool)}
.dp-console{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:11px;margin:9px 0;min-height:38px;max-height:190px;overflow-y:auto}
.dp-console .r{color:var(--sub);margin-bottom:2px;line-height:1.5}
.dp-console .r span{color:var(--ok)}
.dp-note{font-size:calc(var(--fs) - .5px);line-height:1.62;color:var(--body);min-height:48px;margin-top:2px;font-family:var(--read)}
.dp-note b{color:var(--text)}
.dp-progress{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.dp-progress-fill{height:100%;background:var(--accent);transition:width .3s ease}
.dp-controls{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.dp-controls button{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.dp-controls button:hover:not(:disabled){border-color:var(--sub)}
.dp-controls button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.dp-controls button:disabled{opacity:.35;cursor:default}
.dp-step-count{color:var(--sub);font-size:11px;font-family:var(--mono);margin-left:auto}
.scenario-picker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.scenario-chip{font-family:var(--mono);font-size:11.5px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);cursor:pointer;transition:all .2s}
.scenario-chip:hover{border-color:var(--sub);color:var(--text)}
.scenario-chip.active{background:var(--accentbg);border-color:var(--accent);color:var(--accent);font-weight:700}

/* ================= mini animations ================= */
.stack-anim{display:flex;flex-direction:column-reverse;gap:5px;width:150px}
.stack-anim div{height:22px;border-radius:5px;background:var(--accentbg);border:1px solid var(--accentbd);animation:stackPulse 2.4s ease-in-out infinite}
.stack-anim div:nth-child(2){animation-delay:.3s}.stack-anim div:nth-child(3){animation-delay:.6s}
@keyframes stackPulse{0%,100%{opacity:.5;transform:scaleX(.9)}50%{opacity:1;transform:scaleX(1)}}
.heap-anim{position:relative;width:180px;height:100px}
.heap-anim i{position:absolute;border-radius:50%;background:var(--nodebg);border:1px solid var(--nodebd);display:block;animation:float 3.2s ease-in-out infinite}
.heap-anim i:nth-child(1){width:34px;height:34px;left:10px;top:30px}
.heap-anim i:nth-child(2){width:22px;height:22px;left:70px;top:8px;animation-delay:.5s}
.heap-anim i:nth-child(3){width:44px;height:44px;left:100px;top:40px;animation-delay:1s}
.heap-anim i:nth-child(4){width:18px;height:18px;left:60px;top:70px;animation-delay:1.5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.loop-anim{width:104px;height:104px;border-radius:50%;border:3px solid var(--line);position:relative}
.loop-anim::before{content:'';position:absolute;top:-3px;left:-3px;width:100%;height:100%;border-radius:50%;border:3px solid transparent;border-top-color:var(--js);animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chain-anim{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.chain-anim div{padding:8px 12px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--sub);animation:glow 2.4s ease-in-out infinite}
.chain-anim div:nth-child(2){animation-delay:.4s}.chain-anim div:nth-child(3){animation-delay:.8s}
@keyframes glow{0%,100%{border-color:var(--line);color:var(--sub)}50%{border-color:var(--js);color:var(--js)}}
.thread-anim{display:flex;gap:8px}
.thread-anim div{width:28px;height:44px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);animation:busy 3s ease-in-out infinite}
.thread-anim div:nth-child(2){animation-delay:.7s}.thread-anim div:nth-child(3){animation-delay:1.4s}.thread-anim div:nth-child(4){animation-delay:2.1s}
@keyframes busy{0%,20%,100%{background:var(--panel2);border-color:var(--line)}10%{background:var(--poolbg);border-color:var(--pool)}}
.stream-anim{position:relative;width:200px;height:24px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.stream-anim i{position:absolute;top:3px;left:-16px;width:16px;height:16px;border-radius:50%;background:var(--node);animation:travel 2.2s linear infinite}
.stream-anim i:nth-child(2){animation-delay:.7s}.stream-anim i:nth-child(3){animation-delay:1.4s}
@keyframes travel{to{left:calc(100% + 16px)}}
.thisflip-anim{display:flex;align-items:center;gap:14px}
.tf-box{padding:10px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--sub);animation:tfpulse 2.4s ease-in-out infinite}
.tf-box.b{background:var(--jsbg);border-color:var(--jsbd);color:var(--js);animation-delay:.4s}
.tf-arrow{color:var(--sub);font-size:18px;animation:tfarrow 2.4s ease-in-out infinite}
@keyframes tfpulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes tfarrow{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.sweep-anim{display:flex;gap:10px}
.sweep-anim i{width:26px;height:26px;border-radius:50%;display:block}
.sweep-anim i.live{background:var(--nodebg);border:1px solid var(--node);animation:livepulse 2.4s ease-in-out infinite}
.sweep-anim i.dead{background:var(--panel2);border:1px solid var(--line);animation:sweepfade 2.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes sweepfade{0%,40%{opacity:.7}60%,100%{opacity:.1}}
.hoist-anim{position:relative;width:200px;height:110px}
.hoist-top{position:absolute;top:0;left:0;right:0;text-align:center;font-family:var(--mono);font-size:10px;color:var(--sub);border-bottom:1px dashed var(--line);padding-bottom:6px}
.hoist-chip{position:absolute;left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:6px;font-family:var(--mono);font-size:11px;white-space:nowrap;animation:rise 2.8s ease-in infinite}
.hoist-chip.v{background:var(--accentbg);border:1px solid var(--accentbd);color:var(--accent);bottom:10px}
.hoist-chip.f{background:var(--nodebg);border:1px solid var(--nodebd);color:var(--node);bottom:10px;animation-delay:1.4s}
@keyframes rise{0%{bottom:10px;opacity:0}15%{opacity:1}90%{bottom:80px;opacity:1}100%{bottom:80px;opacity:0}}
.protochain-anim{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.pc-node{padding:6px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--sub);animation:pcglow 3.2s ease-in-out infinite}
.pc-arrow{color:var(--sub);font-size:12px}
.protochain-anim .pc-node:nth-child(3){animation-delay:.5s}
.protochain-anim .pc-node:nth-child(5){animation-delay:1s}
.protochain-anim .pc-node:nth-child(7){animation-delay:1.5s}
@keyframes pcglow{0%,85%,100%{border-color:var(--line);color:var(--sub)}15%{border-color:var(--accent);color:var(--accent)}}
.taskqueue-anim{display:flex;flex-direction:column;gap:10px;width:180px}
.tq-row{display:flex;align-items:center;gap:6px}
.tq-label{font-family:var(--mono);font-size:10px;color:var(--sub);width:40px}
.tq-row i{width:12px;height:12px;border-radius:50%;background:var(--microbg);border:1px solid var(--microbd);display:block}
.tq-row:last-child i{background:var(--jsbg);border-color:var(--jsbd)}
.tq-row:first-child i{animation:tqfast 1.1s ease-in-out infinite}
.tq-row:first-child i:nth-child(3){animation-delay:.15s}
.tq-row:first-child i:nth-child(4){animation-delay:.3s}
.tq-row:last-child i{animation:tqfast 2.6s ease-in-out infinite}
@keyframes tqfast{0%,100%{opacity:.3}50%{opacity:1}}
.enginemerge-anim{position:relative;width:200px;height:70px}
.em-box{position:absolute;top:8px;padding:8px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;border:1px solid;animation:emmerge 3s ease-in-out infinite}
.em-box.v8{left:0;background:var(--accentbg);border-color:var(--accentbd);color:var(--accent)}
.em-box.libuv{right:0;background:var(--nodebg);border-color:var(--nodebd);color:var(--node);animation-name:emmerge2}
.em-result{position:absolute;bottom:0;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--sub);opacity:0;animation:emresult 3s ease-in-out infinite}
@keyframes emmerge{0%,20%{left:0}45%,55%{left:38%}80%,100%{left:0}}
@keyframes emmerge2{0%,20%{right:0}45%,55%{right:38%}80%,100%{right:0}}
@keyframes emresult{0%,40%{opacity:0}55%,75%{opacity:1}100%{opacity:0}}
.moduleflow-anim{display:flex;flex-direction:column;gap:14px;width:200px}
.mf-row{position:relative;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--sub);height:20px}
.mf-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);position:absolute;left:0}
.mf-row.sync .mf-dot{animation:mfsync 1.6s linear infinite}
.mf-row.async .mf-dot{background:var(--node);animation:mfasync 2.8s linear infinite}
@keyframes mfsync{0%{left:0;opacity:1}90%{left:130px;opacity:1}100%{left:130px;opacity:0}}
@keyframes mfasync{0%,20%{left:0;opacity:.4}90%{left:130px;opacity:1}100%{left:130px;opacity:0}}
.nexttick-anim{display:flex;gap:8px;align-items:center}
.nt-chip{padding:6px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--sub)}
.nt-chip.priority{background:var(--tickbg);border-color:var(--tickbd);color:var(--tick);animation:tfpulse 2s ease-in-out infinite}
.clusterproc-anim{display:flex;gap:12px}
.cp-proc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:9px;color:var(--sub)}
.cp-proc i{width:10px;height:10px;border-radius:50%;background:var(--pool);display:block;animation:tqfast 2.4s ease-in-out infinite}
.cp-proc:nth-child(2) i{animation-delay:.6s}.cp-proc:nth-child(3) i{animation-delay:1.2s}
.nonblock-anim{width:200px}
.nb-pipe{position:relative;height:24px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.nb-pipe i{position:absolute;top:3px;left:-16px;width:16px;height:16px;border-radius:50%;background:var(--accent);animation:travel 1.8s linear infinite}
.nb-pipe i:nth-child(2){animation-delay:.4s}.nb-pipe i:nth-child(3){animation-delay:.8s}
.typeflow-anim{display:flex;align-items:center;gap:12px}
.tf2-value{padding:8px 14px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--sub);animation:tfpulse 2.4s ease-in-out infinite}
.tf2-arrow{color:var(--sub)}
.tf2-type{padding:8px 14px;border-radius:6px;background:var(--tsbg);border:1px solid var(--tsbd);color:var(--ts);font-family:var(--mono);font-size:13px;opacity:0;animation:tf2type 2.4s ease-in-out infinite}
@keyframes tf2type{0%,45%{opacity:0;transform:translateX(-4px)}70%,100%{opacity:1;transform:none}}
.narrow-anim{display:flex;flex-direction:column;align-items:center;gap:2px}
.nw-wide{padding:6px 14px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--sub)}
.nw-funnel{width:0;height:0;border-left:40px solid transparent;border-right:40px solid transparent;border-top:20px solid var(--line);margin:2px 0}
.nw-narrow{padding:6px 14px;border-radius:6px;background:var(--tsbg);border:1px solid var(--tsbd);color:var(--ts);font-family:var(--mono);font-size:11px;animation:tfpulse 2.4s ease-in-out infinite}
.aliasvs-anim{position:relative;width:200px;height:70px}
.av-box{position:absolute;top:8px;padding:8px 12px;border-radius:6px;font-family:var(--mono);font-size:11px;border:1px solid}
.av-box.a{left:0;background:var(--accentbg);border-color:var(--accentbd);color:var(--accent);animation:emmerge 3s ease-in-out infinite}
.av-box.b{right:0;background:var(--tsbg);border-color:var(--tsbd);color:var(--ts);animation:emmerge2 3s ease-in-out infinite}
.av-result{position:absolute;bottom:0;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--sub);opacity:0;animation:emresult 3s ease-in-out infinite}
.access-anim{display:flex;flex-direction:column;gap:6px}
.acc-chip{padding:6px 12px;border-radius:6px;font-family:var(--mono);font-size:10.5px;border:1px solid}
.acc-chip.pub{background:var(--nodebg);border-color:var(--nodebd);color:var(--node)}
.acc-chip.prot{background:var(--jsbg);border-color:var(--jsbd);color:var(--js);animation:accflicker 2.6s ease-in-out infinite}
.acc-chip.priv{background:var(--tickbg);border-color:var(--tickbd);color:var(--tick);animation:accflicker 2.6s ease-in-out infinite .5s}
@keyframes accflicker{0%,100%{opacity:1}45%,55%{opacity:.25}}
.inherit-anim{display:flex;flex-direction:column;align-items:center;gap:4px}

/* ==================== ENGINE & MEMORY ==================== */
{ id:'exec', group:'Engine & memory', title:'Execution context & call stack', animate:'stack',
  lede:"Every time JS runs code it does so inside an execution context — a box holding variables, scope and 'this'. Contexts stack on top of each other.",
  say:"JavaScript runs code inside execution contexts pushed onto a single call stack. Each context is built in two phases — a creation phase that hoists declarations and sets up scope and <code>this</code>, then an execution phase that runs statements. When a function returns its frame pops. The stack is finite, so unbounded recursion throws <code>RangeError: Maximum call stack size exceeded</code>, and a stack trace is literally a printout of that stack at the moment of the error.",
  steps:[
    "The <b>Global Execution Context</b> is created first and pushed onto the call stack — it holds top-level code, and in browsers binds <code>this</code> to <code>window</code>.",
    "Every function call creates a new <b>Function Execution Context</b> pushed on top of the stack.",
    "Each context has two phases: <b>creation</b> (hoist <code>var</code>/function declarations, build the scope chain, determine <code>this</code>, create the arguments object) then <b>execution</b> (run line by line).",
    "When the function returns, its context is <b>popped</b>, and control resumes in the frame below.",
    "Each context tracks a <b>variable environment</b> (its own bindings) and an <b>outer reference</b> to the lexical scope it was defined in — that outer link is what makes closures work.",
    "The stack has a fixed size (typically ~10k–15k frames in V8). Unbounded recursion pushes faster than it pops → <b>RangeError</b>.",
    "V8 does <b>not</b> implement tail-call optimisation despite it being in the ES2015 spec (only Safari/JSC does), so 'tail-recursive' JS still overflows — convert to a loop or trampoline for large inputs.",
    "Async callbacks do <b>not</b> extend the stack of the code that scheduled them — they run on a fresh, nearly-empty stack later, which is why async stack traces used to be so useless before <code>--async-stack-traces</code>."
  ],
  code:`function greet(name) {
  return 'hi ' + name;
}
greet('Gayan'); <span class="cm">// pushes greet's context, then pops it</span>

<span class="cm">// stack depth is finite:</span>
function depth(n){ try { return depth(n+1); } catch(e){ return n; } }
depth(0); <span class="cm">// ~11000 in Node, varies by frame size</span>`,
  traps:[
    "A recursive function with a <i>correct</i> base case can still overflow if the input is large enough — recursion depth is bounded by frame count, not by correctness.",
    "Stack frames are bigger when a function has many locals/arguments, so max depth varies between functions and between engines. Never quote a fixed number as if it were a spec guarantee.",
    "<code>setTimeout(fn, 0)</code> inside recursion resets the stack each time — that's the classic trampoline trick to avoid overflow, at the cost of being async."
  ],
  terms:[
    {term:"Execution context", desc:"Container tracking variables, scope chain and 'this' for a running block.", detail:"Every context goes through a creation phase before a single line executes — that's why declarations can be 'seen' before their line runs.", code:`function outer() {\n  function inner() { return 'hi'; }\n  return inner();  <span class="cm">// inner() gets its own execution context</span>\n}`},
    {term:"Call stack", desc:"LIFO structure tracking which execution context is active.", detail:"Reading a stack trace top-to-bottom shows the exact chain of calls that led here — innermost call first.", code:`function a(){ b(); }\nfunction b(){ c(); }\nfunction c(){ console.trace(); }\na();  <span class="cm">// trace shows: c, b, a</span>`},
    {term:"Trampolining", desc:"Turning recursion into a loop so the stack never grows.", detail:"A trampoline returns a thunk instead of recursing, and a driver loop keeps calling thunks until a real value comes back — constant stack depth for any input size.", code:`function trampoline(fn){\n  return function(...a){ let r = fn(...a);\n    while (typeof r === 'function') r = r();\n    return r; };\n}`}
  ],
  cards:[
    {q:"What are the two phases of an execution context, and what happens in each?", a:"<b>Creation:</b> hoist <code>var</code> and function declarations, build the scope chain (outer reference), determine <code>this</code>, create <code>arguments</code>. <b>Execution:</b> run statements top to bottom, assigning values."},
    {q:"Does V8 implement tail-call optimisation?", a:"No. TCO is in the ES2015 spec but only JavaScriptCore (Safari) shipped it. In V8/Node, deep tail recursion still throws <code>RangeError: Maximum call stack size exceeded</code>."},
    {q:"Why do async callbacks produce short stack traces?", a:"They run later on a fresh stack — the frames of the code that scheduled them have already popped. Node's <code>--async-stack-traces</code> (on by default in modern versions) stitches them back together for promises."}
  ],
  quiz:[
    {q:"What does this log?", code:`function a(){ return b(); }\nfunction b(){ return 'done'; }\nconsole.log(a());`,
     options:["'done' — b's frame pops, then a's","RangeError","undefined","A stack trace"], answer:0,
     why:"a pushes, calls b which pushes on top, b returns 'done' and pops, a returns that value and pops. Straightforward LIFO."}
  ],
  cheat:[
    "<b>Context = variables + scope chain + this.</b> Two phases: creation (hoist, scope, this) → execution.",
    "Stack is <b>LIFO</b> and finite (~10–15k frames in V8). Overflow = <code>RangeError: Maximum call stack size exceeded</code>.",
    "<b>No TCO in V8.</b> Convert deep recursion to a loop or trampoline.",
    "Stack trace = snapshot of the call stack, innermost frame first.",
    {t:'mnemonic', text:"<b>C-E</b>: <b>C</b>reate then <b>E</b>xecute. Hoisting is just the C half leaking into your mental model of the E half."}
  ]
},

{ id:'memory', group:'Engine & memory', title:'Memory: stack vs heap', animate:'heap',
  lede:"JS has two very different memory regions, and confusing them is one of the most common interview trip-ups.",
  say:"Primitives live in the stack frame; objects, arrays and functions are allocated on the heap and the variable holds a reference. So primitives copy by value and objects copy the reference by value — you can mutate through a parameter, but reassigning it doesn't affect the caller. <code>===</code> on objects compares references, not contents.",
  steps:[
    "<b>Primitives</b> (number, string, boolean, null, undefined, symbol, bigint) are stored directly in the execution context's stack frame.",
    "<b>Objects, arrays and functions</b> are allocated in the <b>heap</b>; the stack slot holds only a reference (pointer).",
    "This is why objects are <b>copied by reference</b> and primitives <b>by value</b> on assignment or when passed to a function.",
    "JS is always <b>pass-by-value</b> — the value passed for an object just happens to be a reference. Mutating through it affects the caller; reassigning the parameter does not.",
    "Primitives are <b>immutable</b>: <code>'a'.toUpperCase()</code> returns a new string, it never edits the original.",
    "<code>===</code> on objects compares identity (same heap address), not structural equality — <code>{a:1} === {a:1}</code> is <code>false</code>.",
    "Stack is fast because its layout is known and frames pop automatically; the heap needs a garbage collector precisely because object lifetimes aren't predictable.",
    "<code>Object.freeze()</code> is <b>shallow</b> — it blocks reassigning own top-level properties but nested objects stay mutable."
  ],
  code:`let a = 10;          <span class="cm">// stack: primitive</span>
let obj = { x: 1 };  <span class="cm">// heap: object, stack holds a pointer</span>
let obj2 = obj;      <span class="cm">// copies the pointer, not the object</span>
obj2.x = 99;         <span class="cm">// obj.x is 99 too — same heap object</span>

const frozen = Object.freeze({ a: 1, nested: { b: 2 } });
frozen.a = 5;          <span class="cm">// silently ignored (throws in strict mode)</span>
frozen.nested.b = 99;  <span class="cm">// works! freeze is shallow</span>`,
  traps:[
    "<code>const</code> prevents <b>rebinding</b>, not <b>mutation</b>. <code>const arr = []; arr.push(1)</code> is perfectly legal.",
    "Two structurally identical objects are never <code>===</code>. Interviewers love asking <code>[1,2] === [1,2]</code> (false) right after <code>'a' === 'a'</code> (true).",
    "Passing an object into a function and doing <code>param = {...}</code> inside changes nothing for the caller — a very common source of 'why didn't my function update it' bugs.",
    "Strings are primitives but <code>typeof new String('x')</code> is <code>'object'</code> — boxed wrappers behave differently under <code>===</code>."
  ],
  terms:[
    {term:"Stack memory", desc:"Fixed-size, fast, automatically freed as frames pop.", detail:"Because its layout is predictable, allocating and freeing stack memory is essentially free compared to heap allocation.", code:`function add(a, b) {\n  const sum = a + b;   <span class="cm">// lives in this frame</span>\n  return sum;\n}                       <span class="cm">// freed when the frame pops</span>`},
    {term:"Heap memory", desc:"Large, dynamically allocated, managed by the garbage collector.", detail:"Heap allocation costs more than stack allocation, which is why creating huge numbers of short-lived objects in a hot loop hurts throughput.", code:`function makeUser(name) {\n  return { name, createdAt: Date.now() };  <span class="cm">// heap</span>\n}`},
    {term:"Pass by sharing", desc:"The precise name for JS's model: the reference is passed by value.", detail:"Mutating vs reassigning is the whole distinction. Mutation is visible to the caller; reassignment only rebinds the local parameter name.", code:`function mutate(o){ o.x = 99; }       <span class="cm">// affects caller</span>\nfunction reassign(o){ o = { x: 1 }; } <span class="cm">// does NOT</span>`}
  ],
  cards:[
    {q:"Is JavaScript pass-by-reference?", a:"No — it's <b>pass-by-value</b> everywhere; for objects the value <i>is</i> a reference (sometimes called pass-by-sharing). You can mutate the pointed-to object, but reassigning the parameter is invisible to the caller."},
    {q:"Why is <code>Object.freeze</code> not enough for immutability?", a:"It's shallow — only own top-level properties are locked. Nested objects remain mutable. You need a recursive deepFreeze, or a structural-sharing library."},
    {q:"What does <code>const</code> actually guarantee?", a:"That the binding can't be reassigned. It says nothing about the value's mutability."}
  ],
  quiz:[
    {q:"What is logged?", code:`function f(o){ o.x = 1; o = { x: 99 }; return o; }\nconst a = { x: 0 };\nconst b = f(a);\nconsole.log(a.x, b.x);`,
     options:["1 99","99 99","0 99","1 1"], answer:0,
     why:"<code>o.x = 1</code> mutates the caller's object → <code>a.x === 1</code>. Then <code>o = {x:99}</code> only rebinds the local parameter; that new object is returned as <code>b</code>, so <code>b.x === 99</code>."},
    {q:"What is the result?", code:`const o = Object.freeze({ list: [1,2] });\no.list.push(3);\nconsole.log(o.list.length);`,
     options:["3 — freeze is shallow","2 — freeze blocks it","TypeError","0"], answer:0,
     why:"freeze only locks own properties of <code>o</code>. The array it points to is a separate heap object and is untouched, so push works."}
  ],
  cheat:[
    "Primitives → stack, by value. Objects/arrays/functions → heap, variable holds a reference.",
    "<b>JS is pass-by-value always</b>; for objects the value is a pointer (\"pass by sharing\").",
    "<code>===</code> on objects = identity, not structure.",
    "<code>const</code> = no rebinding. <code>Object.freeze</code> = shallow. Deep immutability needs recursion or structuredClone + discipline.",
    {t:'table', head:['','Primitive','Object'], rows:[
      ['Stored','Stack frame','Heap (stack holds pointer)'],
      ['Copy semantics','Value','Reference (copied by value)'],
      ['Mutable','No','Yes'],
      ['<code>===</code> compares','Value','Identity'],
      ['Freed by','Frame pop','Garbage collector']
    ]}
  ]
},

{ id:'types', group:'Engine & memory', title:'Types, coercion & equality', animate:'typeflow',
  lede:"Every 'weird JavaScript' quiz question is really a question about the abstract operations behind ==, +, and truthiness.",
  say:"JS has 7 primitives plus object. <code>==</code> applies type coercion via ToPrimitive/ToNumber, <code>===</code> doesn't. I use <code>===</code> always, with the one idiomatic exception of <code>x == null</code> to test for null-or-undefined. <code>typeof null === 'object'</code> is a 1995 bug kept for compatibility, and <code>NaN !== NaN</code> so you test with <code>Number.isNaN</code> or <code>Object.is</code>.",
  steps:[
    "Seven primitives: <code>string, number, boolean, null, undefined, symbol, bigint</code>. Everything else is an object (arrays and functions included).",
    "<code>typeof</code> returns <code>'object'</code> for <code>null</code> (a legacy bug), <code>'function'</code> for functions, and <code>'object'</code> for arrays — use <code>Array.isArray()</code> for arrays.",
    "<code>==</code> triggers coercion: <code>null == undefined</code> is true, but <code>null == 0</code> is false. Strings compared to numbers become numbers; objects compared to primitives go through <code>ToPrimitive</code> (<code>Symbol.toPrimitive</code> → <code>valueOf</code> → <code>toString</code>).",
    "<code>+</code> is overloaded: if either operand is a string after ToPrimitive, it concatenates; otherwise it adds numerically. Every other arithmetic operator only ever coerces to number.",
    "Falsy values, complete list: <code>false, 0, -0, 0n, '', null, undefined, NaN</code>. <b>Everything else is truthy</b>, including <code>[]</code>, <code>{}</code> and <code>'0'</code>.",
    "<code>NaN !== NaN</code>. Use <code>Number.isNaN(x)</code> (not the global <code>isNaN</code>, which coerces first) or <code>Object.is(x, NaN)</code>.",
    "<code>Object.is</code> is <code>===</code> except it treats <code>NaN</code> as equal to itself and distinguishes <code>+0</code> from <code>-0</code>.",
    "<code>??</code> (nullish coalescing) only falls back on <code>null</code>/<code>undefined</code>; <code>||</code> falls back on any falsy value — which silently eats a legitimate <code>0</code> or <code>''</code>."
  ],
  code:`[] + []        <span class="cm">// ''      both ToPrimitive to ''</span>
[] + {}        <span class="cm">// '[object Object]'</span>
[] == false    <span class="cm">// true    [] → '' → 0, false → 0</span>
'0' == false   <span class="cm">// true    both → 0</span>
'' == 0        <span class="cm">// true</span>
null == 0      <span class="cm">// false   null only == undefined</span>
NaN === NaN    <span class="cm">// false</span>

const port = 0;
port || 3000   <span class="cm">// 3000  ← bug: 0 is falsy</span>
port ?? 3000   <span class="cm">// 0     ← correct</span>`,
  traps:[
    "<code>||</code> for defaults is a real production bug generator whenever <code>0</code>, <code>''</code> or <code>false</code> are valid values. Reach for <code>??</code>.",
    "<code>typeof undeclaredVariable</code> returns <code>'undefined'</code> without throwing — the only safe way to probe an undeclared identifier. But it <b>does</b> throw for a <code>let</code>/<code>const</code> in the TDZ.",
    "<code>parseInt('08')</code> is fine now, but <code>parseInt('1e3')</code> is <code>1</code>, not 1000. Use <code>Number()</code> for whole-string conversion.",
    "Sorting numbers with bare <code>.sort()</code> sorts lexicographically: <code>[10,9,1].sort()</code> → <code>[1,10,9]</code>. Always pass a comparator.",
    "<code>0.1 + 0.2 !== 0.3</code> — IEEE-754 doubles. Compare with an epsilon, or use integers/cents for money."
  ],
  terms:[
    {term:"ToPrimitive", desc:"The abstract operation converting an object to a primitive before comparison or arithmetic.", detail:"Order: <code>Symbol.toPrimitive</code> if present, then <code>valueOf</code>, then <code>toString</code> (for the 'default'/'number' hint). Arrays have no useful <code>valueOf</code>, so they fall through to <code>toString</code> — which is why <code>[1,2] + ''</code> is <code>'1,2'</code>.", code:`const money = {\n  amount: 5,\n  [Symbol.toPrimitive](hint){\n    return hint === 'string' ? '$5' : 5;\n  }\n};\nmoney + 1;     <span class="cm">// 6</span>\n\`\${money}\`;     <span class="cm">// '$5'</span>`},
    {term:"Object.is", desc:"SameValue equality — like === but sane about NaN and signed zero.", detail:"Useful in equality-checking library code (React uses it for state comparison). It is not a deep-equality helper.", code:`Object.is(NaN, NaN);  <span class="cm">// true</span>\nObject.is(0, -0);     <span class="cm">// false</span>\nNaN === NaN;          <span class="cm">// false</span>`},
    {term:"Optional chaining & nullish", desc:"<code>?.</code> short-circuits on null/undefined; <code>??</code> defaults only on null/undefined.", detail:"<code>a?.b()</code> short-circuits the whole call if <code>a</code> is nullish. <code>??=</code> assigns only when the target is nullish — handy for lazy caches.", code:`const city = user?.address?.city ?? 'unknown';\ncache.value ??= expensiveCompute();  <span class="cm">// only if null/undefined</span>`}
  ],
  cards:[
    {q:"List every falsy value in JavaScript.", a:"<code>false</code>, <code>0</code>, <code>-0</code>, <code>0n</code>, <code>''</code>, <code>null</code>, <code>undefined</code>, <code>NaN</code>. That's all eight — <code>[]</code>, <code>{}</code>, <code>'0'</code>, <code>'false'</code> are all truthy."},
    {q:"Why is <code>typeof null === 'object'</code>?", a:"A bug in the original 1995 implementation: values were tagged by their low bits and the null pointer (all zeros) collided with the object tag. Fixing it would break the web, so it stayed."},
    {q:"When is <code>==</code> acceptable?", a:"The idiomatic exception is <code>x == null</code>, which is true for exactly <code>null</code> and <code>undefined</code>. Everywhere else use <code>===</code>."},
    {q:"Difference between <code>||</code> and <code>??</code> for defaults?", a:"<code>||</code> falls back on any falsy value (so <code>0</code> and <code>''</code> get replaced — usually a bug). <code>??</code> falls back only on <code>null</code>/<code>undefined</code>."}
  ],
  quiz:[
    {q:"What does this print?", code:`console.log([] == false, [] == '', typeof []);`,
     options:["true true 'object'","false false 'array'","true true 'array'","false true 'object'"], answer:0,
     why:"<code>[]</code> → ToPrimitive → <code>''</code> → ToNumber → <code>0</code>; <code>false</code> → <code>0</code>, so true. <code>[] == ''</code> compares <code>''</code> to <code>''</code> → true. <code>typeof</code> any object, arrays included, is <code>'object'</code>."},
    {q:"What is logged?", code:`const config = { retries: 0, name: '' };\nconsole.log(config.retries || 3, config.name ?? 'anon');`,
     options:["3 ''","0 ''","3 'anon'","0 'anon'"], answer:0,
     why:"<code>0 || 3</code> → 3 because 0 is falsy (the classic bug). <code>'' ?? 'anon'</code> → <code>''</code> because <code>??</code> only triggers on null/undefined."}
  ],
  cheat:[
    "<b>7 primitives</b>: string, number, boolean, null, undefined, symbol, bigint. Everything else is object.",
    "<b>8 falsy values</b>: <code>false 0 -0 0n '' null undefined NaN</code>.",
    "<code>==</code> coerces via ToPrimitive→ToNumber. <code>===</code> doesn't. Only sanctioned <code>==</code> use: <code>x == null</code>.",
    "<code>typeof null==='object'</code> (legacy bug) · <code>typeof fn==='function'</code> · arrays → <code>Array.isArray</code>.",
    "<code>NaN!==NaN</code> → use <code>Number.isNaN</code>. <code>Object.is</code> = === + NaN-equal + ±0 distinct.",
    "<code>??</code>/<code>?.</code>/<code>??=</code> for null-safety; <code>||</code> eats valid 0 and ''.",
    "<code>0.1+0.2 !== 0.3</code> (IEEE-754). Money → integer minor units.",
    {t:'mnemonic', text:"Falsy list mnemonic: <b>“F.O.N.E.N.U.N.”</b> — <b>F</b>alse, <b>O</b> (zero, both signs and bigint), <b>N</b>aN, <b>E</b>mpty string, <b>N</b>ull, <b>U</b>ndefined."}
  ]
},

{ id:'copy', group:'Engine & memory', title:'Shallow vs deep copy & immutability', animate:'sweep',
  lede:"Spread looks like a copy but only goes one level deep — the number-one cause of 'I mutated state I didn't mean to' bugs.",
  say:"Spread and <code>Object.assign</code> are shallow: nested objects are still shared references. For a true deep copy I use <code>structuredClone</code>, which is built in, handles Dates, Maps, Sets and cycles, but throws on functions and DOM nodes. <code>JSON.parse(JSON.stringify(x))</code> is the old trick and silently destroys Dates, undefined, Infinity, functions and Symbols.",
  steps:[
    "<b>Shallow copy</b> (<code>{...obj}</code>, <code>Object.assign({}, obj)</code>, <code>arr.slice()</code>) copies own enumerable properties one level deep — nested objects are shared.",
    "<b>Deep copy</b> recursively duplicates everything, so no reference is shared with the original.",
    "<code>structuredClone(value)</code> is the modern built-in (Node 17+, all modern browsers). It handles <b>Date, Map, Set, RegExp, ArrayBuffer, Blob and circular references</b>.",
    "<code>structuredClone</code> <b>throws</b> on functions, Symbols, DOM nodes, class instances lose their prototype (you get a plain object), and getters are flattened to values.",
    "<code>JSON.parse(JSON.stringify(x))</code> silently converts <code>Date</code> → ISO string, drops <code>undefined</code>/functions/Symbols, turns <code>NaN</code>/<code>Infinity</code> into <code>null</code>, and throws on cycles.",
    "For immutable updates, <b>structural sharing</b> is what you actually want: copy only the path you're changing and reuse every untouched subtree — that's what Immer and Redux Toolkit do under the hood.",
    "Deep-freezing for real immutability means recursing through every own property and calling <code>Object.freeze</code> — and remembering that frozen objects fail silently in sloppy mode, throw in strict mode/modules."
  ],
  code:`const state = { user: { name: 'A' }, tags: ['x'] };

const shallow = { ...state };
shallow.user.name = 'B';
state.user.name;               <span class="cm">// 'B'  ← shared reference!</span>

const deep = structuredClone(state);
deep.user.name = 'C';
state.user.name;               <span class="cm">// 'B'  ← independent</span>

<span class="cm">// immutable update with structural sharing</span>
const next = { ...state, user: { ...state.user, name: 'D' } };
next.tags === state.tags;      <span class="cm">// true — untouched subtree reused</span>`,
  traps:[
    "<code>structuredClone</code> on a class instance returns a <b>plain object</b> — methods and the prototype are gone. Same for anything relying on <code>instanceof</code> afterwards.",
    "<code>JSON.stringify</code> on a <code>Date</code> gives a string; parsing it back gives a string, not a Date. Silent data corruption in caches.",
    "Spread copies <b>own enumerable</b> properties only — inherited props, non-enumerables and Symbol-keyed props behave differently (spread does copy own Symbol keys; <code>JSON</code> does not).",
    "Copying an array of objects with <code>arr.map(o =&gt; o)</code> gives you a new array of the <i>same</i> object references — not a deep copy."
  ],
  terms:[
    {term:"structuredClone", desc:"Built-in deep clone using the structured clone algorithm.", detail:"Same algorithm used to send data to a Web Worker or store it in IndexedDB — which is exactly why functions and DOM nodes are rejected: they aren't serialisable across realms.", code:`const src = { d: new Date(), m: new Map([['a',1]]) };\nsrc.self = src;               <span class="cm">// circular</span>\nconst copy = structuredClone(src);\ncopy.d instanceof Date;       <span class="cm">// true</span>\ncopy.self === copy;           <span class="cm">// true — cycle preserved</span>`},
    {term:"Structural sharing", desc:"Copy only the changed path, reuse every untouched branch.", detail:"This makes immutable updates O(depth) instead of O(size), and it makes reference equality a valid change-detection signal — the basis of React/Redux re-render optimisation.", code:`function setIn(obj, [k, ...rest], val){\n  return { ...obj, [k]: rest.length ? setIn(obj[k], rest, val) : val };\n}`}
  ],
  cards:[
    {q:"What does <code>structuredClone</code> handle that JSON round-tripping doesn't?", a:"Date, Map, Set, RegExp, ArrayBuffer/TypedArray, BigInt, and circular references. JSON turns Dates into strings, drops undefined/functions/Symbols, converts NaN/Infinity to null, and throws on cycles."},
    {q:"What does <code>structuredClone</code> NOT handle?", a:"Functions and Symbols (throws <code>DataCloneError</code>), DOM nodes, and class identity — instances come back as plain objects without their prototype. Getters are evaluated and flattened."},
    {q:"Why is a shallow copy usually enough in React/Redux?", a:"Because immutable updates use structural sharing: you spread only along the path you changed. Untouched subtrees keep the same reference, which makes <code>===</code> a cheap and correct change check."}
  ],
  quiz:[
    {q:"What is logged?", code:`const a = { d: new Date('2020-01-01'), u: undefined };\nconst b = JSON.parse(JSON.stringify(a));\nconsole.log(typeof b.d, 'u' in b);`,
     options:["'string' false","'object' true","'string' true","'object' false"], answer:0,
     why:"JSON.stringify calls <code>Date.prototype.toJSON</code> → an ISO string, so it parses back as a string. Properties with value <code>undefined</code> are omitted entirely, so <code>'u' in b</code> is false."}
  ],
  cheat:[
    "Spread / <code>Object.assign</code> / <code>slice</code> = <b>shallow</b> (one level).",
    "<code>structuredClone</code> = deep, handles Date/Map/Set/RegExp/cycles; <b>throws</b> on functions & Symbols; loses class prototypes.",
    "<code>JSON.parse(JSON.stringify())</code> = lossy: Date→string, undefined/fn/Symbol dropped, NaN/Infinity→null, cycles throw.",
    "Immutable updates = <b>structural sharing</b> (copy the path, reuse the rest) → reference equality becomes a valid change signal.",
    "<code>Object.freeze</code> is shallow; deepFreeze must recurse."
  ]
},

{ id:'gc', group:'Engine & memory', title:'Garbage collection & memory leaks', animate:'sweep',
  lede:"JS memory is managed automatically — but understanding the algorithm explains exactly which leaks are possible.",
  say:"V8 uses generational mark-and-sweep: a fast scavenger for the young generation and a slower mark-compact for the old generation, both starting from roots. Anything unreachable from a root is collected — which means circular references are fine, and the only way to leak is to accidentally keep something reachable: forgotten listeners, growing caches, closures over large data, or dangling timers.",
  steps:[
    "Modern engines use <b>mark-and-sweep</b>: starting from roots (globals, the current stack, active closures), mark everything reachable by reference.",
    "Anything <b>not marked</b> is unreachable and its memory is reclaimed. Reachability — not reference counting — is the criterion, so <b>circular references are collected fine</b>.",
    "V8 splits the heap into <b>generations</b>: a small 'new space' collected very frequently with a cheap copying <i>scavenger</i>, and 'old space' collected less often with <i>mark-compact</i>.",
    "The <b>generational hypothesis</b>: most objects die young. Objects that survive two scavenges get promoted to old space.",
    "Modern V8 does most marking <b>concurrently/incrementally</b> on background threads to keep pause times low, but there are still short stop-the-world pauses.",
    "<code>WeakMap</code>/<code>WeakSet</code>/<code>WeakRef</code> hold <b>weak references</b>: they don't keep the key alive, making them ideal for caches and per-object metadata.",
    "You cannot force GC from normal JS. Setting a variable to <code>null</code> only makes an object <i>eligible</i>; Node's <code>--expose-gc</code> flag adds <code>global.gc()</code> for debugging only.",
    "V8's old-space heap is capped by default (roughly 2–4 GB on 64-bit depending on version); a leaking long-running process ends with <code>FATAL ERROR: JavaScript heap out of memory</code>."
  ],
  code:`let obj = { big: new Array(1e6) };
obj = null;  <span class="cm">// eligible for GC — not necessarily collected yet</span>

<span class="cm">// the four classic Node/browser leaks:</span>
emitter.on('data', handler);      <span class="cm">// 1. listener never removed</span>
const cache = new Map();          <span class="cm">// 2. unbounded cache</span>
setInterval(tick, 1000);          <span class="cm">// 3. timer never cleared</span>
global.requests.push(req);        <span class="cm">// 4. global accumulator</span>

<span class="cm">// weak metadata: entry disappears when the key does</span>
const meta = new WeakMap();
meta.set(someUser, { lastSeen: Date.now() });`,
  note:{type:'warn', text:"<b>How to actually diagnose one:</b> take two heap snapshots (Chrome DevTools Memory tab, or <code>node --inspect</code> + <code>writeHeapSnapshot()</code>) a few minutes apart under load, then use <b>Comparison</b> view sorted by delta. The retained-size column and the <i>retainer path</i> tell you which reference is holding the garbage alive. In production, alert on <code>process.memoryUsage().heapUsed</code> trending upward across restarts — a leak looks like a sawtooth that never returns to baseline."},
  traps:[
    "Closures capture the <b>whole variable environment</b> in some engines, not just the variables you reference — a small callback can pin a large object alive.",
    "Detached DOM nodes: removing an element from the document doesn't free it if JS still holds a reference (or an event listener does).",
    "<code>WeakMap</code> keys must be objects (or non-registered Symbols). You cannot weakly key on a string ID — that's a normal Map and it leaks.",
    "A leak and 'high memory' are different: V8 happily grows toward its limit before collecting. Look for a rising <i>baseline</i> after GC, not a rising peak."
  ],
  terms:[
    {term:"Mark-and-sweep", desc:"Mark everything reachable from roots, sweep the rest.", detail:"Because it works from reachability rather than reference counts, two objects that only point at each other are still collected once nothing else references either.", code:`function makeCircle(){\n  const a = {}, b = {};\n  a.ref = b; b.ref = a;   <span class="cm">// circular but unreachable after return</span>\n}\nmakeCircle();  <span class="cm">// both collected</span>`},
    {term:"WeakMap vs Map", desc:"WeakMap entries don't prevent their key from being collected.", detail:"WeakMap is not enumerable and has no <code>.size</code> — precisely because entries can vanish at any moment, so iteration order would be non-deterministic.", code:`const strong = new Map(), weak = new WeakMap();\nlet key = {};\nstrong.set(key, 'data');  weak.set(key, 'data');\nkey = null;\n<span class="cm">// strong still holds the object → leak</span>\n<span class="cm">// weak entry becomes collectable</span>`},
    {term:"Retained size", desc:"How much memory would be freed if this object were collected.", detail:"Shallow size is the object itself; retained size includes everything only it keeps alive. In a heap snapshot, sort by retained size to find the actual culprit rather than the biggest single object.", code:`<span class="cm">// node --inspect app.js  → DevTools → Memory → Heap snapshot</span>\nrequire('v8').writeHeapSnapshot('./heap-1.heapsnapshot');`}
  ],
  cards:[
    {q:"Why don't circular references leak in JavaScript?", a:"Because GC is based on <b>reachability from roots</b>, not reference counting. Two objects pointing only at each other are unreachable once nothing external references them, so mark-and-sweep collects both."},
    {q:"Name the four classic memory leaks in a Node service.", a:"1) Event listeners never removed. 2) Unbounded in-memory caches/Maps. 3) Timers/intervals never cleared. 4) Module-level or global arrays that keep accumulating (request logs, connection lists)."},
    {q:"What are V8's two heap generations and why?", a:"New space (young), collected frequently with a cheap copying scavenger, and old space, collected with mark-compact. Based on the generational hypothesis that most objects die young — so you scan the small young set often and the big old set rarely."},
    {q:"How do you find a leak in production Node?", a:"Trend <code>process.memoryUsage().heapUsed</code>; if the post-GC baseline climbs, take two heap snapshots under load and diff them in DevTools, sorting by retained size and following the retainer path to the reference holding it."}
  ],
  quiz:[
    {q:"Which of these will definitely NOT be garbage collected?", code:`function attach(){\n  const big = new Array(1e6);\n  window.addEventListener('resize', () =&gt; console.log(big.length));\n}\nattach();`,
     options:["<code>big</code> — the listener closure keeps it reachable","<code>big</code> is freed when attach returns","The listener is freed but big stays","Nothing is retained"], answer:0,
     why:"The listener is registered on a root (window) and its closure references <code>big</code>, so <code>big</code> stays reachable forever unless the listener is removed."}
  ],
  cheat:[
    "GC = <b>mark & sweep from roots</b> → circular refs are fine; only <i>reachability</i> matters.",
    "V8 generational: new space (scavenge, frequent) → promoted after surviving 2 → old space (mark-compact, rare, mostly concurrent).",
    "<b>4 classic leaks:</b> listeners, unbounded caches, timers, global accumulators.",
    "<code>WeakMap/WeakSet/WeakRef</code> = collectable keys; not enumerable, no <code>.size</code>.",
    "Can't force GC (<code>--expose-gc</code> for debugging only). null-ing just makes it <i>eligible</i>.",
    "Diagnose = two heap snapshots + Comparison view, sort by <b>retained size</b>, follow the retainer path.",
    {t:'nums', items:[{v:'~2–4 GB',l:'default V8 old-space cap (64-bit)'},{v:'2 survivals',l:'before promotion to old space'},{v:'heapUsed',l:'the metric to trend in prod'}]}
  ]
},

/* ==================== SCOPE & FUNCTIONS ==================== */
{ id:'scope', group:'Scope & functions', title:'Scope, closures & the scope chain', animate:'chain',
  lede:"Closures are the single most-tested JS concept — and they fall out of how scope is resolved, not from magic.",
  say:"A function remembers the lexical scope it was <i>defined</i> in, not where it's called from. When it survives that scope — returned, stored, passed as a callback — the variables it references stay alive on the heap. That's a closure. Each call creates a fresh scope, which is why two counters from the same factory are independent, and why <code>let</code> in a loop fixes the classic callback bug.",
  steps:[
    "Every function, when defined, captures the <b>lexical environment</b> it was created in — not where it's later called from.",
    "Variable lookup walks the <b>scope chain</b>: local → each enclosing function → module → global; the first match wins, so an inner binding <b>shadows</b> an outer one.",
    "A <b>closure</b> forms when an inner function outlives its outer function while still referencing its variables.",
    "Because the closure references them, those variables <b>can't be collected</b> — they're promoted to the heap and live as long as the closure does.",
    "This is how private state works without classes — the <b>module pattern</b> and every factory function rely on it.",
    "Each invocation creates a <b>brand new scope</b>: calling <code>counter()</code> twice gives two completely independent <code>count</code> variables.",
    "<code>let</code>/<code>const</code> are <b>block-scoped</b>; <code>var</code> ignores blocks entirely and is function-scoped. In a <code>for(let i…)</code> loop the spec creates a fresh binding <i>per iteration</i> — that's the whole fix for the classic callback bug.",
    "Before <code>let</code>, an <b>IIFE</b> was the standard way to create an isolated scope; you'll still see it in older code and bundler output."
  ],
  code:`function counter() {
  let count = 0;                 <span class="cm">// captured by the closure</span>
  return { inc: () =&gt; ++count, get: () =&gt; count };
}
const a = counter(), b = counter();
a.inc(); a.inc(); b.inc();
a.get(); <span class="cm">// 2</span>
b.get(); <span class="cm">// 1 — independent scope per call</span>

<span class="cm">// the classic loop trap</span>
for (var i = 0; i &lt; 3; i++) setTimeout(() =&gt; console.log(i));  <span class="cm">// 3 3 3</span>
for (let j = 0; j &lt; 3; j++) setTimeout(() =&gt; console.log(j));  <span class="cm">// 0 1 2</span>`,
  traps:[
    "Closures capture <b>variables, not values</b>. If the variable is reassigned after capture, the closure sees the new value.",
    "A closure over a large object keeps that whole object alive — a common source of slow memory growth in long-lived callbacks and caches.",
    "In a <code>for (var …)</code> loop with an async callback, every callback shares one binding. <code>let</code>, an IIFE, or <code>forEach</code> all fix it because each creates a new scope.",
    "Blocks create scope for <code>let</code>/<code>const</code>/<code>class</code>/function declarations in strict mode — but <code>var</code> hoists straight out of the block to the function."
  ],
  terms:[
    {term:"Lexical scope", desc:"Scope determined by where code is written, not where it's called.", detail:"This is what makes closures predictable: you can determine what a function can see by reading its surrounding source, regardless of how it's later invoked.", code:`const x = 'outer';\nfunction show(){ console.log(x); }\nfunction wrapper(){\n  const x = 'inner';\n  show();  <span class="cm">// 'outer' — lexical, not dynamic</span>\n}`},
    {term:"Closure", desc:"A function bundled with references to its surrounding state.", detail:"Technically every function is a closure; most just don't capture anything interesting. The interesting case is when the function escapes the scope that created it.", code:`function once(fn){\n  let called = false, result;\n  return (...a) =&gt; called ? result : (called = true, result = fn(...a));\n}`},
    {term:"IIFE / module pattern", desc:"Immediately invoked function used to create a private scope.", detail:"Pre-ESM, this was how libraries avoided polluting the global namespace and how you got private members. Bundlers still emit this shape.", code:`const CounterModule = (function(){\n  let count = 0;                 <span class="cm">// truly private</span>\n  return { inc(){ return ++count; } };\n})();`}
  ],
  cards:[
    {q:"Define a closure in one sentence.", a:"A function together with a live reference to the lexical environment it was defined in, which survives even after that outer function has returned."},
    {q:"Why does <code>for (let i…)</code> fix the setTimeout loop bug but <code>var</code> doesn't?", a:"The spec creates a <b>fresh binding of <code>i</code> per iteration</b> for <code>let</code> (copying the previous value forward), so each callback closes over its own variable. <code>var</code> has one function-scoped binding that all callbacks share, and by the time they run it holds the final value."},
    {q:"Do closures capture values or variables?", a:"Variables (bindings). If the variable is reassigned later, the closure observes the new value — capture is by reference to the binding, not a snapshot."},
    {q:"How do closures cause memory leaks?", a:"They keep their entire captured environment reachable. A long-lived callback (listener, cache entry, interval) that closes over a large object pins that object in the heap for the callback's lifetime."}
  ],
  quiz:[
    {q:"What is logged?", code:`function make(){\n  let n = 0;\n  return () =&gt; ++n;\n}\nconst f = make(), g = make();\nconsole.log(f(), f(), g());`,
     options:["1 2 1","1 2 3","1 1 1","2 2 1"], answer:0,
     why:"Each call to <code>make()</code> creates a new execution context with its own <code>n</code>. <code>f</code> and <code>g</code> close over different variables."},
