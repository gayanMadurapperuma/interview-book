{ id:'events', group:'Core APIs', title:'EventEmitter & the observer pattern', animate:'eventbus',
  lede:"Streams, HTTP servers, sockets and process signals are all EventEmitters — it's the backbone of Node's core APIs.",
  say:"EventEmitter is a synchronous observer implementation: <code>emit</code> calls every listener in registration order, on the same stack, before returning. Two things bite people in production — the <code>'error'</code> event throws and crashes the process if nobody is listening, and the default max-listeners warning at 11 is usually a genuine leak signal, not noise to silence.",
  steps:[
    "<code>on</code>/<code>addListener</code> registers, <code>once</code> auto-removes after the first call, <code>off</code>/<code>removeListener</code> unregisters.",
    "<code>emit(name, ...args)</code> calls every listener <b>synchronously, in registration order</b>, and returns <code>true</code> if there was at least one listener.",
    "Because emission is synchronous, a slow listener blocks the emitter — and a throwing listener propagates up through <code>emit()</code>.",
    "The <code>'error'</code> event is special: if an <code>'error'</code> is emitted with <b>no listener</b>, EventEmitter throws it, which usually crashes the process. Always attach an error handler to emitters and streams.",
    "Default max listeners is <b>10</b> per event; exceeding it logs a <code>MaxListenersExceededWarning</code>. That's a leak detector — usually you're adding a listener per request without removing it.",
    "<code>events.once(emitter, name)</code> returns a promise, and <code>events.on(emitter, name)</code> returns an async iterator — the clean way to bridge emitters into async/await code.",
    "Node 20+ supports <code>AbortSignal</code> in listener options (<code>{ signal }</code>), which removes the listener automatically — a much safer cleanup story.",
    "EventEmitter has no backpressure and no replay: emit into the void if nobody's listening yet. For buffering semantics use a stream or a queue."
  ],
  code:`import { EventEmitter, once, on } from 'node:events';

class Jobs extends EventEmitter {
  run(job){
    this.emit('start', job);
    try { this.emit('done', process(job)); }
    catch (err) { this.emit('error', err); }   <span class="cm">// needs a listener or it throws</span>
  }
}
const jobs = new Jobs();
jobs.on('error', (err) =&gt; logger.error({ err }));   <span class="cm">// ALWAYS</span>

<span class="cm">// promise & async-iterator bridges</span>
const [result] = await once(jobs, 'done');
for await (const [job] of on(jobs, 'start')) track(job);

<span class="cm">// auto-removing listener</span>
const ctrl = new AbortController();
jobs.on('start', handler, { signal: ctrl.signal });
ctrl.abort();   <span class="cm">// listener removed</span>`,
  traps:[
    "Adding a listener inside a request handler without removing it is the #1 <code>MaxListenersExceededWarning</code> cause — and a genuine memory leak.",
    "Raising <code>setMaxListeners</code> to silence the warning hides the leak instead of fixing it. Only raise it when you legitimately have many static listeners.",
    "<code>emit</code> is synchronous, so an async listener's rejection is <b>not</b> observed by the emitter — wrap async listeners in their own try/catch.",
    "Listener order matters and removal by reference requires you to keep the exact function — anonymous arrows can't be removed later.",
    "There's no replay: a listener attached after <code>emit</code> never sees that event."
  ],
  terms:[
    {term:"The 'error' event contract", desc:"Unhandled 'error' emissions throw, crashing the process.", detail:"This applies to every stream, socket, HTTP request and child process. It's the reason <code>pipeline()</code> exists — it wires error propagation and cleanup for a whole chain so you can't miss one.", code:`const rs = fs.createReadStream('missing.txt');\nrs.on('data', () =&gt; {});\n<span class="cm">// no 'error' listener → uncaught ENOENT → process exits</span>\nrs.on('error', err =&gt; logger.warn({ err }));  <span class="cm">// fixed</span>`},
    {term:"events.on() as an async iterator", desc:"Consume an emitter with for await…of.", detail:"Gives you sequential processing and natural backpressure over an event source — though note it buffers events internally while your loop body runs, so it isn't a substitute for a real queue under sustained overload.", code:`for await (const [msg] of on(ws, 'message')) {\n  await handle(msg);        <span class="cm">// processed one at a time</span>\n}`}
  ],
  cards:[
    {q:"Is <code>emit()</code> synchronous or asynchronous?", a:"Synchronous. It invokes every listener in registration order on the current stack and returns after the last one. Nothing is deferred to the event loop."},
    {q:"What happens if you emit <code>'error'</code> with no listener?", a:"EventEmitter throws the error. In practice that becomes an uncaught exception and crashes the process — which is why every stream, socket and emitter needs an error handler."},
    {q:"What does <code>MaxListenersExceededWarning</code> usually mean?", a:"You're adding listeners (often per request or per connection) without removing them — a memory leak. The default limit of 10 is a detector, not a hard cap. Fix the leak rather than calling <code>setMaxListeners</code>."},
    {q:"How do you bridge an EventEmitter into async/await?", a:"<code>events.once(emitter, 'name')</code> returns a promise for the next emission; <code>events.on(emitter, 'name')</code> returns an async iterator for <code>for await…of</code>. Both from <code>node:events</code>."}
  ],
  quiz:[
    {q:"What is logged?", code:`const e = new EventEmitter();\ne.on('x', () =&gt; console.log('A'));\ne.on('x', () =&gt; console.log('B'));\nconsole.log('before');\ne.emit('x');\nconsole.log('after');`,
     options:["before A B after","before after A B","A B before after","before A after B"], answer:0,
     why:"emit is synchronous and calls listeners in registration order, all before emit() returns."}
  ],
  cheat:[
    "<code>on</code> / <code>once</code> / <code>off</code> / <code>emit</code>. Emission is <b>synchronous</b>, in registration order.",
    "<b>Unhandled <code>'error'</code> throws → process crash.</b> Always attach one.",
    "Max listeners default 10 → warning = <b>leak signal</b>, not noise.",
    "Bridges: <code>events.once()</code> → promise · <code>events.on()</code> → async iterator.",
    "<code>{ signal }</code> option auto-removes listeners (AbortController).",
    "No backpressure, no replay, async listener rejections unobserved."
  ]
},

{ id:'streams', group:'Core APIs', title:'Streams, buffers & backpressure', animate:'stream',
  lede:"Process data in chunks instead of loading it all into memory — essential for large files, proxies and token streaming.",
  say:"A stream moves data piece by piece; a Buffer is a fixed-length chunk of binary data allocated outside the V8 heap. The concept that matters is backpressure: <code>write()</code> returns false when the destination's buffer is full, and ignoring that is how Node services grow memory unboundedly. <code>pipeline()</code> is the correct API because it handles backpressure, error propagation and cleanup for the whole chain.",
  steps:[
    "A <b>Buffer</b> is a fixed-size chunk of raw bytes allocated <b>outside</b> the V8 heap, so large binary payloads don't pressure the JS GC. In Node it's a <code>Uint8Array</code> subclass.",
    "Four stream types: <b>Readable</b> (source), <b>Writable</b> (sink), <b>Duplex</b> (both, e.g. a TCP socket), <b>Transform</b> (duplex that modifies, e.g. gzip).",
    "<b>Backpressure</b> is the contract: <code>writable.write(chunk)</code> returns <code>false</code> when its internal buffer exceeds <code>highWaterMark</code>. You should stop writing and wait for the <code>'drain'</code> event.",
    "<code>highWaterMark</code> defaults to 64KB for byte streams and 16 objects for object-mode streams. It's a threshold for signalling, not a hard cap.",
    "<code>pipeline()</code> (prefer <code>stream/promises</code>) wires backpressure <b>and</b> propagates errors <b>and</b> destroys every stream in the chain on failure. Raw <code>.pipe()</code> does none of the error handling — a leaked-file-descriptor generator.",
    "Readables have two modes: <b>flowing</b> (<code>'data'</code> events push at you) and <b>paused</b> (you call <code>read()</code>). <code>for await…of</code> uses paused mode and gives you backpressure automatically.",
    "Everything is a stream underneath: HTTP request/response objects, <code>process.stdin/stdout</code>, sockets, file I/O, zlib, crypto hashes.",
    "Node also has <b>Web Streams</b> (<code>ReadableStream</code>, used by <code>fetch</code>); <code>Readable.fromWeb</code>/<code>toWeb</code> convert between the two families."
  ],
  code:`import { pipeline } from 'node:stream/promises';
import { createGzip } from 'node:zlib';

await pipeline(
  fs.createReadStream('in.txt'),
  createGzip(),
  fs.createWriteStream('out.gz')
);   <span class="cm">// backpressure + errors + cleanup, all handled</span>

<span class="cm">// respecting backpressure by hand (e.g. SSE token streaming)</span>
async function send(res, chunk){
  if (!res.write(chunk)) await once(res, 'drain');   <span class="cm">// wait for the client</span>
}

<span class="cm">// async iteration = automatic backpressure</span>
for await (const chunk of req) await handle(chunk);`,
  note:{type:'info', text:"<b>Directly relevant to LLM token streaming:</b> Server-Sent Events streaming a model's response token by token is exactly a Writable-stream problem. If the client is slow (mobile network, backgrounded tab), <code>res.write()</code> returns <code>false</code> — that's your signal to stop emitting until <code>'drain'</code>. Ignoring the return value and writing every token as fast as the model produces them grows the response buffer per connection, and with thousands of concurrent streams that is how a gateway runs out of memory."},
  traps:[
    "<code>.pipe()</code> does <b>not</b> forward errors or destroy the destination on source failure — you leak file descriptors and sockets. Use <code>pipeline()</code>.",
    "Concatenating chunks into one big Buffer defeats the point of streaming and reintroduces the memory problem you were avoiding.",
    "Attaching a <code>'data'</code> listener switches a stream to flowing mode immediately — if you're not ready, data is lost.",
    "Mixing <code>await</code> inside a <code>'data'</code> handler doesn't pause the stream; the events keep firing. Use <code>for await…of</code> or <code>pause()</code>/<code>resume()</code>.",
    "Object-mode <code>highWaterMark</code> counts <i>objects</i>, not bytes — 16 huge objects can be far more memory than you expect."
  ],
  terms:[
    {term:"Backpressure", desc:"Slowing the producer so a slower consumer isn't overwhelmed.", detail:"Ignoring it is the most common cause of unbounded memory growth in Node servers: the write buffer grows without limit while the source keeps pushing.", code:`<span class="cm">// wrong — unbounded buffering</span>\nsource.on('data', c =&gt; dest.write(c));\n\n<span class="cm">// right</span>\nawait pipeline(source, dest);`},
    {term:"Buffer", desc:"Raw binary data, allocated off the V8 heap.", detail:"<code>Buffer.allocUnsafe</code> is faster but returns uninitialised memory that may contain old data — never send it anywhere without fully overwriting it. Use <code>Buffer.alloc</code> unless you're in a measured hot path.", code:`const buf = Buffer.from('hello', 'utf8');\nbuf.length;           <span class="cm">// 5 bytes, not characters</span>\nBuffer.from('héllo').length;  <span class="cm">// 6 — multi-byte UTF-8</span>`},
    {term:"Transform stream", desc:"Duplex stream that maps input chunks to output chunks.", detail:"The idiomatic place for redaction, line splitting, encryption or metrics inside a pipeline — and it participates in backpressure automatically.", code:`import { Transform } from 'node:stream';\nconst redact = new Transform({\n  transform(chunk, enc, cb){ cb(null, String(chunk).replace(/\\d{16}/g, '****')); }\n});\nawait pipeline(src, redact, dest);`}
  ],
  cards:[
    {q:"What does <code>writable.write()</code> returning <code>false</code> mean, and what should you do?", a:"The internal buffer has exceeded <code>highWaterMark</code>. Stop writing and wait for the <code>'drain'</code> event before continuing. Ignoring it buffers without bound and grows memory per connection."},
    {q:"Why use <code>pipeline()</code> instead of <code>.pipe()</code>?", a:"<code>pipe()</code> only wires data and backpressure. <code>pipeline()</code> additionally propagates errors and destroys every stream in the chain on failure, so you don't leak file descriptors or sockets. The promise version integrates with async/await."},
    {q:"Where are Buffers allocated and why does it matter?", a:"Outside the V8 heap, in native memory. Large binary payloads therefore don't pressure the JS garbage collector — but they also don't count toward <code>heapUsed</code>, so you must watch RSS/external memory to spot buffer leaks."},
    {q:"What are the four stream types?", a:"Readable (source), Writable (sink), Duplex (both, e.g. a socket), Transform (a Duplex that modifies chunks in flight, e.g. gzip or a redactor)."}
  ],
  quiz:[
    {q:"A proxy streams a 2GB file with <code>src.on('data', c =&gt; dest.write(c))</code> to a slow client. What happens?", options:["Memory grows unboundedly — backpressure is ignored","It works fine, Node buffers to disk","The source pauses automatically","The client is disconnected"], answer:0,
     why:"The <code>'data'</code> handler keeps pushing regardless of <code>write()</code>'s return value, so the writable's internal buffer grows in memory until the process runs out. <code>pipeline()</code> would pause the source."}
  ],
  cheat:[
    "Types: <b>Readable · Writable · Duplex · Transform</b>. Everything in Node I/O is one.",
    "Buffer = raw bytes off the V8 heap; <code>Buffer extends Uint8Array</code>; watch RSS/external, not heapUsed.",
    "<b>Backpressure</b>: <code>write()===false</code> ⇒ stop until <code>'drain'</code>. <code>highWaterMark</code> 64KB / 16 objects.",
    "<b>Use <code>pipeline()</code></b> (stream/promises) — data + backpressure + errors + destroy.",
    "<code>for await…of</code> a readable = automatic backpressure.",
    "SSE/LLM token streaming = exactly this contract per connection."
  ]
},

{ id:'http', group:'Core APIs', title:'HTTP, keep-alive & connection pooling', animate:'nonblock',
  lede:"Most 'why is my service slow' answers live in the agent, the keep-alive settings and the timeouts.",
  say:"Node's HTTP client uses an Agent that pools sockets per host. In older Node, keep-alive was off by default, so every outbound call paid a TCP and TLS handshake — enabling it is often the single biggest latency win in a service that fans out to other APIs. On the server side, the four timeouts that matter are headersTimeout, requestTimeout, keepAliveTimeout and server.timeout, and keepAliveTimeout must exceed the load balancer's idle timeout or you get random 502s.",
  steps:[
    "<code>http.Agent</code> pools sockets per <code>host:port</code>. With <code>keepAlive: true</code> the socket is reused, skipping TCP handshake and TLS negotiation on subsequent requests.",
    "Node 19+ enables keep-alive by default for the global agent; older versions did not — check before assuming.",
    "<code>maxSockets</code> caps concurrent connections per host (Infinity by default for the global agent), <code>maxFreeSockets</code> caps idle pooled ones. Too low throttles you; unbounded can overwhelm a downstream.",
    "Server-side timeouts: <b>headersTimeout</b> (time to receive headers), <b>requestTimeout</b> (whole request), <b>keepAliveTimeout</b> (idle socket before close), <b>server.timeout</b> (socket inactivity).",
    "<b>keepAliveTimeout must be greater than the upstream load balancer's idle timeout</b> — otherwise Node closes a socket the LB still thinks is usable and you see sporadic 502s. On ALB (60s default) set Node to ~65s.",
    "HTTP/2 multiplexes many streams over one connection, removing head-of-line blocking at the HTTP layer; Node supports it via <code>node:http2</code>, and gRPC is built on it.",
    "Node's global <code>fetch</code> is powered by undici, which has its own connection pool and its own timeout options — configure it separately from <code>http.Agent</code>.",
    "Always set a per-request timeout on outbound calls (<code>AbortSignal.timeout</code>) — a hung upstream otherwise holds a socket and a request slot indefinitely."
  ],
  code:`import { Agent } from 'node:https';
const agent = new Agent({ keepAlive: true, maxSockets: 50, maxFreeSockets: 10, timeout: 60000 });

<span class="cm">// undici (powers global fetch) — its own pool</span>
import { Agent as UndiciAgent, setGlobalDispatcher } from 'undici';
setGlobalDispatcher(new UndiciAgent({
  keepAliveTimeout: 60_000, connections: 128, headersTimeout: 10_000, bodyTimeout: 30_000
}));

const res = await fetch(url, { signal: AbortSignal.timeout(5000) });

<span class="cm">// server: must exceed the ALB idle timeout (60s)</span>
const server = http.createServer(app);
server.keepAliveTimeout = 65_000;
server.headersTimeout   = 66_000;   <span class="cm">// must be &gt; keepAliveTimeout</span>
server.requestTimeout   = 30_000;`,
  traps:[
    "Sporadic 502s behind an ALB/NGINX almost always mean <code>keepAliveTimeout</code> is shorter than the proxy's idle timeout — the proxy reuses a socket Node just closed.",
    "<code>headersTimeout</code> must be larger than <code>keepAliveTimeout</code> or you get spurious request aborts.",
    "No outbound timeout means a hung dependency ties up a socket and a request forever; under load that cascades into total unavailability.",
    "Creating a new Agent per request destroys pooling entirely — a surprisingly common bug in SDK wrappers.",
    "<code>maxSockets: Infinity</code> plus a retry storm is how you DDoS your own downstream service."
  ],
  terms:[
    {term:"Keep-alive", desc:"Reusing a TCP/TLS connection across requests.", detail:"A TLS handshake costs 1–2 extra round trips. For a service making many small internal calls, enabling keep-alive commonly cuts p50 latency by tens of milliseconds and removes most connection-churn CPU.", code:`<span class="cm">// per-request cost without keep-alive:</span>\n<span class="cm">// DNS + TCP handshake (1 RTT) + TLS handshake (1–2 RTT) + request</span>\n<span class="cm">// with keep-alive: just the request</span>`},
    {term:"Head-of-line blocking", desc:"One slow response holding up others on the same connection.", detail:"HTTP/1.1 pipelining suffers from it at the HTTP layer, which is why browsers open multiple connections. HTTP/2 multiplexes streams to fix it — but TCP-level HOL blocking remains, which is what HTTP/3 over QUIC addresses.", code:`<span class="cm">// h1: N connections for N parallel requests</span>\n<span class="cm">// h2: 1 connection, N multiplexed streams</span>`},
    {term:"Graceful HTTP shutdown", desc:"Stop accepting, drain in-flight, then exit.", detail:"<code>server.close()</code> stops new connections but keep-alive sockets can linger; <code>closeIdleConnections()</code> and a hard deadline are what actually make deploys clean.", code:`process.on('SIGTERM', async () =&gt; {\n  server.close(() =&gt; process.exit(0));\n  server.closeIdleConnections?.();\n  setTimeout(() =&gt; process.exit(1), 15_000).unref();\n});`}
  ],
  cards:[
    {q:"Why does <code>keepAliveTimeout</code> need to exceed the load balancer's idle timeout?", a:"Otherwise Node closes a pooled socket that the LB still considers usable. The LB sends a request onto that closing socket and the client sees a sporadic 502. Rule: Node's keepAliveTimeout &gt; LB idle timeout (e.g. 65s vs ALB's 60s), and headersTimeout &gt; keepAliveTimeout."},
    {q:"What does an HTTP Agent do?", a:"Pools and reuses sockets per host:port, with <code>keepAlive</code>, <code>maxSockets</code> (concurrency cap per host) and <code>maxFreeSockets</code> (idle pool size). Reuse avoids repeating TCP and TLS handshakes on every request."},
    {q:"Name the four server-side HTTP timeouts in Node.", a:"<code>headersTimeout</code> (receive headers), <code>requestTimeout</code> (entire request), <code>keepAliveTimeout</code> (idle socket lifetime), <code>server.timeout</code> (socket inactivity). Plus per-request outbound timeouts via <code>AbortSignal.timeout</code>."},
    {q:"What is undici and why does it matter?", a:"The HTTP client that powers Node's global <code>fetch</code>. It has its own dispatcher/connection pool and its own <code>headersTimeout</code>/<code>bodyTimeout</code>/<code>connections</code> settings — configuring <code>http.Agent</code> does not affect it."}
  ],
  quiz:[
    {q:"A service behind an AWS ALB returns intermittent 502s under normal load. Most likely fix?", options:["Set server.keepAliveTimeout above the ALB's 60s idle timeout","Increase maxSockets","Disable keep-alive","Add more instances"], answer:0,
     why:"The classic race: the ALB reuses a pooled connection just as Node closes it for idleness. Raising Node's keepAliveTimeout (and headersTimeout above it) removes the window."}
  ],
  cheat:[
    "Agent pools sockets per host. <code>keepAlive</code> skips TCP+TLS handshakes → big latency win on internal fan-out.",
    "<code>maxSockets</code> (concurrency) / <code>maxFreeSockets</code> (idle). Never create an Agent per request.",
    "Server timeouts: <b>headersTimeout &gt; keepAliveTimeout &gt; LB idle timeout</b>; plus <code>requestTimeout</code>.",
    "<b>Intermittent 502 behind ALB ⇒ keepAliveTimeout too low.</b> ALB 60s → Node 65s/66s.",
    "Global <code>fetch</code> = undici with its own pool/timeouts.",
    "Every outbound call needs <code>AbortSignal.timeout(ms)</code>.",
    {t:'nums', items:[{v:'65s / 66s',l:'keepAlive / headers timeout behind a 60s ALB'},{v:'1–2 RTT',l:'TLS handshake saved by keep-alive'},{v:'64KB',l:'default stream highWaterMark'}]}
  ]
},

{ id:'crypto', group:'Core APIs', title:'Crypto: hashing, HMAC, JWT signing & randomness', animate:'jwt',
  lede:"The parts of node:crypto a backend engineer is actually expected to know cold.",
  say:"Passwords get a slow, salted KDF — argon2id or bcrypt/scrypt — never a plain SHA. Integrity and webhook verification use HMAC with a shared secret and a timing-safe comparison. JWTs use HS256 (shared secret) or RS256/ES256 (private key signs, public key verifies) — the latter when the verifier shouldn't be able to mint tokens. And any token or ID that must be unguessable comes from <code>crypto.randomUUID</code> or <code>randomBytes</code>, never <code>Math.random</code>.",
  steps:[
    "<b>Hashing</b> (<code>createHash</code>) is one-way and fast — right for content addressing, ETags, dedupe. <b>Wrong for passwords</b>, precisely because it's fast.",
    "<b>Password hashing</b> needs a deliberately slow, salted, memory-hard KDF: <b>argon2id</b> (preferred), <b>bcrypt</b> or <b>scrypt</b>. Node has <code>crypto.scrypt</code> built in; argon2/bcrypt come from npm.",
    "<b>HMAC</b> (<code>createHmac</code>) proves a message came from someone holding the shared secret — how Stripe/GitHub webhook signatures work.",
    "Compare secrets with <code>crypto.timingSafeEqual</code>, never <code>===</code>: an early-exit comparison leaks length and prefix information through timing.",
    "<b>Symmetric encryption</b>: AES-256-GCM gives confidentiality <i>and</i> authentication (the auth tag). Never reuse a nonce/IV with the same key.",
    "<b>Asymmetric</b>: RSA/ECDSA — sign with the private key, verify with the public. Use it when many parties must verify but only one may issue.",
    "<b>JWT</b>: <code>base64url(header).base64url(payload).signature</code>. The payload is <b>encoded, not encrypted</b> — anyone can read it. HS256 = shared secret; RS256/ES256 = private/public keypair.",
    "Randomness: <code>crypto.randomUUID()</code> for IDs, <code>crypto.randomBytes(n)</code> for tokens. <code>Math.random()</code> is not cryptographically secure and must never generate a token, session ID or reset link."
  ],
  code:`import crypto from 'node:crypto';

<span class="cm">// content hash — fine</span>
const etag = crypto.createHash('sha256').update(body).digest('hex');

<span class="cm">// webhook signature verification — constant time</span>
function verify(rawBody, header, secret){
  const expected = crypto.createHmac('sha256', secret).update(rawBody).digest();
  const got = Buffer.from(header, 'hex');
  return got.length === expected.length &amp;&amp; crypto.timingSafeEqual(got, expected);
}

<span class="cm">// password — slow KDF, unique salt</span>
const salt = crypto.randomBytes(16);
const hash = await new Promise((res, rej) =&gt;
  crypto.scrypt(password, salt, 64, (e, k) =&gt; e ? rej(e) : res(k)));

<span class="cm">// unguessable token</span>
const resetToken = crypto.randomBytes(32).toString('base64url');
const id = crypto.randomUUID();`,
  traps:[
    "<b>JWT payloads are readable by anyone.</b> Never put secrets, PII you wouldn't log, or authorisation you don't re-check server-side into one.",
    "The <code>alg: none</code> and algorithm-confusion attacks: always pass an explicit <code>algorithms: ['RS256']</code> allow-list to your verify call. Never trust the token's own header.",
    "Verifying a webhook against the <b>parsed</b> body fails — you must sign/verify the exact raw bytes, so capture the raw body before JSON middleware.",
    "<code>timingSafeEqual</code> throws if the buffers differ in length — check length first (which itself leaks length, hence fixed-length digests).",
    "Reusing an AES-GCM IV with the same key catastrophically breaks confidentiality <i>and</i> authenticity.",
    "JWTs can't be revoked before expiry without server state — that's why short-lived access tokens plus a revocable refresh token is the standard design."
  ],
  terms:[
    {term:"Why not SHA for passwords", desc:"Fast hashes are exactly what an attacker wants.", detail:"A modern GPU computes billions of SHA-256 hashes per second. A KDF tuned to ~100ms per hash reduces that to a handful of guesses per second per core, and memory-hard functions (argon2id, scrypt) additionally defeat GPU/ASIC parallelism.", code:`<span class="cm">// argon2id, the current recommendation</span>\nimport argon2 from 'argon2';\nconst hash = await argon2.hash(pw, { type: argon2.argon2id, memoryCost: 19456, timeCost: 2 });\nawait argon2.verify(hash, pw);`},
    {term:"HS256 vs RS256", desc:"Shared secret vs public/private keypair.", detail:"HS256: anyone who can verify can also mint tokens — fine inside one service. RS256/ES256: the auth service holds the private key, every other service verifies with the public key (often fetched from a JWKS endpoint) and cannot forge tokens. That's what Cognito, Auth0 and most OIDC providers use.", code:`jwt.verify(token, publicKey, { algorithms: ['RS256'], issuer, audience });`},
    {term:"Timing-safe comparison", desc:"Constant-time equality prevents secret extraction by measurement.", detail:"A normal string comparison exits at the first differing byte, so an attacker can discover a signature byte by byte from response-time differences. <code>timingSafeEqual</code> always examines every byte.", code:`crypto.timingSafeEqual(Buffer.from(a), Buffer.from(b));`}
  ],
  cards:[
    {q:"Why is SHA-256 wrong for passwords, and what should you use?", a:"Because it's fast — GPUs do billions per second, so a leaked table is brute-forced quickly. Use a slow, salted, memory-hard KDF: argon2id (preferred), bcrypt, or scrypt, tuned so one hash costs on the order of 100ms."},
    {q:"Is a JWT payload encrypted?", a:"No — it's base64url-<b>encoded</b> and readable by anyone holding the token. The signature only proves integrity and origin. Never put secrets in it, and always re-check authorisation server-side."},
    {q:"HS256 vs RS256 — when do you pick each?", a:"HS256 (shared secret) when the same trusted party issues and verifies — simple, fast, but any verifier can also mint. RS256/ES256 when many services must verify but only the auth service may issue: it signs with a private key, everyone verifies with the public key (typically via JWKS)."},
    {q:"Why <code>timingSafeEqual</code> instead of <code>===</code>?", a:"String comparison short-circuits at the first mismatched byte, leaking information through response timing that lets an attacker reconstruct a signature byte by byte. <code>timingSafeEqual</code> takes the same time regardless of where the difference is."},
    {q:"What must you never use <code>Math.random()</code> for?", a:"Anything security-relevant: session IDs, password-reset tokens, API keys, CSRF tokens, nonces. It's a fast PRNG with predictable state. Use <code>crypto.randomBytes()</code> or <code>crypto.randomUUID()</code>."}
  ],
  quiz:[
    {q:"A webhook handler verifies signatures but fails intermittently. The route uses <code>express.json()</code>. Most likely cause?", options:["It's verifying against the re-serialised body, not the raw bytes","The secret is wrong","The clock is skewed","HMAC needs a salt"], answer:0,
     why:"JSON parsing and re-stringifying changes byte-level details (key order, whitespace, unicode escaping). The signature covers the exact raw payload, so you must capture the raw body (e.g. <code>express.raw()</code> or a verify callback) before parsing."}
  ],
  cheat:[
    "Passwords → <b>argon2id</b> / bcrypt / scrypt (slow, salted, memory-hard). <b>Never</b> plain SHA/MD5.",
    "Integrity/webhooks → <b>HMAC-SHA256</b> over the <b>raw body</b> + <code>timingSafeEqual</code>.",
    "Encryption → <b>AES-256-GCM</b> (confidentiality + auth tag). Never reuse an IV.",
    "JWT = header.payload.signature, base64url. <b>Encoded, not encrypted.</b> Pin <code>algorithms:[…]</code>.",
    "HS256 = shared secret (verifier can mint) · RS256/ES256 = private signs, public verifies (JWKS).",
    "IDs/tokens → <code>crypto.randomUUID()</code> / <code>randomBytes()</code>. Never <code>Math.random()</code>.",
    "JWTs aren't revocable → short access token + revocable refresh token."
  ]
},

{ id:'cluster', group:'Core APIs', title:'Scaling: cluster, worker_threads & child processes', animate:'clusterproc',
  lede:"One Node process uses one JS thread, so using all your cores needs an explicit strategy.",
  say:"Cluster forks whole processes that share a listening port — the right tool for scaling an I/O-bound web server across cores, with full isolation and no shared memory. worker_threads run multiple JS contexts inside one process and can share memory via SharedArrayBuffer — the right tool for CPU-bound work. In containers, the orchestrator usually replaces cluster: one process per container, scaled by replica count, which keeps deploys and memory limits simple.",
  steps:[
    "<b>cluster</b> forks N full Node <b>processes</b>, each with its own event loop, heap and memory. The primary distributes incoming connections (round-robin on Linux by default).",
    "<b>worker_threads</b> runs multiple JS contexts <b>inside one process</b>, each with its own V8 isolate but able to share memory via <code>SharedArrayBuffer</code> and transfer <code>ArrayBuffer</code>s with zero copy.",
    "<b>child_process</b> (<code>spawn</code>/<code>fork</code>/<code>exec</code>) runs separate programs. <code>fork</code> is a Node-specific child with an IPC channel; <code>spawn</code> streams output and is safe for large output; <code>exec</code> buffers and uses a shell — <b>a command-injection risk if you interpolate user input</b>.",
    "Rule of thumb: <b>cluster (or replicas) for network-bound scaling; worker_threads for CPU-bound work; child_process for running other programs.</b>",
    "Each cluster worker has <b>isolated memory</b> — an in-memory cache, counter or rate limiter in one worker is invisible to the others. Move shared state to Redis.",
    "Cluster's round-robin is <b>not sticky</b>: consecutive requests from a client can hit different workers, which breaks in-memory sessions and WebSocket assumptions.",
    "In Kubernetes/ECS the common pattern is <b>one process per container</b> and scale by replicas — simpler resource limits, per-process crash isolation, and no double layer of scheduling. Use cluster mainly on a VM with spare cores.",
    "Communication is message passing (<code>worker.send()</code> / <code>'message'</code>) for cluster and child processes; <code>worker_threads</code> can additionally share a <code>SharedArrayBuffer</code> with <code>Atomics</code> for coordination."
  ],
  code:`<span class="cm">// cluster: separate processes, shared port, no shared memory</span>
import cluster from 'node:cluster';
import { availableParallelism } from 'node:os';
if (cluster.isPrimary){
  for (let i = 0; i &lt; availableParallelism(); i++) cluster.fork();
  cluster.on('exit', (w, code) =&gt; { if (code !== 0) cluster.fork(); });   <span class="cm">// restart</span>
} else {
  await import('./server.js');
}

<span class="cm">// worker_threads: CPU work, same process</span>
import { Worker, isMainThread, parentPort, workerData } from 'node:worker_threads';
if (!isMainThread){ parentPort.postMessage(heavyCompute(workerData)); }

<span class="cm">// child_process — NEVER interpolate user input into exec</span>
import { execFile } from 'node:child_process';
execFile('convert', [userPath, '-resize', '100x100', out], cb);   <span class="cm">// argv array = safe</span>`,
  traps:[
    "In-memory rate limiting or session storage under cluster silently allows N× the intended limit — one counter per worker.",
    "<code>exec('ls ' + userInput)</code> is shell injection. Use <code>execFile</code>/<code>spawn</code> with an argument array and no shell.",
    "Spawning a worker per request costs ~10–30ms plus a fresh V8 heap (several MB). Pool them.",
    "Cluster + a container memory limit is a trap: N workers each with their own heap can OOM the container long before any single worker hits its V8 limit.",
    "<code>SharedArrayBuffer</code> requires <code>Atomics</code> for safe coordination — plain reads/writes race just like any other language."
  ],
  table:{title:'Which one?', head:['','cluster','worker_threads','child_process'], rows:[
    ['Isolation','Process','Thread (own isolate)','Process'],
    ['Memory','Separate','Can share via SAB','Separate'],
    ['Startup cost','High (~50ms+)','Medium (~10–30ms)','High'],
    ['Best for','Scaling a server across cores','CPU-bound tasks','Running other programs'],
    ['Crash blast radius','One worker','Can take the process','One child'],
    ['In k8s','Usually replaced by replicas','Still useful','Still useful']
  ]},
  cards:[
    {q:"cluster vs worker_threads — how do you choose?", a:"cluster for scaling <b>I/O-bound network</b> work across cores (separate processes, isolated memory, shared port). worker_threads for <b>CPU-bound</b> work inside one process, where you want cheap message passing or shared memory via SharedArrayBuffer."},
    {q:"What breaks when you add cluster to an existing app?", a:"Anything relying on in-process state: in-memory sessions, caches, rate-limit counters, scheduled jobs (now running N times), and WebSocket connection registries. Move that state to Redis, or make jobs leader-elected."},
    {q:"Why is cluster often unnecessary in Kubernetes?", a:"The orchestrator already scales by replicas, gives per-process crash isolation, and applies memory limits per container. Running cluster inside a container doubles the scheduling layers and makes memory limits harder to reason about. One process per container is the common pattern."},
    {q:"Why is <code>exec</code> dangerous?", a:"It runs the command through a shell, so any interpolated user input can inject additional commands. Use <code>execFile</code> or <code>spawn</code> with an argument array, which passes arguments directly to the program with no shell parsing."}
  ],
  quiz:[
    {q:"An app rate-limits to 100 req/min using an in-memory counter, then is deployed with <code>cluster</code> across 4 cores. Effective limit?", options:["~400/min — each worker has its own counter","100/min","25/min","Unlimited"], answer:0,
     why:"Cluster workers are separate processes with isolated memory. Each keeps its own counter, so the effective limit multiplies by the worker count. Shared limits need Redis or another shared store."}
  ],
  cheat:[
    "<b>cluster</b> = N processes, shared port, isolated memory → scale I/O-bound servers.",
    "<b>worker_threads</b> = threads in one process, SharedArrayBuffer + Atomics → CPU work. <b>Pool them.</b>",
    "<b>child_process</b>: <code>spawn</code> (stream) · <code>fork</code> (node + IPC) · <code>exec</code> (shell, buffered, <b>injection risk</b>).",
    "Cluster breaks: in-memory sessions/caches/rate limits, cron jobs run N×, non-sticky routing.",
    "In k8s/ECS: usually <b>1 process per container</b>, scale with replicas.",
    "Always restart dead workers (<code>cluster.on('exit')</code>) or let the supervisor do it."
  ]
},

{ id:'process', group:'Production', title:'process, signals & graceful shutdown', animate:'nexttick',
  lede:"How your service starts, reads config, and — most importantly — stops without dropping requests.",
  say:"On a deploy or scale-down the orchestrator sends SIGTERM and then SIGKILL after a grace period. Graceful shutdown means: stop accepting new work, finish in-flight requests, close DB and queue connections, then exit — with a hard timeout so a stuck request can't hang the pod. Skipping this is exactly why teams see intermittent 502s during every rolling deploy.",
  steps:[
    "<code>process</code> exposes <code>env</code>, <code>argv</code>, <code>pid</code>, <code>memoryUsage()</code>, <code>uptime()</code>, exit codes and lifecycle events.",
    "<code>process.env</code> values are <b>always strings</b> — <code>'false'</code> is truthy, <code>'0'</code> is truthy. Parse and validate config at startup and fail fast on missing keys.",
    "<code>process.nextTick(fn)</code> queues ahead of promise microtasks; it exists so an API can guarantee its callback is always async. Recursive use <b>starves the loop</b>.",
    "<b>SIGTERM</b> is the polite 'please stop' from Kubernetes/ECS/systemd. <b>SIGINT</b> is Ctrl-C. <b>SIGKILL</b> cannot be caught — you get whatever grace period the platform allows (k8s default 30s).",
    "Graceful shutdown order: <b>1)</b> flip readiness to failing so the LB stops sending traffic, <b>2)</b> <code>server.close()</code> to stop accepting new connections, <b>3)</b> wait for in-flight requests, <b>4)</b> close DB/cache/queue connections, <b>5)</b> exit 0 — with a hard <code>setTimeout(...).unref()</code> fallback.",
    "Add a small delay between failing readiness and closing the server — LBs need a few seconds to notice, and requests already routed must still be served.",
    "<code>process.exitCode = 1</code> is preferable to <code>process.exit(1)</code>: it lets pending I/O (like a final log flush) finish rather than truncating it.",
    "<code>uncaughtException</code> and <code>unhandledRejection</code> are last-resort <b>logging</b> hooks. Log with full context, then exit — the process state after an uncaught throw is not trustworthy."
  ],
  code:`let shuttingDown = false;
app.get('/readyz', (req, res) =&gt; res.status(shuttingDown ? 503 : 200).end());

async function shutdown(signal){
  if (shuttingDown) return;
  shuttingDown = true;
  logger.info({ signal }, 'shutting down');

  const hard = setTimeout(() =&gt; { logger.fatal('forced exit'); process.exit(1); }, 15_000);
  hard.unref();

  await sleep(5_000);                      <span class="cm">// let the LB notice /readyz failing</span>
  await new Promise(r =&gt; server.close(r)); <span class="cm">// stop new, drain in-flight</span>
  server.closeIdleConnections?.();
  await Promise.allSettled([db.end(), redis.quit(), queue.close()]);
  process.exit(0);
}
process.on('SIGTERM', () =&gt; shutdown('SIGTERM'));
process.on('SIGINT',  () =&gt; shutdown('SIGINT'));`,
  traps:[
    "<code>server.close()</code> alone doesn't close idle keep-alive sockets — without <code>closeIdleConnections()</code> shutdown can hang until the grace period expires.",
    "Kubernetes sends SIGTERM and removes the pod from endpoints <b>concurrently</b>, not in order. Without the readiness delay, requests already in flight from the LB hit a closing server.",
    "<code>process.exit()</code> truncates pending stdout writes — logs from the final moments can be lost. Prefer setting <code>exitCode</code>, or flush explicitly.",
    "Reading config lazily deep in the code means a missing env var causes a 3am failure instead of a startup crash. Validate the whole config object at boot.",
    "Long-running jobs started in a request outlive the shutdown window; move them to a queue so a restart is safe."
  ],
  terms:[
    {term:"Readiness vs liveness", desc:"Two different probes with two different meanings.", detail:"<b>Liveness</b>: is the process wedged and in need of a restart? <b>Readiness</b>: should it receive traffic right now? During shutdown you fail readiness (drain) but keep liveness passing, otherwise the orchestrator kills you mid-drain.", code:`app.get('/livez',  (_, res) =&gt; res.send('ok'));          <span class="cm">// process is alive</span>\napp.get('/readyz', (_, res) =&gt; res.status(ready() ? 200 : 503).end());`},
    {term:"Config validation at boot", desc:"Fail fast on bad configuration rather than at 3am.", detail:"Parse env once into a typed, validated object at startup and export that — never read <code>process.env</code> scattered through the codebase. A schema (zod/envalid) gives you defaults, coercion and a clear crash message.", code:`const Env = z.object({\n  PORT: z.coerce.number().default(3000),\n  DATABASE_URL: z.string().url(),\n  LOG_LEVEL: z.enum(['debug','info','warn','error']).default('info')\n});\nexport const env = Env.parse(process.env);   <span class="cm">// throws at boot</span>`},
    {term:"nextTick vs setImmediate", desc:"nextTick runs before the loop continues; setImmediate runs in the check phase.", detail:"nextTick's original purpose was to let an API defer a callback that might otherwise fire synchronously, keeping calling code's control flow predictable. Recursion in it blocks the loop entirely.", code:`function readCached(key, cb){\n  if (cache.has(key)) return process.nextTick(cb, null, cache.get(key));  <span class="cm">// always async</span>\n  fs.readFile(key, cb);\n}`}
  ],
  cards:[
    {q:"Walk through a correct graceful shutdown.", a:"1) Fail the readiness probe. 2) Wait a few seconds so the LB stops routing. 3) <code>server.close()</code> and <code>closeIdleConnections()</code> to stop new connections while in-flight requests finish. 4) Close DB/cache/queue connections. 5) <code>process.exit(0)</code>. Plus an unref'd hard-timeout that force-exits if anything hangs."},
    {q:"Why is there a delay between failing readiness and closing the server?", a:"Kubernetes removes the pod from the Service endpoints asynchronously, and load balancers cache endpoints for a few seconds. Closing immediately means traffic already routed to you gets connection-refused. The sleep covers that propagation window."},
    {q:"<code>process.exit()</code> vs <code>process.exitCode</code>?", a:"<code>exit()</code> terminates immediately and can truncate pending async writes (including your final log lines). Setting <code>exitCode</code> lets the event loop drain naturally and then exit with that code."},
    {q:"Why validate config at startup?", a:"Because <code>process.env</code> values are always strings and missing keys are silently <code>undefined</code>. Parsing everything through a schema at boot turns a 3am runtime failure into an immediate, obvious startup crash with a clear message."}
  ],
  quiz:[
    {q:"During rolling deploys a service returns intermittent 502s. The app handles SIGTERM by calling <code>process.exit(0)</code> immediately. Fix?", options:["Drain: fail readiness, stop accepting, finish in-flight, then exit","Increase replicas","Catch SIGKILL","Disable keep-alive"], answer:0,
     why:"Exiting immediately kills in-flight requests. A proper drain sequence lets the LB stop routing and lets active requests complete before the process exits. (SIGKILL cannot be caught at all.)"}
  ],
  cheat:[
    "<code>process.env</code> is <b>all strings</b> → parse + validate at boot (zod/envalid), fail fast.",
    "SIGTERM = polite stop (k8s, 30s default grace) · SIGINT = Ctrl-C · <b>SIGKILL uncatchable</b>.",
    "Shutdown: <b>fail readiness → sleep → server.close + closeIdleConnections → drain → close deps → exit</b>, with an unref'd hard timeout.",
    "Readiness = take traffic? Liveness = restart me? Fail readiness during drain, keep liveness green.",
    "<code>exitCode</code> &gt; <code>exit()</code> (don't truncate logs).",
    "<code>nextTick</code> beats promises; recursion starves the loop."
  ]
},

{ id:'node-errors', group:'Production', title:'Errors, timeouts & resilience in a Node service', animate:'errorflow',
  lede:"Uncaught errors are a decision point, not background noise — how you handle them decides whether the process stays trustworthy.",
  say:"I separate operational errors, which I handle and map to a response, from programmer errors, which should log and exit so the supervisor restarts a clean process. Every outbound call gets a timeout — no exceptions — because a hung dependency ties up a request slot indefinitely and cascades under load. And every log line carries a request ID so a crash can actually be traced back to its trigger.",
  steps:[
    "<code>uncaughtException</code> and <code>unhandledRejection</code> are last-resort hooks. Log with full context and <b>exit</b>; the process state is unknown after an uncaught throw.",
    "Since Node 15, an unhandled rejection <b>terminates the process by default</b> — treat rejections as seriously as exceptions.",
    "<b>Every outbound call needs a timeout.</b> LLM APIs, databases, internal services — a call with no deadline can hold a request and its resources forever.",
    "<code>AbortController</code> / <code>AbortSignal.timeout(ms)</code> is the standard mechanism; pass the signal into fetch, and check <code>signal.aborted</code> in your own loops.",
    "Set an <b>overall request deadline</b> and propagate the remaining budget to downstream calls, rather than giving each hop its own generous timeout that sums to minutes.",
    "<b>Retry only idempotent operations</b>, with exponential backoff plus jitter, and a bounded attempt count. Retrying a non-idempotent POST without an idempotency key double-charges customers.",
    "Add a <b>circuit breaker</b> for sustained failures so you fail fast instead of piling load onto a struggling dependency — and a <b>bulkhead</b> (separate connection pool per dependency) so one slow dependency can't exhaust the resources of all the others.",
    "Errors need context to be useful: request ID, route, user/tenant, key parameters, and the <code>cause</code> chain. Use a structured logger (pino) with a per-request child logger via <code>AsyncLocalStorage</code>."
  ],
  code:`<span class="cm">// request-scoped context without threading it through every function</span>
import { AsyncLocalStorage } from 'node:async_hooks';
export const ctx = new AsyncLocalStorage();
app.use((req, res, next) =&gt; ctx.run({ requestId: req.id, log: logger.child({ requestId: req.id }) }, next));

<span class="cm">// deadline propagation</span>
async function callLLM(prompt, deadlineMs){
  const signal = AbortSignal.timeout(Math.min(deadlineMs, 10_000));
  try { return await fetch(LLM_URL, { method:'POST', body: prompt, signal }); }
  catch (err){
    if (err.name === 'TimeoutError' || err.name === 'AbortError')
      throw new AppError('LLM timed out', { code:'LLM_TIMEOUT', status:504, cause: err });
    throw err;
  }
}

process.on('unhandledRejection', (err) =&gt; { logger.fatal({ err }, 'unhandled'); process.exit(1); });
process.on('uncaughtException',  (err) =&gt; { logger.fatal({ err }, 'uncaught');  process.exit(1); });`,
  note:{type:'warn', text:"<b>No exceptions on timeouts.</b> One outbound call without a deadline — an LLM provider having a bad day, a downstream service hanging — ties up a request indefinitely. Under load, enough hung requests exhaust the connection pool and memory for everyone else. Wrap every fetch/DB/API call with a timeout, including the ones that 'never fail in practice'."},
  traps:[
    "Retrying non-idempotent writes without an idempotency key causes duplicates — double charges, duplicate emails, duplicate orders.",
    "Retries at every layer multiply: 3 retries at three layers is 27 requests against a service already failing. Retry at one layer only.",
    "Per-hop timeouts that don't sum to the client's timeout mean the client gives up while you're still working — always propagate a deadline.",
    "Logging <code>err.message</code> only throws away the stack and the <code>cause</code> chain; log the error object with a serialiser.",
    "Swallowing errors in a <code>catch</code> that returns a default value hides outages until someone notices wrong data."
  ],
  terms:[
    {term:"AsyncLocalStorage", desc:"Request-scoped context that survives across await boundaries.", detail:"It's Node's continuation-local storage, built on async_hooks. Use it for request IDs, tenant IDs and trace context so every log line and downstream call is correlated without threading a context object through every signature. There is a small performance cost — keep the stored object small.", code:`function log(msg){ (ctx.getStore()?.log ?? logger).info(msg); }\n<span class="cm">// works inside any awaited call in the request</span>`},
    {term:"Idempotency key", desc:"A client-supplied unique ID that makes a retried write safe.", detail:"Store the key with the result; on a repeat, return the stored result instead of performing the operation again. This is what makes 'at-least-once' delivery and network retries survivable for payments and orders.", code:`const existing = await db.idempotency.findByKey(key);\nif (existing) return existing.result;\nconst result = await chargeCard(body);\nawait db.idempotency.save(key, result);`},
    {term:"Circuit breaker + bulkhead", desc:"Fail fast on sustained failure; isolate resources per dependency.", detail:"The breaker protects both the failing dependency (no extra load) and you (no threads/sockets waiting on calls that will fail). The bulkhead ensures a slow dependency exhausts only its own pool, not the shared one.", code:`if (breaker.isOpen()) throw new AppError('dependency unavailable', { code:'CIRCUIT_OPEN', status:503 });\ntry { const r = await call(); breaker.success(); return r; }\ncatch (e){ breaker.failure(); throw e; }`}
  ],
  cards:[
    {q:"What do you do with an <code>uncaughtException</code>?", a:"Log it with full context, then exit non-zero and let the supervisor (k8s, PM2, systemd) restart a clean process. Continuing risks corrupted in-memory state producing worse, harder-to-diagnose failures later."},
    {q:"Why is a timeout mandatory on every outbound call?", a:"Without one, a hung dependency holds the request, its socket, and its slot in any pool indefinitely. Under load, enough hung requests exhaust connections and memory, turning one slow dependency into a full outage."},
    {q:"When is it safe to retry?", a:"Only for idempotent operations, or non-idempotent ones protected by an idempotency key. Use exponential backoff with jitter, a bounded attempt count, and retry at exactly one layer of the stack."},
    {q:"What is AsyncLocalStorage for?", a:"Carrying request-scoped context (request ID, tenant, trace ID) across <code>await</code> boundaries without passing it through every function signature — so every log line and downstream call can be correlated to one request."}
  ],
  quiz:[
    {q:"Service A retries 3× on failure, calls B which retries 3×, which calls C. C starts failing. How many requests hit C per original request?", options:["Up to 9 — retries multiply","3","1","6"], answer:0,
     why:"Retry amplification: 3 × 3 = 9 requests to a service that's already struggling. Retry at one layer only, and use a circuit breaker so sustained failure stops the traffic entirely."}
  ],
  cheat:[
    "<b>Operational</b> (timeout, 404, validation, 503) → handle. <b>Programmer</b> (bug) → log + exit, restart.",
    "Node ≥15: unhandled rejection <b>kills the process</b> by default.",
    "<b>Timeout on every outbound call</b>: <code>AbortSignal.timeout(ms)</code>. Propagate a request deadline, don't sum per-hop timeouts.",
    "Retry only idempotent ops (or with an idempotency key) · backoff + jitter · <b>one layer only</b> (amplification!).",
    "Circuit breaker = fail fast on sustained failure. Bulkhead = separate pool per dependency.",
    "Context via <code>AsyncLocalStorage</code>; log error objects with <code>cause</code>, plus requestId/route/tenant."
  ]
},

{ id:'perf', group:'Production', title:'Profiling, diagnostics & performance', animate:'thread',
  lede:"When a Node service is slow, there are only a handful of causes — and each has a specific tool.",
  say:"I start by classifying the symptom: is the event loop blocked, is memory growing, or is it just downstream latency? Event-loop lag from perf_hooks answers the first, two heap snapshots diffed by retained size answer the second, and distributed tracing answers the third. For CPU I take a profile with <code>--cpu-prof</code> or Clinic and read the flame graph — the widest plateau is the answer.",
  steps:[
    "<b>Classify first.</b> High event-loop lag → something synchronous is blocking. Rising post-GC heap → a leak. Flat CPU with high latency → you're waiting on I/O downstream.",
    "<b>Event loop lag</b>: <code>perf_hooks.monitorEventLoopDelay</code> gives a proper histogram. Export p50/p99 as metrics and alert on them.",
    "<b>CPU profile</b>: <code>node --cpu-prof app.js</code> writes a <code>.cpuprofile</code> you open in Chrome DevTools; or <code>clinic flame</code> for a flame graph. Wide plateaus = where time goes.",

  code:`<span class="cm"># CPU profile → open in Chrome DevTools</span>

    {term:"memoryUsage fields", desc:"heapUsed vs external vs rss tell different stories.", detail:"<code>heapUsed</code> = JS objects. <code>external</code>/<code>arrayBuffers</code> = Buffers and native memory. <code>rss</code> = everything the OS has given the process. A leak visible only in RSS/external is a Buffer or native-addon leak, not a JS-object leak.", code:`setInterval(() =&gt; {\n  const m = process.memoryUsage();\n  metrics.gauge('heapUsed', m.heapUsed);\n  metrics.gauge('external', m.external);\n  metrics.gauge('rss', m.rss);\n}, 15_000);`},

{ id:'npm', group:'Production', title:'npm, semver, lockfiles & supply chain', animate:'moduleflow',
  lede:"Dependency management is where most 'it works on my machine' and most supply-chain risk actually lives.",
  say:"Semver is major.minor.patch: <code>^</code> allows minor and patch, <code>~</code> allows patch only. The lockfile pins the exact resolved tree, so CI must use <code>npm ci</code> — which installs strictly from the lockfile and fails if package.json disagrees — rather than <code>npm install</code>, which can silently update it. dependencies ship to production, devDependencies don't, and peerDependencies say 'the host must provide this'.",
  steps:[
    "<b>Semver</b>: <code>MAJOR.MINOR.PATCH</code> — major = breaking, minor = backwards-compatible feature, patch = backwards-compatible fix.",
    "Ranges: <code>^1.2.3</code> allows &lt;2.0.0 (minor+patch), <code>~1.2.3</code> allows &lt;1.3.0 (patch only), <code>1.2.3</code> is exact. Below 1.0.0, <code>^</code> behaves like <code>~</code>.",
    "<b>package-lock.json</b> pins the entire resolved tree with integrity hashes. Commit it. It's what makes builds reproducible.",
    "<code>npm ci</code> deletes <code>node_modules</code> and installs strictly from the lockfile, failing if it's out of sync with package.json — <b>the correct command for CI and Docker builds</b>. <code>npm install</code> may mutate the lockfile.",
    "<b>dependencies</b> are needed at runtime; <b>devDependencies</b> only to build/test; <b>peerDependencies</b> declare 'the host app must provide this' (React in a component library); <b>optionalDependencies</b> may fail to install without breaking.",
    "Transitive dependencies are the real attack surface — a typical app has thousands. <code>npm audit</code>, Dependabot/Renovate and an SBOM are the baseline controls.",
    "<b>Supply-chain risks</b>: typosquatting, malicious postinstall scripts, and account takeover of a popular package. Mitigate with <code>--ignore-scripts</code> where possible, pinned versions, a private registry/proxy, and CI that fails on high-severity advisories.",
    "For monorepos, npm/pnpm/yarn <b>workspaces</b> hoist shared deps and let packages reference each other locally; pnpm's content-addressed store also makes phantom dependencies impossible."
  ],
  code:`<span class="cm"># CI / Docker — reproducible, fails on lockfile drift</span>
npm ci --omit=dev

<span class="cm"># see why a package is installed</span>
npm ls lodash
npm explain lodash

<span class="cm"># audit gate in CI</span>
npm audit --audit-level=high

<span class="cm"># reduce postinstall attack surface</span>
npm ci --ignore-scripts`,
  traps:[
    "Not committing the lockfile means every install can resolve different transitive versions — the classic 'works on my machine'.",
    "<code>npm install</code> in a Dockerfile busts layer caching and can silently drift; use <code>npm ci</code> with <code>package*.json</code> copied first.",
    "<code>^</code> on a dependency that doesn't respect semver still breaks you — the lockfile is what actually protects the build.",
    "Postinstall scripts run arbitrary code at install time, in CI, with your credentials in the environment.",
    "Deleting the lockfile 'to fix' an install problem throws away every pinned transitive version at once — almost never the right move."
  ],
  cards:[
    {q:"<code>npm ci</code> vs <code>npm install</code>?", a:"<code>ci</code> wipes node_modules and installs exactly the lockfile, failing if package.json and the lockfile disagree — deterministic, faster, correct for CI/Docker. <code>install</code> resolves ranges and may update the lockfile."},
    {q:"What do <code>^1.2.3</code> and <code>~1.2.3</code> allow?", a:"<code>^</code> allows minor and patch updates (&lt;2.0.0); <code>~</code> allows patch only (&lt;1.3.0). Below 1.0.0, <code>^</code> is effectively as restrictive as <code>~</code>."},
    {q:"dependencies vs devDependencies vs peerDependencies?", a:"<b>dependencies</b>: needed at runtime, shipped. <b>devDependencies</b>: build/test only, omitted with <code>--omit=dev</code>. <b>peerDependencies</b>: the consuming app must supply it (e.g. React for a component library) — avoids duplicate copies."},
    {q:"Name three npm supply-chain risks and a mitigation for each.", a:"Typosquatting → pin names/versions and use a private registry proxy. Malicious postinstall scripts → <code>--ignore-scripts</code> and review new deps. Compromised maintainer account → lockfile pinning, audit gates in CI, Renovate with review, and an SBOM for incident response."}
  ],
  quiz:[
    {q:"A Docker build produces different dependency versions than local dev. The Dockerfile runs <code>npm install</code>. Fix?", options:["Use <code>npm ci</code> with the committed lockfile","Delete package-lock.json","Pin every dependency exactly in package.json","Use yarn"], answer:0,
     why:"<code>npm ci</code> installs strictly from the lockfile and errors if it's out of sync, giving byte-identical trees across environments. <code>npm install</code> re-resolves ranges and can drift."}
  ],
  cheat:[
    "Semver <b>MAJOR.MINOR.PATCH</b> · <code>^</code>=minor+patch · <code>~</code>=patch · exact=exact. (&lt;1.0.0: <code>^</code>≈<code>~</code>.)",
    "<b>Commit the lockfile.</b> CI/Docker → <code>npm ci</code> (strict, fails on drift), never <code>npm install</code>.",
    "deps=runtime · devDeps=build/test · peerDeps=host provides · optionalDeps=may fail.",
    "Supply chain: typosquatting, postinstall scripts, maintainer takeover → pin, audit gate, private proxy, <code>--ignore-scripts</code>, SBOM.",
    "Monorepo: workspaces (npm/pnpm/yarn); pnpm's store prevents phantom deps."
  ]
},
