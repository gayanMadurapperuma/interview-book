{ id:'db-redis', group:'Data platform', title:'Redis in practice: caching, locks & rate limits', animate:'cachelayers',
  lede:"The default shared-state store next to your database — and the patterns worth knowing precisely.",
  say:"Redis is single-threaded for command execution, which is why every command is atomic and why one slow command like <code>KEYS *</code> blocks everything. I use it for cache-aside with a TTL, distributed rate limiting, and sometimes locks — with the caveat that a correct lock needs a unique token, an atomic release via Lua, and an honest acknowledgement that Redlock is contested. Always set a TTL and an eviction policy, or it fills up.",
  steps:[
    "<b>Single-threaded command execution</b> means every command is atomic and ordering is predictable — and that a single O(n) command blocks every other client. Never run <code>KEYS *</code> in production; use <code>SCAN</code>.",
    "<b>Cache-aside</b> is the default pattern: check cache → miss → read source → populate with a TTL. It degrades gracefully because an empty cache is still correct, just slower.",
    "<b>Invalidate on write by deleting</b> the key rather than updating it — the next read repopulates correctly, and you avoid the cache and source drifting apart.",
    "<b>Cache stampede</b>: a hot key expires and every concurrent request misses at once. Mitigate with request coalescing (a short lock so one caller fetches), staggered/jittered TTLs, or serving stale while revalidating.",
    "<b>Data structures matter</b>: strings, hashes (partial field updates), sorted sets (leaderboards, sliding windows, delayed queues), sets, streams (consumer groups), HyperLogLog (approximate cardinality), bitmaps.",
    "<b>Distributed rate limiting</b>: a sorted set of timestamps gives a true sliding window; <code>INCR</code> + <code>EXPIRE</code> gives a cheaper fixed window with edge bursts. Do the whole thing in one Lua script so it's atomic.",
    "<b>Distributed locks</b>: <code>SET key token NX PX ttl</code> to acquire, and release with a Lua script that checks the token before deleting — otherwise you can delete someone else's lock. Redlock across multiple nodes is <b>contested</b>; don't claim it's safe for correctness-critical work.",
    "<b>Eviction policy</b>: with <code>maxmemory</code> set, choose <code>allkeys-lru</code> for a pure cache. The default <code>noeviction</code> makes writes fail when full — a surprising outage.",
    "<b>Persistence</b>: RDB snapshots and AOF exist, but treat Redis as a cache unless you have deliberately designed for durability; a failover can lose recent writes."
  ],
  code:`<span class="cm">// cache-aside with jittered TTL (avoids synchronised expiry)</span>
async function getUser(id){
  const k = \`user:\${id}\`;
  const hit = await redis.get(k);
  if (hit) return JSON.parse(hit);
  const user = await db.users.find(id);
  await redis.set(k, JSON.stringify(user), 'EX', 300 + Math.floor(Math.random() * 60));
  return user;
}
await db.users.update(id, patch);
await redis.del(\`user:\${id}\`);        <span class="cm">// invalidate by deleting, not updating</span>

<span class="cm">-- sliding-window rate limit, atomic in one round trip</span>
local now, window, limit = tonumber(ARGV[1]), tonumber(ARGV[2]), tonumber(ARGV[3])
redis.call('ZREMRANGEBYSCORE', KEYS[1], 0, now - window)
if redis.call('ZCARD', KEYS[1]) &gt;= limit then return 0 end
redis.call('ZADD', KEYS[1], now, ARGV[4])
redis.call('PEXPIRE', KEYS[1], window)
return 1

<span class="cm">-- safe lock release: only if the token is still mine</span>
if redis.call('GET', KEYS[1]) == ARGV[1] then return redis.call('DEL', KEYS[1]) else return 0 end`,
  traps:[
    "<code>KEYS *</code>, large <code>SMEMBERS</code>, or a huge <code>DEL</code> block the single thread and stall every other client. Use <code>SCAN</code> and <code>UNLINK</code>.",
    "Deleting a lock without checking a unique token can delete a lock another process now holds — after your TTL expired mid-work.",
    "No TTL plus <code>noeviction</code> means Redis fills up and writes start failing. Set <code>maxmemory</code> and an eviction policy explicitly.",
    "Treating Redis as durable storage: a failover or restart can lose recent writes even with AOF, depending on fsync settings.",
    "Caching without measuring the hit ratio adds staleness risk and complexity for possibly no benefit — instrument it.",
    "Big keys (multi-megabyte values or million-element collections) cause latency spikes on every operation touching them."
  ],
  terms:[
    {term:"Cache stampede", desc:"Many concurrent misses on the same hot key hammering the source at once.", detail:"Three practical mitigations: jittered TTLs so keys don't expire together; request coalescing so only one caller fetches while others wait; and stale-while-revalidate, serving the old value briefly while one worker refreshes.", code:`<span class="cm">// coalescing: one fetch per key, per process</span>\nconst inflight = new Map();\nfunction load(key){\n  if (inflight.has(key)) return inflight.get(key);\n  const p = fetchAndCache(key).finally(() =&gt; inflight.delete(key));\n  inflight.set(key, p);\n  return p;\n}`},
    {term:"Distributed lock caveats", desc:"Correct enough for coordination; not a substitute for a database constraint.", detail:"Any lock with a TTL can expire while you're still working, so a second holder can appear. If correctness depends on mutual exclusion, back it with a database constraint or a conditional write — use the lock to reduce contention, not to guarantee safety.", code:`const token = crypto.randomUUID();\nconst ok = await redis.set(key, token, 'NX', 'PX', 10000);\ntry { if (ok) await work(); }\nfinally { await redis.eval(RELEASE_LUA, 1, key, token); }`}
  ],
  cards:[
    {q:"Why is <code>KEYS *</code> dangerous?", a:"Redis executes commands on a single thread, so an O(n) command over the whole keyspace blocks every other client for its duration. Use <code>SCAN</code> for iteration and <code>UNLINK</code> for large deletes."},
    {q:"Describe cache-aside and how you invalidate.", a:"Check the cache; on a miss read the source and populate with a TTL. On write, <b>delete</b> the key rather than updating it — the next read repopulates correctly and you avoid drift between cache and source."},
    {q:"What is a cache stampede and how do you mitigate it?", a:"A hot key expires and every concurrent request misses simultaneously, hammering the source. Mitigate with jittered TTLs, request coalescing (one fetch while others wait), or stale-while-revalidate."},
    {q:"How do you implement a Redis lock correctly?", a:"<code>SET key uniqueToken NX PX ttl</code> to acquire, and release with a Lua script that deletes only if the stored token matches yours. Note the honest caveat: the TTL can expire mid-work, so don't rely on it for correctness — back that with a database constraint."},
    {q:"What eviction policy should a pure cache use?", a:"<code>allkeys-lru</code> (or <code>allkeys-lfu</code>) with <code>maxmemory</code> set. The default <code>noeviction</code> causes writes to fail once memory is full, which looks like a sudden outage."}
  ],
  quiz:[
    {q:"A service releases a Redis lock with <code>DEL key</code>. What can go wrong?", options:["If the TTL expired mid-work, it deletes a lock another process now holds","Nothing","DEL is too slow","The key never expires"], answer:0,
     why:"Without checking a unique token, you can delete someone else's lock. Store a random token at acquire time and release with a Lua compare-and-delete."}
  ],
  cheat:[
    "<b>Single-threaded</b> ⇒ atomic commands, but one O(n) command blocks all. <code>SCAN</code> not <code>KEYS</code>, <code>UNLINK</code> not <code>DEL</code>.",
    "<b>Cache-aside</b> + TTL; <b>invalidate by DEL</b> on write.",
    "<b>Stampede</b> → jittered TTLs · coalescing · stale-while-revalidate.",
    "Structures: hash (partial updates) · <b>zset</b> (leaderboards, sliding windows, delayed jobs) · streams (consumer groups) · HyperLogLog.",
    "Rate limit: zset sliding window or <code>INCR</code>+<code>EXPIRE</code> fixed window — <b>in one Lua script</b>.",
    "Lock: <code>SET k token NX PX ttl</code> + Lua compare-and-delete. <b>Redlock is contested</b> — back correctness with a DB constraint.",
    "Set <code>maxmemory</code> + <code>allkeys-lru</code>; default <code>noeviction</code> fails writes. Track hit ratio."
  ]
},

{ id:'db-lake', group:'Data platform', title:'Data lakes: S3, Glue, Parquet & Athena', animate:'lakepipe',
  lede:"Getting analytics off the transactional database — and why file format and partitioning decide the bill.",
  say:"The pattern is: land raw data in S3, catalogue it with Glue, convert to columnar Parquet partitioned by the columns you filter on, and query with Athena. Athena charges by bytes scanned, so partitioning and Parquet are not tuning — they're the cost model. Converting JSON to partitioned Parquet routinely cuts both scan volume and query time by an order of magnitude.",
  steps:[
    "<b>Why not query the OLTP database?</b> Analytical scans compete with transactional traffic for cache and I/O, hold long read transactions that block vacuum, and index-optimised row storage is the wrong shape for column aggregates.",
    "<b>Landing zone</b>: raw events into S3, usually via Firehose or a batch export, in a <code>raw/</code> prefix that you never mutate — keeping the raw copy is what lets you reprocess after a bug.",
    "<b>Catalogue</b>: AWS Glue Data Catalog holds table definitions and partitions. A crawler can infer schema, but explicit table definitions are more predictable in production.",
    "<b>Convert to Parquet</b>: columnar, compressed, with per-column statistics. A query touching 3 of 50 columns reads only those three — often a 10× reduction versus JSON or CSV.",
    "<b>Partition by what you filter on</b>, almost always date (<code>year=/month=/day=</code>) plus perhaps tenant. Partition pruning is what stops a query scanning the entire history.",
    "<b>Athena is serverless Presto and bills per byte scanned</b>, so partitioning + Parquet + selecting only needed columns is directly a cost decision, not just a latency one.",
    "<b>The small-files problem</b>: thousands of tiny objects make queries slow because of per-file overhead. Compact into files of roughly 128MB–1GB.",
    "<b>Table formats</b> (Iceberg, Delta, Hudi) add ACID, schema evolution, time travel and row-level deletes on top of object storage — and Athena supports Iceberg, which matters for GDPR-style deletions.",
    "<b>Medallion layering</b>: raw → cleaned/conformed → aggregated marts. Each layer is reproducible from the one before, which is what makes backfills safe."
  ],
  code:`<span class="cm">-- Hive-style partitioning: the folder layout IS the index</span>
s3://lake/events/year=2026/month=09/day=08/part-0001.parquet

CREATE EXTERNAL TABLE events (
  event_id string, tenant_id int, action string, ts timestamp
)
PARTITIONED BY (year int, month int, day int)
STORED AS PARQUET
LOCATION 's3://lake/events/';

MSCK REPAIR TABLE events;    <span class="cm">-- or partition projection, no repair needed</span>

<span class="cm">-- ✅ prunes partitions and reads 2 columns: scans megabytes</span>
SELECT action, count(*) FROM events
WHERE year = 2026 AND month = 9 GROUP BY action;

<span class="cm">-- ❌ no partition filter, SELECT *: scans the entire lake</span>
SELECT * FROM events WHERE action = 'login';`,
  traps:[
    "<b>Forgetting the partition filter</b> turns a 200MB query into a full-history scan — and Athena bills for every byte.",
    "Leaving data as JSON/CSV instead of Parquet multiplies both scan cost and query time.",
    "Thousands of small files: per-file overhead dominates. Compact them on a schedule.",
    "Over-partitioning (e.g. by hour <i>and</i> tenant <i>and</i> action) creates millions of tiny partitions and slows planning.",
    "Glue crawlers inferring schema from mixed data produce surprising types; define tables explicitly for anything important.",
    "Deleting a specific user's rows from plain Parquet means rewriting whole files — which is exactly why Iceberg exists."
  ],
  terms:[
    {term:"Why Parquet", desc:"Columnar layout with per-column compression and statistics.", detail:"Row formats must read every column of every row. Parquet stores columns contiguously with min/max statistics per row group, so the engine skips both unneeded columns and row groups that can't match the predicate — that's predicate pushdown.", code:`<span class="cm">-- 50 columns, query needs 3 → reads ~6% of the bytes</span>\n<span class="cm">-- plus compression: often another 5–10× smaller than JSON</span>`},
    {term:"Partition projection", desc:"Tell Athena the partition pattern instead of maintaining a partition list.", detail:"Removes the need for <code>MSCK REPAIR</code> or per-partition <code>ALTER TABLE ADD PARTITION</code>, and speeds up planning on tables with very many partitions.", code:`TBLPROPERTIES (\n  'projection.enabled'='true',\n  'projection.day.type'='date',\n  'projection.day.range'='2024/01/01,NOW',\n  'projection.day.format'='yyyy/MM/dd'\n)`}
  ],
  cards:[
    {q:"Why does Athena cost depend on your file layout?", a:"Athena bills per byte scanned. Columnar Parquet means only the referenced columns are read; partitioning means only the relevant prefixes are read. Together they routinely cut both cost and latency by an order of magnitude versus unpartitioned JSON."},
    {q:"How should a data lake be partitioned?", a:"By the columns you filter on — almost always date (<code>year=/month=/day=</code>), sometimes plus tenant. Enough to enable pruning, not so many that you create millions of tiny partitions and slow query planning."},
    {q:"What is the small-files problem?", a:"Thousands of tiny objects mean per-file open/read overhead dominates the query. Compact into roughly 128MB–1GB files on a schedule; streaming ingestion (Firehose) needs buffering configured with this in mind."},
    {q:"Why would you use Iceberg instead of plain Parquet?", a:"It adds ACID transactions, schema evolution, time travel and <b>row-level deletes/updates</b> on object storage. Deleting one user's rows from plain Parquet means rewriting entire files — Iceberg makes GDPR-style deletion and upserts practical."}
  ],
  quiz:[
    {q:"An Athena query costs $12 and takes 4 minutes over JSON files in S3. Best first change?", options:["Convert to partitioned Parquet and select only needed columns","Increase the Athena timeout","Add more S3 buckets","Use a bigger Glue crawler"], answer:0,
     why:"Athena bills by bytes scanned. Columnar Parquet plus partition pruning plus projecting only required columns attacks that directly — typically an order of magnitude on both cost and time."}
  ],
  cheat:[
    "<b>S3 raw → Glue catalogue → Parquet, partitioned → Athena.</b> Keep the raw copy for reprocessing.",
    "<b>Athena bills per byte scanned</b> ⇒ partitioning + Parquet + named columns = the cost model.",
    "Partition by what you filter on (date, maybe tenant). Don't over-partition.",
    "Compact <b>small files</b> to ~128MB–1GB.",
    "Partition projection avoids <code>MSCK REPAIR</code>.",
    "<b>Iceberg</b> for ACID, schema evolution, time travel, row-level deletes (GDPR).",
    "Layer raw → cleaned → marts so backfills are reproducible."
  ]
},

{ id:'db-cdc', group:'Data platform', title:'CDC, the outbox pattern & dual-write consistency', animate:'cdcflow',
  lede:"How a database change reliably becomes an event — and why publishing directly from your handler is a bug.",
  say:"The dual-write problem is that writing to the database and publishing an event are two separate operations that can't be made atomic — a crash between them silently loses the event or emits one for a transaction that rolled back. The transactional outbox fixes it: write the event into an outbox table in the <i>same</i> transaction, then a separate relay publishes it. Change-data-capture from the WAL or a stream is the same idea implemented by infrastructure.",
  steps:[
    "<b>The dual-write problem</b>: <code>await db.save(order)</code> then <code>await queue.publish(event)</code> are two operations with no shared transaction. A crash between them loses the event; a rollback after publishing emits an event for something that never happened.",
    "<b>Transactional outbox</b>: insert the event row into an <code>outbox</code> table <b>inside the same transaction</b> as the business write. Atomic by construction.",
    "A separate <b>relay</b> polls (or tails the WAL) and publishes outbox rows, marking them sent. If it crashes after publishing but before marking, the event is republished — <b>at-least-once, so consumers must be idempotent</b>.",
    "<b>Change data capture (CDC)</b> is the same guarantee provided by infrastructure: Debezium or AWS DMS reads the WAL/binlog, DynamoDB Streams reads the table's change log, and emits row-level changes downstream.",
    "CDC is how you keep a <b>search index, cache, warehouse or read model</b> in sync without the application writing to two places.",
    "<b>Ordering</b> is guaranteed per key/partition, not globally. Use the entity id as the partition key so all changes to one entity stay ordered.",
    "<b>Idempotency on the consumer</b> is mandatory: dedupe on the event id or use a conditional/upsert write, because every one of these paths is at-least-once.",
    "The <b>inbox pattern</b> is the mirror image: record processed event ids in the consumer's own database, in the same transaction as its effects, so a redelivery is a safe no-op.",
    "<b>Trade-off</b>: outbox is simple, portable and visible in your schema, but adds a table and a relay. CDC is lower-latency and application-transparent, but is infrastructure you must operate — and a stuck replication slot will fill the primary's disk."
  ],
  code:`<span class="cm">-- outbox table</span>
CREATE TABLE outbox (
  id bigserial PRIMARY KEY,
  aggregate_id text NOT NULL,
  type text NOT NULL,
  payload jsonb NOT NULL,
  created_at timestamptz NOT NULL DEFAULT now(),
  published_at timestamptz
);
CREATE INDEX ON outbox (id) WHERE published_at IS NULL;   <span class="cm">-- partial: unsent only</span>

<span class="cm">// ✅ one transaction — cannot drift</span>
await db.transaction(async (tx) =&gt; {
  const order = await tx.orders.insert(dto);
  await tx.outbox.insert({ aggregate_id: order.id, type: 'OrderPlaced', payload: order });
});

<span class="cm">-- relay: SKIP LOCKED lets several relay instances run safely</span>
BEGIN;
  SELECT * FROM outbox WHERE published_at IS NULL
  ORDER BY id FOR UPDATE SKIP LOCKED LIMIT 100;
  <span class="cm">-- publish…</span>
  UPDATE outbox SET published_at = now() WHERE id = ANY($1);
COMMIT;`,
  traps:[
    "Publishing before committing emits events for transactions that later roll back — subscribers act on things that never happened.",
    "Publishing after committing loses events if the process dies in between; retries in the handler don't fix it, because the process may not survive to retry.",
    "Forgetting consumer idempotency: the relay's at-least-once behaviour then produces duplicate emails, charges or records.",
    "An outbox table with no cleanup grows forever — archive or delete published rows on a schedule.",
    "CDC emits <i>row</i> changes, not domain events. A consumer coupled to your table structure breaks whenever you refactor the schema — many teams map CDC into domain events deliberately.",
    "A stuck logical replication slot retains WAL indefinitely and can fill the primary's disk."
  ],
  terms:[
    {term:"FOR UPDATE SKIP LOCKED", desc:"Makes Postgres a workable queue and lets multiple relays run concurrently.", detail:"Each worker locks the rows it takes and skips rows another worker already holds, so there's no contention and no duplicate processing within the transaction window. It's also the basis of lightweight job queues in Postgres.", code:`SELECT * FROM jobs\nWHERE status = 'queued'\nORDER BY id\nFOR UPDATE SKIP LOCKED\nLIMIT 10;`},
    {term:"Inbox / idempotent consumer", desc:"Record what you've processed, in the same transaction as its effects.", detail:"This converts at-least-once delivery into effectively-once processing without any distributed transaction — the standard, boring, correct answer.", code:`await db.transaction(async (tx) =&gt; {\n  const fresh = await tx.inbox.insertIgnore({ event_id: evt.id });\n  if (!fresh) return;                <span class="cm">// already processed</span>\n  await tx.apply(evt);\n});`}
  ],
  cards:[
    {q:"What is the dual-write problem?", a:"Writing to the database and publishing an event are two separate operations with no shared transaction. A crash between them loses the event; publishing before committing can emit an event for a transaction that later rolls back. There's no ordering of the two that is safe."},
    {q:"How does the transactional outbox solve it?", a:"The event is inserted into an outbox table inside the <b>same transaction</b> as the business write, so they commit or fail together. A separate relay then publishes unsent rows and marks them sent — at-least-once, so consumers must be idempotent."},
    {q:"CDC vs outbox — what's the trade-off?", a:"Outbox is simple, portable and explicit in your schema, but adds a table and a relay to operate. CDC (Debezium, DMS, DynamoDB Streams) is lower-latency and requires no application change, but is infrastructure to run, emits row-level rather than domain events, and a stuck slot can fill the primary's disk."},
    {q:"What is the inbox pattern?", a:"The consumer records processed event ids in its own database, in the same transaction as the effects. A redelivered event finds its id already present and becomes a no-op — turning at-least-once delivery into effectively-once processing with no distributed transaction."}
  ],
  quiz:[
    {q:"An order service saves to Postgres then publishes to SNS. Occasionally an order exists with no downstream event. Best fix?", options:["Transactional outbox — write the event in the same transaction, relay publishes it","Retry the publish in a catch block","Publish before saving","Use a bigger SNS timeout"], answer:0,
     why:"The gap between commit and publish can't be closed by retries — the process may die in it. Only writing the event atomically with the business data removes the failure mode."}
  ],
  cheat:[
    "<b>Dual write is unsafe in both orders</b> (lose events, or emit for rolled-back work).",
    "<b>Outbox</b>: event row in the <b>same transaction</b> → relay publishes → mark sent. At-least-once.",
    "Relay uses <code>FOR UPDATE SKIP LOCKED</code> so multiple instances are safe.",
    "<b>CDC</b> = same guarantee from infra (Debezium/DMS/DynamoDB Streams) → search index, cache, warehouse, read models.",
    "Ordering per <b>key/partition</b>, not global → partition by entity id.",
    "<b>Consumers must be idempotent</b> — inbox table or conditional write.",
    "Archive published outbox rows; watch replication slots for WAL retention."
  ]
},

{ key:'closures', label:'Closures: var vs let in loops', phases:JS_PHASES, cols:JS_COLS,
  takeaway:"<code>var</code> gives one shared binding for the whole loop; <code>let</code> creates a fresh binding per iteration. Every callback closes over a <b>variable</b>, not a value — which is why they all see 3 with <code>var</code>.",
  code:[
    `<span class="kw">for</span> (<span class="kw">var</span> i = 0; i &lt; 3; i++) {`,
    `  setTimeout(() =&gt; console.log(i), 0);`,
    `}`,
    ``,
    `<span class="kw">for</span> (<span class="kw">let</span> j = 0; j &lt; 3; j++) {`,
    `  setTimeout(() =&gt; console.log(j), 0);`,
    `}`
  ],
  steps:[
    {line:0, phase:'run', out:[], cols:{stack:[Fd('stack','Global')]},
     note:"Two loops that look almost identical — one uses <code>var</code>, one uses <code>let</code>. Watch what each callback actually captures."},
    {line:1, phase:'run', out:[], cols:{stack:[Fd('stack','Global')], heap:[Fd('heap','var i — ONE shared binding','= 3 (final)')], macro:[Fd('macro','cb1: log(i)'),Fd('macro','cb2: log(i)'),Fd('macro','cb3: log(i)')]},
     note:"<code>var</code> is function-scoped — <b>all three iterations share one binding</b>. Each callback holds a reference to that single box, which ends at 3 once the loop condition fails."},
    {line:4, phase:'run', out:[], cols:{stack:[Fd('stack','Global')], heap:[Fd('heap','var i (shared, done)','= 3'),Fd('heap','let j — iter 1','= 0'),Fd('heap','let j — iter 2','= 1'),Fd('heap','let j — iter 3','= 2')], macro:[Fd('macro','cb1'),Fd('macro','cb2'),Fd('macro','cb3'),Fd('macro','cb4: log(j)'),Fd('macro','cb5: log(j)'),Fd('macro','cb6: log(j)')]},
     note:"<code>let</code> creates a <b>brand-new binding every iteration</b>. Each callback closes over its own private box — 0, then 1, then 2."},
    {line:-1, phase:'idle', out:[], cols:{heap:[Fd('heap','var i (shared)','= 3'),Fd('heap','let j × 3 (separate)')], macro:[Fd('macro','cb1'),Fd('macro','cb2'),Fd('macro','cb3'),Fd('macro','cb4'),Fd('macro','cb5'),Fd('macro','cb6')]},
     note:"The call stack empties. Six 0ms timeouts are queued — time to drain the macrotask queue in registration order."},
    {line:-1, phase:'macro', out:['3','3','3'], cols:{stack:[Fd('stack','cb1, cb2, cb3 → same box')], heap:[Fd('heap','var i (shared)','= 3')], macro:[Fd('macro','cb4'),Fd('macro','cb5'),Fd('macro','cb6')]},
     note:"The three <code>var</code>-based callbacks all read the same shared box — by the time they run it holds <b>3</b>. Output: <b>3, 3, 3</b>."},
    {line:-1, phase:'macro', out:['3','3','3','0','1','2'], cols:{stack:[Fd('stack','cb4, cb5, cb6 → own box each')]},
     note:"The <code>let</code>-based callbacks each read their own binding — <b>0, 1, 2</b>. This is exactly why <code>let</code> fixes the classic loop-closure bug."}
  ]},

{ key:'this', label:'The this binding trap', phases:JS_PHASES, cols:JS_COLS,

    ``,
    `<span class="kw">const</span> bound = obj.getName.bind(obj);`,

  ],

     note:"Called as <code>obj.getName()</code> — <b>this binds to whatever is left of the dot</b>, i.e. <code>obj</code>."},
    {line:2, phase:'run', out:['Ada'], cols:{stack:[Fd('stack','Global')], heap:[Fd('heap',"{ name:'Ada', getName(){…} }")]},
     note:"Frame pops, logs <b>'Ada'</b>."},
    {line:4, phase:'run', out:['Ada'], cols:{stack:[Fd('stack','Global')], heap:[Fd('heap',"{ name:'Ada', getName(){…} }"),Fd('heap','fn → same function, no owner')]},
     note:"<code>fn</code> now references the function itself, <b>detached from obj</b> — the connection to <code>this</code> is gone."},
    {line:5, phase:'run', out:['Ada'], cols:{stack:[Fd('stack','Global'),Fd('stack','getName()','this = undefined')], heap:[Fd('heap',"{ name:'Ada', getName(){…} }"),Fd('heap','fn → no owner')]},
     note:"Called plainly as <code>fn()</code> — <b>this is undefined</b> in strict mode, since there's no object left of the dot."},
    {line:5, phase:'run', out:['Ada','undefined'], cols:{stack:[Fd('stack','Global')], heap:[Fd('heap','fn → no owner')]},
     note:"Frame pops, logs <b>'undefined'</b> — reading <code>.name</code> off <code>undefined</code> (optional chaining would be needed to avoid a TypeError here)."},
    {line:7, phase:'run', out:['Ada','undefined'], cols:{stack:[Fd('stack','Global')], heap:[Fd('heap','bound → getName, this PERMANENTLY = obj')]},

    {line:8, phase:'run', out:['Ada','undefined','Ada'], cols:{stack:[Fd('stack','Global')], heap:[Fd('heap','bound → this PERMANENTLY = obj')]},
     note:"<b>this depends on the call site</b> — except when <code>bind()</code> fixes it forever. Final output: Ada, undefined, Ada."}
  ]},

{ key:'asyncawait', label:'async/await suspension & resumption',
  phases:JS_PHASES,
  cols:[
    {k:'stack', label:'Call stack',            c:'accent'},
    {k:'susp',  label:'Suspended async frames', c:'node'},
    {k:'micro', label:'Microtask queue',        c:'micro'},
    {k:'macro', label:'Pending I/O',            c:'js'}
  ],
  takeaway:"An async function runs <b>synchronously up to its first <code>await</code></b>, then suspends and resumes as a microtask. It always returns a promise — so the caller continues immediately.",
  code:[
    `async function load(id) {`,
    `  console.log(<span class="str">'1: entering load'</span>);`,
    `  const user = <span class="kw">await</span> fetchUser(id);   <span class="cm">// suspends HERE</span>`,
    `  console.log(<span class="str">'4: resumed with user'</span>);`,
    `  return user;`,
    `}`,
    ``,
    `const p = load(7);       <span class="cm">// returns a promise immediately</span>`,
    `console.log(<span class="str">'2: after calling load'</span>);`,
    `p.then(u =&gt; console.log(<span class="str">'5: then'</span>, u));`,
    `console.log(<span class="str">'3: end of script'</span>);`
  ],
  steps:[
    {line:7, phase:'run', out:[], cols:{stack:[Fd('stack','Global'),Fd('stack','load(7)')]},
     note:"Calling an <code>async</code> function does <b>not</b> defer anything. The body starts executing immediately, on the current stack."},
    {line:1, phase:'run', out:['1: entering load'], cols:{stack:[Fd('stack','Global'),Fd('stack','load(7)')]},
     note:"Everything before the first <code>await</code> is ordinary synchronous code — logs <b>'1: entering load'</b> right now."},
    {line:2, phase:'run', out:['1: entering load'], cols:{stack:[Fd('stack','Global')], susp:[Fd('heap','load(7)','paused at await')], macro:[Fd('macro','fetchUser(7) — in flight')]},
     note:"<b>The <code>await</code> suspends the function.</b> Its frame pops off the stack and is parked; <code>fetchUser</code> is already running. <code>load()</code> has already returned a <i>pending promise</i> to its caller."},
    {line:8, phase:'run', out:['1: entering load','2: after calling load'], cols:{stack:[Fd('stack','Global')], susp:[Fd('heap','load(7)','paused at await')], macro:[Fd('macro','fetchUser(7) — in flight')]},
     note:"Control is back in the caller. <code>p</code> holds a pending promise — this is why an async function never blocks the code that called it."},
    {line:9, phase:'run', out:['1: entering load','2: after calling load'], cols:{stack:[Fd('stack','Global')], susp:[Fd('heap','load(7)','paused at await')], macro:[Fd('macro','fetchUser(7) — in flight')]},
     note:"<code>.then()</code> registers a reaction on that pending promise. Nothing is queued yet — the promise hasn't settled."},
    {line:10, phase:'run', out:['1: entering load','2: after calling load','3: end of script'], cols:{stack:[Fd('stack','Global')], susp:[Fd('heap','load(7)','paused at await')], macro:[Fd('macro','fetchUser(7) — in flight')]},
     note:"Last synchronous line. Note the log order so far: <b>1, 2, 3</b> — the middle of <code>load</code> hasn't run at all."},
    {line:-1, phase:'idle', out:['1: entering load','2: after calling load','3: end of script'], cols:{susp:[Fd('heap','load(7)','paused at await')], micro:[Fd('micro','resume load() with user','← fetchUser resolved')]},
     note:"Call stack empty. <code>fetchUser</code> resolves, and the <b>continuation of <code>load</code> is queued as a microtask</b> — not run directly by whatever resolved it."},
    {line:3, phase:'micro', out:['1: entering load','2: after calling load','3: end of script','4: resumed with user'], cols:{stack:[Fd('stack','load(7) — resumed')], micro:[Fd('micro',"then → log('5: then')",'← just queued')]},
     note:"The microtask runs: <code>load</code> resumes <b>where it left off</b>, with its local variables intact, and logs <b>'4'</b>. Returning resolves <code>p</code>, which queues the <code>.then</code> reaction."},
    {line:9, phase:'micro', out:['1: entering load','2: after calling load','3: end of script','4: resumed with user','5: then {…}'], cols:{stack:[Fd('stack','then callback')]},
     note:"The queue drains: the <code>.then</code> reaction runs and logs <b>'5'</b>. Final order: <b>1, 2, 3, 4, 5</b>."},
    {line:-1, phase:'idle', out:['1: entering load','2: after calling load','3: end of script','4: resumed with user','5: then {…}'], cols:{},
     note:"<b>Mental model:</b> <code>await</code> ≈ <code>yield</code>, and the runtime is a driver that calls <code>.next(value)</code> when the awaited promise settles. That's literally how Babel compiles it. Consequence: <code>await</code> on a plain value <i>still</i> costs one microtask tick."}
  ]},

{ key:'generator', label:'Generators: lazy execution & two-way channel',
  phases:[
    {k:'run',  label:'Caller running', c:'accent'},

  ],
  takeaway:"Calling a generator function runs <b>none</b> of its body. Each <code>next()</code> resumes it until the next <code>yield</code>, and the argument to <code>next(v)</code> becomes the <i>result</i> of that yield — a two-way channel.",
  code:[
    `function* dialogue() {`,
    `  console.log(<span class="str">'body starts'</span>);`,
    `  const a = <span class="kw">yield</span> 1;`,
    `  console.log(<span class="str">'received a ='</span>, a);`,
    `  const b = <span class="kw">yield</span> 2;`,
    `  return a + b;`,
    `}`,
    ``,
    `const it = dialogue();`,
    `console.log(<span class="str">'created — nothing has run'</span>);`,
    `it.next();      <span class="cm">// → { value: 1, done: false }</span>`,
    `it.next(10);    <span class="cm">// 10 becomes the value of "yield 1"</span>`,
    `it.next(20);    <span class="cm">// → { value: 30, done: true }</span>`
  ],
  steps:[
    {line:8, phase:'run', out:[], cols:{stack:[Fd('stack','Global')], gen:[Fd('heap','dialogue()','suspended at start')]},
     note:"<code>dialogue()</code> returns an iterator object. <b>Not a single line of the body has executed</b> — this surprises people who put side effects before the first yield."},
    {line:9, phase:'run', out:['created — nothing has run'], cols:{stack:[Fd('stack','Global')], gen:[Fd('heap','dialogue()','suspended at start')]},
     note:"Confirmed: the log inside the body hasn't appeared, but the script's own log has."},
    {line:10, phase:'gen', out:['created — nothing has run','body starts'], cols:{stack:[Fd('stack','Global'),Fd('stack','dialogue body')], gen:[Fd('node','running')], chan:[Fd('micro','next()','no value sent in')]},
     note:"The first <code>next()</code> runs the body <b>from the top</b> until it hits a <code>yield</code>."},
    {line:2, phase:'susp', out:['created — nothing has run','body starts'], cols:{stack:[Fd('stack','Global')], gen:[Fd('heap','suspended at "yield 1"','locals kept alive')], chan:[Fd('micro','out ← { value: 1, done: false }')]},
     note:"<code>yield 1</code> hands <code>1</code> out and <b>suspends</b>. The frame's local variables stay alive on the heap, exactly like a closure — this is the machinery async/await is built on."},
    {line:11, phase:'gen', out:['created — nothing has run','body starts','received a = 10'], cols:{stack:[Fd('stack','Global'),Fd('stack','dialogue body')], gen:[Fd('node','running')], chan:[Fd('micro','in → next(10)','becomes the value of "yield 1"')]},
     note:"<b>The two-way part.</b> <code>next(10)</code> resumes the generator and the argument becomes the <i>result</i> of the suspended <code>yield</code> expression, so <code>a === 10</code>."},
    {line:4, phase:'susp', out:['created — nothing has run','body starts','received a = 10'], cols:{stack:[Fd('stack','Global')], gen:[Fd('heap','suspended at "yield 2"','a = 10 retained')], chan:[Fd('micro','out ← { value: 2, done: false }')]},
     note:"Suspends again at <code>yield 2</code>, with <code>a</code> preserved between resumptions."},
    {line:12, phase:'done', out:['created — nothing has run','body starts','received a = 10'], cols:{stack:[Fd('stack','Global')], gen:[Fd('heap','completed')], chan:[Fd('micro','in → next(20)'),Fd('micro','out ← { value: 30, done: true }')]},
     note:"<code>next(20)</code> sets <code>b = 20</code>, the body returns <code>a + b</code>, and the result comes out as <code>{ value: 30, done: true }</code>."},
    {line:-1, phase:'done', out:['created — nothing has run','body starts','received a = 10','further next() → { value: undefined, done: true }'], cols:{gen:[Fd('heap','completed — single use')]},
     note:"<b>Generators are single-use.</b> Every further <code>next()</code> returns <code>{ undefined, true }</code>. Make the <i>class</i> iterable (a method returning a fresh generator) if you need to iterate twice. Also: <code>it.return()</code> runs <code>finally</code> blocks — which is where resource cleanup belongs when a consumer <code>break</code>s early."}
  ]},

{ key:'immediate', label:'setTimeout vs setImmediate', phases:NODE_PHASES, cols:NODE_COLS,
  takeaway:"At the top level the order is <b>non-deterministic</b>. Inside an I/O callback it is guaranteed: <b>setImmediate always wins</b>, because Check comes immediately after Poll.",
  code:[
    `setTimeout(() =&gt; console.log(<span class="str">'timeout'</span>), 0);`,
    `setImmediate(() =&gt; console.log(<span class="str">'immediate'</span>));`,
    ``,
    `fs.readFile(__filename, () =&gt; {`,
    `  setTimeout(() =&gt; console.log(<span class="str">'io → timeout'</span>), 0);`,
    `  setImmediate(() =&gt; console.log(<span class="str">'io → immediate'</span>));`,
    `});`
  ],
  steps:[
    {line:0, phase:'idle', w:[0,0,0,0], out:[], cols:{stack:[Fd('stack','Global')], macro:[Fd('macro','setTimeout → Timers')]},
     note:"A 0ms timer is registered. Note that Node clamps a 0ms timeout to <b>1ms</b> internally — that single millisecond is the whole source of the ambiguity that follows."},
    {line:1, phase:'idle', w:[0,0,0,0], out:[], cols:{stack:[Fd('stack','Global')], macro:[Fd('macro','setTimeout → Timers'),Fd('macro','setImmediate → Check')]},
     note:"<code>setImmediate</code> is registered for the <b>Check</b> phase, which runs immediately after Poll."},
    {line:3, phase:'idle', w:[1,0,0,0], out:[], cols:{stack:[Fd('stack','Global')], pool:[Fd('pool','readFile(__filename)')], macro:[Fd('macro','setTimeout → Timers'),Fd('macro','setImmediate → Check')]},
     note:"<code>fs.readFile</code> goes to the thread pool (Worker 1). Its callback will run in the <b>Poll</b> phase when the read completes."},
    {line:-1, phase:'idle', w:[1,0,0,0], out:[], cols:{pool:[Fd('pool','readFile(__filename)')], macro:[Fd('macro','setTimeout → Timers'),Fd('macro','setImmediate → Check')]},
     note:"<b>The ambiguity.</b> The loop is about to start its first iteration. If process startup happened to take ≥1ms, the timer is already due and Timers fires first. If it was faster, Timers finds nothing due, and Check runs first. <b>Both orders are legal</b> — this pair genuinely varies run to run on the same machine."},
    {line:-1, phase:'timers', w:[1,0,0,0], out:['timeout'], cols:{stack:[Fd('stack','setTimeout callback')], pool:[Fd('pool','readFile(__filename)')], macro:[Fd('macro','setImmediate → Check')]},
     note:"In <i>this</i> run, startup took over 1ms, so the Timers phase finds the timer due and logs <b>'timeout'</b> first. Re-run the process and you may well see the opposite."},
    {line:3, phase:'poll', w:[0,0,0,0], out:['timeout'], cols:{stack:[Fd('stack','fs.readFile callback')], macro:[Fd('macro','setImmediate → Check')]},
     note:"<b>Poll phase.</b> The read finished, so its callback runs — and we are now at a <i>known</i> point in the loop, which is what removes the ambiguity from here on."},
    {line:5, phase:'poll', w:[0,0,0,0], out:['timeout'], cols:{stack:[Fd('stack','fs.readFile callback')], macro:[Fd('macro','setImmediate → Check'),Fd('macro','io → immediate → Check'),Fd('macro','io → timeout → Timers (next iteration)')]},
     note:"Inside the callback both are registered. The immediate goes to <b>Check — the very next phase</b>. The timer goes to Timers, which has already run this iteration, so it must wait for the next pass."},
    {line:-1, phase:'check', w:[0,0,0,0], out:['timeout','immediate','io → immediate'], cols:{stack:[Fd('stack','setImmediate callbacks')], macro:[Fd('macro','io → timeout → Timers')]},
     note:"<b>Check phase.</b> Both queued immediates run now, in registration order — the outer one, then the one registered from inside the I/O callback."},
    {line:-1, phase:'timers', w:[0,0,0,0], out:['timeout','immediate','io → immediate','io → timeout'], cols:{stack:[Fd('stack','io timeout callback')]},
     note:"Only on the <b>next iteration</b> does Timers come around again and fire <code>'io → timeout'</code> — a full loop later than its sibling."},
    {line:-1, phase:'idle', w:[0,0,0,0], out:['timeout','immediate','io → immediate','io → timeout'], cols:{},
     note:"<b>The rule to remember:</b> inside any I/O callback, <code>setImmediate</code> fires before <code>setTimeout(…, 0)</code>, guaranteed. At the top level, don't rely on either. And if you need to yield after I/O without waiting a full loop, <code>setImmediate</code> is the correct tool — <code>process.nextTick</code> would jump ahead of the loop entirely."}
  ]},

{ key:'pool', label:'Thread pool saturation', phases:NODE_PHASES, cols:NODE_COLS,
  takeaway:"The libuv pool has <b>4 threads by default</b>. Saturate it with crypto and your unrelated file reads queue behind it — while HTTP requests, which use the kernel, are unaffected.",
  code:[
    `<span class="cm">// UV_THREADPOOL_SIZE = 4  (the default)</span>`,
    `for (const pw of [p1, p2, p3, p4, p5]) {`,
    `  crypto.pbkdf2(pw, salt, 100_000, 64, <span class="str">'sha512'</span>, done);`,
    `}`,
    ``,
    `fs.readFile(<span class="str">'config.json'</span>, cb);   <span class="cm">// tiny file</span>`,
    `https.get(<span class="str">'https://api/health'</span>, cb); <span class="cm">// network</span>`
  ],
  steps:[
    {line:2, phase:'idle', w:[1,1,1,1], out:['5 password hashes requested'], cols:{stack:[Fd('stack','Global')], pool:[Fd('pool','pbkdf2 #1'),Fd('pool','pbkdf2 #2'),Fd('pool','pbkdf2 #3'),Fd('pool','pbkdf2 #4')]},
     note:"Four <code>pbkdf2</code> calls immediately occupy all four pool threads. Note these are <b>async</b> calls — your JS thread is completely free, which is exactly why this problem is invisible in a CPU graph."},
    {line:2, phase:'idle', w:[1,1,1,1], out:['5 password hashes requested'], cols:{stack:[Fd('stack','Global')], pool:[Fd('pool','pbkdf2 #1'),Fd('pool','pbkdf2 #2'),Fd('pool','pbkdf2 #3'),Fd('pool','pbkdf2 #4'),Fd('bad','pbkdf2 #5','QUEUED — no free thread')]},
     note:"The fifth hash has nowhere to run. It sits in libuv's work queue until a thread frees up — pure waiting, invisible to your code."},
    {line:5, phase:'idle', w:[1,1,1,1], out:['5 password hashes requested','config.json requested'], cols:{stack:[Fd('stack','Global')], pool:[Fd('pool','pbkdf2 #1–4','running'),Fd('bad','pbkdf2 #5','queued'),Fd('bad','readFile config.json','QUEUED behind the hashes')]},
     note:"<b>Here is the damage.</b> A trivial 2KB file read — nothing to do with authentication — is now stuck behind five CPU-bound hashes, because <code>fs</code> and <code>crypto</code> share the same four threads."},
    {line:6, phase:'idle', w:[1,1,1,1], out:['5 password hashes requested','config.json requested','GET /health sent'], cols:{stack:[Fd('stack','Global')], pool:[Fd('pool','pbkdf2 #1–4'),Fd('bad','pbkdf2 #5'),Fd('bad','readFile — queued')], kernel:[Fd('heap','GET /health','kernel epoll — unaffected')]},
     note:"The HTTP request goes to the <b>kernel</b>, not the pool. Networking never touches the thread pool — which is why one Node process can hold tens of thousands of sockets with only four worker threads."},
    {line:-1, phase:'poll', w:[1,1,1,1], out:['5 password hashes requested','config.json requested','GET /health sent','← /health responded (12ms)'], cols:{pool:[Fd('pool','pbkdf2 #1–4'),Fd('bad','pbkdf2 #5'),Fd('bad','readFile — still queued')]},
     note:"<b>The tell-tale symptom.</b> The network call returns fast while the file read is still waiting. If you were only watching CPU and HTTP latency, everything would look healthy."},
    {line:-1, phase:'poll', w:[0,1,1,1], out:['5 password hashes requested','config.json requested','GET /health sent','← /health responded (12ms)','← hash #1 done (410ms)'], cols:{stack:[Fd('stack','pbkdf2 #1 callback')], pool:[Fd('pool','pbkdf2 #2–4'),Fd('pool','pbkdf2 #5','started — thread freed')], kernel:[]},
     note:"Hash #1 completes; its callback runs on the main thread in the <b>Poll</b> phase. Worker 1 is free, so the queued fifth hash starts — <b>not</b> the file read, which was queued after it."},
    {line:5, phase:'poll', w:[0,0,0,1], out:['5 password hashes requested','config.json requested','GET /health sent','← /health responded (12ms)','← hash #1 done (410ms)','← config.json read (830ms)'], cols:{stack:[Fd('stack','readFile callback')], pool:[Fd('pool','pbkdf2 #5','running')]},
     note:"The 2KB file finally arrives after <b>830ms</b> — a read that takes under a millisecond in isolation. This is what pool saturation looks like from the outside: unrelated I/O with wildly inflated p99."},
    {line:-1, phase:'idle', w:[0,0,0,0], out:['5 password hashes requested','config.json requested','GET /health sent','← /health responded (12ms)','← hash #1 done (410ms)','← config.json read (830ms)'], cols:{},
     note:"<b>Fixes, in order:</b> move password hashing off the pool entirely (a dedicated worker pool or auth service); raise <code>UV_THREADPOOL_SIZE</code> toward your core count — but it must be set <b>before the process starts</b>; and use <code>dns.resolve()</code> rather than <code>dns.lookup()</code> if DNS is also competing for these threads."}
  ]},

{ key:'stream', label:'Backpressure: ignoring write()',
  phases:[
    {k:'flow',  label:'Flowing',      c:'node'},
    {k:'full',  label:'Buffer over HWM', c:'js'},
    {k:'pause', label:'Source paused', c:'tick'},
    {k:'drain', label:'Drain',         c:'accent'}
  ],
  cols:[
    {k:'src',  label:'Readable (fast disk)',    c:'node'},
    {k:'buf',  label:'Writable internal buffer', c:'js'},
    {k:'dest', label:'Slow consumer (mobile client)', c:'pool'}
  ],
  takeaway:"<code>write()</code> returning <code>false</code> means \"stop\". Ignoring it buffers without limit in memory — per connection. <code>pipeline()</code> handles this for you.",
  code:[
    `const src = fs.createReadStream(<span class="str">'4gb.mp4'</span>);  <span class="cm">// fast</span>`,
    ``,
    `<span class="cm">// ❌ the bug: return value ignored</span>`,
    `src.on(<span class="str">'data'</span>, (chunk) =&gt; {`,
    `  res.write(chunk);`,
    `});`,
    ``,
    `<span class="cm">// ✅ the fix</span>`,
    `await pipeline(src, res);`
  ],
  steps:[
    {line:3, phase:'flow', out:['streaming started'], cols:{src:[Fd('heap','reading 64KB chunks','fast')], buf:[Fd('macro','128 KB buffered','HWM = 64 KB')], dest:[Fd('pool','sent 64 KB','slow link')]},
     note:"Attaching a <code>'data'</code> listener puts the readable into <b>flowing mode</b> — it now pushes chunks at you as fast as the disk can supply them, whether or not you're ready."},
    {line:4, phase:'flow', out:['streaming started','write() returned false'], cols:{src:[Fd('heap','still pushing','unpaused')], buf:[Fd('macro','1.2 MB buffered','over HWM')], dest:[Fd('pool','sent 190 KB')]},
     note:"The writable's buffer has passed <code>highWaterMark</code>, so <code>res.write()</code> has started returning <b>false</b>. That is the entire backpressure signal — and this code throws it away."},
    {line:4, phase:'full', out:['streaming started','write() returned false','write() returned false ×2,400'], cols:{src:[Fd('heap','still pushing'),Fd('bad','no pause requested')], buf:[Fd('bad','340 MB buffered','growing without limit')], dest:[Fd('pool','sent 4 MB','~1 Mbps')]},
     note:"<b>The buffer is now the difference between disk speed and network speed, held in RAM.</b> Nothing errors, nothing warns — memory just climbs."},
    {line:4, phase:'full', out:['streaming started','write() returned false ×2,400','RSS: 2.1 GB'], cols:{src:[Fd('heap','still pushing')], buf:[Fd('bad','1.9 GB buffered','per connection!')], dest:[Fd('pool','sent 22 MB')]},
     note:"<b>And it's per connection.</b> Fifty slow clients streaming simultaneously is fifty of these buffers. This is one of the most common causes of a Node process being OOM-killed with healthy-looking CPU."},
    {line:8, phase:'flow', out:['— restarted with pipeline() —'], cols:{src:[Fd('heap','reading 64KB chunks')], buf:[Fd('macro','64 KB buffered','at HWM')], dest:[Fd('pool','sent 64 KB')]},
     note:"Now the correct version. <code>pipeline()</code> wires the same data flow, but it also watches <code>write()</code>'s return value."},
    {line:8, phase:'pause', out:['— restarted with pipeline() —','source paused'], cols:{src:[Fd('bad','PAUSED','waiting for drain')], buf:[Fd('macro','64 KB buffered','capped')], dest:[Fd('pool','draining…')]},
     note:"<code>write()</code> returned <code>false</code>, so <b>the source is paused</b>. The disk stops reading. Memory stops growing. The consumer sets the pace."},
    {line:8, phase:'drain', out:['— restarted with pipeline() —','source paused',"'drain' → resumed"], cols:{src:[Fd('heap','resumed')], buf:[Fd('macro','32 KB buffered','below HWM')], dest:[Fd('pool','sent 128 KB')]},
     note:"The buffer falls below the high-water mark, the writable emits <code>'drain'</code>, and the source resumes. This pause/resume cycle repeats for the whole 4GB at <b>constant memory</b>."},
    {line:-1, phase:'drain', out:['— restarted with pipeline() —','4 GB transferred','peak RSS: 90 MB'], cols:{},
     note:"<b>Same transfer, ~90MB instead of ~2GB.</b> <code>pipeline()</code> also propagates errors and destroys every stream in the chain on failure — which raw <code>.pipe()</code> does not, and is how file descriptors leak. The identical contract applies to WebSockets (<code>ws.bufferedAmount</code>) and to SSE token streaming from an LLM."}
  ]},

{ key:'emitter', label:"EventEmitter & the unhandled 'error'",
  phases:[
    {k:'run',   label:'Running',         c:'accent'},
    {k:'emit',  label:'Emitting (sync)', c:'node'},
    {k:'crash', label:'Uncaught throw',  c:'tick'},
    {k:'idle',  label:'Process exits',   c:'sub'}
  ],
  cols:[
    {k:'stack',     label:'Call stack',            c:'accent'},
    {k:'listeners', label:"Listeners for 'done'",  c:'node'},
    {k:'err',       label:"Listeners for 'error'", c:'tick'}
  ],
  takeaway:"<code>emit()</code> is <b>synchronous</b> and runs listeners in registration order. An <code>'error'</code> event with no listener is <b>thrown</b> — which crashes the process.",
  code:[
    `const jobs = new EventEmitter();`,
    ``,
    `jobs.on(<span class="str">'done'</span>, () =&gt; console.log(<span class="str">'listener A'</span>));`,
    `jobs.on(<span class="str">'done'</span>, () =&gt; console.log(<span class="str">'listener B'</span>));`,
    ``,
    `console.log(<span class="str">'before emit'</span>);`,
    `jobs.emit(<span class="str">'done'</span>);`,
    `console.log(<span class="str">'after emit'</span>);`,
    ``,
    `jobs.emit(<span class="str">'error'</span>, new Error(<span class="str">'boom'</span>));  <span class="cm">// no listener!</span>`
  ],
  steps:[
    {line:3, phase:'run', out:[], cols:{stack:[Fd('stack','Global')], listeners:[Fd('heap','A'),Fd('heap','B')]},
     note:"Two listeners registered for <code>'done'</code>. Order is recorded — emission will follow it exactly. Note there is <b>no listener for <code>'error'</code></b>."},
    {line:5, phase:'run', out:['before emit'], cols:{stack:[Fd('stack','Global')], listeners:[Fd('heap','A'),Fd('heap','B')]},
     note:"Ordinary synchronous log."},
    {line:6, phase:'emit', out:['before emit','listener A'], cols:{stack:[Fd('stack','Global'),Fd('stack',"emit('done')"),Fd('stack','listener A')], listeners:[Fd('node','A','running'),Fd('heap','B')]},
     note:"<b><code>emit</code> is synchronous.</b> Listener A is invoked on the current stack — not queued as a microtask or a timer. A slow listener here blocks the emitter and everything else."},
    {line:6, phase:'emit', out:['before emit','listener A','listener B'], cols:{stack:[Fd('stack','Global'),Fd('stack',"emit('done')"),Fd('stack','listener B')], listeners:[Fd('heap','A'),Fd('node','B','running')]},
     note:"Listener B runs immediately after, in registration order, still inside the same <code>emit()</code> call."},
    {line:7, phase:'run', out:['before emit','listener A','listener B','after emit'], cols:{stack:[Fd('stack','Global')], listeners:[Fd('heap','A'),Fd('heap','B')]},
     note:"<code>emit()</code> returns only after every listener has finished, then <b>'after emit'</b> logs. Output order is <b>before → A → B → after</b>, with nothing deferred. (An <code>async</code> listener would return a promise the emitter ignores entirely — its rejection would be unhandled.)"},
    {line:9, phase:'crash', out:['before emit','listener A','listener B','after emit'], cols:{stack:[Fd('bad',"emit('error')"),Fd('bad','no handler → throw')], err:[Fd('bad','none registered')]},
     note:"<b>The special case.</b> <code>'error'</code> is the one event EventEmitter treats specially: with no listener registered, it <b>throws the error</b> rather than quietly doing nothing."},
    {line:-1, phase:'idle', out:['before emit','listener A','listener B','after emit','⚠ Uncaught Error: boom','process exited (code 1)'], cols:{},
     note:"Nothing catches it, so it becomes an uncaught exception and the process dies. <b>This is why every stream, socket, child process and custom emitter needs an <code>'error'</code> listener</b> — and why <code>pipeline()</code> exists, since it wires error handling for a whole chain so you cannot miss one."},
    {line:-1, phase:'idle', out:['Fixed: jobs.on(\'error\', err => logger.error({ err }))'], cols:{err:[Fd('node','logger handler','registered')]},
     note:"With a handler attached, the same emit is just a log line. One more thing worth knowing: the default limit is <b>10 listeners per event</b>, and the <code>MaxListenersExceededWarning</code> you get past that is almost always a genuine leak — a listener added per request and never removed — not noise to silence with <code>setMaxListeners</code>."}
  ]}
],

{ key:'nonrepeatable', label:'Non-repeatable read (Read Committed)',
  phases:[

    {k:'t2',   label:'Transaction 2 (writer)', c:'aws'},
    {k:'data', label:'Committed table state',  c:'db'}
  ],
  takeaway:"Read Committed takes a <b>fresh snapshot per statement</b>, so the same query twice in one transaction can return different values. Repeatable Read pins one snapshot for the whole transaction.",
  code:[
    `<span class="cm">-- T1                          -- T2</span>`,
    `BEGIN;  <span class="cm">-- READ COMMITTED</span>`,
    `SELECT balance FROM acct`,
    `  WHERE id = 1;    <span class="cm">-- 500</span>`,
    `                                <span class="cm">-- BEGIN;</span>`,
    `                                <span class="cm">-- UPDATE acct SET balance = 900</span>`,
    `                                <span class="cm">--   WHERE id = 1;</span>`,
    `                                <span class="cm">-- COMMIT;</span>`,
    `SELECT balance FROM acct`,
    `  WHERE id = 1;    <span class="cm">-- 900 (!)</span>`,
    `COMMIT;`
  ],
  steps:[
    {line:1, phase:'t1', out:['T1: BEGIN (READ COMMITTED)'], cols:{t1:[Fd('stack','snapshot: per statement')], data:[Fd('db','acct(1).balance = 500')]},
     note:"T1 opens at <b>Read Committed</b> — the default in Postgres, MySQL and most engines. Note what this level promises: no dirty reads. It promises nothing about repeated reads."},
    {line:2, phase:'t1', out:['T1: BEGIN','T1 reads balance → 500'], cols:{t1:[Fd('stack','read balance = 500')], data:[Fd('db','acct(1).balance = 500')]},
     note:"First read returns 500. T1 might now branch on that value — 'the customer can afford this'."},
    {line:5, phase:'t2', out:['T1: BEGIN','T1 reads balance → 500','T2: UPDATE balance = 900'], cols:{t1:[Fd('stack','read balance = 500')], t2:[Fd('aws','UPDATE balance = 900','uncommitted')], data:[Fd('db','acct(1).balance = 500','+ uncommitted version')]},
     note:"T2 updates the same row. Under MVCC this writes a <b>new row version</b>; the old one is still visible to everyone else. T1 sees nothing yet — that would be a dirty read, which this level does prevent."},
    {line:7, phase:'commit', out:['T1: BEGIN','T1 reads balance → 500','T2: UPDATE balance = 900','T2: COMMIT'], cols:{t1:[Fd('stack','read balance = 500')], t2:[Fd('node','COMMIT','done')], data:[Fd('db','acct(1).balance = 900','committed')]},
     note:"T2 commits. The new version is now visible to any snapshot taken from this moment on."},
    {line:8, phase:'bad', out:['T1: BEGIN','T1 reads balance → 500','T2: UPDATE balance = 900','T2: COMMIT','T1 reads balance → 900 ⚠'], cols:{t1:[Fd('bad','read balance = 900','same query, different answer')], data:[Fd('db','acct(1).balance = 900')]},
     note:"<b>Non-repeatable read.</b> T1 ran the identical query and got a different answer, because Read Committed takes a <b>fresh snapshot for every statement</b>. Any logic T1 built on the first value is now operating on stale assumptions."},
    {line:-1, phase:'commit', out:['Fix A: BEGIN ISOLATION LEVEL REPEATABLE READ','Fix B: SELECT … FOR UPDATE','Fix C: make the write atomic'], cols:{t1:[Fd('node','one snapshot per transaction')]},
     note:"<b>Three fixes, in increasing order of preference.</b> <b>A)</b> Repeatable Read pins one snapshot for the whole transaction — both reads return 500. <b>B)</b> <code>SELECT … FOR UPDATE</code> locks the row so T2 blocks. <b>C)</b> Best of all, avoid read-modify-write entirely: <code>UPDATE acct SET balance = balance - 100 WHERE id = 1 AND balance &gt;= 100</code> is atomic and needs no elevated isolation."}
  ]},

  ],
  takeaway:"Two transactions can each read a set, each make an <i>individually valid</i> decision, and together break an invariant — with <b>no row conflict</b> for snapshot isolation to detect. Only Serializable catches it.",
  code:[
    `<span class="cm">-- invariant: at least one doctor must stay on call</span>`,
    `<span class="cm">-- both run at REPEATABLE READ, concurrently</span>`,
    ``,
    `<span class="cm">-- T1 (Alice)                  -- T2 (Bob)</span>`,
    `BEGIN;                          <span class="cm">-- BEGIN;</span>`,
    `SELECT count(*) FROM doctors`,
    `  WHERE on_call;   <span class="cm">-- 2</span>       <span class="cm">-- SELECT count(*) … -- 2</span>`,
    `UPDATE doctors SET on_call=false`,
    `  WHERE id = 1;                 <span class="cm">-- UPDATE … WHERE id = 2;</span>`,
    `COMMIT;                         <span class="cm">-- COMMIT;</span>`
  ],
  steps:[
    {line:4, phase:'t1', out:['invariant: count(on_call) >= 1'], cols:{t1:[Fd('stack','BEGIN (repeatable read)')], t2:[Fd('aws','BEGIN (repeatable read)')], data:[Fd('db','Alice on_call = true'),Fd('db','Bob on_call = true')]},
     note:"Both transactions start at <b>Repeatable Read</b> — snapshot isolation. Each will see a consistent snapshot for its whole lifetime, which feels like it should be enough."},
    {line:5, phase:'t1', out:['invariant: count(on_call) >= 1','T1 counts on_call → 2'], cols:{t1:[Fd('stack','count = 2 → safe to leave')], t2:[Fd('aws','BEGIN')], data:[Fd('db','Alice = true'),Fd('db','Bob = true')]},
     note:"T1 checks the invariant: two doctors on call, so it is safe for Alice to go off call. <b>This reasoning is correct given what T1 can see.</b>"},
    {line:6, phase:'t2', out:['invariant: count(on_call) >= 1','T1 counts on_call → 2','T2 counts on_call → 2'], cols:{t1:[Fd('stack','count = 2')], t2:[Fd('aws','count = 2 → safe to leave')], data:[Fd('db','Alice = true'),Fd('db','Bob = true')]},
     note:"T2 runs the same check against its own snapshot and reaches the same conclusion. Both are individually right; neither can see the other's intention."},
    {line:7, phase:'t1', out:['invariant: count(on_call) >= 1','T1 counts → 2','T2 counts → 2','T1: UPDATE Alice off call'], cols:{t1:[Fd('stack','UPDATE Alice → false')], t2:[Fd('aws','count = 2')], data:[Fd('db','Alice = true','+ uncommitted change'),Fd('db','Bob = true')]},
     note:"T1 takes Alice off call. Note it writes <b>row 1</b>."},
    {line:8, phase:'t2', out:['invariant: count(on_call) >= 1','T1 counts → 2','T2 counts → 2','T1: UPDATE Alice off call','T2: UPDATE Bob off call'], cols:{t1:[Fd('stack','UPDATE Alice')], t2:[Fd('aws','UPDATE Bob → false')], data:[Fd('db','Alice','uncommitted'),Fd('db','Bob','uncommitted')]},
     note:"T2 takes Bob off call — writing <b>row 2</b>. <b>The two transactions wrote different rows</b>, so there is no write-write conflict for the engine to detect."},
    {line:9, phase:'bad', out:['invariant: count(on_call) >= 1','T1: COMMIT ✓','T2: COMMIT ✓','⚠ count(on_call) = 0 — invariant violated'], cols:{t1:[Fd('node','COMMIT ok')], t2:[Fd('node','COMMIT ok')], data:[Fd('bad','Alice = false'),Fd('bad','Bob = false'),Fd('bad','ZERO doctors on call')]},
     note:"<b>Both commit successfully and the invariant is broken.</b> Snapshot isolation guarantees each transaction saw a consistent view — it does <i>not</i> guarantee the combined result is one a serial execution could produce. That gap is write skew."},
    {line:-1, phase:'commit', out:['Fix A: SERIALIZABLE → one transaction gets 40001, retry','Fix B: SELECT … FOR UPDATE on the whole set','Fix C: materialise the invariant as a constraint'], cols:{t1:[Fd('node','SERIALIZABLE')], t2:[Fd('bad','serialization_failure 40001','application retries')]},
     note:"<b>A)</b> Serializable (Postgres SSI tracks the <i>predicate</i> each transaction read, sees the dependency cycle, and aborts one with <code>40001</code> — your code must retry). <b>B)</b> Lock the rows you read, not just the ones you write: <code>SELECT … WHERE on_call FOR UPDATE</code>. <b>C)</b> Best where possible — turn the invariant into something the database enforces, e.g. a counter row with a CHECK, so it cannot be violated by any interleaving."}
  ]},

{ key:'deadlock', label:'Deadlock from inconsistent lock order',
  phases:[
    {k:'t1',     label:'T1 acts',   c:'accent'},
    {k:'t2',     label:'T2 acts',   c:'aws'},
    {k:'bad',    label:'Deadlock',  c:'tick'},
    {k:'commit', label:'Resolved',  c:'node'}
  ],
  cols:[
    {k:'t1',    label:'Transaction 1', c:'accent'},
    {k:'t2',    label:'Transaction 2', c:'aws'},
    {k:'locks', label:'Row locks held', c:'db'}
  ],
  takeaway:"Deadlock is two transactions acquiring the same locks in <b>opposite order</b>. Fix it by always locking rows in a consistent order — <code>ORDER BY id FOR UPDATE</code> — plus short transactions and a retry.",
  code:[
    `<span class="cm">-- T1: transfer 100 from account 1 → 2</span>`,
    `BEGIN;`,
    `UPDATE acct SET bal = bal-100 WHERE id = 1;   <span class="cm">-- locks row 1</span>`,
    `UPDATE acct SET bal = bal+100 WHERE id = 2;   <span class="cm">-- wants row 2</span>`,
    `COMMIT;`,
    ``,
    `<span class="cm">-- T2: transfer 50 from account 2 → 1  (opposite order!)</span>`,
    `BEGIN;`,
    `UPDATE acct SET bal = bal-50  WHERE id = 2;   <span class="cm">-- locks row 2</span>`,
    `UPDATE acct SET bal = bal+50  WHERE id = 1;   <span class="cm">-- wants row 1</span>`,
    `COMMIT;`
  ],
  steps:[
    {line:2, phase:'t1', out:['T1: BEGIN'], cols:{t1:[Fd('stack','UPDATE row 1')], locks:[Fd('db','row 1 → held by T1')]},
     note:"T1 updates account 1. The <code>UPDATE</code> itself takes an exclusive <b>row lock</b>, held until the transaction ends — no explicit <code>FOR UPDATE</code> needed."},
    {line:8, phase:'t2', out:['T1: BEGIN','T2: BEGIN'], cols:{t1:[Fd('stack','holds row 1')], t2:[Fd('aws','UPDATE row 2')], locks:[Fd('db','row 1 → T1'),Fd('db','row 2 → T2')]},
     note:"T2 updates account 2 and takes that row's lock. So far no contention at all — the two transactions are touching different rows."},
    {line:3, phase:'t1', out:['T1: BEGIN','T2: BEGIN','T1 blocked waiting for row 2'], cols:{t1:[Fd('bad','WAITING for row 2','holds row 1')], t2:[Fd('aws','holds row 2')], locks:[Fd('db','row 1 → T1'),Fd('db','row 2 → T2')]},
     note:"T1 now wants row 2 — held by T2. T1 blocks. On its own this is ordinary lock waiting and would resolve as soon as T2 commits."},
    {line:9, phase:'bad', out:['T1: BEGIN','T2: BEGIN','T1 blocked waiting for row 2','T2 blocked waiting for row 1'], cols:{t1:[Fd('bad','WAITING for row 2')], t2:[Fd('bad','WAITING for row 1')], locks:[Fd('bad','row 1 → T1 (T2 waiting)'),Fd('bad','row 2 → T2 (T1 waiting)')]},
     note:"<b>The cycle closes.</b> T2 wants row 1, which T1 holds while waiting for row 2. Neither can proceed and neither will ever release — this is a genuine deadlock, not slow progress."},
    {line:-1, phase:'bad', out:['T1: BEGIN','T2: BEGIN','deadlock detected','ERROR 40P01: deadlock detected — T2 aborted'], cols:{t1:[Fd('node','proceeds','acquired row 2')], t2:[Fd('bad','ABORTED 40P01','rolled back')], locks:[Fd('db','row 1 → T1'),Fd('db','row 2 → T1')]},
     note:"The deadlock detector (Postgres checks after <code>deadlock_timeout</code>, default 1s) finds the cycle and <b>kills one transaction as the victim</b>. The survivor proceeds. Note the cost: a full second of both transactions blocked before detection."},
    {line:-1, phase:'commit', out:['Fix: always lock in a consistent order'], cols:{t1:[Fd('node','ORDER BY id → locks 1 then 2')], t2:[Fd('node','ORDER BY id → locks 1 then 2')], locks:[Fd('db','no cycle possible')]},
     note:"<b>The fix is ordering, not locking less.</b> If both transactions always take rows in ascending id order, the second one simply waits for the first — no cycle can form. In code: <code>SELECT * FROM acct WHERE id = ANY($1) ORDER BY id FOR UPDATE</code> before doing the updates."},
    {line:-1, phase:'commit', out:['Fix: consistent order','+ short transactions','+ lock_timeout','+ retry on 40P01'], cols:{},
     note:"<b>The full defence:</b> consistent lock ordering; keep transactions short so lock windows are small; set <code>lock_timeout</code> so a pathological wait fails fast rather than piling up connections; and <b>retry on <code>40P01</code></b> with backoff — under real concurrency, deadlocks are an expected outcome to handle, not necessarily a bug to eliminate."}
  ]},

     note:"No usable index, so every row is read and almost all are discarded. <b><code>Rows Removed by Filter</code> is the signal</b>: reading five million rows to return twelve thousand."},
    {line:3, phase:'idx', out:['no index yet','index created'], cols:{plan:[Fd('db','Index Scan using idx_t')], work:[Fd('macro','~12,000 index entries'),Fd('macro','+ heap fetches for SELECT *')], res:[Fd('node','18 ms')]},

     note:"<b>The index is silently defeated.</b> The index stores <code>email</code>, but the predicate asks about <code>lower(email)</code> — a different value the planner cannot match. Same for <code>date(created_at)</code> and <code>id::text</code>. Fix: <code>CREATE INDEX ON orders (lower(email))</code>, or store a normalised column."},

     note:"<b>Order of investigation:</b> 1) compare estimated vs actual rows — if they diverge, run <code>ANALYZE</code>, because every plan choice above that node is based on a wrong number. 2) Look for <code>Rows Removed by Filter</code> and high <code>loops=</code>. 3) Only then add an index — and check whether a function, a cast, or a leading wildcard is stopping the one you already have from being used."}

{ key:'nplus1', label:'N+1 vs DataLoader',

  cols:[{k:'stack',label:'Resolver calls',c:'fw'},{k:'db',label:'Database queries',c:'db'},{k:'macro',label:'DataLoader batch',c:'js'}],
  takeaway:"DataLoader defers every <code>.load(id)</code> made in the same tick, then issues <b>one</b> query. Same per-item code style, 2 queries instead of 51.",
  code:[

    ``,
    `Query.orders  = () =&gt; db.orders.findMany({ take: 50 });`,
    ``,
    `<span class="cm">// ❌ N+1: one query per order</span>`,
    `Order.customer = (o) =&gt; db.users.find(o.customerId);`,
    ``,
    `<span class="cm">// ✅ batched: same shape, one query</span>`,
    `Order.customer = (o, _a, ctx) =&gt;`,
    `  ctx.loaders.userById.load(o.customerId);`
  ],

    {line:2, phase:'run', out:['GraphQL query received'], cols:{stack:[Fd('fw','Query.orders')], db:[Fd('db','SELECT * FROM orders LIMIT 50','query 1')]},

     note:"<b>Naive version.</b> Field resolvers run once per parent object, so <code>customer</code> fires 50 times — 51 round trips total. Invisible with 5 rows in dev; fatal at 5,000."},

     note:"<b>With DataLoader.</b> Each resolver calls <code>load(id)</code>, which returns a promise and <b>defers</b>. Nothing has hit the database yet."},
    {line:8, phase:'poll', out:['GraphQL query received (batched version)'], cols:{db:[Fd('db','SELECT * FROM orders LIMIT 50','query 1'),Fd('db','SELECT … users WHERE id IN (1,2,…,50)','query 2')], macro:[Fd('macro','batchFn([1..50]) → 1 query','flushed')]},
     note:"At the end of the tick, DataLoader flushes: one batch function call with all 50 keys → <b>a single <code>WHERE id IN (…)</code> query</b>."},

  takeaway:"Init runs once per environment; module scope survives to the next invocation. That's the caching opportunity — and the state-leak risk.",
  code:[
    `<span class="cm">// module scope — runs ONCE per environment</span>`,
    `const ddb = new DynamoDBClient({});`,
    `const config = await loadConfig();`,
    `let cachedToken = null;`,

{ key:'throttle', label:'Concurrency, scaling & throttling',
  phases:[{k:'invoke',label:'Normal',c:'accent'},{k:'cold',label:'Scaling out',c:'aws'},{k:'err',label:'Throttled',c:'tick'},{k:'idle',label:'Recovered',c:'sub'}],
