  lede:"Throwing is easy; making failures diagnosable across async boundaries is the skill being tested.",
  say:"I subclass <code>Error</code> so failures carry a machine-readable code plus context, chain the original with the <code>cause</code> option so the root cause isn't lost, and separate operational errors — a timeout, a 404, invalid input — from programmer errors, which should crash the process and be restarted. Everything crossing an async boundary needs a try/catch or a <code>.catch</code>, and every log line needs a request ID to be worth anything.",
  steps:[
    "Always <b>throw <code>Error</code> instances</b>, never strings or plain objects — only Errors carry a stack.",
    "<b>Subclass Error</b> to add a stable machine-readable <code>code</code> and structured context. Set <code>this.name</code> and call <code>Error.captureStackTrace(this, MyError)</code> in Node to drop the constructor frame.",
    "<b>Error cause</b> (ES2022): <code>throw new AppError('failed to load user', { cause: err })</code> preserves the original. Node's <code>console.error</code> and <code>util.inspect</code> print the whole chain.",
    "Distinguish <b>operational</b> errors (expected: timeout, 404, validation, downstream 503 — handle and respond) from <b>programmer</b> errors (bugs: undefined is not a function — let the process crash and restart).",
    "<code>try/catch</code> around <code>await</code> works exactly like sync code. But a promise created and not awaited inside a <code>try</code> escapes it — the frame is already gone when it rejects.",
    "In Express 4, async route handlers that throw are <b>not</b> caught by the error middleware — you need a wrapper or <code>express-async-errors</code>. Express 5 handles it natively.",
    "Never swallow: <code>catch(e){}</code> is how outages become mysteries. Log with context or re-throw wrapped.",
    "Set a <b>top-level handler</b> for <code>unhandledRejection</code> and <code>uncaughtException</code> that logs and then exits — the process state after an uncaught throw is unknown."
  ],
  code:`class AppError extends Error {
  constructor(message, { code, status = 500, cause, context } = {}){
    super(message, { cause });                <span class="cm">// ES2022 cause chaining</span>
    this.name = this.constructor.name;
    this.code = code;                         <span class="cm">// stable, machine-readable</span>
    this.status = status;
    this.context = context;
    this.isOperational = true;
    Error.captureStackTrace?.(this, this.constructor);
  }
}

try {
  await db.getUser(id);
} catch (err) {
  throw new AppError('Could not load user profile', {
    code: 'USER_LOAD_FAILED', status: 502, cause: err, context: { id, requestId: req.id }
  });
}

<span class="cm">// async route wrapper (Express 4)</span>
const wrap = fn =&gt; (req, res, next) =&gt; Promise.resolve(fn(req, res, next)).catch(next);
app.get('/users/:id', wrap(async (req, res) =&gt; { res.json(await getUser(req.params.id)); }));`,
  traps:[
    "<code>throw 'something'</code> gives you no stack. Some libraries still do this — normalise unknown throws with <code>err instanceof Error ? err : new Error(String(err))</code>.",
    "Extending built-ins requires the class-syntax (or <code>Object.setPrototypeOf</code> after <code>super</code> when targeting ES5) or <code>instanceof</code> breaks.",
    "Logging <code>err.message</code> only loses the stack and the cause chain. Log the error object with a structured logger (pino/winston) that serialises it.",
    "A <code>finally</code> that returns or throws overrides the original outcome — a classic way to lose an error.",
    "Catching and re-throwing the <i>same</i> error adds nothing but noise; either add context via <code>cause</code>, or don't catch."
  ],
  terms:[
    {term:"Operational vs programmer errors", desc:"Handle the first, crash on the second.", detail:"Operational: the network failed, the user sent bad input, a dependency is down — expected, recoverable, part of your API contract. Programmer: a bug in your code — the process state is now suspect and the only safe action is to log, exit, and let the supervisor restart cleanly.", code:`process.on('uncaughtException', (err) =&gt; {\n  logger.fatal({ err }, 'uncaught — exiting');\n  process.exit(1);           <span class="cm">// let k8s/PM2 restart</span>\n});\nprocess.on('unhandledRejection', (err) =&gt; { throw err; });`},
    {term:"Error.cause", desc:"Standard way to wrap an error without losing the original.", detail:"Before ES2022 everyone invented their own <code>.originalError</code>. Now it's standard and tooling understands it — Node prints the full chain with '[cause]:' sections.", code:`try { await s3.getObject(p); }\ncatch (e) { throw new Error(\`config load failed: \${key}\`, { cause: e }); }`},
    {term:"AggregateError", desc:"Multiple errors as one, used by Promise.any.", detail:"Also useful for your own batch operations: collect per-item failures and throw one AggregateError whose <code>.errors</code> array holds them all, rather than only the first.", code:`const errs = results.filter(r =&gt; r.status === 'rejected').map(r =&gt; r.reason);\nif (errs.length) throw new AggregateError(errs, \`\${errs.length} items failed\`);`}
  ],
  cards:[
    {q:"Why subclass Error rather than throwing objects?", a:"Only Error instances carry a stack trace and work with <code>instanceof</code>, logger serialisers, and <code>cause</code> chaining. A subclass lets you attach a stable <code>code</code> and structured context that callers can branch on without string-matching messages."},
    {q:"What is <code>Error.cause</code> for?", a:"Wrapping a low-level error in a higher-level one without losing the original: <code>new Error('msg', { cause: err })</code>. Node prints the whole chain, so you keep both the business context and the root cause."},
    {q:"Operational vs programmer error — what do you do with each?", a:"Operational (timeout, 404, validation, downstream failure): handle it, map to a response, retry if appropriate. Programmer (a genuine bug): log with full context and exit, letting the orchestrator restart — the process state is no longer trustworthy."},
    {q:"Why do async errors escape Express 4's error middleware?", a:"Express 4 only catches synchronous throws. An async handler returns a rejected promise that nothing observes. Fix with a wrapper that <code>.catch(next)</code>, <code>express-async-errors</code>, or Express 5."}
  ],
  quiz:[
    {q:"Does the catch fire?", code:`try {\n  doAsync();            <span class="cm">// async fn that rejects; NOT awaited</span>\n} catch (e) {\n  console.log('caught');\n}`,
     options:["No — unhandled rejection instead","Yes","Only in strict mode","Only in Node"], answer:0,
     why:"Without <code>await</code>, the function returns a promise immediately and the try block exits. When the promise later rejects there is no handler attached, so it becomes an unhandled rejection."}
  ],
  cheat:[
    "Throw <b>Error subclasses</b> with <code>name</code>, stable <code>code</code>, <code>status</code>, structured context.",
    "Chain root causes with <code>new Error(msg, { cause })</code> (ES2022).",
    "<b>Operational</b> → handle & respond. <b>Programmer</b> → log + <code>process.exit(1)</code>, let the supervisor restart.",
    "Every await needs a try/catch or the promise a <code>.catch</code>. Unawaited promise inside try ⇒ escapes it.",
    "Express 4: wrap async handlers (<code>Promise.resolve(fn()).catch(next)</code>). Express 5: native.",
    "Never <code>catch(e){}</code>. Log the error <i>object</i>, with a request ID.",
    "<code>AggregateError.errors</code> for batch/any failures."
  ]
},

{ id:'collections', group:'Modern JavaScript', title:'Map, Set, WeakMap & typed arrays', animate:'heap',
  lede:"Objects were the only container for years; the ES6 collections fix real problems objects have.",
  say:"Map keeps insertion order, allows any key type including objects, has O(1) size, and doesn't inherit prototype keys — so it's the right choice for a dynamic dictionary, especially with untrusted keys. Set gives O(1) membership and deduping. WeakMap/WeakSet hold keys weakly, which makes them the correct structure for per-object metadata and caches you don't want to leak.",
  steps:[
    "<b>Map</b>: any value as a key (objects included), preserves insertion order, <code>.size</code> in O(1), iterable directly. Objects coerce keys to strings and inherit from <code>Object.prototype</code>.",
    "Use a <b>Map</b> whenever keys are dynamic, non-string, or come from user input; use a plain object for fixed, known-shape records.",
    "<b>Set</b>: unique values with O(1) <code>has</code>. <code>[...new Set(arr)]</code> is the idiomatic dedupe. Uses SameValueZero, so <code>NaN</code> is found (unlike <code>indexOf</code>).",
    "<b>WeakMap/WeakSet</b>: keys must be objects, held weakly, not enumerable, no <code>.size</code>. Perfect for attaching private data or caches keyed on an object's lifetime.",
    "<b>WeakRef</b> and <b>FinalizationRegistry</b> exist for advanced caching, but the spec explicitly warns their timing is unpredictable — rarely the right tool.",
    "<b>Typed arrays</b> (<code>Uint8Array</code>, <code>Float64Array</code>…) are fixed-type views over an <code>ArrayBuffer</code> — how you handle binary protocols, image data and <code>SharedArrayBuffer</code> in workers.",
    "In Node, <code>Buffer</code> is a <code>Uint8Array</code> subclass, so anything accepting a typed array accepts a Buffer.",
    "Iteration order: Map/Set are insertion order. Plain objects are integer-like keys ascending first, then string keys in insertion order, then symbols — which is why <code>{2:'a',1:'b'}</code> iterates 1 before 2."
  ],
  code:`const m = new Map();
m.set({ id: 1 }, 'object key');   <span class="cm">// impossible with a plain object</span>
m.set(NaN, 'nan works too');
m.size;                            <span class="cm">// 2, O(1)</span>

const seen = new Set([1, 2, 2, NaN, NaN]);
seen.size;                         <span class="cm">// 3 — SameValueZero dedupes NaN</span>

<span class="cm">// per-object private metadata that can't leak</span>
const meta = new WeakMap();
function track(node){ meta.set(node, { at: Date.now() }); }
<span class="cm">// when the node is GC'd, the entry disappears automatically</span>

const buf = new ArrayBuffer(8);
new Float64Array(buf)[0] = 1.5;
new Uint8Array(buf);               <span class="cm">// same bytes, different view</span>`,
  traps:[
    "<code>JSON.stringify(map)</code> gives <code>'{}'</code> — Maps and Sets aren't JSON-serialisable. Convert with <code>Object.fromEntries(map)</code> or <code>[...set]</code>.",
    "Map keys use SameValueZero: two structurally identical objects are different keys. <code>m.set({a:1},'x'); m.get({a:1})</code> is <code>undefined</code>.",
    "A plain object used as a dictionary with user-controlled keys can collide with inherited names (<code>constructor</code>, <code>__proto__</code>). Use <code>Map</code> or <code>Object.create(null)</code>.",
    "<code>Set</code> has no <code>map</code>/<code>filter</code> — spread to an array first (ES2025 adds set-theory methods like <code>union</code>/<code>intersection</code>, still rolling out).",
    "Typed array views over the same buffer alias each other — writing through one changes the other."
  ],
  table:{title:'Map vs plain object', head:['','Map','Object'], rows:[
    ['Key types','Any value','String / Symbol only'],
    ['Order','Insertion','Integer keys first, then insertion'],
    ['Size','<code>.size</code>, O(1)','<code>Object.keys().length</code>, O(n)'],
    ['Inherited keys','None','From <code>Object.prototype</code>'],
    ['Iterate','Directly iterable','Needs <code>Object.entries</code>'],
    ['JSON','Not serialisable','Native'],
    ['Best for','Dynamic / untrusted keys','Fixed-shape records']
  ]},
  cards:[
    {q:"When should you use a Map instead of an object?", a:"When keys are dynamic, non-string, or attacker-controlled; when you need insertion order guarantees; when you add/remove frequently; or when you need O(1) size. Objects are better for fixed-shape records and when you need JSON serialisation."},
    {q:"What makes WeakMap different, and what is it for?", a:"Keys must be objects and are held weakly — an entry doesn't prevent its key from being collected. It's not enumerable and has no size. Use it for per-object metadata, private state, and caches that should die with their key."},
    {q:"Why does <code>[...new Set(arr)]</code> handle NaN correctly?", a:"Set uses SameValueZero, under which <code>NaN</code> equals <code>NaN</code>. <code>indexOf</code> uses strict equality, where it doesn't — which is why <code>[NaN].indexOf(NaN)</code> is <code>-1</code>."}
  ],
  quiz:[
    {q:"What is the size?", code:`const m = new Map();\nm.set({}, 1);\nm.set({}, 2);\nconsole.log(m.size);`,
     options:["2 — different object identities","1 — same shape","0","TypeError"], answer:0,
     why:"Map keys compare by identity (SameValueZero). Two separate object literals are two distinct keys even though they look identical."}
  ],
  cheat:[
    "<b>Map</b>: any key, insertion order, O(1) size, no inherited keys, iterable. Use for dynamic/untrusted keys.",
    "<b>Set</b>: unique, O(1) has, SameValueZero (NaN dedupes). <code>[...new Set(a)]</code> to dedupe.",
    "<b>WeakMap/WeakSet</b>: object keys held weakly, not enumerable, no size → metadata & self-cleaning caches.",
    "Neither Map nor Set is JSON-serialisable → <code>Object.fromEntries</code> / spread.",
    "Typed arrays = typed views over an ArrayBuffer; Node <code>Buffer extends Uint8Array</code>.",
    "Object key order: integer-like ascending, then strings by insertion, then symbols."
  ]
},

{ id:'meta', group:'Modern JavaScript', title:'Symbols, Proxy & Reflect', animate:'delegate',
  lede:"The metaprogramming layer — how libraries implement observability, validation and virtual objects.",
  say:"Symbols are unique, non-colliding property keys; well-known symbols like <code>Symbol.iterator</code> and <code>Symbol.toPrimitive</code> are the hooks that let your objects participate in language protocols. A Proxy intercepts fundamental operations — get, set, has, deleteProperty — and Reflect provides the default implementations to forward to. That's the machinery behind Vue's reactivity, ORM lazy loading and mocking libraries.",
  steps:[
    "<code>Symbol('desc')</code> creates a <b>unique</b> value — two symbols with the same description are never equal. Used as a property key it can never collide with another library's key.",
    "Symbol-keyed properties are skipped by <code>for…in</code>, <code>Object.keys</code> and <code>JSON.stringify</code>, but are copied by spread and found by <code>Object.getOwnPropertySymbols</code>. Not private, just out of the way.",
    "<b>Well-known symbols</b> are protocol hooks: <code>Symbol.iterator</code>, <code>Symbol.asyncIterator</code>, <code>Symbol.toPrimitive</code>, <code>Symbol.hasInstance</code>, <code>Symbol.toStringTag</code>.",
    "<code>Symbol.for('key')</code> uses a cross-realm global registry — the same symbol across iframes/workers. Registered symbols are the exception <code>#private</code>-style rules don't apply to.",
    "A <b>Proxy</b> wraps a target and intercepts operations via <b>traps</b>: <code>get</code>, <code>set</code>, <code>has</code>, <code>deleteProperty</code>, <code>ownKeys</code>, <code>apply</code>, <code>construct</code> and more.",
    "<b>Reflect</b> mirrors those operations as plain functions (<code>Reflect.get(t, k, r)</code>) — the correct default behaviour to forward to inside a trap, and it preserves the receiver so getters/setters resolve correctly.",
    "Real uses: Vue 3 reactivity, ORM lazy relation loading, API clients that turn any property into an HTTP path, validation wrappers, test spies, negative array indices.",
    "Proxies are <b>not free</b> — every intercepted operation is a function call. Don't proxy hot-path data structures, and be aware some traps have invariants the engine enforces (you can't report a non-configurable own property as absent)."
  ],
  code:`const CACHE = Symbol('cache');           <span class="cm">// collision-proof key</span>
obj[CACHE] = { hits: 0 };
Object.keys(obj);                         <span class="cm">// CACHE not listed</span>

<span class="cm">// validation proxy</span>
const user = new Proxy({}, {
  set(target, key, value, recv){
    if (key === 'age' &amp;&amp; typeof value !== 'number')
      throw new TypeError('age must be a number');
    return Reflect.set(target, key, value, recv);   <span class="cm">// default behaviour</span>
  },
  get(target, key, recv){
    if (!(key in target)) throw new ReferenceError(\`no property \${String(key)}\`);
    return Reflect.get(target, key, recv);
  }
});

<span class="cm">// make a class respond to instanceof however you like</span>
class Even { static [Symbol.hasInstance](n){ return n % 2 === 0; } }
4 instanceof Even;   <span class="cm">// true</span>`,
  traps:[
    "Symbols are <b>not private</b> — <code>Object.getOwnPropertySymbols</code> reveals them. Use <code>#private</code> for real privacy.",
    "Forgetting to forward the <code>receiver</code> in <code>Reflect.get/set</code> breaks getters and setters on a prototype chain.",
    "Proxy traps must respect invariants; violating them throws a TypeError at runtime, not at definition.",
    "<code>proxy === target</code> is false. Identity-based lookups (a Map keyed on the target) will miss.",
    "Proxying a class instance with private fields breaks: <code>#field</code> access goes through the proxy and the brand check fails."
  ],
  terms:[
    {term:"Symbol.toPrimitive & toStringTag", desc:"Control how your object converts and how it identifies itself.", detail:"<code>toStringTag</code> changes <code>Object.prototype.toString.call(x)</code>, which is how <code>Array.isArray</code>-style type checks and many logging libraries identify built-ins.", code:`class Money {\n  constructor(c){ this.cents = c; }\n  get [Symbol.toStringTag](){ return 'Money'; }\n  [Symbol.toPrimitive](hint){\n    return hint === 'string' ? \`$\${this.cents/100}\` : this.cents;\n  }\n}\nString(new Money(500));                       <span class="cm">// '$5'</span>\nObject.prototype.toString.call(new Money(1)); <span class="cm">// '[object Money]'</span>`},
    {term:"Reactivity via Proxy", desc:"How Vue 3 (and signals libraries) track dependencies.", detail:"The <code>get</code> trap records which effect is currently running as a dependent of that key; the <code>set</code> trap re-runs those effects. No compilation step needed — the language does the interception.", code:`function reactive(obj, onRead, onWrite){\n  return new Proxy(obj, {\n    get(t, k, r){ onRead(k); return Reflect.get(t, k, r); },\n    set(t, k, v, r){ const ok = Reflect.set(t, k, v, r); onWrite(k); return ok; }\n  });\n}`}
  ],
  cards:[
    {q:"Are symbol-keyed properties private?", a:"No. They're skipped by <code>for…in</code>, <code>Object.keys</code> and JSON, but <code>Object.getOwnPropertySymbols</code> and <code>Reflect.ownKeys</code> expose them. They prevent <i>collisions</i>, not access. Use <code>#private</code> for real privacy."},
    {q:"Why use Reflect inside a Proxy trap?", a:"Reflect methods are the exact default behaviour of each trap, with the same signature, and they take a <code>receiver</code> so getters/setters resolve against the proxy rather than the raw target. They also return booleans instead of throwing, matching what traps must return."},
    {q:"Name two real-world uses of Proxy.", a:"Reactivity systems (Vue 3 tracks reads in the <code>get</code> trap and triggers effects in <code>set</code>); ORM lazy loading and API clients that translate property access into calls; also validation, spies/mocks, and negative array indexing."}
  ],
  quiz:[
    {q:"What is logged?", code:`const s1 = Symbol('a'), s2 = Symbol('a');\nconst o = { [s1]: 1 };\nconsole.log(s1 === s2, Object.keys(o).length, JSON.stringify(o));`,
     options:["false 0 '{}'","true 1 '{\"a\":1}'","false 1 '{}'","true 0 '{}'"], answer:0,
     why:"Symbols are always unique regardless of description. Symbol keys are excluded from <code>Object.keys</code> and from JSON serialisation."}
  ],
  cheat:[
    "<code>Symbol()</code> = unique key, collision-proof; <b>not private</b> (<code>getOwnPropertySymbols</code>). <code>Symbol.for</code> = global registry.",
    "Well-known: <code>iterator</code>, <code>asyncIterator</code>, <code>toPrimitive</code>, <code>hasInstance</code>, <code>toStringTag</code>.",
    "Proxy traps: get/set/has/deleteProperty/ownKeys/apply/construct.",
    "<b>Always forward with Reflect</b> (+ receiver) for correct getter/setter semantics.",
    "Uses: Vue reactivity, ORM lazy load, validation, mocks, virtual APIs.",
    "Costs: per-op overhead, <code>proxy !== target</code>, breaks <code>#private</code> brand checks."
  ]
},

{ id:'modules-js', group:'Modern JavaScript', title:'ES modules: bindings, cycles & tree-shaking', animate:'moduleflow',
  lede:"ESM isn't just new syntax — the semantics of live bindings and static structure are genuinely different from require().",
  say:"ESM is statically analysable: imports are hoisted and resolved before evaluation, which is what makes tree-shaking and cycle handling possible. Imports are <b>live bindings</b>, not copies — if the exporting module reassigns, importers see the new value. Modules are singletons per resolved specifier, always strict, and evaluated once.",
  steps:[
    "Loading has three phases: <b>construction</b> (resolve and parse every file, build the graph), <b>instantiation</b> (allocate exports and wire the bindings), <b>evaluation</b> (run the bodies, depth-first, once each).",
    "<code>import</code>/<code>export</code> are <b>static</b> — must be top-level, can't be conditional. That's what enables tree-shaking and pre-resolution of the graph.",
    "Imports are <b>live read-only bindings</b>, not value copies. If the exporter reassigns a <code>let</code>, importers immediately see the new value; importers cannot assign to it.",
    "Modules are <b>singletons</b> keyed by resolved URL/path — imported many times, evaluated once. Side effects run exactly once.",
    "Because bindings are wired before evaluation, <b>cycles</b> work as long as you don't <i>use</i> the imported value at module top level before the other side has evaluated — otherwise you hit the TDZ.",
    "<b>Tree-shaking</b> drops unused exports, but only for genuinely side-effect-free modules. <code>\"sideEffects\": false</code> in package.json is how you tell a bundler it's safe.",
    "<code>import()</code> is dynamic, returns a promise, and is the one way to load conditionally — the basis of code splitting.",
    "ESM is always strict mode, has <code>import.meta.url</code> instead of <code>__dirname</code>, and top-level <code>this</code> is <code>undefined</code> (not <code>module.exports</code>)."
  ],
  code:`<span class="cm">// counter.js</span>
export let count = 0;
export function inc(){ count++; }

<span class="cm">// main.js</span>
import { count, inc } from './counter.js';
console.log(count);   <span class="cm">// 0</span>
inc();
console.log(count);   <span class="cm">// 1 — live binding, not a copy</span>
<span class="cm">// count = 5;         → TypeError: Assignment to constant variable</span>

<span class="cm">// dynamic import — the only conditional form</span>
if (user.isAdmin) {
  const { AdminPanel } = await import('./admin-panel.js');
}

<span class="cm">// Node ESM has no __dirname:</span>
import { fileURLToPath } from 'node:url';
const __dirname = path.dirname(fileURLToPath(import.meta.url));`,
  traps:[
    "<code>export default</code> of a mutable binding exports the <b>value</b> at that moment, not a live binding — a real asymmetry with named exports.",
    "Mixing default and named exports makes tree-shaking and refactoring harder; many style guides ban default exports for that reason.",
    "In Node, ESM cannot be <code>require()</code>d from CJS in older versions (use dynamic <code>import()</code>); CJS <i>can</i> be imported from ESM but only the default export is guaranteed.",
    "Circular imports that read a value at module top level throw <code>ReferenceError: Cannot access 'x' before initialization</code> — the ESM cycle failure mode.",
    "Tree-shaking silently keeps everything if the module has (or is assumed to have) side effects — a common reason bundles don't shrink."
  ],
  terms:[
    {term:"Live bindings", desc:"Importers see the exporter's current value, not a snapshot.", detail:"This is the sharpest semantic difference from CommonJS, where <code>module.exports</code> gives you the value at require time. It's what allows hot-swapping module internals and makes cycles more tractable.", code:`<span class="cm">// CJS: a copy</span>\nlet c = 0;\nmodule.exports = { c };   <span class="cm">// snapshot — later c++ invisible</span>\n\n<span class="cm">// ESM: a live binding</span>\nexport let c = 0;         <span class="cm">// importers see every update</span>`},
    {term:"Dynamic import & code splitting", desc:"import() returns a promise for the module namespace.", detail:"Bundlers turn each dynamic import into a separate chunk fetched on demand — the standard way to keep initial bundles small. In Node it's also how you load ESM from CJS.", code:`const heavy = await import('./chart-library.js');\nheavy.render(el, data);`}
  ],
  cards:[
    {q:"What's a 'live binding' and why does it matter?", a:"An ESM import is a read-only reference to the exporter's variable, not a copy of its value. If the exporter reassigns it, every importer sees the new value immediately. CommonJS gives you a snapshot of <code>module.exports</code> at require time."},
    {q:"Why can ESM be tree-shaken but CommonJS generally can't?", a:"ESM imports/exports are static and top-level only, so a bundler can determine the full graph and which exports are unused without running the code. <code>require()</code> is a runtime function call with arbitrary arguments, so usage can't be proven statically."},
    {q:"How do ESM circular dependencies fail?", a:"Bindings are created before evaluation, so the import exists but may be uninitialised. If you <i>read</i> it at module top level before the other module has evaluated, you get <code>ReferenceError: Cannot access 'x' before initialization</code>. Using it inside a function called later is fine."}
  ],
  quiz:[
    {q:"What is logged in main.js?", code:`<span class="cm">// counter.js</span>\nexport let n = 1;\nexport const bump = () =&gt; n++;\n\n<span class="cm">// main.js</span>\nimport { n, bump } from './counter.js';\nbump();\nconsole.log(n);`,
     options:["2 — live binding","1 — imports are copies","undefined","TypeError"], answer:0,
     why:"ESM imports are live bindings into the exporting module's scope, so the mutation performed by <code>bump()</code> is visible to the importer."}
  ],
  cheat:[
    "3 phases: <b>construct</b> (parse graph) → <b>instantiate</b> (wire bindings) → <b>evaluate</b> (run once, depth-first).",
    "Imports = <b>live, read-only bindings</b>. CJS = value snapshot.",
    "Static & top-level only → tree-shaking + pre-resolved graph. <code>import()</code> for conditional/lazy.",
    "Modules are singletons per resolved specifier; always strict; <code>import.meta.url</code>, no <code>__dirname</code>.",
    "Cycles OK unless you <i>read</i> the import at top level too early → TDZ ReferenceError.",
    "<code>export default</code> of a <code>let</code> is <b>not</b> live — exports the value."
  ]
},

{ id:'delegation', group:'Modern JavaScript', title:'Event delegation, debounce & throttle', animate:'delegate',
  lede:"Three closely related patterns for controlling how often — and where — your code responds to events.",
  say:"Delegation means attaching one listener to a stable ancestor and using <code>event.target</code> to identify what was actually clicked; it works for dynamically added children and uses far less memory than per-row listeners. Debounce waits for silence and then fires once — search inputs. Throttle fires at most once per interval during continuous activity — scroll and resize.",
  steps:[
    "Events <b>bubble</b> from target up through ancestors (after a capture phase downward), which is what makes delegation possible.",
    "<b>Event delegation</b>: one listener on a parent, then <code>e.target.closest('.item')</code> to identify the real source.",
    "Delegation handles <b>dynamically added children</b> for free, since the listener lives on an ancestor that already exists.",
    "<b>Debounce</b> resets its timer on every call, so the function runs only once activity has stopped for N ms — search-as-you-type, autosave, resize-complete.",
    "<b>Throttle</b> guarantees at most one call per interval regardless of how many events arrive — scroll position, drag, mousemove, analytics sampling.",
    "The mental model: debounce waits for <b>silence</b>; throttle fires <b>periodically during noise</b>.",
    "Both are just closures over a timer id or a timestamp — no browser API needed, which is why they're a favourite 'implement this' question.",
    "Production versions add <code>leading</code>/<code>trailing</code> options and a <code>.cancel()</code> so a pending call can be dropped on unmount."
  ],
  code:`function debounce(fn, delay, { leading = false } = {}){
  let timer = null;
  const debounced = (...args) =&gt; {
    const callNow = leading &amp;&amp; timer === null;
    clearTimeout(timer);
    timer = setTimeout(() =&gt; { timer = null; if (!leading) fn(...args); }, delay);
    if (callNow) fn(...args);
  };
  debounced.cancel = () =&gt; { clearTimeout(timer); timer = null; };
  return debounced;
}

function throttle(fn, interval){
  let last = 0, pending = null;
  return (...args) =&gt; {
    const now = Date.now();
    if (now - last &gt;= interval){ last = now; fn(...args); }
    else { clearTimeout(pending); pending = setTimeout(() =&gt; { last = Date.now(); fn(...args); }, interval - (now - last)); }
  };
}

list.addEventListener('click', (e) =&gt; {
  const item = e.target.closest('.item');
  if (item &amp;&amp; list.contains(item)) open(item.dataset.id);
});`,
  traps:[
    "A debounced scroll handler feels broken — it never fires while the user is scrolling. Throttle scroll, debounce input.",
    "<code>e.target</code> is what was clicked (possibly a nested <code>&lt;span&gt;</code>); <code>e.currentTarget</code> is where the listener sits. Use <code>closest()</code>, not <code>target.matches()</code> alone.",
    "Not cancelling a debounced call on unmount can fire against a destroyed component/DOM node.",
    "<code>focus</code>/<code>blur</code> don't bubble (use <code>focusin</code>/<code>focusout</code>); neither do <code>mouseenter</code>/<code>mouseleave</code>.",
    "Recreating a debounced function on every render (React) gives you a fresh timer each time and effectively no debouncing — memoise it."
  ],
  cards:[
    {q:"Debounce vs throttle, in one line each.", a:"<b>Debounce</b>: wait until calls stop for N ms, then run once — search input, autosave. <b>Throttle</b>: run at most once per N ms during continuous activity — scroll, resize, drag."},
    {q:"Why is event delegation better for long lists?", a:"One listener instead of N (less memory and setup cost), and it automatically covers rows added after the listener was attached, since the listener lives on an ancestor that persists."},
    {q:"<code>e.target</code> vs <code>e.currentTarget</code>?", a:"<code>target</code> is the deepest element that originated the event; <code>currentTarget</code> is the element whose listener is currently running. In delegation you read <code>target</code> (usually via <code>closest()</code>) while <code>currentTarget</code> is the parent."}
  ],
  quiz:[
    {q:"A user types 10 characters quickly, then stops. With <code>debounce(fn, 300)</code>, how many times does <code>fn</code> run?", code:null,
     options:["Once, 300ms after the last keystroke","10 times","Once, immediately","Zero"], answer:0,
     why:"Each keystroke clears the pending timer and starts a new one. Only the final quiet period elapses fully, so <code>fn</code> runs once, 300ms after the last input."}
  ],
  cheat:[
    "Delegation: one listener on a stable ancestor + <code>e.target.closest(sel)</code>. Works for dynamic children.",
    "Bubbling: target → ancestors. <code>focus/blur/mouseenter/mouseleave</code> don't bubble (use focusin/focusout).",
    "<b>Debounce</b> = wait for silence → search, autosave, validation.",
    "<b>Throttle</b> = cap the rate → scroll, resize, drag, mousemove.",
    "Both = closure over a timer/timestamp. Add <code>.cancel()</code>; memoise in React.",
    {t:'mnemonic', text:"<b>Debounce = elevator door</b> (keeps resetting while people arrive). <b>Throttle = metronome</b> (fires on a fixed beat no matter what)."}
  ]
},

{ id:'what', group:'Runtime', title:'What Node.js actually is', animate:'enginemerge',
  lede:"Node isn't a language or a browser replacement — it's V8 plus a C library that supplies everything V8 lacks.",
  say:"Node is V8 — the same JS engine as Chrome — bundled with libuv, a C library that provides the event loop, a thread pool and async I/O, plus a standard library and a set of Node-only globals. V8 gives you the language; libuv gives you the ability to open sockets and files. That split explains almost every Node-versus-browser difference.",
  steps:[
    "<b>V8</b> compiles and runs your JavaScript — identical engine to Chrome, including the same GC and the same language features.",
    "<b>libuv</b> is a C library providing the event loop, a thread pool, and cross-platform async I/O (epoll on Linux, kqueue on macOS, IOCP on Windows). It replaces the browser's Web APIs.",
    "Node adds globals the browser doesn't have — <code>process</code>, <code>Buffer</code>, <code>require</code>/<code>module</code>, <code>__dirname</code> — and removes browser-only ones (<code>window</code>, <code>document</code>, <code>localStorage</code>).",
    "Result: JavaScript that can open files, listen on sockets, spawn processes and talk to the OS — things browsers deliberately forbid.",
    "Node's version determines the bundled V8 version, which determines which JS language features are available at runtime.",
    "The <b>bindings layer</b> (C++) is what exposes libuv and other native functionality to JS; <code>node:fs</code> and friends are thin JS wrappers over it.",
    "<b>npm</b> ships with Node but is a separate tool — it reads <code>package.json</code> and installs into <code>node_modules</code>.",
    "Deno and Bun are alternatives built on the same idea (an engine plus an event loop); Node's advantage is the npm ecosystem and operational maturity."
  ],
  code:`console.log(process.versions);
<span class="cm">// { node: '22.x', v8: '12.x', uv: '1.x', openssl: '3.x', ... }</span>

<span class="cm">// prefer the node: prefix — unambiguous, can't be shadowed by a package</span>
import fs from 'node:fs/promises';
import { createServer } from 'node:http';`,
  traps:[
    "'Node is single-threaded' is only true of <b>your JavaScript</b>. libuv runs a thread pool, and V8 itself uses background threads for GC and compilation.",
    "Importing <code>'fs'</code> rather than <code>'node:fs'</code> can be hijacked by a malicious package of that name — always use the <code>node:</code> prefix in new code.",
    "Node's <code>fetch</code>, <code>AbortController</code>, <code>structuredClone</code>, <code>WebStreams</code> and <code>URL</code> are web-standard APIs added later; don't assume an old runtime has them.",
    "<code>__dirname</code> and <code>require</code> don't exist in ESM — you need <code>import.meta.url</code>."
  ],
  terms:[
    {term:"V8", desc:"Google's JS engine — parses, JIT-compiles and runs JS; owns the heap and GC.", detail:"V8 is entirely separate from Node — the same engine is embedded in Chrome, which is why core JS behaviour (closures, prototypes, GC characteristics) matches the browser exactly.", code:`process.versions.v8;  <span class="cm">// exact V8 build in this Node</span>`},
    {term:"libuv", desc:"C library providing the event loop, thread pool and cross-platform async I/O.", detail:"Without libuv, V8 has no concept of a filesystem, sockets or timers. libuv abstracts epoll/kqueue/IOCP behind one API, which is why Node behaves the same on Linux, macOS and Windows.", code:`<span class="cm">// this call goes JS → C++ binding → libuv → thread pool → OS</span>\nawait fs.readFile('big.txt');`},
    {term:"Native addons & N-API", desc:"C/C++ code callable from JS through a stable ABI.", detail:"N-API (node-api) is version-independent, so an addon compiled once keeps working across Node major versions — unlike the old V8-API addons that broke on every upgrade. Relevant when a dependency needs a compiler at install time.", code:`<span class="cm">// package.json of a native dep triggers node-gyp at install</span>\n<span class="cm">// prebuilt binaries (prebuildify/node-pre-gyp) avoid that</span>`}
  ],
  cards:[
    {q:"What are the two core components of Node and what does each provide?", a:"<b>V8</b> — compiles and executes JavaScript, owns the heap and GC. <b>libuv</b> — the event loop, the thread pool, and cross-platform non-blocking I/O (epoll/kqueue/IOCP). Node adds a standard library and Node-specific globals on top."},
    {q:"Is Node single-threaded?", a:"Your JavaScript runs on a single thread, but the process is multi-threaded: libuv's thread pool (default 4) handles fs/dns/some crypto, V8 uses background threads for GC and compilation, and you can add more JS threads with <code>worker_threads</code>."},
    {q:"Why use the <code>node:</code> prefix on built-in imports?", a:"It's unambiguous and cannot be shadowed by an npm package with the same name — a real supply-chain risk. It also makes the import obviously a builtin to readers and tooling."}
  ],
  quiz:[
    {q:"Which of these is provided by libuv, not V8?", options:["The event loop and async file I/O","Garbage collection","JIT compilation of JavaScript","Prototype chain lookup"], answer:0,
     why:"GC, JIT and all language semantics are V8. The event loop, thread pool and non-blocking I/O come from libuv."}
  ],
  cheat:[
    "Node = <b>V8</b> (language, heap, GC) + <b>libuv</b> (event loop, thread pool, async I/O) + stdlib + Node globals.",
    "libuv abstracts epoll (Linux) / kqueue (macOS) / IOCP (Windows).",
    "Node-only: <code>process</code>, <code>Buffer</code>, <code>require</code>, <code>__dirname</code>. Missing: <code>window</code>, <code>document</code>.",
    "\"Single-threaded\" = your JS only. Pool + V8 background threads + worker_threads exist.",
    "Use <code>node:</code>-prefixed imports (supply-chain safety).",
    {t:'nums', items:[{v:'4',l:'default UV_THREADPOOL_SIZE'},{v:'1',l:'JS thread per process'},{v:'N-API',l:'stable ABI for native addons'}]}
  ]
},

{ id:'phases', group:'Runtime', title:'The Node event loop — six phases', animate:'loop',
  lede:"Unlike the browser's two flat queues, Node's loop has explicit ordered phases, each with its own callback queue.",
  say:"One tick runs six phases in order: timers, pending callbacks, idle/prepare, poll, check, close. <code>setTimeout</code> fires in timers, <code>setImmediate</code> in check, and I/O callbacks in poll. After <i>every</i> callback in every phase, Node drains the <code>process.nextTick</code> queue and then the promise microtask queue. The classic trick question — setTimeout vs setImmediate at top level — is non-deterministic, but inside an I/O callback setImmediate always wins because you're already past the poll phase.",
  steps:[
    "<b>1. Timers</b> — runs <code>setTimeout</code>/<code>setInterval</code> callbacks whose threshold has elapsed.",
    "<b>2. Pending callbacks</b> — some system-level callbacks deferred from the previous iteration (e.g. certain TCP errors).",
    "<b>3. Idle / prepare</b> — internal to libuv only.",
    "<b>4. Poll</b> — retrieves new I/O events and runs their callbacks. This is where the loop <b>blocks</b> and waits if there's nothing else to do; the wait is bounded by the nearest upcoming timer.",
    "<b>5. Check</b> — runs <code>setImmediate</code> callbacks, always immediately after poll.",
    "<b>6. Close callbacks</b> — <code>socket.on('close')</code> and similar.",
    "Between <b>every single callback</b> in every phase: drain <code>process.nextTick</code> queue fully, then drain the promise microtask queue fully.",
    "The process stays alive while any <b>ref'd handle</b> remains — a pending timer, a listening server, an open socket. <code>unref()</code> opts a handle out of keeping it alive.",
    "At the top level, <code>setTimeout(fn,0)</code> vs <code>setImmediate(fn)</code> is <b>non-deterministic</b> (depends on how long process startup took relative to the 1ms timer threshold). Inside an I/O callback, <code>setImmediate</code> <b>always</b> runs first because check comes right after poll."
  ],
  code:`setTimeout(() =&gt; console.log('timeout'), 0);
setImmediate(() =&gt; console.log('immediate'));
<span class="cm">// top level: order varies run to run</span>

require('node:fs').readFile(__filename, () =&gt; {
  setTimeout(() =&gt; console.log('timeout'), 0);
  setImmediate(() =&gt; console.log('immediate'));
  <span class="cm">// inside I/O: ALWAYS immediate, then timeout</span>
});

<span class="cm">// keep a heartbeat from blocking a clean exit</span>
const t = setInterval(ping, 30000);
t.unref();`,
  note:{type:'warn', text:"<b>Why this matters for an AI platform:</b> an LLM call is long-lived I/O — the round trip itself never blocks the loop. But what you do <i>around</i> it can: synchronously <code>JSON.parse</code>-ing a 5MB response, or running token counting on the main thread, occupies the single JS thread solidly. During that window <b>every other concurrent request stalls</b>, not just slow ones. Offload to <code>worker_threads</code>, stream rather than buffer, or move heavy computation off the request path."},
  traps:[
    "There is no guarantee <code>setTimeout(fn, 100)</code> runs at exactly 100ms — a busy poll phase or a long callback delays it. Timers are a floor, not a promise.",
    "A blocking callback in <b>any</b> phase blocks every other phase. Phases don't run in parallel.",
    "<code>setInterval</code> with a callback slower than the interval queues up back-to-back executions. Use a self-rescheduling <code>setTimeout</code> for periodic work.",
    "Recursive <code>process.nextTick</code> starves the entire loop — the queue is drained to empty before the loop can advance.",
    "A forgotten <code>setInterval</code> or open server is why <code>node script.js</code> sometimes never exits."
  ],
  terms:[
    {term:"Poll phase blocking", desc:"Where the loop waits for I/O — for a computed, bounded time.", detail:"libuv computes the timeout as the time until the nearest due timer (or 0 if the check queue is non-empty), so it never oversleeps past a scheduled timer.", code:`<span class="cm">// with nothing else pending, this process sits in poll,</span>\n<span class="cm">// consuming ~0% CPU, until a connection arrives</span>\nhttp.createServer(handler).listen(3000);`},
    {term:"ref / unref", desc:"Whether a handle keeps the process alive.", detail:"Metrics pushers, heartbeats and background reconnect timers should be <code>unref()</code>'d so they never delay a graceful shutdown; anything the process must finish should stay ref'd.", code:`const timer = setInterval(reportMetrics, 60000);\ntimer.unref();   <span class="cm">// won't hold the process open</span>`},
    {term:"setImmediate vs nextTick", desc:"Despite the names, nextTick is sooner and setImmediate is the loop-friendly one.", detail:"<code>process.nextTick</code> runs before the loop continues at all; <code>setImmediate</code> runs in the check phase of the current or next iteration. The Node docs themselves say the names are historically backwards.", code:`process.nextTick(() =&gt; console.log('1: nextTick'));\nPromise.resolve().then(() =&gt; console.log('2: promise'));\nsetImmediate(() =&gt; console.log('3: immediate'));\nsetTimeout(() =&gt; console.log('4: timeout'), 0);`}
  ],
  cards:[
    {q:"Name the six event loop phases in order.", a:"Timers → Pending callbacks → Idle/prepare (internal) → Poll → Check (<code>setImmediate</code>) → Close callbacks. nextTick and promise microtasks drain between every callback in every phase."},
    {q:"setTimeout(0) vs setImmediate at the top level — which runs first?", a:"Non-deterministic. It depends on whether process startup took longer than the ~1ms timer threshold. Inside an I/O callback it's deterministic: <code>setImmediate</code> always wins, because check comes immediately after poll."},
    {q:"When does the event loop block, and for how long?", a:"In the <b>poll</b> phase, when there's nothing else queued. libuv bounds the wait by the time until the nearest due timer (or zero if the check queue is non-empty), so it never oversleeps a timer."},
    {q:"Why does a Node script sometimes never exit?", a:"A ref'd handle is still open — a <code>setInterval</code>, a listening server, an open socket or a pending fs watcher. <code>unref()</code> the ones that shouldn't hold the process, or close them in your shutdown path."}
  ],
  quiz:[
    {q:"What is the guaranteed output order?", code:`const fs = require('node:fs');\nfs.readFile(__filename, () =&gt; {\n  setTimeout(() =&gt; console.log('T'), 0);\n  setImmediate(() =&gt; console.log('I'));\n  process.nextTick(() =&gt; console.log('N'));\n});`,
     options:["N, I, T","T, I, N","I, T, N","N, T, I"], answer:0,
     why:"nextTick drains immediately after the current callback. Then, since we're inside the poll phase, check (setImmediate → I) comes next, and timers only on the following iteration (T)."}
  ],
  cheat:[
    "<b>Timers → Pending → Idle/Prepare → Poll → Check → Close.</b>",
    "<code>setTimeout</code>=timers · I/O callbacks=poll · <code>setImmediate</code>=check.",
    "After <b>every</b> callback: drain nextTick, then promise microtasks.",
    "Poll blocks (bounded by nearest timer). Non-empty check queue ⇒ poll doesn't wait.",
    "Top-level timeout-vs-immediate = non-deterministic; inside I/O ⇒ <b>immediate first</b>.",
    "Process lives while a ref'd handle exists → <code>unref()</code> heartbeats.",
    {t:'mnemonic', text:"<b>“Timers Pending Idle Poll Check Close”</b> → <i>“Ten Pretty Iguanas Play Chess Calmly.”</i>"}
  ]
},

{ id:'pool', group:'Runtime', title:'The libuv thread pool', animate:'thread',
  lede:"Node is famously 'single-threaded' — true of your JS, false of the runtime.",
  say:"Some operations have no async OS primitive — filesystem calls, <code>dns.lookup</code>, and CPU-bound crypto like pbkdf2/scrypt/bcrypt. libuv offloads those to a thread pool, default size 4, set by <code>UV_THREADPOOL_SIZE</code> before startup. Networking does <b>not</b> use the pool — sockets go straight to epoll/kqueue/IOCP. So a burst of file reads or password hashes can queue behind four threads even though your JS never blocks.",
  steps:[
    "Blocking-at-the-OS-level operations go to the pool: <b>filesystem</b> (all <code>fs</code> async calls), <b>dns.lookup</b>, some <b>zlib</b> and <b>crypto</b> (<code>pbkdf2</code>, <code>scrypt</code>, <code>randomBytes</code> above a threshold).",
    "The pool defaults to <b>4</b> threads, configurable via the <code>UV_THREADPOOL_SIZE</code> env var (max 1024) — read once at startup, so setting it in code is too late.",
    "Your JS thread continues while a worker does the blocking work; the completion callback runs back on the main thread in the <b>poll</b> phase.",
    "<b>Networking does not use the pool.</b> TCP/HTTP sockets use the kernel's async I/O directly, which is why one process can hold tens of thousands of connections without tens of thousands of threads.",
    "If all pool threads are busy, further fs/dns/crypto requests <b>queue</b>. A burst of file reads can add latency even though nothing is 'blocked' in the JS sense.",
    "<code>dns.lookup</code> (used implicitly by <code>http.request</code> to a hostname) is a pool operation because <code>getaddrinfo</code> is blocking; <code>dns.resolve*</code> uses c-ares and is truly async — a real fix for DNS-bound throughput problems.",
    "The pool is for <b>I/O</b>, not computation. Genuinely CPU-bound work belongs in <code>worker_threads</code> or a separate service — putting it in the pool starves I/O.",
    "Sizing rule of thumb: raise <code>UV_THREADPOOL_SIZE</code> toward the core count if you're fs- or crypto-heavy; measure, don't guess."
  ],
  code:`<span class="cm">// must be set BEFORE node starts:</span>
<span class="cm">// UV_THREADPOOL_SIZE=16 node server.js</span>

fs.readFile('big.txt', cb);      <span class="cm">// → pool thread</span>
fs.readFileSync('big.txt');      <span class="cm">// → blocks the JS thread, no pool</span>
crypto.pbkdf2(pw, salt, 100000, 64, 'sha512', cb);  <span class="cm">// → pool</span>
http.get('http://api/', cb);     <span class="cm">// → kernel sockets, NOT the pool</span>

<span class="cm">// bypass the pool for DNS-heavy workloads</span>
dns.resolve4('example.com', cb); <span class="cm">// c-ares, truly async</span>`,
  traps:[
    "Four concurrent bcrypt/pbkdf2 hashes saturate the default pool, and the fifth request's <i>file read</i> waits behind them. Password hashing at scale belongs in a dedicated worker pool or service.",
    "Setting <code>process.env.UV_THREADPOOL_SIZE</code> at the top of your script does nothing — libuv reads it when the first pool task is scheduled, and many runtimes have already initialised by then.",
    "<code>fs.promises</code> is still the thread pool; it's not magically more concurrent than callbacks.",
    "Raising the pool size beyond your core count mostly adds context-switching, not throughput, for CPU-bound tasks.",
    "<code>fs.readFileSync</code> at startup (config, templates, certs) is fine; inside a request handler it's a production incident."
  ],
  terms:[
    {term:"Why networking skips the pool", desc:"The kernel already provides async socket readiness notification.", detail:"epoll/kqueue/IOCP let one thread watch thousands of file descriptors. There's nothing to offload — the OS tells you when a socket is readable. Files have no equivalent readiness API on most systems, hence the pool.", code:`<span class="cm">// 10k concurrent connections, still 4 pool threads, still 1 JS thread</span>\nnet.createServer(sock =&gt; sock.pipe(sock)).listen(3000);`},
    {term:"Pool saturation symptom", desc:"Latency rises on unrelated I/O while CPU looks fine.", detail:"The tell is that p99 latency climbs for endpoints that only read a small file, whenever a crypto-heavy or file-heavy endpoint is under load. Instrument with <code>perf_hooks</code> or check whether raising UV_THREADPOOL_SIZE moves the number.", code:`const { monitorEventLoopDelay } = require('node:perf_hooks');\nconst h = monitorEventLoopDelay({ resolution: 20 });\nh.enable();\nsetInterval(() =&gt; console.log('p99 lag', h.percentile(99) / 1e6, 'ms'), 5000);`}
  ],
  cards:[
    {q:"Which operations use the libuv thread pool?", a:"Filesystem (<code>fs.*</code> async), <code>dns.lookup</code>, some <code>zlib</code>, and CPU-bound crypto (<code>pbkdf2</code>, <code>scrypt</code>, <code>randomBytes</code>). <b>Not</b> TCP/HTTP networking, which uses kernel async I/O directly."},
    {q:"What's the default pool size and how do you change it?", a:"4. Set the <code>UV_THREADPOOL_SIZE</code> environment variable <b>before the process starts</b> (max 1024). Setting it from inside your script is too late."},
    {q:"Why is <code>dns.lookup</code> different from <code>dns.resolve</code>?", a:"<code>lookup</code> calls the OS's blocking <code>getaddrinfo</code>, so it must go through the thread pool (and it's what <code>http.request</code> uses by default). <code>resolve*</code> uses c-ares to query DNS servers directly and is genuinely async."},
    {q:"How would you notice pool saturation in production?", a:"Latency rising on I/O-light endpoints while CPU is not pegged, correlated with load on crypto- or file-heavy endpoints. Confirm by measuring event-loop delay and by testing whether raising UV_THREADPOOL_SIZE changes p99."}
  ],
  quiz:[
    {q:"A Node service does bcrypt hashing on login. Under load, unrelated endpoints that read small config files get slower. Most likely cause?", options:["The 4-thread libuv pool is saturated by bcrypt","The event loop is blocked by bcrypt","The GC is thrashing","TCP connection limits"], answer:0,
     why:"bcrypt/pbkdf2 run on the libuv pool. With the default size of 4, concurrent hashes occupy all threads and queue every other pool operation — including file reads — behind them."}
  ],
  cheat:[
    "Pool handles: <b>fs, dns.lookup, zlib, pbkdf2/scrypt/randomBytes</b>. Default <b>4</b>, env <code>UV_THREADPOOL_SIZE</code> (pre-start, max 1024).",
    "<b>Networking does NOT use the pool</b> — kernel epoll/kqueue/IOCP.",
    "Saturation ⇒ queued fs/dns behind crypto. Symptom: p99 up on unrelated I/O.",
    "<code>dns.resolve*</code> (c-ares) bypasses the pool; <code>dns.lookup</code> doesn't.",
    "Pool is for I/O; CPU work → <code>worker_threads</code> / separate service.",
    "Any <code>*Sync</code> call blocks the JS thread outright — startup only."
  ]
},

{ id:'nonblocking', group:'Runtime', title:'The non-blocking I/O model & CPU-bound work', animate:'nonblock',
  lede:"The core pitch of Node: thousands of concurrent connections without a thread per connection.",
  say:"Node issues an I/O request and returns to the loop instead of waiting, so one thread multiplexes thousands of connections. The trade is that the model only helps while you're <i>waiting</i>. CPU-bound work has nothing to wait on, so it monopolises the one JS thread and every other request queues behind it. The fix is always the same: offload to worker_threads, a queue, or a separate service, and monitor event-loop lag as a health metric.",
  steps:[
    "A thread-per-connection server pays memory (typically ~1MB stack each) and context-switching per connection.",
    "Node instead issues the I/O request and <b>returns to the event loop immediately</b>.",
    "The kernel (networking) or the thread pool (fs/dns/crypto) does the waiting; the callback is queued and picked up in the <b>poll</b> phase.",
    "Meanwhile thousands of other requests are progressing on the same single JS thread — <b>throughput over per-request latency</b>.",
    "A single <i>synchronous</i> operation ruins it: <code>readFileSync</code>, a big <code>JSON.parse</code>, a synchronous crypto call, a tight loop — all block every concurrent user.",
    "CPU-bound work has <b>nothing to yield on</b>. There is no I/O wait to hand back during, so it occupies the thread until done.",
    "The fixes, in order of preference: don't do it on the request path (precompute/queue) → <code>worker_threads</code> pool → separate service → native addon.",
    "<b>Event-loop lag</b> — the delay between scheduling a check and it running — is the canonical health metric. Rising lag means something is blocking; alert on p99 lag, not just CPU."
  ],
  code:`<span class="cm">// one thread, thousands of concurrent requests</span>
app.get('/user', async (req, res) =&gt; {
  const user = await db.find(req.query.id);   <span class="cm">// yields to the loop while waiting</span>
  res.json(user);
});

<span class="cm">// measure event loop lag properly</span>
const { monitorEventLoopDelay } = require('node:perf_hooks');
const h = monitorEventLoopDelay({ resolution: 20 });
h.enable();
setInterval(() =&gt; {
  metrics.gauge('eventloop.lag.p99.ms', h.percentile(99) / 1e6);
  h.reset();
}, 10000);

<span class="cm">// offload CPU work</span>
const { Worker } = require('node:worker_threads');
function heavy(data){
  return new Promise((res, rej) =&gt; {
    const w = new Worker('./cpu-task.js', { workerData: data });
    w.once('message', res); w.once('error', rej);
  });
}`,
  note:{type:'warn', text:"<b>Why CPU-intensive work doesn't suit Node:</b> non-blocking I/O only helps while a handler is <i>waiting</i>. A CPU-bound computation — image processing, big JSON parse, synchronous hashing, a large sort — has no wait to yield during, so it holds the single JS thread until it finishes and <i>every other request, however trivial, is blocked behind it</i>. See the 'Why CPU-heavy work blocks Node' demo for this step by step."},
  traps:[
    "<code>JSON.parse</code>/<code>JSON.stringify</code> on multi-megabyte payloads is synchronous and is a very common hidden blocker in API gateways and LLM proxies.",
    "Spawning a <code>new Worker</code> per request costs ~10–30ms and its own V8 heap — use a pool, not one-per-call.",
    "Regex catastrophic backtracking (ReDoS) blocks the loop completely on a crafted input — a security issue as much as a performance one.",
    "Large synchronous <code>Array.sort</code>, <code>crypto.pbkdf2Sync</code>, and template rendering of huge datasets are all blockers.",
    "Alerting on CPU% alone misses the problem: a blocked loop can look like modest CPU while every request times out."
  ],
  terms:[
    {term:"Event loop lag", desc:"How late a scheduled callback actually runs — the health metric for blocking.", detail:"Under 10ms is healthy for most services; sustained triple-digit lag means requests are queueing behind something synchronous. <code>monitorEventLoopDelay</code> gives a proper histogram rather than a sampled guess.", code:`<span class="cm">// crude but effective if you can't add perf_hooks</span>\nlet last = Date.now();\nsetInterval(() =&gt; { const lag = Date.now() - last - 500; last = Date.now(); report(lag); }, 500);`},
    {term:"Worker pool", desc:"Reuse a fixed set of worker threads instead of spawning per task.", detail:"Node 18+ ships <code>node:worker_threads</code> plus you can use <code>piscina</code> for a batteries-included pool with queueing, timeouts and abort support.", code:`import Piscina from 'piscina';\nconst pool = new Piscina({ filename: './resize.js', maxThreads: 4 });\napp.post('/resize', async (req,res) =&gt; res.send(await pool.run(req.body)));`},
    {term:"Streaming instead of buffering", desc:"Avoid holding whole payloads in memory or parsing them at once.", detail:"For large JSON, a streaming parser processes incrementally and yields to the loop; for file/proxy work, <code>pipeline()</code> never materialises the full body. Both remove the blocking parse entirely.", code:`import { pipeline } from 'node:stream/promises';\nawait pipeline(req, transform, res);   <span class="cm">// constant memory, no big parse</span>`}
  ],
  cards:[
    {q:"Why is Node good at concurrency but bad at CPU-bound work?", a:"Non-blocking I/O lets one thread multiplex thousands of waits, so concurrency is cheap. But CPU work has no wait to yield during — it occupies the single JS thread until it completes, blocking every other request regardless of how trivial they are."},
    {q:"What metric tells you the event loop is blocked?", a:"Event-loop lag/delay — the gap between when a callback was scheduled and when it ran. Measure it with <code>perf_hooks.monitorEventLoopDelay</code> and alert on the p99. CPU% alone can look fine while every request times out."},
    {q:"List the fixes for CPU-bound work in a Node service, in order.", a:"1) Move it off the request path entirely (precompute, or push to a queue/background worker). 2) <code>worker_threads</code> pool. 3) A separate service in a better-suited runtime. 4) A native addon. Spawning a worker per request is not a fix — pool them."}
  ],
  quiz:[
    {q:"Two requests arrive together: /heavy runs <code>fib(40)</code> (2s of CPU) and /ping returns a constant. What happens?", options:["/ping waits ~2s — it can't even start","/ping responds immediately on another thread","/ping responds after ~1s","Node spawns a thread automatically"], answer:0,
     why:"Both handlers share the one JS thread. /heavy has no I/O to yield on, so /ping's callback sits in the queue until fib(40) finishes."}
  ],
  cheat:[
    "Issue I/O → return to loop. Kernel (net) or pool (fs/dns/crypto) waits. Callback resumes in <b>poll</b>.",
    "Optimises <b>throughput</b>, not single-request latency.",
    "Any sync op blocks <i>everyone</i>: <code>*Sync</code>, big <code>JSON.parse</code>, ReDoS, huge sort, sync crypto.",
    "CPU work → precompute/queue &gt; worker pool &gt; separate service. <b>Never spawn a worker per request.</b>",
    "Health metric = <b>event-loop lag p99</b> (perf_hooks). &lt;10ms good.",
    "Stream instead of buffering to avoid big synchronous parses."
  ]
},

{ id:'modules', group:'Runtime', title:'Modules: CommonJS vs ESM in Node', animate:'moduleflow',
  lede:"Two module systems with genuinely different loading semantics — a frequent source of real-world pain.",
  say:"CommonJS loads synchronously and caches by resolved path, so <code>require</code> can be conditional and gives you a snapshot of <code>module.exports</code>. ESM is resolved statically before evaluation, gives live bindings, is always strict, and enables tree-shaking. You choose per file via the <code>.mjs</code>/<code>.cjs</code> extension or <code>\"type\": \"module\"</code>. ESM can import CJS; CJS can only reach ESM through dynamic <code>import()</code>.",
  steps:[
    "<b>CommonJS</b>: <code>require()</code> is a synchronous function call. It resolves, loads, wraps the file in a function, executes it, and caches <code>module.exports</code> keyed by resolved filename.",
    "Because it's synchronous and dynamic, <code>require()</code> can appear anywhere — inside an <code>if</code>, inside a function, with a computed path.",
    "<b>ESM</b>: <code>import</code>/<code>export</code> are static, hoisted, and resolved before any code runs, enabling tree-shaking and cycle handling.",
    "ESM gives <b>live bindings</b>; CJS gives you the value of <code>module.exports</code> at require time (a snapshot).",
    "Node picks the system by file extension (<code>.mjs</code> / <code>.cjs</code>) or the nearest <code>package.json</code>'s <code>\"type\"</code> field (<code>\"module\"</code> or the default <code>\"commonjs\"</code>).",
    "ESM has no <code>require</code>, <code>__dirname</code>, <code>__filename</code> or <code>module.exports</code>; use <code>import.meta.url</code>, or <code>createRequire</code> when you must.",
    "<b>ESM can import CJS</b> (the whole <code>module.exports</code> becomes the default export; named exports work only when statically detectable). <b>CJS cannot <code>require()</code> ESM</b> in most versions — use dynamic <code>import()</code>. (Node 22+ can require synchronous ESM graphs behind a flag/newer releases.)",
    "The <code>\"exports\"</code> field in package.json is now the source of truth for what a package exposes and can provide separate <code>import</code>/<code>require</code> entry points — that's how libraries ship dual builds."
  ],
  code:`<span class="cm">// CommonJS — sync, cached, dynamic</span>
const fs = require('node:fs');
if (process.env.DEBUG) require('./debug-tools');   <span class="cm">// legal</span>
module.exports = { fs };

<span class="cm">// ESM — static, live bindings, strict</span>
import fs from 'node:fs';
export default { fs };

<span class="cm">// ESM shims for CJS globals</span>
import { createRequire } from 'node:module';
import { fileURLToPath } from 'node:url';
const require = createRequire(import.meta.url);
const __dirname = path.dirname(fileURLToPath(import.meta.url));

<span class="cm">// dual-entry package.json</span>
{ "type": "module",
  "exports": { ".": { "import": "./dist/index.mjs", "require": "./dist/index.cjs" } } }`,
  table:{title:'CommonJS vs ESM', head:['','CommonJS','ESM'], rows:[
    ['Loading','Synchronous','Asynchronous, pre-resolved'],
    ['Syntax position','Anywhere','Top level only (or <code>import()</code>)'],
    ['Bindings','Value snapshot','Live, read-only'],
    ['Strict mode','Opt-in','Always'],
    ['Tree-shaking','No','Yes'],
    ['Cycles','Partial exports object','TDZ error if read too early'],
    ['<code>__dirname</code>','Yes','No — <code>import.meta.url</code>'],
    ['Interop','Can\'t require ESM','Can import CJS']
  ]},
  traps:[
    "<code>require</code> cache is keyed on the <b>resolved path</b> — the same package installed twice at different depths is two separate instances, which breaks singletons and <code>instanceof</code> checks.",
    "CJS circular dependency returns a <b>partially populated</b> exports object rather than throwing; the bug shows up as <code>undefined is not a function</code> at runtime.",
    "Destructuring a CJS module's named exports from ESM sometimes fails because Node's static analysis can't detect them — import the default and destructure at runtime.",
    "Top-level <code>await</code> in ESM delays every importer's evaluation — fine for config loading, dangerous in a widely-imported utility.",
    "Jest and ts-node historically needed extra configuration for ESM; check your test runner before flipping <code>\"type\": \"module\"</code>."
  ],
  terms:[
    {term:"require cache", desc:"Modules are cached by resolved filename; a second require returns the same object.", detail:"You can inspect or delete entries via <code>require.cache</code>, which is how some hot-reload tools force re-evaluation. ESM has no equivalent public API — the module registry is not mutable.", code:`const a = require('./config');\nconst b = require('./config');\na === b;   <span class="cm">// true</span>\ndelete require.cache[require.resolve('./config')];  <span class="cm">// force reload</span>`},
    {term:"The module wrapper", desc:"CJS files are wrapped in a function — which is where the 'globals' come from.", detail:"This explains why <code>module</code>, <code>exports</code>, <code>__dirname</code> and <code>__filename</code> exist and why top-level <code>this</code> in CJS is <code>module.exports</code>, while in ESM it is <code>undefined</code>.", code:`(function (exports, require, module, __filename, __dirname) {\n  <span class="cm">// your file body goes here</span>\n});`},
    {term:"exports map & conditional exports", desc:"package.json controls the public surface and per-environment entry points.", detail:"It also <b>blocks</b> deep imports into internals unless explicitly listed, which is a real behaviour change from the old 'any file is importable' model.", code:`"exports": {\n  ".": { "types": "./d.ts", "import": "./esm.js", "require": "./cjs.js" },\n  "./utils": "./src/utils.js"\n}`}
  ],
  cards:[
    {q:"Why can <code>require()</code> be conditional but <code>import</code> can't?", a:"<code>require</code> is a synchronous function evaluated at runtime. ESM <code>import</code> is a static declaration resolved before the module body executes, which is exactly what makes tree-shaking and pre-resolution possible. Use dynamic <code>import()</code> for conditional loading."},
    {q:"How do CJS and ESM handle circular dependencies differently?", a:"CJS returns whatever <code>module.exports</code> holds at that moment — often a partially populated object, failing silently at call time. ESM wires bindings up front, so the import exists but throws a TDZ <code>ReferenceError</code> if you read it before the other module evaluated."},
    {q:"How does Node decide whether a file is CJS or ESM?", a:"Extension first (<code>.mjs</code> = ESM, <code>.cjs</code> = CJS), otherwise the <code>\"type\"</code> field of the nearest package.json (<code>\"module\"</code> = ESM, default/absent = CommonJS)."},
    {q:"What are the ESM replacements for <code>__dirname</code> and <code>require</code>?", a:"<code>path.dirname(fileURLToPath(import.meta.url))</code> for the directory, and <code>createRequire(import.meta.url)</code> from <code>node:module</code> when you genuinely need CJS resolution (e.g. loading JSON in older Node)."}
  ],
  quiz:[
    {q:"What does this log?", code:`<span class="cm">// counter.cjs</span>\nlet n = 0;\nmodule.exports = { n, bump: () =&gt; n++ };\n\n<span class="cm">// main.cjs</span>\nconst c = require('./counter.cjs');\nc.bump();\nconsole.log(c.n);`,
     options:["0 — CJS exported a snapshot","1 — live binding","undefined","ReferenceError"], answer:0,
     why:"<code>module.exports = { n, ... }</code> copied the <i>value</i> of n at that moment. Incrementing the module-local variable doesn't change the exported property. In ESM with <code>export let n</code> this would print 1."}
  ],
  cheat:[
    "<b>CJS</b>: sync <code>require</code>, cached by resolved path, value snapshot, dynamic position, wrapper function gives <code>__dirname</code>.",
    "<b>ESM</b>: static & pre-resolved, live bindings, always strict, tree-shakeable, <code>import.meta.url</code>.",
    "Choose via <code>.mjs</code>/<code>.cjs</code> or <code>\"type\"</code> in package.json.",
    "ESM→CJS import: OK (default export). CJS→ESM require: use dynamic <code>import()</code>.",
    "Cycles: CJS = partial object (silent) · ESM = TDZ ReferenceError (loud).",
    "<code>\"exports\"</code> map = public API + per-condition entry points; blocks deep imports."
  ]
},
