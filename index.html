{ id:'db-acid', group:'Transactions', title:'ACID & what a transaction actually guarantees', animate:'isolation',
  lede:"Four letters everyone can recite — the interview is about which one is negotiable and what it costs.",
  say:"Atomicity means all-or-nothing, consistency means the database's own constraints hold across the transaction, isolation means concurrent transactions don't observe each other's partial work, and durability means a committed write survives a crash. In practice the one you actively tune is isolation — it's a dial with a real cost, and the default in Postgres and most engines is Read Committed, not Serializable.",
  steps:[
    "<b>Atomicity</b> — the whole transaction commits or none of it does. Implemented with a write-ahead log and rollback; a crash mid-transaction leaves no partial effect.",
    "<b>Consistency</b> — the database moves from one valid state to another with respect to its declared constraints (foreign keys, checks, uniqueness). It does <i>not</i> mean your business rules are correct.",
    "<b>Isolation</b> — concurrent transactions behave as if they ran with some degree of separation. This is the negotiable one, and the level you choose determines which anomalies are possible.",
    "<b>Durability</b> — once <code>COMMIT</code> returns, the data survives a crash. Achieved by flushing the WAL to disk (<code>fsync</code>) before acknowledging.",
    "The <b>WAL (write-ahead log)</b> is the mechanism behind A and D: changes are appended to a sequential log and fsynced <i>before</i> the data pages are updated, so recovery can replay or undo.",
    "Durability is a spectrum in practice: <code>synchronous_commit = off</code> in Postgres trades a small window of possible data loss for a large throughput gain, and replicas can be sync or async.",
    "<b>Keep transactions short.</b> They hold locks and a pooled connection for their entire duration — never make a network call inside one.",
    "A transaction is not a substitute for idempotency: a retried request can commit twice unless you also have an idempotency key or a uniqueness constraint."
  ],
  code:`BEGIN;
  UPDATE accounts SET balance = balance - 100 WHERE id = 1;
  UPDATE accounts SET balance = balance + 100 WHERE id = 2;
COMMIT;                       <span class="cm">-- atomic: both or neither</span>

<span class="cm">-- constraints are what "consistency" actually means</span>
ALTER TABLE accounts ADD CONSTRAINT non_negative CHECK (balance &gt;= 0);

<span class="cm">-- durability trade-off (Postgres)</span>
SET synchronous_commit = off;  <span class="cm">-- faster commits, small loss window on crash</span>`,
  traps:[
    "<b>Consistency in ACID ≠ consistency in CAP.</b> ACID's C is about declared constraints; CAP's C is about all replicas returning the latest write. Interviewers ask this deliberately.",
    "Wrapping an external API call inside a transaction holds locks for the entire round trip — a top cause of lock storms and pool exhaustion.",
    "A rollback still consumed work: sequences/auto-increment values are not returned, so IDs get gaps.",
    "Long-running read transactions in Postgres block <code>VACUUM</code> from cleaning old row versions, which causes table bloat.",
    "Nested <code>BEGIN</code> is not nested transactions — you need <code>SAVEPOINT</code>, and most ORMs emulate nesting with savepoints."
  ],
  terms:[
    {term:"Write-ahead log", desc:"Append-only log flushed before data pages — the basis of atomicity and durability.", detail:"Because it's sequential, it's fast to write. Recovery replays committed transactions and undoes uncommitted ones. It's also what physical replication ships to replicas, and what point-in-time recovery replays.", code:`<span class="cm">-- WAL is also the replication stream and the PITR source</span>\nSELECT pg_current_wal_lsn();`},
    {term:"Savepoints", desc:"Partial rollback inside a transaction.", detail:"Lets you attempt something optional and recover without losing the whole transaction. ORMs use these to implement 'nested transactions', which is worth knowing when a nested failure unexpectedly rolls back more than you meant.", code:`BEGIN;\n  INSERT INTO orders …;\n  SAVEPOINT before_optional;\n  INSERT INTO analytics …;      <span class="cm">-- may fail</span>\n  ROLLBACK TO before_optional;  <span class="cm">-- order survives</span>\nCOMMIT;`}
  ],
  cards:[
    {q:"What does the C in ACID actually mean?", a:"That the database's own declared constraints — foreign keys, checks, uniqueness, triggers — hold before and after the transaction. It is <b>not</b> a guarantee that your business logic is right, and it is unrelated to the C in CAP."},
    {q:"How are atomicity and durability implemented?", a:"With a write-ahead log: changes are appended to a sequential log and fsynced before the data pages change. On crash, recovery replays committed transactions and undoes uncommitted ones."},
    {q:"Which ACID property do you actually tune, and why?", a:"Isolation. It's a dial (Read Uncommitted → Serializable) trading concurrency for correctness, and the default in most engines is Read Committed — not Serializable — so certain anomalies are possible by default."},
    {q:"Why must transactions be short?", a:"They hold row locks and a pooled connection for their whole duration. A long transaction — especially one containing a network call — causes lock contention, deadlocks, pool exhaustion, and in Postgres blocks VACUUM and causes bloat."}
  ],
  quiz:[
    {q:"A handler opens a transaction, inserts an order, calls Stripe, then commits. What is the main risk?", options:["Row locks and a connection are held for the whole network round trip","Stripe will reject the call","The insert can't be rolled back","None — this is the standard pattern"], answer:0,
     why:"The transaction stays open for hundreds of milliseconds or more. Under load that exhausts the pool and creates lock contention. Commit first, then charge with an idempotency key, and reconcile failures."}
  ],
  cheat:[
    "<b>A</b>tomicity (all-or-nothing, via WAL) · <b>C</b>onsistency (declared constraints) · <b>I</b>solation (the tunable one) · <b>D</b>urability (fsync'd WAL).",
    "ACID's C ≠ CAP's C. Expect to be asked.",
    "WAL = atomicity + durability + replication stream + PITR.",
    "Default isolation is usually <b>Read Committed</b>, not Serializable.",
    "<b>Short transactions.</b> No network calls inside. Commit → then call, with an idempotency key.",
    "<code>SAVEPOINT</code> for partial rollback; ORMs use it to fake nesting."
  ]
},

{ id:'db-isolation', group:'Transactions', title:'Isolation levels & the anomalies they permit', animate:'isolation',
  lede:"Four levels, four anomalies — and knowing which anomaly each level still allows is the whole question.",
  say:"Read Uncommitted allows dirty reads, Read Committed prevents those but allows non-repeatable reads and phantoms, Repeatable Read prevents both of those, and Serializable prevents everything including write skew. Postgres's Read Committed is the default and takes a fresh snapshot per statement; its Repeatable Read is snapshot isolation, which still permits write skew — that's why Serializable exists as a separate level.",
  steps:[
    "<b>Dirty read</b> — reading another transaction's <i>uncommitted</i> data. Prevented from Read Committed upward; Postgres never allows it at all.",
    "<b>Non-repeatable read</b> — reading the same row twice in one transaction and getting different values because someone committed in between. Prevented from Repeatable Read upward.",
    "<b>Phantom read</b> — re-running the same <i>range</i> query and getting new rows. Prevented at Serializable (and in Postgres's Repeatable Read, thanks to snapshot isolation).",
    "<b>Write skew</b> — two transactions each read a set, each make a decision that is individually valid, and the combined result violates an invariant. Only Serializable prevents it.",
    "<b>Read Committed</b> (the common default): each <i>statement</i> sees a fresh snapshot. So two identical <code>SELECT</code>s in one transaction can differ.",
    "<b>Repeatable Read</b>: the whole transaction sees one snapshot taken at its start. In Postgres this is snapshot isolation and it also blocks phantoms — but a concurrent conflicting write causes a <b>serialization failure</b> your application must retry.",
    "<b>Serializable</b>: the result is guaranteed equivalent to <i>some</i> serial order. Postgres implements SSI (predicate-tracking, optimistic); MySQL/InnoDB uses next-key locking (pessimistic).",
    "The practical rule: use the default, and reach for a higher level or explicit locking only where a real invariant is at stake — then <b>be prepared to retry</b> serialization failures with backoff."
  ],
  code:`<span class="cm">-- classic write skew: "at least one doctor must be on call"</span>
<span class="cm">-- both transactions run concurrently at Repeatable Read</span>
BEGIN ISOLATION LEVEL REPEATABLE READ;
  SELECT count(*) FROM doctors WHERE on_call = true;  <span class="cm">-- both see 2</span>
  UPDATE doctors SET on_call = false WHERE id = 1;    <span class="cm">-- T1</span>
COMMIT;                                               <span class="cm">-- T2 does the same for id = 2</span>
<span class="cm">-- result: ZERO doctors on call. Neither transaction saw a conflicting row.</span>

<span class="cm">-- fixes</span>
BEGIN ISOLATION LEVEL SERIALIZABLE;                   <span class="cm">-- 1. detect &amp; retry</span>
SELECT … FROM doctors WHERE on_call = true FOR UPDATE; <span class="cm">-- 2. explicit lock</span>
ALTER TABLE … ADD CONSTRAINT …;                        <span class="cm">-- 3. materialise the invariant</span>`,
  table:{title:'Levels vs anomalies', head:['Level','Dirty read','Non-repeatable','Phantom','Write skew'], rows:[
    ['Read Uncommitted','Possible*','Possible','Possible','Possible'],
    ['Read Committed <i>(default)</i>','No','Possible','Possible','Possible'],
    ['Repeatable Read','No','No','No in PG / possible in spec','Possible'],
    ['Serializable','No','No','No','No']
  ]},
  traps:[
    "<b>Postgres has no real Read Uncommitted</b> — requesting it silently gives you Read Committed. Naming the level and getting a different behaviour surprises people.",
    "Higher isolation does not mean 'no errors' — it means <b>more errors you must retry</b>. Serializable and Repeatable Read both raise serialization failures under contention.",
    "In Read Committed, an <code>UPDATE … WHERE balance &gt; 100</code> re-reads the row after waiting on a lock, so it can act on a value your earlier <code>SELECT</code> never saw. Read-modify-write needs <code>FOR UPDATE</code> or an atomic expression.",
    "<code>SELECT … FOR UPDATE</code> in an inconsistent order across code paths is how you manufacture deadlocks.",
    "MySQL's Repeatable Read behaves differently from Postgres's (next-key locks vs snapshots) — don't carry assumptions between engines."
  ],
  terms:[
    {term:"Atomic update vs read-modify-write", desc:"Let the database do the arithmetic and the race disappears.", detail:"<code>SET n = n + 1</code> is applied under the row lock the update itself takes. Reading into the application, adding one, and writing back is a lost-update race at any level below Serializable.", code:`<span class="cm">-- ❌ lost update</span>\nSELECT stock FROM items WHERE id = 1;   <span class="cm">-- 5</span>\nUPDATE items SET stock = 4 WHERE id = 1;\n\n<span class="cm">-- ✅ atomic, no race</span>\nUPDATE items SET stock = stock - 1\nWHERE id = 1 AND stock &gt; 0;`},
    {term:"Optimistic vs pessimistic locking", desc:"Detect-and-retry versus take-the-lock-first.", detail:"Optimistic (a version column, or Serializable's SSI) is best when conflicts are rare — no lock held, but you must handle a retry. Pessimistic (<code>FOR UPDATE</code>) is better under real contention, at the cost of blocking and deadlock risk.", code:`<span class="cm">-- optimistic</span>\nUPDATE orders SET status = 'shipped', version = version + 1\nWHERE id = $1 AND version = $2;   <span class="cm">-- 0 rows ⇒ someone else won, retry</span>\n\n<span class="cm">-- pessimistic</span>\nSELECT * FROM orders WHERE id = $1 FOR UPDATE;`},
    {term:"Serialization failure retry", desc:"Higher isolation moves the burden into your code.", detail:"Wrap the whole transaction in a bounded retry with backoff and jitter, and make sure everything inside is safe to re-execute — no emails sent mid-transaction.", code:`for (let a = 0; a &lt; 3; a++){\n  try { return await tx(work); }\n  catch (e){\n    if (e.code !== '40001') throw e;      <span class="cm">// serialization_failure</span>\n    await sleep(2 ** a * 50 + Math.random() * 50);\n  }\n}`}
  ],
  cards:[
    {q:"Name the four anomalies and the lowest level that prevents each.", a:"<b>Dirty read</b> → Read Committed. <b>Non-repeatable read</b> → Repeatable Read. <b>Phantom read</b> → Serializable (Postgres's Repeatable Read also prevents it). <b>Write skew</b> → Serializable only."},
    {q:"What is write skew?", a:"Two concurrent transactions each read an overlapping set, each make an individually-valid decision, and the combination breaks an invariant — e.g. both doctors go off call because each saw the other still on. No row conflicts, so snapshot isolation can't detect it; only Serializable can."},
    {q:"What's the catch with Serializable?", a:"It doesn't remove conflicts, it converts them into <b>serialization failure errors</b> the application must catch and retry with backoff. Throughput also drops under contention. Use it where a real invariant is at stake."},
    {q:"Postgres Read Committed: can two identical SELECTs in one transaction differ?", a:"Yes. Read Committed takes a fresh snapshot <b>per statement</b>, so anything committed between the two statements becomes visible. That's a non-repeatable read, and it's allowed at this level."}
  ],
  quiz:[
    {q:"Two transactions each check 'at least one doctor on call' and each take a different doctor off call, at Repeatable Read. Result?", options:["Zero on call — write skew, only Serializable prevents it","One stays on call","A deadlock","A unique-constraint violation"], answer:0,
     why:"Neither transaction wrote a row the other read, so snapshot isolation sees no conflict. This is textbook write skew: Serializable (or an explicit <code>FOR UPDATE</code> / constraint) is required."},
    {q:"Which is safe under concurrency?", code:`-- A\nSELECT stock FROM items WHERE id=1;   -- app computes stock-1\nUPDATE items SET stock = $newValue WHERE id=1;\n\n-- B\nUPDATE items SET stock = stock - 1 WHERE id=1 AND stock &gt; 0;`,
     options:["B — the arithmetic happens under the update's row lock","A — the SELECT locks the row","Both","Neither"], answer:0,
     why:"A is a read-modify-write race: two sessions read 5 and both write 4. B is atomic — the update takes the row lock and computes from the current value, and the <code>stock &gt; 0</code> guard prevents going negative."}
  ],
  cheat:[
    {t:'table', head:['Level','Dirty','Non-repeat.','Phantom','Write skew'], rows:[
      ['Read Uncommitted','✔*','✔','✔','✔'],
      ['Read Committed (default)','✘','✔','✔','✔'],
      ['Repeatable Read','✘','✘','✘ (PG)','✔'],
      ['Serializable','✘','✘','✘','✘']
    ]},
    "* Postgres has no Read Uncommitted — it silently gives Read Committed.",
    "Read Committed = fresh snapshot <b>per statement</b>. Repeatable Read = one snapshot per <b>transaction</b>.",
    "<b>Write skew is the level-4 question.</b> Fix: Serializable, <code>FOR UPDATE</code>, or a constraint.",
    "Higher isolation ⇒ <b>serialization failures to retry</b> (SQLSTATE <code>40001</code>), backoff + jitter.",
    "Read-modify-write → make it atomic (<code>SET n = n - 1 WHERE n &gt; 0</code>) or lock.",
    {t:'mnemonic', text:"Anomalies in order of severity: <b>D</b>irty → <b>N</b>on-repeatable → <b>P</b>hantom → <b>S</b>kew. Each level knocks out one more, left to right."}
  ]
},

{ id:'db-mvcc', group:'Transactions', title:'MVCC, locks, deadlocks & vacuum', animate:'sweep',
  lede:"How Postgres lets readers and writers coexist — and the maintenance debt that model creates.",
  say:"MVCC means an UPDATE writes a new row version rather than overwriting, so readers never block writers and writers never block readers — each transaction sees the versions visible to its snapshot. The cost is dead tuples, which VACUUM must reclaim; a long-running transaction holds back the visibility horizon and causes bloat. Locks still exist for writer-writer conflicts, and deadlocks come from acquiring them in inconsistent order.",
  steps:[
    "<b>MVCC</b>: an <code>UPDATE</code> writes a <b>new row version</b> and marks the old one dead. Each version carries the transaction ids that created and deleted it.",
    "A transaction's <b>snapshot</b> determines which versions it can see — so <b>readers never block writers and writers never block readers</b>. Only writer-versus-writer conflicts take locks.",
    "<b>Dead tuples</b> accumulate. <code>VACUUM</code> reclaims them for reuse; <code>autovacuum</code> does this in the background based on churn thresholds.",
    "<b>A long-running transaction holds back the visibility horizon</b> — vacuum cannot remove versions that transaction might still need, so the table bloats. An idle-in-transaction connection is a classic cause.",
    "<b>Bloat</b> means more pages to scan for the same rows: queries slow down and disk grows. <code>VACUUM FULL</code> rewrites the table but takes an exclusive lock; <code>pg_repack</code> does it online.",
    "<b>Row locks</b> (<code>FOR UPDATE</code>, and any UPDATE/DELETE) and <b>table locks</b> (DDL) are what actually block. Watch <code>pg_locks</code> and <code>pg_stat_activity</code>.",
    "<b>Deadlock</b>: T1 holds A and wants B while T2 holds B and wants A. The engine detects the cycle and kills one transaction with a deadlock error.",
    "The fix is <b>consistent lock ordering</b> — always acquire rows in the same order (e.g. sorted by primary key) — plus short transactions and a bounded retry.",
    "MySQL/InnoDB also uses MVCC but with an undo log and next-key (gap) locks, so its blocking behaviour and deadlock patterns differ from Postgres's."
  ],
  code:`<span class="cm">-- who is blocking whom (Postgres)</span>
SELECT pid, state, wait_event_type, now() - xact_start AS age, query
FROM pg_stat_activity
WHERE state &lt;&gt; 'idle' ORDER BY age DESC;

<span class="cm">-- the silent killer: idle in transaction</span>
SELECT pid, now() - state_change AS idle_for, query
FROM pg_stat_activity WHERE state = 'idle in transaction';

<span class="cm">-- consistent ordering prevents deadlocks</span>
SELECT * FROM accounts WHERE id = ANY($1) ORDER BY id FOR UPDATE;

<span class="cm">-- bound the damage</span>
SET lock_timeout = '3s';
SET idle_in_transaction_session_timeout = '30s';
SET statement_timeout = '10s';`,
  traps:[
    "<b>Idle in transaction</b> is the most damaging state a connection can be in: it holds locks and blocks vacuum indefinitely. Always set <code>idle_in_transaction_session_timeout</code>.",
    "<code>UPDATE</code> in Postgres rewrites the whole row (all columns), so updating one column of a wide row still writes a full new version — and updates every index unless HOT applies.",
    "<code>VACUUM FULL</code> takes an ACCESS EXCLUSIVE lock and blocks everything; it is not a routine operation.",
    "Deadlocks are <b>expected</b> under concurrency — detect the error code (<code>40P01</code>) and retry rather than treating each one as a bug.",
    "Adding a column with a volatile default, or many DDL statements, can take table locks that queue behind (and then block) everything.",
    "Autovacuum falling behind shows up first as slowly growing latency, not as an error."
  ],
  terms:[
    {term:"Transaction ID wraparound", desc:"The failure mode that takes a Postgres database offline.", detail:"Transaction ids are 32-bit and wrap. Vacuum 'freezes' old rows to prevent them appearing to be from the future. If autovacuum can't keep up — usually because of a long transaction or a stuck replication slot — Postgres eventually refuses writes to protect the data. Monitor <code>age(datfrozenxid)</code>.", code:`SELECT datname, age(datfrozenxid) AS xid_age\nFROM pg_database ORDER BY xid_age DESC;\n<span class="cm">-- alert well before autovacuum_freeze_max_age (default 200M)</span>`},
    {term:"HOT updates", desc:"Heap-only tuple updates skip index maintenance.", detail:"If the new version fits on the same page and no indexed column changed, Postgres chains it on the page and doesn't touch the indexes — much cheaper. Leaving some <code>fillfactor</code> headroom on update-heavy tables makes HOT updates more likely.", code:`ALTER TABLE sessions SET (fillfactor = 85);  <span class="cm">-- room for HOT updates</span>`},
    {term:"Deadlock retry", desc:"Catch the code, retry with backoff, keep ordering consistent.", detail:"Deadlock is the engine choosing a victim to break a cycle — it's a normal outcome under contention, not necessarily a bug, though repeated deadlocks on the same pair of tables means your lock ordering is inconsistent.", code:`catch (e) {\n  if (e.code === '40P01' || e.code === '40001') return retry();  <span class="cm">// deadlock / serialization</span>\n  throw e;\n}`}
  ],
  cards:[
    {q:"What is MVCC and what does it buy you?", a:"Multi-version concurrency control: updates write a new row version instead of overwriting, and each transaction sees the versions visible to its snapshot. The payoff is that <b>readers never block writers and writers never block readers</b> — only writer-writer conflicts take locks."},
    {q:"Why does a long-running transaction cause table bloat?", a:"Vacuum can only remove row versions no running transaction might still need. A long transaction (or one sitting idle-in-transaction) holds back that horizon, so dead tuples accumulate, tables grow, and scans get slower."},
    {q:"What causes a deadlock and how do you prevent it?", a:"Two transactions acquiring the same locks in opposite order. Prevent it by always acquiring rows in a consistent order (e.g. sorted by primary key), keeping transactions short, and setting <code>lock_timeout</code> — plus a bounded retry, since deadlocks are expected under contention."},
    {q:"What is transaction ID wraparound?", a:"Postgres transaction ids are 32-bit; vacuum must 'freeze' old rows before they wrap and appear to be in the future. If autovacuum can't keep up — long transactions, stuck replication slots — Postgres eventually stops accepting writes to protect data. Monitor <code>age(datfrozenxid)</code>."}
  ],
  quiz:[
    {q:"A Postgres table grows to 40GB while holding only 2GB of live rows, and queries are slowing. Most likely cause?", options:["Bloat — vacuum blocked by a long-running or idle-in-transaction session","Missing indexes","Too many connections","Wrong isolation level"], answer:0,
     why:"Dead tuples aren't being reclaimed because something is holding back the visibility horizon. Find it in <code>pg_stat_activity</code>, set <code>idle_in_transaction_session_timeout</code>, then repack the table."}
  ],
  cheat:[
    "<b>MVCC</b>: update = new row version. Readers ⊥ writers. Only writer-writer conflicts lock.",
    "Cost: dead tuples → <b>VACUUM/autovacuum</b>. Long/idle transactions block it → <b>bloat</b>.",
    "<code>idle_in_transaction_session_timeout</code>, <code>lock_timeout</code>, <code>statement_timeout</code> — set all three.",
    "Deadlock = inconsistent lock order → acquire rows <b>ORDER BY id FOR UPDATE</b>; retry on <code>40P01</code>.",
    "<code>VACUUM FULL</code> = exclusive lock; use <code>pg_repack</code> online.",
    "Watch <code>pg_stat_activity</code>, <code>pg_locks</code>, <code>age(datfrozenxid)</code> (wraparound).",
    "HOT updates skip index writes — leave <code>fillfactor</code> headroom on hot tables."
  ]
},

{ id:'db-index', group:'Performance', title:'Indexing internals: B-trees, composites & selectivity', animate:'btree',
  lede:"The single highest-leverage database skill — and the one most often reduced to 'add an index'.",
  say:"A B-tree index is a balanced structure that turns a full scan into a logarithmic lookup, and it also provides ordering, which is why it can serve ORDER BY and range queries. The details that matter are column order in a composite index — leftmost prefix — selectivity, and the fact that every index makes writes slower and takes space. An index is only used if the planner believes it's cheaper, which is why a function on the column or a low-selectivity predicate silently gives you a sequential scan.",
  steps:[
    "A <b>B-tree</b> keeps keys sorted in a balanced tree, so a lookup is O(log n) page reads instead of scanning every row. Because it's sorted, it also serves <b>range queries</b> and <b>ORDER BY</b> without a sort.",
    "<b>Selectivity</b> decides whether it's worth using: an index that narrows to 1% of rows is great; one that narrows to 40% is usually slower than a sequential scan, because random page reads cost more than sequential ones.",
    "<b>Composite index column order matters.</b> An index on <code>(a, b, c)</code> serves predicates on <code>a</code>, <code>(a,b)</code>, and <code>(a,b,c)</code> — the <b>leftmost prefix</b> — but not on <code>b</code> alone.",
    "Rule of thumb for ordering: <b>equality columns first, then the range/sort column</b>. <code>WHERE tenant = ? AND created_at &gt; ?</code> wants <code>(tenant, created_at)</code>.",
    "A <b>covering index</b> includes every column the query needs (via <code>INCLUDE</code> in Postgres), so the engine answers from the index alone — an <b>index-only scan</b>, no heap access.",
    "<b>Partial indexes</b> index a subset (<code>WHERE deleted_at IS NULL</code>) — much smaller and faster for queries that always carry that predicate.",
    "Other types: <b>GIN</b> for arrays/JSONB/full-text, <b>GiST</b> for geometric and range types, <b>BRIN</b> for huge naturally-ordered tables (time series), <b>hash</b> for equality only.",
    "<b>Every index costs writes</b>: each insert/update/delete must maintain it, and it consumes memory and disk. Unused indexes are pure overhead — find them in <code>pg_stat_user_indexes</code>.",
    "<b>Build indexes concurrently</b> in production (<code>CREATE INDEX CONCURRENTLY</code>) — the plain form takes a lock that blocks writes for the whole build."
  ],
  code:`<span class="cm">-- equality first, then range/sort</span>
CREATE INDEX idx_orders_tenant_created ON orders (tenant_id, created_at DESC);

<span class="cm">-- covering: answers entirely from the index (index-only scan)</span>
CREATE INDEX idx_orders_lookup ON orders (tenant_id, status) INCLUDE (total, created_at);

<span class="cm">-- partial: only the rows you ever query</span>
CREATE INDEX idx_active_users ON users (email) WHERE deleted_at IS NULL;

<span class="cm">-- ❌ function on the column disables the index</span>
WHERE lower(email) = 'a@b.com';
<span class="cm">-- ✅ index the expression instead</span>
CREATE INDEX idx_users_email_lower ON users (lower(email));

<span class="cm">-- never lock the table in production</span>
CREATE INDEX CONCURRENTLY idx_orders_status ON orders (status);

<span class="cm">-- find indexes nobody uses</span>
SELECT relname, indexrelname, idx_scan FROM pg_stat_user_indexes WHERE idx_scan = 0;`,
  traps:[
    "<b>Any function or cast on an indexed column kills the index</b>: <code>lower(email)</code>, <code>date(created_at)</code>, <code>id::text</code>. Index the expression, or rewrite the predicate.",
    "A leading wildcard (<code>LIKE '%foo'</code>) can't use a B-tree. Trailing wildcards can; full-text or trigram indexes handle the rest.",
    "Indexing every column 'to be safe' slows down every write and wastes memory — and the planner still won't use most of them.",
    "<code>OR</code> across different columns often prevents a single index from being used; a <code>UNION ALL</code> of two indexed queries can be dramatically faster.",
    "<code>NULL</code>s and column order in the index must match the <code>ORDER BY</code> direction, or you lose the sort-avoidance benefit.",
    "Adding an index to a huge table without <code>CONCURRENTLY</code> blocks writes for the entire build."
  ],
  terms:[
    {term:"Leftmost prefix rule", desc:"A composite index on (a,b,c) serves a, (a,b), (a,b,c) — not b alone.", detail:"This is why one well-ordered composite index often replaces three single-column ones, and why a query filtering only on the second column mysteriously does a sequential scan.", code:`CREATE INDEX ON t (tenant_id, status, created_at);\n\nWHERE tenant_id = 1                             <span class="cm">-- ✅ uses index</span>\nWHERE tenant_id = 1 AND status = 'open'         <span class="cm">-- ✅</span>\nWHERE status = 'open'                           <span class="cm">-- ❌ no leading column</span>`},
    {term:"Index-only scan", desc:"Answering a query from the index without touching the table.", detail:"Requires every referenced column to be in the index, and the visibility map to be current — which means it depends on vacuum having run. A query that is index-only in staging can hit the heap in production if the table is churning.", code:`CREATE INDEX ON orders (tenant_id) INCLUDE (total);\nSELECT sum(total) FROM orders WHERE tenant_id = 7;\n<span class="cm">-- EXPLAIN: Index Only Scan … Heap Fetches: 0</span>`},
    {term:"When NOT to index", desc:"Low selectivity, tiny tables, write-heavy columns.", detail:"A boolean column with a 50/50 split, a table of 200 rows, or a counter updated on every request are all cases where the index costs more than it saves. Measure with EXPLAIN rather than guessing.", code:`<span class="cm">-- better: partial index on the rare value</span>\nCREATE INDEX ON jobs (created_at) WHERE status = 'failed';`}
  ],
  cards:[
    {q:"How do you order columns in a composite index?", a:"<b>Equality predicates first, then the range or sort column.</b> For <code>WHERE tenant = ? AND created_at > ?</code> use <code>(tenant_id, created_at)</code>. Remember the leftmost-prefix rule: <code>(a,b,c)</code> serves a, (a,b) and (a,b,c) — never b alone."},
    {q:"Why might the planner ignore your index?", a:"Low selectivity (the predicate matches too many rows, so a sequential scan is cheaper), a function or cast wrapping the column, a leading wildcard in LIKE, stale statistics, or the leading column of a composite index not being in the predicate."},
    {q:"What is a covering index / index-only scan?", a:"An index containing every column the query needs (Postgres: <code>INCLUDE (…)</code>), so the engine answers from the index alone without heap lookups. It depends on the visibility map being current, so vacuum affects whether you actually get it."},
    {q:"What does an index cost?", a:"Every insert, update and delete must maintain it; it consumes disk and shared memory; and building it on a large table locks writes unless you use <code>CREATE INDEX CONCURRENTLY</code>. Unused indexes are pure overhead — audit with <code>pg_stat_user_indexes</code>."}
  ],
  quiz:[
    {q:"Index is on <code>(tenant_id, created_at)</code>. Which query cannot use it?", options:["<code>WHERE created_at &gt; now() - interval '1 day'</code>","<code>WHERE tenant_id = 4</code>","<code>WHERE tenant_id = 4 AND created_at &gt; …</code>","<code>WHERE tenant_id = 4 ORDER BY created_at DESC</code>"], answer:0,
     why:"The leftmost-prefix rule: without a predicate on <code>tenant_id</code>, the index's ordering is useless for finding rows by <code>created_at</code> alone."},
    {q:"Why is this slow despite an index on <code>email</code>?", code:`SELECT * FROM users WHERE lower(email) = 'a@b.com';`,
     options:["The function on the column prevents index use","<code>SELECT *</code> is the problem","Email isn't selective enough","The index is corrupt"], answer:0,
     why:"The index stores <code>email</code>, not <code>lower(email)</code>, so the planner can't match the predicate. Create an expression index on <code>lower(email)</code>, or store a normalised column."}
  ],
  cheat:[
    "B-tree = O(log n) lookup <b>+ ordering</b> (range queries, ORDER BY without a sort).",
    "<b>Composite order: equality columns → range/sort column.</b> Leftmost-prefix rule.",
    "Covering (<code>INCLUDE</code>) ⇒ index-only scan (depends on vacuum/visibility map).",
    "Partial index (<code>WHERE deleted_at IS NULL</code>) = smaller and faster.",
    "Types: B-tree · <b>GIN</b> (JSONB/array/FTS) · GiST (geo/range) · <b>BRIN</b> (huge time-ordered) · hash (equality).",
    "<b>Index killers</b>: function/cast on the column, leading <code>%</code>, low selectivity, stale stats.",
    "Every index taxes writes. Audit <code>idx_scan = 0</code>. Always <code>CREATE INDEX CONCURRENTLY</code> in prod."
  ]
},

{ id:'db-explain', group:'Performance', title:'Reading query plans with EXPLAIN', animate:'partition',
  lede:"The difference between guessing and knowing — and it takes about five minutes to learn to read one.",
  say:"<code>EXPLAIN</code> shows the planner's intended plan with estimates; <code>EXPLAIN (ANALYZE, BUFFERS)</code> actually runs it and shows real times and page reads. I read it inside-out, looking for three things: a big gap between estimated and actual rows, which means stale statistics; the node where actual time jumps; and the scan and join types. A sequential scan on a large table, or a nested loop over thousands of rows, is usually the answer.",
  steps:[
    "<code>EXPLAIN</code> shows the plan and <b>estimates</b>. <code>EXPLAIN ANALYZE</code> executes the query and shows <b>actual</b> rows and timings. Add <code>BUFFERS</code> to see page reads — cache hits vs disk.",
    "Read the tree <b>inside-out / bottom-up</b>: the deepest nodes run first and feed their parents.",
    "<b>Scan types</b>: <i>Seq Scan</i> (read everything — fine for small tables, alarming for large ones), <i>Index Scan</i> (index then heap), <i>Index Only Scan</i> (index alone), <i>Bitmap Heap Scan</i> (many matches — collect page ids, then read pages in order).",
    "<b>Join types</b>: <i>Nested Loop</i> (great when the inner side is tiny or indexed, terrible for large × large), <i>Hash Join</i> (build a hash of the smaller side — the usual choice for big unsorted joins), <i>Merge Join</i> (both inputs already sorted).",
    "<b>The single most useful signal</b> is <code>rows=</code> estimated versus <code>actual rows=</code>. A large divergence means the planner is working from bad statistics and every decision above that node is suspect — run <code>ANALYZE</code>.",
    "Watch for <b>Rows Removed by Filter</b>: reading a million rows to return ten means the predicate isn't served by an index.",
    "Watch for <b>external merge Disk</b> in a Sort node — the sort spilled to disk because <code>work_mem</code> is too small for it.",
    "<b>Loops matters</b>: a node showing <code>actual time=0.01 … loops=50000</code> costs 500ms in total, not 0.01ms. Multiply.",
    "Postgres 16+ can show <code>EXPLAIN (ANALYZE, BUFFERS, SETTINGS, WAL)</code>; <code>auto_explain</code> logs plans for slow queries in production, and <code>pg_stat_statements</code> ranks queries by total time."
  ],
  code:`EXPLAIN (ANALYZE, BUFFERS)
SELECT o.id, u.email
FROM orders o JOIN users u ON u.id = o.user_id
WHERE o.tenant_id = 7 AND o.created_at &gt; now() - interval '7 days';

<span class="cm">-- Nested Loop  (cost=… rows=12 width=…) (actual time=0.1..842 rows=48210 loops=1)</span>
<span class="cm">--   -&gt; Seq Scan on orders o  (actual time=0.02..96 rows=48210 loops=1)</span>
<span class="cm">--        Filter: (tenant_id = 7 …)   Rows Removed by Filter: 3104882   ← 🚩</span>
<span class="cm">--   -&gt; Index Scan on users u  (actual time=0.01..0.01 rows=1 loops=48210) ← 🚩 loops!</span>

<span class="cm">-- two red flags: estimate 12 vs actual 48,210 (bad stats),</span>
<span class="cm">-- and a nested loop executing 48,210 times.</span>

ANALYZE orders;                                     <span class="cm">-- refresh statistics</span>
CREATE INDEX CONCURRENTLY ON orders (tenant_id, created_at);

<span class="cm">-- find the worst queries in production</span>
SELECT query, calls, mean_exec_time, total_exec_time
FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;`,
  traps:[
    "<code>EXPLAIN ANALYZE</code> <b>actually runs the query</b> — including <code>UPDATE</code>/<code>DELETE</code>. Wrap it in a transaction you roll back.",
    "Plans depend on data volume and statistics, so a plan from a small dev database tells you very little about production.",
    "Reading only the total cost number is a mistake — costs are arbitrary units, and the useful information is in the per-node actual times and row counts.",
    "A single slow query is rarely the biggest problem: <code>pg_stat_statements</code> sorted by <b>total</b> time often reveals a fast query called a million times.",
    "Raising <code>work_mem</code> globally to avoid disk sorts multiplies across every concurrent connection and can exhaust memory — set it per-session for the query that needs it."
  ],
  terms:[
    {term:"Estimated vs actual rows", desc:"The first thing to look at, every time.", detail:"The planner chooses join and scan strategies from estimated cardinality. If it expects 12 rows and gets 48,000, it will have chosen a nested loop that is now catastrophic. Fix the statistics (<code>ANALYZE</code>, raise <code>default_statistics_target</code>, or add extended statistics for correlated columns) before touching indexes.", code:`CREATE STATISTICS orders_tenant_status (dependencies)\n  ON tenant_id, status FROM orders;\nANALYZE orders;`},
    {term:"pg_stat_statements", desc:"Aggregate query workload view — where to start, before EXPLAIN.", detail:"Ranks normalised queries by total time, calls, rows and cache hit ratio. Sorting by <code>total_exec_time</code> tells you what the database actually spends its day doing, which is frequently not the query anyone complained about.", code:`SELECT substr(query,1,60), calls, round(mean_exec_time::numeric,2) AS avg_ms,\n       round(total_exec_time::numeric) AS total_ms\nFROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 10;`}
  ],
  cards:[
    {q:"What's the first thing you look at in an EXPLAIN ANALYZE?", a:"The gap between <code>rows=</code> (estimated) and <code>actual rows=</code>. A large divergence means the planner is working from bad statistics, so every join and scan choice above that node is suspect. Run <code>ANALYZE</code> before blaming indexes."},
    {q:"EXPLAIN vs EXPLAIN ANALYZE?", a:"<code>EXPLAIN</code> shows the intended plan with estimates and doesn't execute. <code>EXPLAIN ANALYZE</code> runs the query and reports actual row counts and timings — so wrap DML in a transaction you roll back. Add <code>BUFFERS</code> to see cache hits versus disk reads."},
    {q:"When is a Nested Loop join a problem?", a:"When the outer side returns many rows — the inner side executes once per row. Check the <code>loops=</code> count and multiply it by the per-loop time. For large × large joins you want a Hash Join, which usually means fixing the row estimate or adding an index."},
    {q:"Where do you start when 'the database is slow'?", a:"<code>pg_stat_statements</code> ordered by <b>total</b> execution time — that shows where the database actually spends its time, which is often a fast query called a million times rather than the one someone reported."}
  ],
  quiz:[
    {q:"A plan shows <code>rows=15</code> but <code>actual rows=90000</code>, and a Nested Loop above it. First action?", options:["Run ANALYZE — the estimate is wrong, so the join choice is wrong","Increase work_mem","Add a hash index","Rewrite as a subquery"], answer:0,
     why:"The planner picked a nested loop because it expected 15 rows. Fixing the statistics usually flips it to a hash join on its own. Only then consider indexes or rewrites."}
  ],
  cheat:[
    "<code>EXPLAIN (ANALYZE, BUFFERS)</code>; read <b>bottom-up</b>. ANALYZE <b>executes</b> — wrap DML in a rolled-back transaction.",
    "<b>#1 signal: estimated vs actual rows.</b> Big gap ⇒ run <code>ANALYZE</code> / extended statistics.",
    "Scans: Seq · Index · <b>Index Only</b> · Bitmap Heap. Joins: <b>Nested Loop</b> (small/indexed inner) · Hash (big unsorted) · Merge (pre-sorted).",
    "Red flags: <b>Rows Removed by Filter</b>, high <code>loops=</code>, <code>Sort … external merge Disk</code>.",
    "Multiply per-node time by <code>loops</code>.",
    "Start from <b><code>pg_stat_statements</code> by total_exec_time</b>; <code>auto_explain</code> for prod plans."
  ]
},

{ id:'db-slow', group:'Performance', title:'The recurring slow-query patterns', animate:'nplusone',
  lede:"Nearly every database performance incident is one of about eight shapes.",
  say:"The ones I look for first are N+1 queries, unbounded result sets, OFFSET pagination on deep pages, functions wrapping indexed columns, SELECT * pulling large columns, missing indexes on foreign keys, and a chatty ORM hiding all of it. Each has a known fix, and the reason they survive to production is that they're all fast on a development dataset.",
  steps:[
    "<b>N+1 queries</b> — one query for a list, then one per item. Fix with a join, eager loading, or batching into <code>WHERE id IN (…)</code>. (Full topic in the Frameworks track.)",
    "<b>Unbounded queries</b> — no <code>LIMIT</code>, so a table that grew from 10k to 10M rows quietly kills the service. Every list endpoint must paginate.",
    "<b>OFFSET pagination</b> — <code>OFFSET 100000</code> makes the database read and discard 100,000 rows. Use <b>keyset (cursor) pagination</b> on an indexed, unique ordering column instead.",
    "<b>Functions on indexed columns</b> — <code>lower(email)</code>, <code>date(created_at)</code>, <code>id::text</code> all prevent index use. Index the expression, or store a normalised column.",
    "<b><code>SELECT *</code></b> — pulls large TEXT/JSONB columns you don't need, defeats index-only scans, and breaks when the schema changes. Select the columns you use.",
    "<b>Missing indexes on foreign keys</b> — Postgres doesn't create them automatically, and a delete on the parent then scans the whole child table to check references.",
    "<b>Counting everything</b> — <code>SELECT count(*)</code> on a large table is a full scan. Use an approximate count from statistics, or a maintained counter, when an exact number isn't required.",
    "<b>Chatty transactions</b> — a loop of individual inserts instead of one multi-row insert or <code>COPY</code>; each round trip pays network latency.",
    "All of these are <b>invisible in development</b> because the dataset is tiny. Test against production-scale data, log query counts per request, and alert on the outliers."
  ],
  code:`<span class="cm">-- ❌ deep OFFSET: reads and throws away 100,000 rows</span>
SELECT * FROM orders ORDER BY created_at DESC OFFSET 100000 LIMIT 20;

<span class="cm">-- ✅ keyset pagination: constant cost at any depth</span>
SELECT * FROM orders
WHERE (created_at, id) &lt; ($lastCreatedAt, $lastId)   <span class="cm">-- tuple comparison, stable</span>
ORDER BY created_at DESC, id DESC
LIMIT 20;

<span class="cm">-- ❌ N round trips</span>
for (const r of rows) await db.query('INSERT INTO t VALUES ($1)', [r]);

<span class="cm">-- ✅ one round trip</span>
INSERT INTO t (a, b) SELECT * FROM unnest($1::int[], $2::text[]);

<span class="cm">-- approximate count, instant</span>
SELECT reltuples::bigint FROM pg_class WHERE relname = 'orders';`,
  traps:[
    "Keyset pagination needs a <b>unique, stable</b> ordering key — order by <code>(created_at, id)</code>, not <code>created_at</code> alone, or rows with identical timestamps are skipped or repeated.",
    "Keyset pagination can't jump to page 57. If the product genuinely needs numbered pages, cap the depth or use a different UX.",
    "An ORM's lazy relations turn a property access into a query inside a loop — N+1 that looks like ordinary object code.",
    "Adding <code>LIMIT</code> without <code>ORDER BY</code> gives non-deterministic results across runs.",
    "`SELECT *` through an ORM often also fetches TOASTed large columns, multiplying the bytes transferred for no benefit."
  ],
  terms:[
    {term:"Keyset (cursor) pagination", desc:"Page from the last row's sort key rather than an offset.", detail:"Cost is constant regardless of depth because the index seeks directly to the position — and it's stable under concurrent inserts, unlike OFFSET, which shifts rows between pages.", code:`<span class="cm">-- index that makes it O(1) per page</span>\nCREATE INDEX ON orders (created_at DESC, id DESC);\n<span class="cm">-- cursor = base64 of (created_at, id) of the last row</span>`},
    {term:"Query-count-per-request", desc:"The cheapest instrumentation that catches N+1 in production.", detail:"Count queries per request in a middleware or ORM hook, attach it to the request log, and alert on requests above a threshold. Traces show the same thing as a long fan of identical spans.", code:`app.use((req, res, next) =&gt; {\n  req.dbQueries = 0;\n  res.on('finish', () =&gt; {\n    if (req.dbQueries &gt; 20) logger.warn({ route: req.route?.path, n: req.dbQueries }, 'query fan-out');\n  });\n  next();\n});`}
  ],
  cards:[
    {q:"Why is OFFSET pagination slow at depth, and what replaces it?", a:"The database must read and discard every skipped row, so cost grows linearly with the offset. Keyset (cursor) pagination seeks straight to the last row's sort key — constant cost at any depth, and stable under concurrent inserts."},
    {q:"What must the ordering key be for keyset pagination?", a:"Unique and stable. Order by a tuple that includes the primary key — <code>(created_at, id)</code> — otherwise rows sharing a timestamp get skipped or duplicated across pages."},
    {q:"Why do these problems only appear in production?", a:"They're all O(n) or O(n²) in data volume, and development datasets are tiny. 201 queries against 200 rows is fast; against 200,000 it isn't. Test against production-scale data and instrument query count per request."},
    {q:"Name three things that silently disable an index.", a:"A function or cast on the column (<code>lower(email)</code>, <code>id::text</code>), a leading wildcard in <code>LIKE '%x'</code>, and a predicate that isn't selective enough for the planner to prefer the index over a sequential scan. Stale statistics do it too."}
  ],
  quiz:[
    {q:"An endpoint is fast on page 1 and takes 8 seconds on page 5000. Cause?", options:["OFFSET pagination — the database reads and discards all skipped rows","Missing connection pool","Lock contention","Too many indexes"], answer:0,
     why:"OFFSET cost grows with depth. Keyset pagination against an index on the ordering tuple makes every page cost the same."}
  ],
  cheat:[
    "<b>N+1</b> → join / eager load / <code>IN (…)</code> batch.",
    "<b>No LIMIT</b> → every list endpoint paginates.",
    "<b>Deep OFFSET</b> → keyset pagination on <code>(sort_col, id)</code> with a matching index.",
    "<b>Function on column</b> → expression index or normalised column.",
    "<b><code>SELECT *</code></b> → name the columns (also enables index-only scans).",
    "<b>Unindexed FKs</b> → Postgres doesn't add them; parent deletes then scan the child.",
    "<b>count(*)</b> on big tables → approximate via <code>reltuples</code> or a maintained counter.",
    "<b>Row-at-a-time inserts</b> → multi-row INSERT / <code>COPY</code> / <code>unnest</code>.",
    "All invisible in dev ⇒ test at scale + log query count per request."
  ]
},

{ id:'db-replication', group:'Scale', title:'Replication, read replicas & failover', animate:'loadbalance',
  lede:"The first scaling move for reads — and the first place where 'I just wrote that' stops being true.",
  say:"Streaming replication ships the WAL from the primary to replicas. Async replication is the default: commits don't wait for replicas, so replicas lag, and a read immediately after a write can miss it. That read-your-own-writes problem is the thing to design around — route reads that must be fresh to the primary, or wait for the replica's LSN. Synchronous replication removes the lag at the cost of commit latency and availability.",
  steps:[
    "<b>Streaming replication</b> continuously ships WAL records from the primary to replicas, which replay them. Replicas are read-only.",
    "<b>Asynchronous</b> (the default): the primary commits without waiting for replicas. Fast, but replicas lag — typically milliseconds, sometimes far more under load or long queries.",
    "<b>Synchronous</b>: commit waits for at least one replica to confirm. No data loss on failover, but every write pays the network round trip, and losing the sync replica can stall writes.",
    "<b>Read replicas</b> scale reads, not writes. All writes still go to the single primary — that's the ceiling that eventually forces sharding or a different datastore.",
    "<b>Replication lag is the operational metric.</b> Monitor it in seconds and bytes; alert before it becomes user-visible.",
    "<b>Read-your-own-writes</b> is the classic bug: user updates their profile, the next request reads a replica, and the change 'didn't save'. Fixes: route that user's reads to the primary for a short window, wait for the replica to reach the write's LSN, or read from the primary for anything the user just changed.",
    "<b>Failover</b> promotes a replica. With async replication you can lose the unreplicated tail; managed services (RDS Multi-AZ, Aurora) automate promotion and DNS/endpoint switching.",
    "<b>Logical replication</b> ships row-level changes rather than physical WAL, which allows replicating a subset of tables, replicating across major versions, and feeding CDC pipelines.",
    "Long-running queries on a replica can conflict with replay; Postgres either cancels them or delays replay (<code>hot_standby_feedback</code>), which then causes bloat on the primary — a trade-off worth knowing."
  ],
  code:`<span class="cm">-- lag on the replica</span>
SELECT now() - pg_last_xact_replay_timestamp() AS replica_lag;

<span class="cm">-- read-your-own-writes: remember the write position…</span>
const { lsn } = await primary.query('SELECT pg_current_wal_lsn() AS lsn');

<span class="cm">-- …and only read from a replica that has caught up</span>
SELECT pg_last_wal_replay_lsn() &gt;= $1 AS caught_up;

<span class="cm">-- application-level routing</span>
const db = (needsFresh) =&gt; needsFresh ? primaryPool : replicaPool;
await db(justWrote).query('SELECT * FROM profile WHERE user_id = $1', [id]);`,
  traps:[
    "Routing <i>all</i> reads to replicas without thinking causes intermittent 'my change disappeared' bug reports that are almost impossible to reproduce.",
    "Replicas don't help write throughput at all — if writes are the bottleneck, replicas are the wrong tool.",
    "A replica used for heavy analytics can fall far behind, so it's also serving stale data to your application reads. Use a dedicated replica for reporting.",
    "Async failover can lose recently committed transactions. If that's unacceptable, you need synchronous replication and must accept its latency and availability cost.",
    "A stuck logical replication slot retains WAL forever and can fill the primary's disk — a genuinely common outage cause."
  ],
  terms:[
    {term:"Read-your-own-writes", desc:"A consistency guarantee that async replication breaks.", detail:"The cheapest practical fix is a short sticky window: after a write, route that user's reads to the primary for a few seconds. The precise fix is LSN-based: record the write's LSN and only use a replica that has replayed at least that far.", code:`<span class="cm">// sticky window, stored in the session/cookie</span>\nif (Date.now() - session.lastWriteAt &lt; 5000) usePrimary();`},
    {term:"Logical vs physical replication", desc:"Row-level changes vs byte-level WAL.", detail:"Physical is exact and cheap but all-or-nothing and version-locked. Logical decodes WAL into row changes, enabling selective replication, cross-version upgrades, and change-data-capture into Kafka/Kinesis or a search index.", code:`CREATE PUBLICATION orders_pub FOR TABLE orders, order_items;\n<span class="cm">-- consumer: CREATE SUBSCRIPTION … or a CDC tool (Debezium/DMS)</span>`}
  ],
  cards:[
    {q:"What does a read replica actually scale?", a:"Reads only. Every write still goes through the single primary, so replicas move the read ceiling but not the write ceiling — when writes saturate, you need partitioning/sharding or a different datastore."},
    {q:"What is read-your-own-writes and how do you fix it?", a:"With async replication, a read routed to a replica right after a write can miss it, so the user thinks their change didn't save. Fix by routing that user's reads to the primary for a short sticky window, or by recording the write's LSN and only using a replica that has replayed past it."},
    {q:"Sync vs async replication trade-off?", a:"Async: fast commits, replicas lag, and a failover can lose the unreplicated tail. Sync: no data loss on failover, but every commit pays a network round trip and losing the sync replica can stall writes entirely."},
    {q:"What is logical replication used for?", a:"Row-level change streams: replicating a subset of tables, cross-major-version upgrades, and change-data-capture into a search index, warehouse or event stream. Watch out for stuck slots retaining WAL and filling the primary's disk."}
  ],
  quiz:[
    {q:"Users report that profile edits 'don't save', but only sometimes. Reads go to a replica. Most likely cause?", options:["Async replication lag — the read hit a replica before the write replicated","Transaction not committed","Missing index","Connection pool exhaustion"], answer:0,
     why:"Classic read-your-own-writes violation. Route post-write reads to the primary for a short window, or gate the replica read on its replayed LSN."}
  ],
  cheat:[
    "Streaming replication ships <b>WAL</b>; replicas are read-only.",
    "<b>Async (default)</b>: fast commit, lag, possible data loss on failover. <b>Sync</b>: no loss, slower commits, availability risk.",
    "Replicas scale <b>reads only</b>. Writes remain single-primary.",
    "<b>Read-your-own-writes</b>: sticky-to-primary window, or gate on replayed LSN.",
    "Monitor lag (seconds <i>and</i> bytes). Dedicated replica for analytics.",
    "<b>Logical</b> replication = row-level → CDC, subsets, cross-version. Stuck slots fill the disk."
  ]
},

{ id:'db-sharding', group:'Scale', title:'Partitioning, sharding & consistent hashing', animate:'shard',
  lede:"When one primary can't take the writes any more — and why this is the last resort, not the first.",
  say:"Partitioning splits one table inside one database, usually by time, and mainly buys cheap data lifecycle and better pruning. Sharding splits data across separate databases and is what actually scales writes — at the cost of losing cross-shard joins, transactions and easy re-balancing. Shard key choice is everything: it must be high-cardinality, evenly distributed, and present in almost every query. Consistent hashing is what keeps re-sharding from moving all the data.",
  steps:[
    "<b>Partitioning</b> (declarative, in Postgres) splits one logical table into child tables by range, list or hash — inside a single database. The planner prunes irrelevant partitions.",
    "The biggest practical win of partitioning is <b>data lifecycle</b>: dropping last year's partition is instant, whereas <code>DELETE</code> of a billion rows is a bloat event.",
    "<b>Sharding</b> distributes data across <b>separate databases</b>. It's what actually scales writes, and it's a significant architectural commitment.",
    "<b>Shard key</b> requirements: high cardinality, even distribution, and present in nearly every query — because a query without it must fan out to every shard.",
    "Common keys: <b>tenant/customer id</b> (natural isolation, but a huge tenant becomes a hot shard), <b>user id</b>, or a <b>hash</b> of the id (even distribution, no range queries).",
    "What you give up: <b>cross-shard joins, foreign keys and transactions</b>. Cross-shard consistency needs a saga or two-phase commit; both are complex.",
    "<b>Consistent hashing</b> maps shards and keys onto a ring so that adding a shard moves only ~1/n of the keys, instead of the total reshuffle that <code>hash % n</code> causes. <b>Virtual nodes</b> smooth out the distribution.",
    "An alternative to hashing is a <b>lookup/directory service</b> mapping key → shard: more flexible (you can move a single tenant), at the cost of an extra hop and a component to keep available.",
    "<b>Exhaust the cheaper options first</b>: indexes, caching, read replicas, partitioning, archiving cold data, and moving the write-heavy table to a datastore designed for it."
  ],
  code:`<span class="cm">-- declarative partitioning by month (one database)</span>
CREATE TABLE events (id bigint, tenant_id int, created_at timestamptz, payload jsonb)
  PARTITION BY RANGE (created_at);
CREATE TABLE events_2026_09 PARTITION OF events
  FOR VALUES FROM ('2026-09-01') TO ('2026-10-01');

DROP TABLE events_2025_09;      <span class="cm">-- instant retention, no bloat</span>

<span class="cm">// consistent hashing with virtual nodes</span>
class Ring {
  constructor(shards, vnodes = 150){
    this.ring = shards.flatMap(s =&gt;
      Array.from({length: vnodes}, (_, i) =&gt; ({ hash: hash(\`\${s}#\${i}\`), shard: s })))
      .sort((a, b) =&gt; a.hash - b.hash);
  }
  locate(key){
    const h = hash(key);
    return (this.ring.find(n =&gt; n.hash &gt;= h) ?? this.ring[0]).shard;
  }
}
<span class="cm">// adding a shard moves ~1/n of keys — not all of them</span>`,
  traps:[
    "<b>Sharding is very hard to undo.</b> Every cheaper option — indexes, caching, replicas, partitioning, archiving — should be exhausted first.",
    "A query without the shard key must fan out to every shard and merge results in the application — slow, and it gets slower with each shard added.",
    "<code>hash(key) % n</code> re-maps almost every key when <code>n</code> changes. Consistent hashing exists precisely to avoid that.",
    "Tenant-based sharding produces hot shards when one customer is 100× the others; you need the ability to move or split a single tenant.",
    "Partitioning with too many partitions (thousands) slows planning; and every partition needs its own indexes.",
    "Cross-shard reporting queries usually need a separate analytics store rather than being answered from the shards."
  ],
  terms:[
    {term:"Consistent hashing", desc:"Ring mapping so adding/removing a node moves only ~1/n of keys.", detail:"Both shards and keys are hashed onto the same ring; a key belongs to the first node clockwise. Virtual nodes (many ring positions per physical node) prevent uneven distribution and make removal spread across all remaining nodes.", code:`<span class="cm">// modulo: 4 → 5 shards remaps ~80% of keys</span>\n<span class="cm">// consistent hashing: remaps ~20%</span>`},
    {term:"Partitioning vs sharding", desc:"One database with child tables vs many databases.", detail:"Partitioning is a query-planning and maintenance feature — same connection, same transactions, same joins. Sharding is a distribution strategy that removes cross-shard transactions and joins entirely. They're often confused in interviews.", code:`<span class="cm">-- partitioning: still one DB, joins and transactions work</span>\nSELECT * FROM events WHERE created_at &gt;= '2026-09-01';  <span class="cm">-- prunes to one partition</span>`}
  ],
  cards:[
    {q:"Partitioning vs sharding?", a:"Partitioning splits one table into child tables <b>within one database</b> — joins, foreign keys and transactions still work, and you gain pruning plus instant retention by dropping partitions. Sharding splits data across <b>separate databases</b> to scale writes, and gives up cross-shard joins, FKs and transactions."},
    {q:"What makes a good shard key?", a:"High cardinality, even distribution, and present in almost every query — because a query lacking it must fan out to all shards. Tenant id is natural but risks hot shards; a hash of the id distributes evenly but loses range queries."},
    {q:"Why consistent hashing instead of <code>hash % n</code>?", a:"With modulo, changing the shard count remaps nearly every key, requiring a full data migration. Consistent hashing places nodes and keys on a ring so adding or removing a node moves only about 1/n of the keys; virtual nodes keep the distribution even."},
    {q:"What should you try before sharding?", a:"Indexes and query fixes, caching, read replicas, table partitioning, archiving cold data, and moving the write-heavy workload to a datastore built for it. Sharding is a large, hard-to-reverse commitment."}
  ],
  quiz:[
    {q:"A sharded system uses <code>hash(user_id) % 8</code>. Adding a 9th shard requires…", options:["Moving roughly 89% of all keys","Moving 1/9 of keys","No data movement","Only new writes to move"], answer:0,
     why:"Modulo remaps nearly every key when the divisor changes. Consistent hashing would move only about 1/9 of the data — which is exactly the problem it was designed to solve."}
  ],
  cheat:[
    "<b>Partitioning</b> = child tables, one DB → pruning + <b>instant retention via DROP</b>. Joins/transactions intact.",
    "<b>Sharding</b> = separate DBs → scales <b>writes</b>. Loses cross-shard joins, FKs, transactions.",
    "Shard key: high cardinality · even · <b>in almost every query</b> (else fan-out).",
    "<code>hash % n</code> remaps ~everything on resize → <b>consistent hashing + virtual nodes</b> (~1/n moves).",
    "Directory/lookup service = flexible (move one tenant) + an extra hop.",
    "<b>Try first</b>: indexes → cache → replicas → partitioning → archive → different datastore."
  ]
},

{ id:'db-modelling', group:'Scale', title:'Schema design: normalisation & when to denormalise', animate:'normalise',
  lede:"Normalise until it hurts, denormalise until it works — with the reasons for each step.",
  say:"Normalisation removes duplication so a fact lives in exactly one place, which makes updates safe and constraints enforceable. I start there, then denormalise deliberately where a read path is hot and the duplicated data changes rarely — accepting that I now own keeping the copies in sync. Constraints belong in the database, because application-level validation can't survive concurrency or a second writer.",
  steps:[
    "<b>1NF</b> — atomic column values, no repeating groups. <b>2NF</b> — no partial dependency on part of a composite key. <b>3NF</b> — no transitive dependency: non-key columns depend only on the key.",
    "The practical summary: <b>every fact lives in exactly one place</b>. Then an update touches one row and can't leave inconsistent copies behind.",
    "<b>Denormalise deliberately</b>, for a specific hot read path — a stored <code>order_total</code>, a cached <code>comment_count</code>, a duplicated <code>customer_name</code> on an invoice.",
    "Every denormalisation creates a <b>synchronisation obligation</b>. Decide up front how it's maintained: a trigger, application code in the same transaction, or a background job, and how you'd detect drift.",
    "Some duplication is not denormalisation but <b>correctness</b>: an invoice must store the price and address <i>as they were</i>, not join to a table that has since changed.",
    "<b>Put constraints in the database</b> — not null, foreign keys, unique, check. Application validation cannot hold under concurrency, and there's always a second writer eventually (a script, a migration, another service).",
    "<b>Choose types precisely</b>: <code>timestamptz</code> not <code>timestamp</code>, <code>numeric</code> for money (never float), <code>text</code> over arbitrary <code>varchar(n)</code> limits, native <code>uuid</code>, and enums or a lookup table rather than free-text status.",
    "<b>JSONB</b> is excellent for genuinely variable attributes and terrible as a way to avoid designing a schema — you lose constraints, cheap column stats, and clear query plans. Index it with GIN when you do use it.",
    "<b>Surrogate vs natural keys</b>: prefer a surrogate primary key; if you use UUIDs at scale, use a time-ordered variant (UUIDv7) so inserts don't fragment the index."
  ],
  code:`<span class="cm">-- normalised: the customer's name lives in one place</span>
CREATE TABLE customers (id bigserial PRIMARY KEY, name text NOT NULL);
CREATE TABLE orders (
  id          bigserial PRIMARY KEY,
  customer_id bigint NOT NULL REFERENCES customers(id),
  placed_at   timestamptz NOT NULL DEFAULT now(),
  total_cents bigint NOT NULL CHECK (total_cents &gt;= 0)   <span class="cm">-- money as integers</span>
);
CREATE INDEX ON orders (customer_id);          <span class="cm">-- FKs are NOT auto-indexed</span>

<span class="cm">-- correctness duplication: the invoice keeps the values as they were</span>
CREATE TABLE invoice_lines (
  invoice_id bigint REFERENCES invoices(id),
  sku        text NOT NULL,
  description text NOT NULL,        <span class="cm">-- snapshot, not a join</span>
  unit_price_cents bigint NOT NULL  <span class="cm">-- price at time of sale</span>
);

<span class="cm">-- deliberate denormalisation, with the sync obligation stated</span>
ALTER TABLE posts ADD COLUMN comment_count int NOT NULL DEFAULT 0;
<span class="cm">-- maintained by trigger on comments; reconciled nightly</span>`,
  traps:[
    "<b>Floats for money.</b> <code>0.1 + 0.2 ≠ 0.3</code> in binary floating point. Use integer minor units or <code>numeric</code>.",
    "<code>timestamp</code> without time zone loses the offset and produces bugs that only appear across DST or regions. Use <code>timestamptz</code> and store UTC.",
    "Postgres does <b>not</b> index foreign keys automatically — deletes on the parent then scan the whole child table.",
    "Using JSONB to skip schema design means no constraints, poor statistics, and queries the planner can't optimise well.",
    "Random UUIDv4 primary keys on a large, insert-heavy table fragment the B-tree and hurt cache locality; UUIDv7 (time-ordered) avoids most of it.",
    "A denormalised counter with no reconciliation job drifts silently, and nobody notices until a customer does."
  ],
  terms:[
    {term:"Denormalisation with a sync plan", desc:"Never duplicate data without deciding how it stays correct.", detail:"The three options are: maintain it in the same transaction (correct, slightly slower writes), a database trigger (correct, invisible to application developers), or an async job (fast, eventually consistent, needs reconciliation). Pick one explicitly and write down how drift is detected.", code:`CREATE FUNCTION bump_count() RETURNS trigger AS $$\nBEGIN\n  UPDATE posts SET comment_count = comment_count + 1 WHERE id = NEW.post_id;\n  RETURN NEW;\nEND $$ LANGUAGE plpgsql;\nCREATE TRIGGER t AFTER INSERT ON comments FOR EACH ROW EXECUTE FUNCTION bump_count();`},
    {term:"Constraints as the last line of defence", desc:"The only validation that survives concurrency and a second writer.", detail:"A uniqueness check done as SELECT-then-INSERT is a race; a unique index is not. Application validation is for good error messages; the constraint is for correctness.", code:`<span class="cm">-- race-free uniqueness, including case-insensitive</span>\nCREATE UNIQUE INDEX ON users (lower(email));\n\n<span class="cm">-- exclusion constraint: no overlapping bookings for a room</span>\nALTER TABLE bookings ADD EXCLUDE USING gist\n  (room_id WITH =, during WITH &amp;&amp;);`}
  ],
  cards:[
    {q:"Summarise 3NF in one sentence.", a:"Every non-key column depends on the key, the whole key, and nothing but the key — i.e. each fact is stored in exactly one place, so an update touches one row and can't leave inconsistent duplicates."},
    {q:"When should you denormalise?", a:"For a specific hot read path where the duplicated data changes rarely, and only after deciding how the copy is kept in sync (same transaction, trigger, or reconciled background job) and how drift would be detected."},
    {q:"Is storing a product's price on the invoice line denormalisation?", a:"No — that's correctness. An invoice must record the price and address <i>as they were at the time</i>, not join to a table whose values have since changed. Historical snapshots are a different concept from duplicated current state."},
    {q:"Name four schema type choices people get wrong.", a:"Floats for money (use integer minor units or <code>numeric</code>); <code>timestamp</code> instead of <code>timestamptz</code>; free-text status instead of an enum or lookup table; and random UUIDv4 primary keys on large insert-heavy tables (use UUIDv7)."}
  ],
  quiz:[
    {q:"Deleting a customer takes 40 seconds on a table with a million orders. Most likely cause?", options:["No index on the orders.customer_id foreign key","Missing primary key","Wrong isolation level","Table bloat"], answer:0,
     why:"Postgres doesn't index foreign key columns automatically. To enforce the reference on delete it must scan the child table. Index every FK column you delete or join on."}
  ],
  cheat:[
    "Normalise to 3NF: <b>each fact in exactly one place</b>. Denormalise <b>deliberately</b>, with a stated sync mechanism.",
    "Historical snapshots (invoice price/address) = correctness, not denormalisation.",
    "<b>Constraints belong in the DB</b>: NOT NULL, FK, UNIQUE (incl. expression), CHECK, EXCLUDE.",
    "Types: <code>timestamptz</code> · money as <b>integer minor units</b>/<code>numeric</code> · <code>text</code> · native <code>uuid</code> (UUIDv7 at scale) · enum/lookup for status.",
    "<b>Postgres does not index FKs</b> — add them yourself.",
    "JSONB for genuinely variable attributes only; index with GIN."
  ]
},

{ id:'db-choose', group:'Scale', title:'Choosing a datastore: SQL, document, key-value, columnar', animate:'datastore',
  lede:"The question isn't which database is best — it's which access patterns you need and which guarantees you can give up.",
  say:"I start from access patterns and guarantees, not from the product. Relational when the data is relational and you need ad-hoc queries plus transactions — which is most business software. Key-value or document when the access pattern is known, single-entity and needs predictable latency at scale. Columnar when the workload is analytical scans over huge datasets. And the honest default is Postgres, because it now covers JSON, full-text, geospatial and queues well enough that a second datastore has to earn its operational cost.",
  steps:[
    "<b>Relational (Postgres, MySQL, Aurora)</b> — strong consistency, transactions, joins, ad-hoc queries, constraints. Best default for business data, and it scales further than most people assume.",
    "<b>Key-value / wide-column (DynamoDB, Cassandra)</b> — predictable single-digit-millisecond latency at any scale, but you must design around known access patterns; ad-hoc queries and joins are not available.",
    "<b>Document (MongoDB, DocumentDB)</b> — flexible nested documents; good when the aggregate is naturally one document. Weak fit when you keep needing cross-document joins.",
    "<b>Columnar / analytical (Redshift, BigQuery, ClickHouse, Athena over Parquet)</b> — scans and aggregates over billions of rows; terrible for single-row OLTP lookups.",
    "<b>Search (OpenSearch, Elasticsearch)</b> — relevance ranking, fuzzy matching, facets. A derived index, never the system of record.",
    "<b>In-memory (Redis, ElastiCache)</b> — caching, counters, rate limiting, leaderboards, locks, ephemeral state. Persistence exists but treat it as a cache unless you've thought hard about it.",
    "The real questions to ask: <i>what are the access patterns? read/write ratio? consistency requirement? data volume and growth? query flexibility needed later? who operates it?</i>",
    "<b>Polyglot persistence has a real cost</b>: every extra store adds operations, backups, failover, monitoring, a consistency boundary and an on-call burden. Each one must earn that.",
    "The commonest sound architecture is <b>Postgres as the system of record</b>, plus Redis for cache/ephemeral state, plus a search index or analytics store fed by CDC."
  ],
  code:`<span class="cm">-- Postgres covers more than people expect:</span>
SELECT * FROM docs WHERE attrs @&gt; '{"tier":"pro"}';       <span class="cm">-- JSONB + GIN</span>
SELECT * FROM articles
  WHERE to_tsvector('english', body) @@ plainto_tsquery('serverless');  <span class="cm">-- full text</span>
SELECT * FROM stores ORDER BY location &lt;-&gt; point(6.9,79.8) LIMIT 5;     <span class="cm">-- PostGIS</span>
SELECT * FROM jobs WHERE status='queued'
  ORDER BY id FOR UPDATE SKIP LOCKED LIMIT 10;             <span class="cm">-- a real work queue</span>

<span class="cm">-- the common shape</span>
<span class="cm">Postgres (source of truth) --CDC--&gt; OpenSearch (search)</span>
<span class="cm">                           --CDC--&gt; S3/Parquet + Athena (analytics)</span>
<span class="cm">        Redis (cache, rate limits, locks, sessions)</span>`,
  traps:[
    "Choosing a datastore for its scaling story when your data is 20GB and relational is the most common over-engineering mistake in this area.",
    "Using a search index as the system of record — it's a derived, eventually-consistent, lossy view.",
    "Adding a second datastore without deciding how the two stay consistent creates a permanent class of 'the data doesn't match' bugs.",
    "'NoSQL is faster' is only true for the access patterns it was modelled for; an unmodelled query pattern can be far worse than SQL.",
    "Ignoring the operational cost: backups, restores tested, failover, version upgrades, monitoring and someone who understands it at 3am."
  ],
  table:{title:'Fit by workload', head:['Need','Reach for'], rows:[
    ['Transactions, joins, ad-hoc queries','Relational (Postgres/Aurora)'],
    ['Known key-based access at massive scale','DynamoDB / Cassandra'],
    ['Naturally document-shaped aggregates','Document store'],
    ['Aggregates over billions of rows','Columnar / Athena over Parquet'],
    ['Relevance, fuzzy match, facets','Search index (derived)'],
    ['Cache, counters, locks, sessions','Redis'],
    ['Ordered, replayable event stream','Kinesis / Kafka']
  ]},
  cards:[
    {q:"How do you choose a datastore in an interview?", a:"Work from requirements, not products: access patterns, read/write ratio, consistency requirement, data volume and growth, how much query flexibility you'll need later, and who operates it. Then name the trade-off you're accepting."},
    {q:"What's the strongest argument for defaulting to Postgres?", a:"It covers relational data, JSONB, full-text search, geospatial, and even a workable job queue (<code>FOR UPDATE SKIP LOCKED</code>), with real transactions and constraints. A second datastore has to earn its operational cost — backups, failover, monitoring, expertise."},
    {q:"When is DynamoDB the right call over Postgres?", a:"When access patterns are known and key-based, you need predictable single-digit-millisecond latency at very large scale with no capacity planning, and you can accept losing joins and ad-hoc queries. If you'll need unanticipated query shapes, that's a strong argument the other way."},
    {q:"What's the hidden cost of polyglot persistence?", a:"Each store adds operations, backups and restore testing, failover, upgrades, monitoring, on-call knowledge — and a consistency boundary between it and the source of truth that becomes a permanent source of bugs."}
  ],
  quiz:[
    {q:"A team wants DynamoDB for a 15GB relational dataset with evolving reporting requirements. Best advice?", options:["Use a relational database — query flexibility is the actual requirement","DynamoDB, it scales better","MongoDB for flexibility","Split across both"], answer:0,
     why:"DynamoDB requires access patterns to be known up front; evolving ad-hoc reporting is precisely what it's bad at. At 15GB, scale is not the constraint — query flexibility is."}
  ],
  cheat:[
    "Choose from <b>access patterns + guarantees</b>, never from the product name.",
    "Relational = transactions, joins, ad-hoc. KV/wide-column = known key access at scale. Document = natural aggregates. Columnar = big scans. Search = derived index. Redis = cache/counters/locks.",
    "<b>Default to Postgres</b> — JSONB, FTS, PostGIS, <code>FOR UPDATE SKIP LOCKED</code> queue all included.",
    "Common shape: Postgres (truth) + Redis (cache) + CDC → search / analytics.",
    "Every extra store costs ops, backups, failover, monitoring, on-call <b>and a consistency boundary</b>.",
    "Never make a search index the system of record."
  ]
},
