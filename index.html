const tsTopics = [
{ id:'ts-basics', title:'Type system basics', animate:'typeflow',
  lede:"TypeScript adds a static type layer on top of JS — types exist only while you're writing code and vanish completely once compiled to plain JavaScript.",
  steps:[
    "TypeScript is <b>structurally typed</b> — two types are compatible if their shapes match, not because they share a declared name (unlike Java/C#'s nominal typing).",
    "<b>Type inference</b> means you often don't need to annotate everything — <code>let x = 5</code> infers <code>number</code> automatically without writing <code>: number</code>.",
    "<code>any</code> disables type checking entirely for that value — it's an escape hatch, not a type, and defeats the whole purpose if overused.",
    "<code>unknown</code> is the type-safe alternative to <code>any</code> — you can assign anything to it, but you can't use it until you narrow it with a check first.",
    "<code>never</code> represents a value that can never occur — the return type of a function that always throws, or the type of an unreachable branch after exhaustive checks.",
    "TypeScript is <b>erased at compile time</b> — types add zero runtime cost and zero runtime behavior; the compiled JS has no trace of them at all.",
    "<code>strict</code> mode (in tsconfig.json) turns on a bundle of stricter checks — including <code>strictNullChecks</code>, which stops <code>null</code>/<code>undefined</code> from silently being assignable to every other type.",
    "Because types are erased at compile time, they provide <b>zero protection against data crossing a real boundary</b> — an API response, form input, or LLM output can be typed however you like and still not match at runtime.",
    "Libraries like <b>zod</b> solve this by defining a schema once and deriving both the <b>runtime check</b> and the <b>static type</b> from that single source of truth — no risk of the two drifting apart over time."
  ],
  code:`let age = 25;              <span class="cm">// inferred as number</span>\nlet name: string = 'Kai';  <span class="cm">// explicit annotation</span>\n\nfunction fail(): never {\n  throw new Error('always throws');\n}`,
  note:{type:'warn', text:"<b>Why you'd still validate at runtime even with types:</b> TypeScript's checks disappear entirely once compiled — an <code>as SomeType</code> assertion, or JSON parsed from an external API/LLM response, is trusted by the compiler but never actually verified. If that data doesn't match the shape you claimed, you get a runtime crash somewhere downstream with no compile-time warning at all. Runtime validation (zod, io-ts, or a manual check) is the only real guarantee for anything crossing a process/network boundary."},
  terms:[
    {term:"Structural typing", desc:"Compatibility based on shape, not declared type name.", detail:"This means two completely unrelated interfaces are interchangeable as long as their properties line up — TypeScript calls this 'duck typing' at compile time.", code:`interface Point { x: number; y: number; }\nfunction log(p: Point) { console.log(p.x, p.y); }\nlog({ x: 1, y: 2, z: 3 });  <span class="cm">// OK — has at least x and y</span>`},
    {term:"any vs unknown", desc:"any bypasses checking entirely; unknown forces you to narrow before use.", detail:"Prefer unknown for values from outside your control (API responses, JSON.parse results) — it protects you from accidentally treating untrusted data as if its shape were guaranteed.", code:`function handle(val: unknown) {\n  if (typeof val === 'string') {\n    val.toUpperCase();  <span class="cm">// OK — narrowed to string</span>\n  }\n}`},
    {term:"Runtime validation (zod)", desc:"Deriving both a runtime check and a static type from one schema definition.", detail:"This closes the exact gap that pure TypeScript leaves open — the schema actually executes and throws (or returns a typed error) if the real data doesn't match, instead of just trusting an assertion.", code:`const UserSchema = z.object({ id: z.number(), name: z.string() });\ntype User = z.infer&lt;typeof UserSchema&gt;;  <span class="cm">// static type, derived from the schema</span>\n\nconst result = UserSchema.safeParse(apiResponse);  <span class="cm">// actual runtime check</span>\nif (!result.success) { <span class="cm">// handle invalid data</span> }`}
  ]
},
{ id:'ts-union', title:'Union, intersection & narrowing', animate:'narrow',
  lede:"Union and intersection types let you combine types; narrowing is how TypeScript figures out which specific type you're dealing with at a given point in the code.",
  steps:[
    "A <b>union type</b> (<code>string | number</code>) means 'this could be either' — you can only safely call methods that exist on <i>every</i> member of the union.",
    "An <b>intersection type</b> (<code>A & B</code>) means 'this has all properties of both' — commonly used to combine several smaller interfaces into one.",
    "<b>Type narrowing</b> is how TypeScript shrinks a union down to a single specific type inside a conditional block, based on a runtime check.",
    "<code>typeof</code> checks narrow primitives (string, number, boolean); <code>instanceof</code> narrows class instances; custom <b>type guards</b> narrow anything else.",
    "A <b>type guard</b> is just a function returning <code>value is SomeType</code> — TypeScript trusts that return type to narrow the caller's variable.",
    "<b>Discriminated unions</b> use a shared literal property (like <code>kind: 'circle' | 'square'</code>) so a <code>switch</code> on that property narrows the whole object automatically.",
    "Narrowing only lasts within the scope where the check remains provably true — reassigning the variable afterward, or calling an external function, can widen it back."
  ],
  code:`function describe(val: string | number) {\n  if (typeof val === 'string') {\n    return val.toUpperCase();   <span class="cm">// narrowed to string here</span>\n  }\n  return val.toFixed(2);        <span class="cm">// narrowed to number here</span>\n}`,
  terms:[
    {term:"Union type", desc:"A value that could be one of several types.", detail:"Unions are how TypeScript models real-world variability — an API field that's sometimes a string ID and sometimes a full object is a classic union candidate.", code:`type Id = string | number;\nfunction printId(id: Id) { console.log(id); }\nprintId(101);      <span class="cm">// OK</span>\nprintId('abc-1');  <span class="cm">// OK</span>`},
    {term:"Discriminated union", desc:"A union of object types sharing one literal 'tag' property used to narrow the whole shape.", detail:"This pattern gives you exhaustiveness checking for free — TypeScript can warn you if a switch statement forgets to handle one of the possible tags.", code:`type Shape =\n  | { kind: 'circle'; r: number }\n  | { kind: 'square'; s: number };\n\nfunction area(shape: Shape) {\n  switch (shape.kind) {\n    case 'circle': return Math.PI * shape.r ** 2;\n    case 'square': return shape.s ** 2;\n  }\n}`}
  ]
},
{ id:'ts-alias', title:'Type aliases vs interfaces', animate:'aliasvs',
  lede:"Both describe shapes, and for object types they're mostly interchangeable — but a few real differences decide which one fits a given situation.",
  steps:[
    "A <code>type</code> alias can name <i>any</i> type — objects, unions, primitives, tuples, function signatures — while <code>interface</code> only describes object/class shapes.",
    "<b>Interfaces are open</b> — declaring the same interface name twice merges the two declarations together (declaration merging); type aliases throw an error if redeclared.",
    "Interfaces support <code>extends</code> for inheritance; type aliases use <code>&</code> (intersection) to achieve a similar composition effect.",
    "For plain object shapes, most teams pick <b>interface</b> by convention — the error messages tend to be cleaner and it signals 'this is meant to be implemented/extended'.",
    "Type aliases are the only option for <b>union types</b> (<code>type Status = 'idle' | 'loading' | 'error'</code>) — interfaces can't express a union directly.",
    "Classes can <code>implement</code> either an interface or an object-shaped type alias — TypeScript doesn't care which one you used to declare the contract.",
    "Neither one exists at runtime — both are fully erased during compilation, exactly like every other TypeScript-only construct."
  ],
  code:`interface User { name: string; age: number; }\ntype UserAlias = { name: string; age: number; };\n\ninterface Admin extends User { role: string; }\ntype AdminAlias = UserAlias & { role: string };`,
  terms:[
    {term:"Declaration merging", desc:"Two interfaces with the same name automatically combine into one.", detail:"This is intentionally used by library authors to let consumers 'augment' a third-party interface — for example adding custom properties to Express's Request type.", code:`interface Window { myGlobal: string; }\ninterface Window { anotherGlobal: number; }\n<span class="cm">// merged: Window now has both myGlobal AND anotherGlobal</span>`},
    {term:"Intersection composition", desc:"Combining type aliases with & instead of extends.", detail:"Unlike interface extends, intersecting two types with conflicting property types doesn't error — it just produces a property typed as never, which is a common gotcha.", code:`type A = { x: string };\ntype B = { x: number };\ntype C = A & B;  <span class="cm">// C['x'] is 'never' — string & number is impossible</span>`}
  ]
},
{ id:'ts-classes', title:'Classes & access modifiers', animate:'access',
  lede:"TypeScript's classes compile down to plain JS classes, but add compile-time visibility rules that plain JavaScript has no concept of at all.",
  steps:[
    "<code>public</code> (the default) means accessible from anywhere — you never actually need to write it explicitly.",
    "<code>private</code> restricts access to <b>inside the class itself</b> — not even subclasses can reach it.",
    "<code>protected</code> is like private, but subclasses <b>can</b> access it — useful for internals meant to be extended, not exposed.",
    "<code>readonly</code> prevents reassignment after the constructor runs — it's a compile-time check only, not a runtime freeze.",
    "<b>Parameter properties</b> let you declare and assign a class field directly in the constructor signature, skipping the usual boilerplate.",
    "These modifiers are <b>compile-time only</b> — the emitted JavaScript has no real private fields from this syntax (unless you use the newer native <code>#field</code> syntax, which IS enforced at runtime).",
    "Getters and setters (<code>get</code>/<code>set</code>) let you run logic on property access while keeping the call-site syntax identical to a plain field."
  ],
  code:`class Account {\n  private balance: number;\n  readonly id: string;\n\n  constructor(public owner: string, startBalance: number) {\n    this.balance = startBalance;\n    this.id = crypto.randomUUID();\n  }\n\n  deposit(amount: number) { this.balance += amount; }\n}`,
  terms:[
    {term:"private vs #field", desc:"TypeScript's private is compile-time only; #field is real, runtime-enforced privacy.", detail:"Compiled TypeScript private fields are still visible in the emitted JS output and accessible via bracket notation — real native #private fields cannot be accessed that way even after compilation.", code:`class A { private secret = 1; #realSecret = 2; }\nconst a = new A();\n(a as any)['secret'];      <span class="cm">// works — TS-only privacy is compile-time</span>\n(a as any)['#realSecret']; <span class="cm">// fails — truly private at runtime</span>`},
    {term:"Parameter properties", desc:"Declaring and assigning a field directly in the constructor parameter list.", detail:"This is purely sugar — it compiles to the exact same 'declare field, then assign it in the constructor body' pattern you'd otherwise write by hand.", code:`class Point {\n  constructor(public x: number, public y: number) {}\n}\n<span class="cm">// equivalent to declaring x and y as fields, then this.x = x; this.y = y;</span>`}
  ]
},
{ id:'ts-inherit', title:'Inheritance & abstract classes', animate:'inherit',
  lede:"Inheritance lets one class build on another; abstract classes let you define a partial contract that concrete subclasses are forced to complete.",
  steps:[
    "<code>class Dog extends Animal</code> gives Dog everything Animal has, plus whatever Dog adds or overrides.",
    "<code>super()</code> must be called in a subclass constructor before using <code>this</code> — it runs the parent's constructor logic first.",
    "<code>super.methodName()</code> calls the parent's version of an overridden method — useful when you want to extend rather than fully replace behavior.",
    "An <b>abstract class</b> (<code>abstract class Shape</code>) can't be instantiated directly — it exists only to be extended.",
    "<b>Abstract methods</b> (<code>abstract area(): number</code>) declare a signature with no body — every concrete subclass is <b>required</b> to implement it, checked at compile time.",
    "Abstract classes can mix abstract methods with fully-implemented concrete methods — unlike interfaces, which can't have any implementation at all.",
    "TypeScript only supports <b>single inheritance</b> for classes (<code>extends</code> takes one parent) — for combining multiple behaviors, interfaces (via <code>implements</code>) are the way to compose more than one contract."
  ],
  code:`abstract class Shape {\n  abstract area(): number;\n  describe() { return \`Area: \${this.area()}\`; }  <span class="cm">// concrete, inherited as-is</span>\n}\n\nclass Circle extends Shape {\n  constructor(private radius: number) { super(); }\n  area() { return Math.PI * this.radius ** 2; }  <span class="cm">// required override</span>\n}`,
  terms:[
    {term:"Abstract class", desc:"A class that can't be instantiated directly, only extended.", detail:"Abstract classes sit between interfaces (no implementation) and regular classes (fully implemented) — they let you share common logic while still forcing subclasses to fill in the specifics.", code:`abstract class Shape { abstract area(): number; }\nnew Shape();  <span class="cm">// compile error — cannot create an instance of an abstract class</span>`},
    {term:"Method overriding", desc:"A subclass redefining a method it inherited, replacing (or extending via super) the parent's behavior.", detail:"TypeScript will flag an override whose signature is incompatible with the parent's — you can't quietly change a method's parameter or return types when overriding.", code:`class Animal { speak() { return 'some sound'; } }\nclass Dog extends Animal {\n  speak() { return super.speak() + ' (a bark, specifically)'; }\n}`}
  ]
},
{ id:'ts-interface', title:'Interfaces & polymorphism', animate:'polymorph',
  lede:"Interfaces define a contract; polymorphism is what lets many different types honor that same contract in their own way.",
  steps:[
    "An <b>interface</b> describes a shape a value must have — properties, method signatures — with zero implementation of its own.",
    "<code>class Dog implements Animal</code> is a compile-time promise that Dog provides everything Animal's interface requires — it produces no runtime code at all.",
    "A class can <code>implement</code> <b>multiple</b> interfaces at once, unlike <code>extends</code> which only allows one parent class.",
    "<b>Polymorphism</b> means code written against the interface works with <i>any</i> class that implements it, without knowing which concrete class it actually is.",
    "This is what makes functions like <code>function render(shape: Shape)</code> powerful — the same function correctly handles a Circle, Square, or Triangle without an if/else per type.",
    "Interfaces can also describe <b>function types</b> and <b>index signatures</b> (<code>[key: string]: number</code>), not just object shapes — they're more flexible than 'just a class contract'.",
    "Optional properties (<code>name?: string</code>) let an interface describe a shape where a field might be missing — accessing it without a check requires narrowing or a fallback."
  ],
  code:`interface Shape { area(): number; }\n\nclass Circle implements Shape {\n  constructor(private r: number) {}\n  area() { return Math.PI * this.r ** 2; }\n}\nclass Square implements Shape {\n  constructor(private s: number) {}\n  area() { return this.s ** 2; }\n}\n\nfunction totalArea(shapes: Shape[]) {\n  return shapes.reduce((sum, s) =&gt; sum + s.area(), 0);  <span class="cm">// works for any Shape</span>\n}`,
  terms:[
    {term:"implements", desc:"A compile-time promise that a class fulfills an interface's contract.", detail:"Unlike extends, implements adds no behavior at all — it only asks the compiler to verify the shape matches, and produces zero extra runtime code.", code:`interface Flyable { fly(): void; }\nclass Bird implements Flyable {\n  fly() { console.log('flapping'); }  <span class="cm">// required, or a compile error</span>\n}`},
    {term:"Polymorphism", desc:"Different concrete types responding correctly to the same interface-shaped call.", detail:"This is what lets you add a brand-new class implementing an existing interface without touching any of the code that already consumes that interface — the classic 'open for extension, closed for modification' principle.", code:`const shapes: Shape[] = [new Circle(2), new Square(3)];\nshapes.forEach(s =&gt; console.log(s.area()));  <span class="cm">// each calls its own area() implementation</span>`}
  ]
},
{ id:'ts-generics', title:'Generics crash course', animate:'generic',
  lede:"Generics let you write a function, class, or type once and have it work correctly for whatever specific type is passed in — without falling back to any.",
  steps:[
    "A <b>type parameter</b> like <code>&lt;T&gt;</code> is a placeholder — TypeScript fills it in with whatever concrete type you actually use at the call site.",
    "<code>function identity&lt;T&gt;(val: T): T</code> means 'whatever type goes in, that exact type comes out' — <code>identity(5)</code> returns <code>number</code>, <code>identity('hi')</code> returns <code>string</code>.",
    "Without generics you'd have to use <code>any</code> (loses all type safety) or write a separate function per type (repetitive) — generics solve both problems at once.",
    "<b>Constraints</b> (<code>&lt;T extends { length: number }&gt;</code>) restrict which types are allowed, while still preserving the specific type that was passed in.",
    "Generics work on <b>classes</b> too — <code>class Box&lt;T&gt;</code> lets you create <code>Box&lt;string&gt;</code> and <code>Box&lt;number&gt;</code> from the same class definition.",
    "<b>Default type parameters</b> (<code>&lt;T = string&gt;</code>) let a generic be used without explicitly specifying <code>T</code>, falling back to a sensible default.",
    "Multiple type parameters are allowed (<code>&lt;K, V&gt;</code>) — this is exactly how built-in types like <code>Map&lt;K, V&gt;</code> are defined.",
    "The type parameter is usually <b>inferred automatically</b> from the argument you pass — you rarely need to write <code>identity&lt;number&gt;(5)</code> explicitly."
  ],
  code:`function firstElement&lt;T&gt;(arr: T[]): T {\n  return arr[0];\n}\nfirstElement([1, 2, 3]);        <span class="cm">// T inferred as number</span>\nfirstElement(['a', 'b']);       <span class="cm">// T inferred as string</span>\n\nfunction longest&lt;T extends { length: number }&gt;(a: T, b: T): T {\n  return a.length &gt;= b.length ? a : b;\n}\nlongest('short', 'longer string');  <span class="cm">// works — strings have .length</span>`,
  terms:[
    {term:"Type parameter", desc:"A placeholder type, filled in per call/instantiation.", detail:"By convention these are named T, U, K, V for generic cases, but any valid identifier works — naming them meaningfully (like TItem or TResponse) helps in more complex generic code.", code:`function wrapInArray&lt;T&gt;(val: T): T[] {\n  return [val];\n}\nwrapInArray(42);      <span class="cm">// number[]</span>\nwrapInArray('hi');    <span class="cm">// string[]</span>`},
    {term:"Generic constraint", desc:"Restricting a type parameter to types with certain required properties.", detail:"Constraints are what let you safely call methods or access properties on a generic value inside the function body — without one, TypeScript assumes T could be absolutely anything.", code:`interface HasId { id: number; }\nfunction findById&lt;T extends HasId&gt;(items: T[], id: number) {\n  return items.find(item =&gt; item.id === id);  <span class="cm">// .id is safe because of the constraint</span>\n}`},
    {term:"Generic class", desc:"A class parameterized by a type, reusable across many concrete types.", detail:"This is exactly how TypeScript's own built-ins like Array&lt;T&gt;, Promise&lt;T&gt;, and Map&lt;K,V&gt; are implemented — generics aren't a special-case feature, they're the foundation of the standard library's type definitions.", code:`class Box&lt;T&gt; {\n  constructor(private value: T) {}\n  get(): T { return this.value; }\n}\nconst b = new Box&lt;string&gt;('hello');\nb.get();  <span class="cm">// string</span>`}
  ]
},
{ id:'ts-utility', title:'Utility types', animate:'utility',
  lede:"TypeScript ships a set of built-in generic types that transform an existing type into a new one — covering the transformations you'd otherwise write by hand constantly.",
  steps:[
    "<code>Partial&lt;T&gt;</code> makes every property of <code>T</code> optional — perfect for an 'update' function that only changes some fields.",
    "<code>Required&lt;T&gt;</code> is the opposite — it makes every optional property mandatory, useful after you've fully validated/filled in a partial object.",
    "<code>Pick&lt;T, K&gt;</code> creates a new type with only the listed keys from <code>T</code> — great for narrowing a big model down to exactly what a component needs.",
    "<code>Omit&lt;T, K&gt;</code> is the inverse of Pick — it keeps everything <i>except</i> the listed keys, commonly used to strip an <code>id</code> before creating a new record.",
    "<code>Record&lt;K, V&gt;</code> builds an object type with keys of type <code>K</code> all mapping to values of type <code>V</code> — a typed dictionary/lookup map.",
    "<code>Readonly&lt;T&gt;</code> marks every property as read-only, so any reassignment attempt is a compile-time error — mirrors <code>const</code> but for object properties.",
    "<code>ReturnType&lt;typeof fn&gt;</code> extracts a function's return type automatically — handy for deriving a type from existing logic instead of duplicating it manually.",
    "These aren't magic — they're all just <b>ordinary generic types</b> built from mapped types and keyof, defined in TypeScript's own standard library, and you can read their source directly."
  ],
  code:`interface User { id: number; name: string; email: string; }\n\ntype UserUpdate = Partial&lt;User&gt;;              <span class="cm">// all fields optional</span>\ntype UserPreview = Pick&lt;User, 'id'|'name'&gt;;    <span class="cm">// only id and name</span>\ntype NewUser = Omit&lt;User, 'id'&gt;;               <span class="cm">// everything except id</span>\ntype UserMap = Record&lt;number, User&gt;;           <span class="cm">// { [id: number]: User }</span>\ntype FrozenUser = Readonly&lt;User&gt;;              <span class="cm">// no property can be reassigned</span>`,
  terms:[
    {term:"Partial&lt;T&gt;", desc:"Makes all properties of T optional.", detail:"Under the hood it's just a mapped type: { [P in keyof T]?: T[P] } — worth knowing since it demystifies where utility types come from and how to write your own.", code:`function updateUser(id: number, changes: Partial&lt;User&gt;) {\n  <span class="cm">// changes might only include e.g. { name: 'New Name' }</span>\n}`},
    {term:"Pick&lt;T, K&gt; / Omit&lt;T, K&gt;", desc:"Select a subset of keys, or exclude a subset of keys, from T.", detail:"Omit is technically built from Pick and Exclude internally — Omit&lt;T,K&gt; is roughly Pick&lt;T, Exclude&lt;keyof T, K&gt;&gt; — a good example of utility types composing on top of each other.", code:`type Credentials = Pick&lt;User, 'email'&gt;;\ntype PublicUser = Omit&lt;User, 'email'&gt;;`},
    {term:"Record&lt;K, V&gt;", desc:"An object type mapping every key in K to a value of type V.", detail:"Record is especially useful for enforcing that every value of a union/enum has a corresponding entry — TypeScript will error if you forget one.", code:`type Status = 'idle' | 'loading' | 'error';\nconst messages: Record&lt;Status, string&gt; = {\n  idle: 'Waiting...',\n  loading: 'Working...',\n  error: 'Something broke.'\n};  <span class="cm">// missing any key here is a compile error</span>`}
  ]
}
];

const sdTopics = [
{ id:'sd-scaling', title:'Load balancing, horizontal scaling & statelessness', animate:'loadbalance',
  lede:"The foundation of scaling any backend: spread traffic across many identical servers instead of making one server bigger.",
  steps:[
    "<b>Vertical scaling</b> (a bigger machine) has a hard ceiling and a single point of failure; <b>horizontal scaling</b> (more machines) has neither, but requires the app to support running multiple instances at once.",
    "A <b>load balancer</b> sits in front of your servers and distributes incoming requests — common strategies: round-robin (rotate through servers), least-connections (send to the least busy), and IP hash (same client → same server).",
    "For horizontal scaling to work safely, servers must be <b>stateless</b> — no request should depend on data stored only in that one server's memory, since the next request might hit a different instance entirely.",
    "Session data is the classic statelessness trap — storing a logged-in user's session in server memory breaks the moment a load balancer sends their next request elsewhere. Move sessions to Redis, a DB, or a signed client-side token (JWT) instead.",
    "<b>Sticky sessions</b> (routing a client to the same server every time) are a workaround, not a fix — they reintroduce a single point of failure per client and complicate deployments.",
    "<b>Health checks</b> let the load balancer stop routing to an unhealthy instance automatically — critical for both graceful failure handling and safe rolling deployments.",
    "Auto-scaling ties this together: metrics (CPU, request queue depth, latency) trigger adding or removing instances automatically, so capacity roughly tracks real demand instead of being fixed."
  ],
  code:`<span class="cm">// stateful — breaks under a load balancer</span>\nlet loggedInUsers = {};  <span class="cm">// lives only in THIS server's memory</span>\n\n<span class="cm">// stateless — safe to run N identical copies of</span>\napp.get('/profile', async (req, res) => {\n  const session = await redis.get(req.cookies.sessionId);  <span class="cm">// shared store, any instance can read it</span>\n  res.json(session);\n});`,
  terms:[
    {term:"Statelessness", desc:"No server holds request-critical data only it knows about.", detail:"This is the single property that makes horizontal scaling actually work — without it, adding more servers just adds more places for inconsistent state to hide.", code:`<span class="cm">// any of N identical instances can handle any request</span>\napp.get('/order/:id', async (req, res) => {\n  const order = await db.orders.findById(req.params.id);  <span class="cm">// state lives in the DB, not the process</span>\n  res.json(order);\n});`},
    {term:"Round-robin vs least-connections", desc:"Two common load balancing strategies with different failure characteristics.", detail:"Round-robin is simple but can overload a server that's slower than the others (it still gets an equal share); least-connections adapts to real load but needs the balancer to track connection counts per server.", code:`<span class="cm">// round-robin: server 1, 2, 3, 1, 2, 3, ...</span>\n<span class="cm">// least-connections: always pick whichever server has the fewest active requests right now</span>`}
  ]
},
{ id:'sd-caching', title:'Caching layers & invalidation', animate:'cachelayers',
  lede:"Caching trades a bit of staleness for a lot of speed — the hard part is never fetching, it's knowing when to throw a stale value away.",
  steps:[
    "Requests typically pass through several cache layers before hitting real work: <b>CDN</b> (static assets, geographically close to the user) → <b>application cache</b> (Redis/Memcached, shared across instances) → <b>database cache</b> (query result or buffer pool caching).",
    "<b>Cache-aside</b> (lazy loading): the app checks the cache first; on a miss, it reads from the source and populates the cache for next time — simple, and only caches what's actually requested.",
    "<b>Write-through</b>: every write updates the cache and the source together, keeping them always in sync at the cost of slightly slower writes.",
    "<b>Write-behind</b>: writes go to the cache immediately and are flushed to the source asynchronously — fast writes, but a crash before the flush can lose data.",
    "<b>Invalidation</b> is the genuinely hard part — <i>'there are only two hard things in computer science: cache invalidation and naming things.'</i> Common strategies: a <b>TTL</b> (time-based expiry, simple but can serve stale data), or <b>explicit invalidation</b> (delete/update the cache entry the moment the source changes).",
    "<b>Cache stampede</b>: when a popular key expires, many concurrent requests can all miss at once and hammer the source simultaneously — mitigated with request coalescing (only one request actually fetches, others wait) or staggered TTLs.",
    "CDN caching is controlled by HTTP headers (<code>Cache-Control</code>, <code>ETag</code>) — the server declares how cacheable a response is, and intermediate caches (browser, CDN) respect that contract.",
    "Cache hit ratio is the metric that matters — a cache with a low hit ratio adds complexity and a staleness risk without delivering much actual benefit, and is worth removing."
  ],
  code:`async function getUser(id) {\n  const cached = await redis.get(\`user:\${id}\`);\n  if (cached) return JSON.parse(cached);            <span class="cm">// cache hit</span>\n\n  const user = await db.users.findById(id);          <span class="cm">// cache miss — read source</span>\n  await redis.set(\`user:\${id}\`, JSON.stringify(user), 'EX', 300);  <span class="cm">// populate, 5min TTL</span>\n  return user;\n}`,
  terms:[
    {term:"Cache-aside", desc:"App checks cache first, falls back to the source on a miss, and populates the cache.", detail:"This is the most common pattern precisely because it's forgiving — if the cache is completely empty (a fresh deploy, a flush), the app still works correctly, just slower until it warms back up.", code:`const cached = await cache.get(key);\nif (cached) return cached;\nconst fresh = await source.fetch(key);\nawait cache.set(key, fresh);\nreturn fresh;`},
    {term:"Cache invalidation on write", desc:"Explicitly deleting or updating a cached value the moment its source changes.", detail:"Deleting (rather than updating) the cache entry on write is often simpler and safer — the next read just repopulates it correctly, instead of risking the cache and source drifting out of sync.", code:`async function updateUser(id, changes) {\n  await db.users.update(id, changes);\n  await redis.del(\`user:\${id}\`);   <span class="cm">// invalidate — next read repopulates fresh</span>\n}`}
  ]
},
{ id:'sd-databases', title:'SQL vs NoSQL, indexing & N+1 queries', animate:'dbcompare',
  lede:"The database choice and how you query it affects correctness and performance more than almost any other backend decision.",
  steps:[
    "<b>SQL (relational)</b> databases enforce a fixed schema and strong relationships via foreign keys — ideal when data is structured, relationships matter, and you need transactional guarantees (ACID).",
    "<b>NoSQL</b> databases (document, key-value, wide-column, graph) trade some of that structure for flexibility and horizontal scalability — good fits: rapidly evolving schemas, massive write throughput, or data that's naturally document-shaped.",
    "The real decision driver is usually <b>access patterns</b>, not preference — how will this data be queried, and how often does it change shape? SQL for complex relational queries and consistency; NoSQL for scale and schema flexibility.",
    "An <b>index</b> is a separate data structure (usually a B-tree) that lets the database find rows without scanning the whole table — the classic trade-off is faster reads at the cost of slower writes (every insert must update the index too).",
    "Indexing the wrong column (or not indexing a column used in every <code>WHERE</code> clause) is one of the most common real-world performance bugs — a full table scan on a large table can turn a 5ms query into a multi-second one.",
    "An <b>N+1 query</b> bug: fetching a list (1 query), then looping over it and firing a separate query per item (N queries) — instead of one query joining or batching everything at once.",
    "The fix for N+1 is usually a <code>JOIN</code>, an ORM's eager-loading option, or batching IDs into a single <code>WHERE id IN (...)</code> query — turning N+1 queries into 1 or 2.",
    "<b>Denormalization</b> (deliberately duplicating data to avoid a join) is a valid NoSQL and even SQL technique when read performance matters more than write simplicity — it trades storage and update complexity for query speed."
  ],
  code:`<span class="cm">// N+1 bug — 1 query for posts, then N queries for each author</span>\nconst posts = await db.posts.findAll();\nfor (const post of posts) {\n  post.author = await db.users.findById(post.authorId);  <span class="cm">// N extra round trips</span>\n}\n\n<span class="cm">// fixed — 1 query total, join or batched IN()</span>\nconst posts = await db.posts.findAll({ include: 'author' });`,
  terms:[
    {term:"Index", desc:"A separate lookup structure that avoids scanning the whole table.", detail:"Indexes aren't free — every additional index slows down inserts/updates slightly, since the index has to be kept up to date too, so indexing every column 'just in case' is itself a mistake.", code:`CREATE INDEX idx_users_email ON users(email);\n<span class="cm">-- turns 'WHERE email = ?' from a full scan into a direct lookup</span>`},
    {term:"N+1 query problem", desc:"One query for a list, then a separate query per item in a loop.", detail:"This bug is especially dangerous because it's invisible in development with small datasets — it only becomes a real problem once a list grows to hundreds or thousands of items in production.", code:`<span class="cm">// batched fix using IN() instead of a query per item</span>\nconst authorIds = posts.map(p => p.authorId);\nconst authors = await db.users.findAll({ where: { id: authorIds } });`}
  ]
},
{ id:'sd-queues', title:'Message queues & delivery guarantees', animate:'queueflow',
  lede:"Queues decouple producing work from processing it — letting a slow or unreliable consumer never block whoever's generating the work.",
  steps:[
    "A <b>message queue</b> (SQS, RabbitMQ, Kafka) sits between a <b>producer</b> (creates work) and one or more <b>consumers</b> (process it) — the producer doesn't wait for processing to finish, just for the message to be accepted.",
    "This is the standard fix for slow background work — sending an email, resizing an image, calling a third-party API — keeping the user-facing request fast while the actual work happens asynchronously.",
    "<b>At-least-once delivery</b> means a message might be delivered (and processed) more than once — usually because a consumer crashed after processing but before acknowledging. This is the most common guarantee queues actually provide.",
    "<b>Exactly-once delivery</b> is extremely hard to guarantee end-to-end in a distributed system — most systems that claim it actually provide at-least-once delivery plus deduplication on the consumer side.",
    "Because at-least-once is the realistic default, <b>consumers must be idempotent</b> — processing the same message twice should produce the same result as processing it once, not double-charge a customer or double-send an email.",
    "A <b>dead-letter queue (DLQ)</b> catches messages that repeatedly fail processing, instead of retrying forever or silently dropping them — critical for both debugging and not losing data.",
    "<b>Ordering</b> is another trade-off — a single queue partition preserves order but limits parallelism; multiple partitions/consumers scale throughput but only guarantee ordering within each partition, not globally.",
    "Queues also provide natural <b>backpressure</b> for the whole system — if consumers fall behind, work piles up in the queue instead of overwhelming downstream services directly."
  ],
  code:`<span class="cm">// producer — fire and forget, request stays fast</span>\napp.post('/signup', async (req, res) => {\n  await db.users.create(req.body);\n  await queue.send('send-welcome-email', { userId: req.body.id });\n  res.status(201).send();  <span class="cm">// doesn't wait for the email to send</span>\n});\n\n<span class="cm">// consumer — must be idempotent, since it may run more than once</span>\nqueue.on('send-welcome-email', async ({ userId }) => {\n  if (await alreadySent(userId)) return;  <span class="cm">// dedupe check</span>\n  await sendEmail(userId);\n  await markSent(userId);\n});`,
  terms:[
    {term:"At-least-once vs exactly-once", desc:"At-least-once may redeliver; exactly-once (rarely truly achieved) delivers once.", detail:"In practice, most 'exactly-once' systems are really at-least-once delivery combined with idempotent processing on the consumer — the illusion of exactly-once comes from deduplication, not from the transport layer itself.", code:`<span class="cm">// achieving 'exactly-once' behavior via idempotency, not magic</span>\nasync function processPayment(paymentId) {\n  const existing = await db.payments.findByIdempotencyKey(paymentId);\n  if (existing) return existing;  <span class="cm">// already processed — safe no-op</span>\n  return await chargeCard(paymentId);\n}`},
    {term:"Dead-letter queue", desc:"Where messages go after repeatedly failing to process successfully.", detail:"Without a DLQ, a single malformed message can either block a whole ordered queue (retried forever) or get silently dropped — neither of which you want to discover in production.", code:`queue.on('process-order', async (msg) => {\n  try {\n    await handleOrder(msg);\n  } catch (err) {\n    if (msg.retryCount >= 3) await deadLetterQueue.send(msg);  <span class="cm">// give up gracefully</span>\n    else throw err;  <span class="cm">// let the queue retry</span>\n  }\n});`}
  ]
},
{ id:'sd-resilience', title:'Idempotency, retries, circuit breakers & bulkheads', animate:'circuitbreaker',
  lede:"Distributed systems fail constantly in small ways — these four patterns are how you keep small failures from becoming big ones.",
  steps:[
    "<b>Idempotency</b>: an operation that produces the same result no matter how many times it's applied — <code>PUT</code> (set a value) is naturally idempotent; <code>POST</code> (create a new thing) usually isn't, unless you add an idempotency key.",
    "An <b>idempotency key</b> — a unique client-generated ID sent with a request — lets the server recognize and safely ignore a duplicate request (e.g. from a retried payment) instead of processing it twice.",
    "<b>Retries</b> handle transient failures (a brief network blip, a momentarily overloaded service) — but retrying instantly and repeatedly can turn a small problem into a bigger one by piling more load onto an already-struggling service.",
    "<b>Exponential backoff</b> (wait longer between each retry) plus <b>jitter</b> (add randomness to the wait) prevents synchronized retry storms, where many clients all retry at the exact same moment and re-overwhelm the service.",
    "A <b>circuit breaker</b> tracks failures to a dependency and 'opens' after too many — while open, calls fail immediately without even attempting the request, giving the struggling dependency room to recover instead of being hit with more traffic.",
    "The circuit breaker's <b>half-open</b> state periodically lets a single test request through — if it succeeds, the circuit closes again (normal traffic resumes); if it fails, it stays open longer.",
    "A <b>bulkhead</b> isolates resources (connection pools, thread pools) per dependency, so one failing/slow dependency can't exhaust resources needed to serve requests to unrelated, healthy dependencies — named after ship compartments that contain flooding.",
    "These patterns compose: retries handle brief blips, circuit breakers handle sustained outages, and bulkheads contain the blast radius when something does go wrong despite the other two."
  ],
  code:`<span class="cm">// idempotency key — safe to retry without double-processing</span>\napp.post('/payments', async (req, res) => {\n  const key = req.headers['idempotency-key'];\n  const existing = await db.payments.findByKey(key);\n  if (existing) return res.json(existing);   <span class="cm">// already handled this exact request</span>\n\n  const payment = await chargeCard(req.body);\n  await db.payments.save(key, payment);\n  res.json(payment);\n});`,
  terms:[
    {term:"Circuit breaker states", desc:"Closed (normal) → Open (failing fast) → Half-open (testing recovery).", detail:"The point of 'failing fast' while open isn't just protecting the failing dependency — it's also protecting the caller's own resources (threads, connections) from being tied up waiting on calls that are very likely to fail anyway.", code:`if (breaker.isOpen()) throw new Error('circuit open — failing fast');\ntry {\n  const result = await callDependency();\n  breaker.recordSuccess();\n  return result;\n} catch (err) {\n  breaker.recordFailure();  <span class="cm">// may flip the breaker to open</span>\n  throw err;\n}`},
    {term:"Exponential backoff with jitter", desc:"Growing delay between retries, randomized to avoid synchronized retry storms.", detail:"Without jitter, many clients that failed at the same moment (e.g. during a brief outage) will all retry at the same moment again — jitter spreads that retry traffic out over time instead of hitting the recovering service in one more spike.", code:`async function retryWithBackoff(fn, attempt = 0) {\n  try { return await fn(); }\n  catch (err) {\n    if (attempt >= 5) throw err;\n    const delay = 2 ** attempt * 100 + Math.random() * 100;  <span class="cm">// backoff + jitter</span>\n    await new Promise(r => setTimeout(r, delay));\n    return retryWithBackoff(fn, attempt + 1);\n  }\n}`}
  ]
},
{ id:'sd-cap', title:'CAP theorem, in plain language', animate:'captriangle',
  lede:"A useful mental model for distributed database trade-offs — though in practice it's more nuanced than 'pick two'.",
  steps:[
    "<b>Consistency</b>: every read gets the most recent write, or an error — no node ever serves stale data.",
    "<b>Availability</b>: every request gets a (non-error) response — even if it might not reflect the most recent write.",
    "<b>Partition tolerance</b>: the system keeps working even when network communication between nodes breaks down (a network partition).",
    "The theorem: when a <b>partition actually happens</b>, you must choose between consistency and availability — you cannot have both at that moment. Partition tolerance itself isn't really optional for any real distributed system, since networks do fail.",
    "A <b>CP</b> system (e.g. a strongly consistent database like Zookeeper) refuses to serve a request it can't guarantee is up to date during a partition — it returns an error rather than stale data.",
    "An <b>AP</b> system (e.g. Cassandra, DynamoDB in default mode) keeps serving requests during a partition, accepting that different nodes might temporarily disagree — this is <b>eventual consistency</b>: given enough time with no new writes, all nodes converge.",
    "In practice, <b>most of the time there's no partition</b> — CAP only forces a choice during the (hopefully rare) window when nodes can't talk to each other; the rest of the time, both consistency and availability are achievable.",
    "The practical question to ask in an interview isn't 'CP or AP in the abstract' — it's 'for this specific piece of data, is serving stale information acceptable, or is an error better than a wrong answer?' (e.g. a bank balance vs a 'likes' counter)."
  ],
  code:`<span class="cm">// AP choice: serve a possibly-stale like count rather than error</span>\nasync function getLikeCount(postId) {\n  return await cassandra.get(postId);  <span class="cm">// fast, available, maybe a few seconds stale</span>\n}\n\n<span class="cm">// CP choice: refuse rather than risk an incorrect balance</span>\nasync function getAccountBalance(accountId) {\n  if (!quorumReachable()) throw new Error('cannot guarantee consistency — try again');\n  return await stronglyConsistentRead(accountId);\n}`,
  terms:[
    {term:"Eventual consistency", desc:"Given no new writes, all replicas converge to the same value — but not instantly.", detail:"This isn't a vague promise — most eventually-consistent systems converge within milliseconds to seconds under normal conditions; the 'eventual' window only widens meaningfully during actual network problems.", code:`<span class="cm">// two replicas can briefly disagree right after a write</span>\nawait replicaA.write('count', 5);\n<span class="cm">// replicaB might still return the old value for a brief window</span>\nawait replicaB.read('count');  <span class="cm">// eventually becomes 5 too</span>`},
    {term:"CP vs AP trade-off", desc:"During a partition: refuse and stay correct (CP), or answer and risk staleness (AP).", detail:"This choice is often made per-operation, not per-database — many real systems (like DynamoDB) let you choose strongly consistent or eventually consistent reads on a per-query basis.", code:`<span class="cm">// same database, different consistency choice per read</span>\ndynamodb.get({ Key: id, ConsistentRead: true });   <span class="cm">// CP-style for this read</span>\ndynamodb.get({ Key: id, ConsistentRead: false });  <span class="cm">// AP-style, faster, possibly stale</span>`}
  ]
},
{ id:'sd-observability', title:'Observability: logs, metrics, traces & alerting', animate:'observability',
  lede:"You can't fix what you can't see — observability is what turns 'the site is slow' into 'this specific query on this specific service is slow'.",
  steps:[
    "<b>Logs</b>: discrete, timestamped events with context — best for answering 'what exactly happened' for one specific request or error, especially after the fact.",
    "<b>Metrics</b>: numeric measurements aggregated over time (request rate, error rate, latency percentiles, CPU) — best for dashboards, trends, and automated alerting, since they're cheap to store and query at scale.",
    "<b>Traces</b>: follow a single request as it moves across multiple services, showing where time was actually spent — essential once a request touches more than one service, where logs alone can't show the full picture.",
    "<b>Structured logging</b> (JSON with consistent fields) beats free-text logs — it lets you actually query and aggregate logs, instead of just grepping for a string and hoping.",
    "<b>Latency percentiles</b> (p50, p95, p99) matter more than averages — an average can look fine while 1% of users have a genuinely broken experience; p99 surfaces that.",
    "What to actually <b>alert on</b>: symptoms users would notice — elevated error rate, p95/p99 latency crossing a threshold, a queue backing up — not raw causes like 'CPU at 80%', which may or may not actually be a problem.",
    "Good alerts are <b>actionable</b> — if an alert fires and there's nothing a human can or should do about it, it's noise that trains people to ignore alerts, including the ones that matter.",
    "A <b>request ID</b> generated at the edge and passed through every downstream service ties logs, metrics, and traces for a single request together — without it, correlating what happened across services during an incident is far harder."
  ],
  code:`<span class="cm">// structured log with a request ID that ties everything together</span>\nlogger.info({\n  requestId: req.id,\n  route: '/api/llm/complete',\n  latencyMs: Date.now() - start,\n  status: res.statusCode,\n  userId: req.user?.id\n});`,
  terms:[
    {term:"p99 latency", desc:"The latency below which 99% of requests fall — surfaces the worst experiences, not the typical one.", detail:"A service can have a great average latency of 100ms while its p99 is 4 seconds — meaning 1 in 100 users has a badly broken experience that the average completely hides.", code:`<span class="cm">// example distribution: 100 requests, sorted by latency</span>\n<span class="cm">// p50 (median) = 90ms, p95 = 300ms, p99 = 4000ms</span>\n<span class="cm">// the average might look like ~130ms — hiding that 1% badly slow tail</span>`},
    {term:"Distributed tracing", desc:"Following one request's journey across multiple services via a shared trace ID.", detail:"Each service adds a 'span' to the trace showing how long its part took — stitched together, this shows exactly which downstream call (a slow DB query, a slow third-party API) is responsible for overall latency.", code:`<span class="cm">// trace ID propagated through headers across service calls</span>\nfetch('https://inventory-service/check', {\n  headers: { 'traceparent': req.headers['traceparent'] }\n});`}
  ]
},
{ id:'sd-api', title:'API design: resources, pagination, versioning & errors', animate:'apidesign',
  lede:"A well-designed API is one where the shape of the URLs and responses makes the system predictable to use, without reading the docs every time.",
  steps:[
    "<b>REST resource modelling</b>: URLs represent nouns (resources), not actions — <code>/orders/123</code>, not <code>/getOrder?id=123</code>; the HTTP method (GET/POST/PUT/DELETE) expresses the action.",
    "Nest resources to express relationships that are always scoped that way — <code>/users/42/orders</code> for a user's orders — but avoid nesting more than one or two levels deep, which gets unwieldy fast.",
    "<b>Pagination</b> is mandatory for any endpoint returning an unbounded list — <b>offset-based</b> (<code>?page=2&limit=20</code>) is simple but can skip/duplicate items if data changes between requests; <b>cursor-based</b> (<code>?after=abc123</code>) is stable under concurrent writes and scales better on large datasets.",
    "<b>Versioning</b> lets you evolve an API without breaking existing clients — common approaches: URL versioning (<code>/v2/orders</code>, most visible/simple) or a header (<code>Accept-Version</code>, keeps URLs clean but less discoverable).",
    "A consistent <b>error contract</b> matters as much as success responses — every error should return the same shape (error code, human-readable message, maybe a field-level detail list) so clients can handle errors generically instead of parsing every error message.",
    "Use HTTP status codes <b>meaningfully</b>: 400 for client mistakes, 401/403 for auth issues, 404 for missing resources, 429 for rate limiting, 5xx for server-side failures — returning 200 with an error buried in the body defeats standard HTTP tooling.",
    "<b>Idempotent methods</b> matter for API design too — GET/PUT/DELETE should be safe to retry; a POST that creates a resource typically shouldn't be retried blindly without an idempotency key (see the resilience topic).",
    "Good API design also means <b>not over-fetching or under-fetching</b> — this is exactly the problem GraphQL was built to solve, letting clients specify exactly the fields they need instead of getting a fixed REST response shape."
  ],
  code:`GET /v2/users/42/orders?after=order_88&limit=20\n\n<span class="cm">// consistent success shape</span>\n{ "data": [ /* orders */ ], "nextCursor": "order_108" }\n\n<span class="cm">// consistent error shape, regardless of which endpoint failed</span>\n{ "error": { "code": "NOT_FOUND", "message": "Order not found" } }`,
  terms:[
    {term:"Cursor-based pagination", desc:"Paginating from a stable pointer (like an ID) instead of a numeric offset.", detail:"Offset pagination breaks under concurrent writes — if an item is deleted from an earlier page while a user is paginating, offset-based pages shift and can skip or duplicate items; cursor-based pagination doesn't have this problem.", code:`<span class="cm">// offset — fragile if data changes mid-pagination</span>\nGET /orders?page=3&limit=20\n\n<span class="cm">// cursor — stable regardless of concurrent writes</span>\nGET /orders?after=order_60&limit=20`},
    {term:"Consistent error contract", desc:"Every endpoint's error response follows the same shape.", detail:"This is what lets a client write ONE generic error-handling function instead of custom parsing logic per endpoint — a small design decision with an outsized effect on how pleasant an API is to actually build against.", code:`{\n  "error": {\n    "code": "VALIDATION_FAILED",\n    "message": "Invalid request body",\n    "details": [{ "field": "email", "issue": "must be a valid email" }]\n  }\n}`}
  ]
}
];

/* ---------- render ---------- */
let currentTab = 'js';
let currentIndex = 0;

function topicsFor(tab){ return tab==='js' ? jsTopics : tab==='node' ? nodeTopics : tab==='ts' ? tsTopics : sdTopics; }
function tabLabel(tab){ return tab==='js' ? 'JavaScript engine' : tab==='node' ? 'Node.js runtime' : tab==='ts' ? 'TypeScript' : 'System Design'; }
const tabOrder = ['js','node','ts','sd'];

function renderSidebar(){
  const topics = topicsFor(currentTab);
  document.getElementById('sidebar').innerHTML = topics.map((t,idx)=>
    `<button class="side-item ${currentTab}${idx===currentIndex?' active':''}" data-idx="${idx}"><span class="n">${String(idx+1).padStart(2,'0')}</span>${t.title}${t.type==='demo'?'<span class="play-badge">▶ play</span>':''}</button>`
  ).join('');
  document.querySelectorAll('.side-item').forEach(btn=>{
    btn.onclick = ()=>{ currentIndex = Number(btn.dataset.idx); renderAll(); };
  });
}

function renderSections(){
  const topics = topicsFor(currentTab);
  const t = topics[currentIndex];

  if(t.type === 'demo'){
    document.getElementById('sections').innerHTML = `
      <div class="section active">
        <div class="eyebrow ${currentTab}">${tabLabel(currentTab)} — interactive demo</div>

        <p class="lede">${t.demo==='js' ? "Step through (or play) real code and watch the call stack, heap allocation, and the microtask/macrotask queues move together." : "Step through (or play) a script that fires an API request and a file read, and watch exactly which subsystem — kernel, thread pool, or queue — handles each one."}</p>
        ${buildDemoMarkup(t.demo)}
      </div>`;
    initDemo(t.demo);
    return;
  }

  document.getElementById('sections').innerHTML = `
    <div class="section active">

    </div>`;

function renderTabs(){
  document.getElementById('tabJS').classList.toggle('active', currentTab==='js');
  document.getElementById('tabNode').classList.toggle('active', currentTab==='node');
  document.getElementById('tabTS').classList.toggle('active', currentTab==='ts');
  document.getElementById('tabSD').classList.toggle('active', currentTab==='sd');
}

function renderFooter(){
  const topics = topicsFor(currentTab);
  const isFirst = currentIndex===0 && currentTab===tabOrder[0];
  const isLast = currentIndex===topics.length-1 && currentTab===tabOrder[tabOrder.length-1];
  const prevBtn = document.getElementById('prevSec');
  const nextBtn = document.getElementById('nextSec');
  prevBtn.disabled = isFirst;
  nextBtn.disabled = isLast;
  nextBtn.textContent = isLast ? "You've reached the last topic" : 'Next topic →';
}

function renderAll(){
  renderTabs();
  renderSidebar();
  renderSections();
  renderFooter();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('tabJS').onclick = ()=>{ currentTab='js'; currentIndex=0; renderAll(); };
document.getElementById('tabNode').onclick = ()=>{ currentTab='node'; currentIndex=0; renderAll(); };
document.getElementById('tabTS').onclick = ()=>{ currentTab='ts'; currentIndex=0; renderAll(); };
document.getElementById('tabSD').onclick = ()=>{ currentTab='sd'; currentIndex=0; renderAll(); };

document.getElementById('prevSec').onclick = ()=>{
  if(currentIndex>0){ currentIndex--; }
  else {
    const idx = tabOrder.indexOf(currentTab);
    if(idx>0){ currentTab = tabOrder[idx-1]; currentIndex = topicsFor(currentTab).length-1; }
  }
  renderAll();
};
document.getElementById('nextSec').onclick = ()=>{
  const topics = topicsFor(currentTab);
  if(currentIndex<topics.length-1){ currentIndex++; }
  else {
    const idx = tabOrder.indexOf(currentTab);
    if(idx<tabOrder.length-1){ currentTab = tabOrder[idx+1]; currentIndex = 0; }
  }
  renderAll();
};

const demoState = {

function curScenario(kind){ const s = demoState[kind]; return s.scenarios[s.scenarioIndex]; }

function buildDemoMarkup(kind){
  const isNode = kind==='node';
  const scenarios = demoState[kind].scenarios;
  const activeIdx = demoState[kind].scenarioIndex;
  const chips = scenarios.map((sc,idx)=>
    `<button class="scenario-chip${idx===activeIdx?' active':''}" data-kind="${kind}" data-idx="${idx}">${sc.label}</button>`
  ).join('');
  return `
    <div class="scenario-picker">${chips}</div>
    <div class="dp-layout">
      <div class="dp-code" id="dpCode-${kind}"></div>
      <div>
        <div class="dp-ring" id="dpRing-${kind}"></div>
        <div class="dp-row ${isNode?'three':''}">
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--accent)"></span>Call stack</h4><div class="dp-items" id="dpStack-${kind}"></div></div>
          ${isNode ? `
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--pool)"></span>Thread pool</h4><div class="dp-workers" id="dpWorkers-${kind}"></div><div class="dp-items" id="dpPool-${kind}"></div></div>
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--node)"></span>OS kernel — network</h4><div class="dp-items" id="dpKernel-${kind}"></div></div>` : `
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--node)"></span>Heap (memory)</h4><div class="dp-items" id="dpHeap-${kind}"></div></div>`}

          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--micro)"></span>Microtask queue</h4><div class="dp-items" id="dpMicro-${kind}"></div></div>
          <div class="dp-card"><h4><span class="dp-dot" style="background:var(--js)"></span>${isNode?'Timers / check':'Macrotask queue'}</h4><div class="dp-items" id="dpMacro-${kind}"></div></div>
        </div>
        <div class="dp-console" id="dpConsole-${kind}"></div>
        <div class="dp-note" id="dpNote-${kind}"></div>
        <div class="dp-progress"><div class="dp-progress-fill" id="dpProgress-${kind}"></div></div>
        <div class="dp-controls">
          <button id="dpPrev-${kind}">Back</button>

          <button id="dpReset-${kind}">Reset</button>
          <span class="dp-step-count" id="dpCount-${kind}"></span>
        </div>
        <div class="dp-legend">
          <span><i style="background:var(--accent)"></i>call stack</span>
          ${isNode ? `<span><i style="background:var(--pool)"></i>thread pool (fs/dns/crypto)</span><span><i style="background:var(--node)"></i>OS kernel (network)</span><span><i style="background:var(--tick)"></i>nextTick</span>` : `<span><i style="background:var(--node)"></i>heap</span>`}
          <span><i style="background:var(--micro)"></i>microtasks</span>
        </div>
      </div>
    </div>`;
}

function switchScenario(kind, idx){
  stopDemo(kind);
  demoState[kind].scenarioIndex = idx;
  demoState[kind].i = 0;
  renderSections();
}

function initDemo(kind){
  const s = demoState[kind];
  s.i = 0; s.playing = false; clearInterval(s.timer);
  const sc = curScenario(kind);
  document.getElementById(`dpCode-${kind}`).innerHTML = sc.code.map((l,idx)=>`<div class="dp-code-line" data-i="${idx}">${l||'&nbsp;'}</div>`).join('');
  renderDemo(kind);
  document.querySelectorAll(`.scenario-chip[data-kind="${kind}"]`).forEach(btn=>{
    btn.onclick = ()=> switchScenario(kind, Number(btn.dataset.idx));
  });
  document.getElementById(`dpPrev-${kind}`).onclick = ()=>{ stopDemo(kind); stepDemo(kind,-1); };
  document.getElementById(`dpNext-${kind}`).onclick = ()=>{ stopDemo(kind); stepDemo(kind,1); };
  document.getElementById(`dpReset-${kind}`).onclick = ()=>{ stopDemo(kind); s.i=0; renderDemo(kind); };
  document.getElementById(`dpPlay-${kind}`).onclick = ()=> s.playing ? stopDemo(kind) : startDemo(kind);
}

function stepDemo(kind, dir){
  const s = demoState[kind];
  const steps = curScenario(kind).steps;
  s.i = Math.max(0, Math.min(steps.length-1, s.i+dir));
  renderDemo(kind);
  if(s.i === steps.length-1) stopDemo(kind);
}
function startDemo(kind){
  const s = demoState[kind];
  s.playing = true;
  document.getElementById(`dpPlay-${kind}`).textContent = '⏸ Pause';
  s.timer = setInterval(()=>{
    const steps = curScenario(kind).steps;
    if(s.i >= steps.length-1){ stopDemo(kind); return; }
    stepDemo(kind, 1);
  }, 2300);
}
function stopDemo(kind){
  const s = demoState[kind];
  s.playing = false;
  const btn = document.getElementById(`dpPlay-${kind}`);
  if(btn) btn.textContent = '▶ Play';
  clearInterval(s.timer);
}

function renderDemo(kind){
  const s = demoState[kind];
  const sc = curScenario(kind);
  const step = sc.steps[s.i];
  const isNode = kind==='node';

  document.querySelectorAll(`#dpCode-${kind} .dp-code-line`).forEach(el=>{
    el.classList.toggle('active', Number(el.dataset.i) === step.line);
  });

  document.getElementById(`dpRing-${kind}`).innerHTML = sc.phases.map(p=>{
    const on = p.k === step.phase;
    const colorMap = {run:'accent',idle:'sub',micro:'micro',macro:'js',timers:'js',pending:'pool',poll:'node',check:'tick',close:'micro'};
    const varName = colorMap[p.k] || 'accent';
    return `<div class="dp-phase${on?' on':''}" style="${on?`background:var(--${varName});color:#0D1013;`:''}">${p.label}</div>`;
  }).join('');

  document.getElementById(`dpStack-${kind}`).innerHTML = step.stack.length ? step.stack.join('') : dpEmpty;
  document.getElementById(`dpMicro-${kind}`).innerHTML = step.micro.length ? step.micro.join('') : dpEmpty;
  document.getElementById(`dpMacro-${kind}`).innerHTML = step.macro.length ? step.macro.join('') : dpEmpty;

  if(isNode){
    document.getElementById(`dpPool-${kind}`).innerHTML = step.pool.length ? step.pool.join('') : dpEmpty;
    document.getElementById(`dpWorkers-${kind}`).innerHTML = step.poolW.map((b,idx)=>`<div class="dp-worker ${b?'busy':''}">W${idx+1}${b?' •':''}</div>`).join('');
    document.getElementById(`dpKernel-${kind}`).innerHTML = step.kernel.length ? step.kernel.join('') : dpEmpty;
    document.getElementById(`dpTick-${kind}`).innerHTML = step.tick.length ? step.tick.join('') : dpEmpty;
  } else {
    document.getElementById(`dpHeap-${kind}`).innerHTML = step.heap.length ? step.heap.join('') : dpEmpty;
  }

  document.getElementById(`dpConsole-${kind}`).innerHTML = step.out.length
    ? step.out.map((o,idx)=>`<div class="r${idx===step.out.length-1?' new':''}">&gt; <span>${o}</span></div>`).join('')
    : '<div class="r" style="opacity:.5">console output will appear here</div>';

  document.getElementById(`dpNote-${kind}`).innerHTML = step.note;
  document.getElementById(`dpCount-${kind}`).textContent = `Step ${s.i+1} / ${sc.steps.length}`;
  document.getElementById(`dpProgress-${kind}`).style.width = `${((s.i+1)/sc.steps.length)*100}%`;
  document.getElementById(`dpPrev-${kind}`).disabled = s.i===0;
  document.getElementById(`dpNext-${kind}`).disabled = s.i===sc.steps.length-1;
}
/* ================= END DEMO PLAYER ================= */
