{ id:'ts-basics', group:'Foundations', title:'Type system basics & the runtime gap', animate:'typeflow',
  lede:"TypeScript adds a static layer on top of JS — and every type vanishes at compile time, which is the single most important consequence to internalise.",
  say:"TypeScript is structurally typed and fully erased at compile time. That means types give you zero protection at any boundary where data actually enters the process — an API response, a queue message, a config file, an LLM output. So I type internal code with TypeScript and validate external data at runtime with a schema library like zod, deriving the static type from the same schema so the two can't drift.",
  steps:[
    "TypeScript is <b>structurally typed</b> — compatibility is by shape, not by declared name (unlike Java/C#'s nominal typing).",
    "<b>Inference</b> means most annotations are unnecessary: <code>let x = 5</code> is <code>number</code>. Annotate function boundaries and exported APIs; let bodies infer.",
    "<code>any</code> disables checking entirely and spreads — it's an escape hatch, not a type. <code>unknown</code> is the safe top type: assignable from anything, usable only after narrowing.",
    "<code>never</code> is the bottom type — the return of a function that always throws, and the type of an impossible branch, which is what makes exhaustiveness checking work.",
    "<b>Types are fully erased.</b> The emitted JavaScript contains no trace of them: zero runtime cost, and zero runtime enforcement.",
    "<code>strict: true</code> turns on the checks that make TypeScript worth using — especially <code>strictNullChecks</code>, which stops <code>null</code>/<code>undefined</code> being assignable everywhere.",
    "An <code>as</code> assertion is a <b>claim, not a check</b>. <code>JSON.parse(body) as User</code> compiles happily and crashes later if the shape is wrong.",
    "Therefore: validate at every trust boundary with a runtime schema (zod, valibot, io-ts, ajv) and derive the static type from it, so a single definition governs both."
  ],
  code:`let age = 25;                <span class="cm">// inferred number</span>
const role = 'admin';        <span class="cm">// inferred literal type 'admin'</span>

function fail(msg: string): never { throw new Error(msg); }

function handle(v: unknown){
  <span class="cm">// v.length      → error: 'v' is of type 'unknown'</span>
  if (typeof v === 'string') v.toUpperCase();   <span class="cm">// narrowed, safe</span>
}

<span class="cm">// one schema → runtime check AND static type</span>
import { z } from 'zod';
const User = z.object({ id: z.number(), email: z.string().email() });
type User = z.infer&lt;typeof User&gt;;

const parsed = User.safeParse(await res.json());
if (!parsed.success) throw new AppError('bad upstream payload', { cause: parsed.error });
const user: User = parsed.data;   <span class="cm">// now genuinely guaranteed</span>`,
  note:{type:'warn', text:"<b>The question interviewers use to separate levels:</b> “Your API returns <code>User</code> — how do you know it really is one?” TypeScript checks disappear at compile time, so an <code>as User</code> assertion or an untyped <code>await res.json()</code> is trusted by the compiler and never verified. Runtime validation at the boundary is the only actual guarantee — and deriving the type from the schema (<code>z.infer</code>) is what stops the type and the validator drifting apart."},
  traps:[
    "<code>any</code> is contagious: one <code>any</code> silently disables checking through every expression it touches. Ban it with <code>noImplicitAny</code> and lint rules; use <code>unknown</code> instead.",
    "<code>as</code> is not a cast — no conversion, no check. Double assertions (<code>x as unknown as T</code>) are a code smell that bypasses even TypeScript's sanity check.",
    "Without <code>strictNullChecks</code>, every type silently includes <code>null</code> and <code>undefined</code> — most 'cannot read property of undefined' errors in TS codebases trace back to it being off.",
    "Excess property checking only applies to <b>object literals</b> assigned directly. Assign via a variable first and extra properties pass silently.",
    "<code>typeof</code>/<code>instanceof</code> narrowing works at runtime, but interfaces and type aliases don't exist at runtime — you can't <code>instanceof</code> an interface."
  ],
  terms:[
    {term:"Structural typing", desc:"Compatibility by shape, not by name.", detail:"Two unrelated interfaces are interchangeable if the properties line up. This is why TypeScript feels flexible — and why you sometimes want <b>branded types</b> to get nominal behaviour back.", code:`interface Point { x: number; y: number }\nfunction log(p: Point){}\nlog({ x:1, y:2, z:3 });          <span class="cm">// via a variable: OK</span>\n<span class="cm">// log({x:1,y:2,z:3}) directly → excess property error</span>`},
    {term:"any vs unknown", desc:"any turns checking off; unknown forces you to prove the shape.", detail:"Use <code>unknown</code> for anything from outside your control — <code>JSON.parse</code>, API responses, <code>catch</code> clause variables (which are <code>unknown</code> under <code>useUnknownInCatchVariables</code>).", code:`try { risky(); }\ncatch (e) {          <span class="cm">// e: unknown under strict</span>\n  const msg = e instanceof Error ? e.message : String(e);\n}`},
    {term:"Runtime validation with zod", desc:"One schema produces both the check and the type.", detail:"The key property is that the type is <i>derived</i> from the schema, so they cannot drift. Validate at every boundary: HTTP handlers, queue consumers, config, third-party SDK responses, LLM tool-call arguments.", code:`const Config = z.object({\n  PORT: z.coerce.number().default(3000),\n  DATABASE_URL: z.string().url()\n});\nexport const config = Config.parse(process.env);  <span class="cm">// throws at boot</span>`}
  ],
  cards:[
    {q:"What does 'types are erased' mean in practice?", a:"The compiler removes every type annotation; the emitted JS has no type information. So types cost nothing at runtime and enforce nothing at runtime — any data crossing a process or network boundary must be validated separately."},
    {q:"<code>any</code> vs <code>unknown</code>?", a:"<code>any</code> disables type checking for that value and everything derived from it. <code>unknown</code> accepts any value but permits no operations until you narrow it with <code>typeof</code>, <code>instanceof</code>, or a type guard. Prefer <code>unknown</code> at every boundary."},
    {q:"Is <code>as User</code> a runtime check?", a:"No. It's an assertion — you telling the compiler to trust you. Nothing is verified and no code is emitted. If the data doesn't match, you get a crash far away from the assertion with no compile-time warning."},
    {q:"What does <code>never</code> represent and where is it useful?", a:"The bottom type — a value that can never occur. Return type of a function that always throws or loops forever, and the type of an unreachable branch, which is exactly what makes exhaustiveness checks on discriminated unions work."}
  ],
  quiz:[
    {q:"Which of these actually guarantees the object has the right shape at runtime?", options:["<code>UserSchema.parse(data)</code>","<code>data as User</code>","<code>&lt;User&gt;data</code>","Declaring <code>const u: User = data</code>"], answer:0,
     why:"Only a runtime schema parse executes a check. All the assertion forms are erased at compile time and verify nothing."},
    {q:"What is <code>e</code>'s type here under <code>strict</code>?", code:`try { risky(); } catch (e) { /* ? */ }`,
     options:["unknown","any","Error","never"], answer:0,
     why:"With <code>useUnknownInCatchVariables</code> (part of <code>strict</code>), catch variables are <code>unknown</code>, forcing you to narrow before use — because JS can throw anything, not just Errors."}
  ],
  cheat:[
    "<b>Structural</b> typing (shape, not name). Inference covers most locals; annotate boundaries.",
    "<code>any</code> = checking off (contagious) · <code>unknown</code> = safe top type · <code>never</code> = bottom/impossible.",
    "<b>Types are erased</b> → zero runtime cost, zero runtime protection.",
    "<code>as</code> = a claim, not a cast. No check, no conversion.",
    "<b>Validate every trust boundary</b> (HTTP, queue, config, LLM output) with zod/valibot; derive the type via <code>z.infer</code>.",
    "<code>strict: true</code>, especially <code>strictNullChecks</code> + <code>noImplicitAny</code>."
  ]
},

{ id:'ts-union', group:'Foundations', title:'Unions, intersections & narrowing', animate:'narrow',
  lede:"Union types model real-world variability; narrowing is how the compiler proves which member you're holding.",
  say:"A union means 'one of these', so only members present on every arm are accessible until you narrow. Narrowing happens via <code>typeof</code>, <code>instanceof</code>, truthiness, <code>in</code>, equality against literals, and user-defined type guards. The pattern I reach for constantly is the discriminated union — a shared literal tag — because a switch on that tag narrows the whole object and gives exhaustiveness checking via <code>never</code>.",
  steps:[
    "A <b>union</b> <code>A | B</code> means one of them; you may only access members common to <i>all</i> arms until narrowed.",
    "An <b>intersection</b> <code>A &amp; B</code> means all of both — commonly used to compose small interfaces or to add fields to a base type.",
    "<b>Narrowing</b> shrinks a union inside a branch based on a runtime check the compiler understands: <code>typeof</code>, <code>instanceof</code>, <code>in</code>, truthiness, <code>Array.isArray</code>, and equality against literal types.",
    "A <b>user-defined type guard</b> is a function returning <code>value is T</code>. The compiler takes that predicate on trust, so the implementation must actually be correct.",
    "An <b>assertion function</b> (<code>asserts value is T</code>) narrows for the rest of the enclosing scope instead of inside a branch — good for invariants.",
    "<b>Discriminated unions</b>: give every arm a shared literal property (<code>kind</code>, <code>type</code>, <code>status</code>) and a <code>switch</code> on it narrows the whole object.",
    "<b>Exhaustiveness checking</b>: in the <code>default</code> branch, assign the value to <code>never</code>. Add a new union member and the compiler immediately points at every switch you forgot.",
    "Narrowing is lost when the compiler can't prove the value is unchanged — after an intervening function call on a mutable property, or inside a callback. Destructure into a <code>const</code> first."
  ],
  code:`type Result =
  | { status: 'ok'; data: string }
  | { status: 'error'; error: Error }
  | { status: 'loading' };

function render(r: Result): string {
  switch (r.status) {
    case 'ok':      return r.data;          <span class="cm">// narrowed</span>
    case 'error':   return r.error.message;
    case 'loading': return '…';
    default:        return assertNever(r);  <span class="cm">// compile error if a case is missing</span>
  }
}
function assertNever(x: never): never { throw new Error('unhandled: ' + JSON.stringify(x)); }

<span class="cm">// user-defined guard &amp; assertion function</span>
function isUser(v: unknown): v is User {
  return typeof v === 'object' &amp;&amp; v !== null &amp;&amp; 'email' in v;
}
function assertDefined&lt;T&gt;(v: T | null | undefined, m: string): asserts v is T {
  if (v == null) throw new Error(m);
}`,
  traps:[
    "Narrowing on an <b>optional object property</b> is discarded after any function call — the compiler must assume it changed. Copy to a local <code>const</code> first.",
    "A type guard's body isn't verified. <code>function isUser(v): v is User { return true; }</code> compiles and lies.",
    "Intersecting conflicting primitives gives <code>never</code>: <code>{x: string} &amp; {x: number}</code> has <code>x: never</code>, and the error surfaces far from the definition.",
    "<code>if (x)</code> excludes <code>0</code> and <code>''</code> as well as null/undefined — use <code>x != null</code> when zero and empty string are valid.",
    "Unions of many object types without a discriminant are painful to narrow; add a tag rather than probing with <code>in</code> repeatedly."
  ],
  cards:[
    {q:"What is a discriminated union and why is it the go-to pattern?", a:"A union of object types sharing a common literal-typed property (the discriminant). A <code>switch</code> on that property narrows the entire object in each branch, and adding a <code>never</code> default gives free exhaustiveness checking when new variants are added."},
    {q:"How do you get exhaustiveness checking?", a:"In the default branch, pass the value to a function taking <code>never</code>. If any union member is unhandled, that value isn't <code>never</code> and the compiler errors — pointing you at every switch that needs updating."},
    {q:"Type guard vs assertion function?", a:"A guard (<code>v is T</code>) narrows inside the <code>if</code> branch. An assertion function (<code>asserts v is T</code>) throws on failure and narrows for the remainder of the scope. Assertion functions must have an explicit return type annotation and can't be arrow functions assigned without one."},
    {q:"When does narrowing get lost?", a:"When the compiler can't prove the value is unchanged: after a function call if the value is a mutable property, inside closures/callbacks, and across <code>await</code> for properties. Destructure into a <code>const</code> to keep the narrowing."}
  ],
  quiz:[
    {q:"Why does this error?", code:`type Shape = { kind:'c'; r:number } | { kind:'s'; s:number };\nfunction area(sh: Shape){\n  if (sh.kind === 'c') return Math.PI * sh.r ** 2;\n  return sh.r ** 2;\n}`,
     options:["In the second branch sh is the square variant, which has no <code>r</code>","<code>kind</code> isn't a valid discriminant","Math.PI is untyped","It doesn't error"], answer:0,
     why:"After the <code>if</code>, TypeScript narrows the remaining type to <code>{kind:'s'; s:number}</code>, which has no <code>r</code> property."}
  ],
  cheat:[
    "<code>A | B</code> = one of (only shared members until narrowed). <code>A &amp; B</code> = both.",
    "Narrow with: <code>typeof</code>, <code>instanceof</code>, <code>in</code>, truthiness, <code>Array.isArray</code>, literal equality, guards.",
    "Guard: <code>v is T</code> (branch). Assertion: <code>asserts v is T</code> (rest of scope, needs explicit annotation).",
    "<b>Discriminated union</b> + <code>switch</code> on the tag = the workhorse pattern.",
    "<code>assertNever(x: never)</code> in <code>default</code> ⇒ compile-time exhaustiveness.",
    "Narrowing is lost after calls / in callbacks → destructure to a <code>const</code>."
  ]
},

{ id:'ts-alias', group:'Foundations', title:'Type aliases vs interfaces', animate:'aliasvs',
  lede:"For object shapes they're near-interchangeable — the differences that matter are declaration merging and what each can express.",
  say:"A <code>type</code> can name anything — unions, tuples, primitives, function signatures, mapped and conditional types. An <code>interface</code> only describes object shapes, but it supports declaration merging, which is how you augment third-party types like Express's Request. My rule: interfaces for public object contracts that others may extend or augment, type aliases for unions and anything computed.",
  steps:[
    "A <code>type</code> alias can name <b>any</b> type: unions, intersections, tuples, primitives, function signatures, mapped and conditional types.",
    "An <code>interface</code> describes <b>object shapes</b> (including callable and construct signatures and index signatures) — it cannot express a union.",
    "<b>Interfaces merge</b>: two declarations with the same name in the same scope combine. Type aliases error on redeclaration.",
    "Declaration merging is what makes <b>module augmentation</b> possible — the standard way to add <code>req.user</code> to Express's <code>Request</code>.",
    "Interfaces use <code>extends</code> (which <i>checks</i> compatibility and errors on conflicts); type aliases compose with <code>&amp;</code> (which silently produces <code>never</code> for conflicting members).",
    "Both can be <code>implement</code>ed by a class, as long as the alias resolves to an object type.",
    "Interfaces are lazily resolved, which historically gives better error messages and slightly better compiler performance for large recursive shapes.",
    "Neither exists at runtime — both are fully erased."
  ],
  code:`interface User { id: number; name: string }
interface Admin extends User { role: 'admin' }        <span class="cm">// conflict → error</span>

type UserT  = { id: number; name: string };
type AdminT = UserT &amp; { role: 'admin' };              <span class="cm">// conflict → never (silent)</span>

type Status = 'idle' | 'loading' | 'error';           <span class="cm">// only a type alias can do this</span>
type Handler = (req: Request) =&gt; Promise&lt;void&gt;;

<span class="cm">// module augmentation — only possible with interfaces</span>
declare global {
  namespace Express {
    interface Request { user?: { id: string; roles: string[] } }
  }
}`,
  table:{title:'When to use which', head:['','interface','type'], rows:[
    ['Object shapes','✔','✔'],
    ['Unions / tuples / primitives','✘','✔'],
    ['Mapped & conditional types','✘','✔'],
    ['Declaration merging / augmentation','✔','✘'],
    ['Conflict on extend','Errors','Silently <code>never</code>'],
    ['Typical use','Public contracts, classes, augmentation','Unions, computed types, function types']
  ]},
  traps:[
    "Intersecting conflicting property types produces <code>never</code> rather than an error at the definition — the failure appears much later at the assignment site.",
    "Declaration merging is global to the module scope: an accidentally duplicated interface name silently merges instead of erroring.",
    "You can't declare a union with an interface — attempting to model 'A or B' with interfaces leads to optional-everything shapes that narrow badly.",
    "Augmenting a global namespace requires the file to be a module (have an import/export) or the <code>declare global</code> block behaves differently."
  ],
  cards:[
    {q:"Name two things a type alias can do that an interface can't.", a:"Express unions (and tuples/primitives), and be computed — mapped types, conditional types, template literal types, <code>keyof</code>-driven transformations."},
    {q:"What can an interface do that a type alias can't?", a:"Declaration merging — two interfaces with the same name combine. That's the mechanism behind module augmentation, e.g. adding <code>user</code> to Express's <code>Request</code> or extending a library's options interface."},
    {q:"What happens when you intersect conflicting property types?", a:"You get <code>never</code> for that property, silently, at the definition. The error only appears when something tries to assign to it. <code>interface extends</code> reports the conflict immediately instead."}
  ],
  quiz:[
    {q:"What is <code>C['x']</code>?", code:`type A = { x: string };\ntype B = { x: number };\ntype C = A &amp; B;`,
     options:["never","string | number","string","Error at the type C declaration"], answer:0,
     why:"An intersection requires the value to satisfy both, and no value is both string and number, so the property type collapses to <code>never</code> — silently, at declaration."}
  ],
  cheat:[
    "<code>type</code>: anything — unions, tuples, functions, mapped/conditional. <code>interface</code>: object shapes only.",
    "<b>Interfaces merge</b> → module augmentation (<code>declare global { namespace Express { interface Request {...} } }</code>).",
    "<code>extends</code> errors on conflict; <code>&amp;</code> silently yields <code>never</code>.",
    "Rule of thumb: interfaces for public/extendable contracts, aliases for unions and computed types.",
    "Both erased; both implementable by a class."
  ]
},

{ id:'ts-enums', group:'Foundations', title:'Enums, literal types & const assertions', animate:'narrow',
  lede:"Enums are the one TypeScript feature that emits runtime code — which is exactly why most teams now avoid them.",
  say:"A numeric enum emits a reverse-mapped object and isn't type-safe against arbitrary numbers in older versions; a string enum is nominal, so a plain matching string isn't assignable. Most codebases now prefer a <code>const</code> object with <code>as const</code> plus a derived union type: zero runtime cost beyond a plain object, structurally compatible with plain strings, and it plays well with <code>Object.values</code> and zod.",
  steps:[
    "<b>Numeric enums</b> emit an object with a reverse mapping (<code>E[0] === 'A'</code>). They're the only TS construct besides namespaces and decorators-with-metadata that generates runtime code.",
    "<b>String enums</b> emit a plain object and behave <b>nominally</b>: a string literal that matches a member's value is <i>not</i> assignable to the enum type.",
    "<code>const enum</code> is fully inlined with no runtime object — but it breaks under <code>isolatedModules</code> and bundlers that compile file-by-file (Babel, esbuild, swc), so it's discouraged.",
    "The modern alternative: a <code>const</code> object with <code>as const</code>, plus <code>type X = typeof Obj[keyof typeof Obj]</code> to derive the union.",
    "<code>as const</code> makes everything deeply <code>readonly</code> and infers <b>literal</b> types instead of widened ones — <code>'admin'</code> rather than <code>string</code>.",
    "Literal union types (<code>'idle' | 'loading'</code>) give you the same exhaustiveness benefits as enums with no runtime footprint and perfect interop with JSON and validators.",
    "Enums in a DTO crossing a network boundary are a smell — the wire format is a plain string, so validate it into a union and stop pretending it's nominal.",
    "TypeScript 5.0 made all enums (including numeric) behave as union enums, tightening some of the old holes — but the ecosystem preference for <code>as const</code> unions has stuck."
  ],
  code:`<span class="cm">// preferred: const object + derived union</span>
export const Role = { Admin: 'admin', User: 'user', Guest: 'guest' } as const;
export type Role = typeof Role[keyof typeof Role];    <span class="cm">// 'admin' | 'user' | 'guest'</span>

function can(r: Role){ }
can('admin');        <span class="cm">// works — plain strings are fine</span>
Object.values(Role); <span class="cm">// ['admin','user','guest'] — iterable, useful for zod</span>
z.enum(Object.values(Role) as [Role, ...Role[]]);

<span class="cm">// string enum is nominal — this is the friction people hit</span>
enum Colour { Red = 'red' }
const c: Colour = 'red';   <span class="cm">// ✘ Type '"red"' is not assignable to type 'Colour'</span>

<span class="cm">// as const preserves literals</span>
const cfg1 = { mode: 'dark' };            <span class="cm">// { mode: string }</span>
const cfg2 = { mode: 'dark' } as const;   <span class="cm">// { readonly mode: 'dark' }</span>`,
  traps:[
    "<code>const enum</code> silently breaks with esbuild/swc/Babel transpilation (they can't see across files to inline), producing runtime <code>undefined</code>.",
    "Numeric enums have no meaningful string representation on the wire — persisting them means a schema change reorders values and corrupts stored data. Use string values.",
    "Passing an enum through JSON and back gives you a plain string that no longer type-checks against the enum.",
    "<code>as const</code> on an array gives a <code>readonly</code> tuple — passing it where a mutable array is expected fails."
  ],
  cards:[
    {q:"Why do most modern TS codebases avoid enums?", a:"They emit runtime code (unlike everything else in TS), string enums are nominal so plain matching strings don't type-check, <code>const enum</code> breaks under isolated transpilation, and they interop badly with JSON and schema validators. A <code>const</code> object + <code>as const</code> + derived union gives the same ergonomics without any of that."},
    {q:"What does <code>as const</code> do?", a:"Infers the narrowest literal types instead of widening (<code>'dark'</code> not <code>string</code>), and marks the whole structure deeply <code>readonly</code> (arrays become readonly tuples)."},
    {q:"How do you derive a union type from a const object?", a:"<code>type Role = typeof Role[keyof typeof Role]</code> — <code>typeof Role</code> gets the object's type, <code>keyof</code> gets its keys, and the indexed access yields the union of value types."}
  ],
  quiz:[
    {q:"Why does this fail?", code:`enum Status { Active = 'active' }\nconst s: Status = 'active';`,
     options:["String enums are nominal — the literal isn't assignable","'active' is not a valid value","Enums can't hold strings","It doesn't fail"], answer:0,
     why:"String enum members are nominally typed. Only <code>Status.Active</code> is assignable to <code>Status</code>, which is exactly the friction that makes enums awkward at API boundaries."}
  ],
  cheat:[
    "Enums <b>emit runtime code</b>. Numeric = reverse-mapped object; string = nominal.",
    "<code>const enum</code> breaks with esbuild/swc/Babel + <code>isolatedModules</code> → avoid.",
    "<b>Preferred</b>: <code>const X = {...} as const</code> + <code>type X = typeof X[keyof typeof X]</code>.",
    "<code>as const</code> = literal inference + deep <code>readonly</code>.",
    "Literal unions: zero runtime, exhaustive with <code>never</code>, JSON- and zod-friendly."
  ]
},

/* ==================== OOP ==================== */
{ id:'ts-classes', group:'Classes & OOP', title:'Classes, access modifiers & parameter properties', animate:'access',
  lede:"TypeScript classes compile to plain JS classes plus compile-time visibility rules JavaScript has no concept of.",
  say:"<code>public</code>, <code>private</code> and <code>protected</code> are compile-time only — the field still exists in the emitted JS and is reachable with bracket notation or <code>as any</code>. <code>#private</code> is real, engine-enforced privacy. <code>readonly</code> is likewise compile-time. Parameter properties (<code>constructor(private repo: Repo)</code>) are the pattern you'll see everywhere in NestJS, since they declare and assign in one line.",
  steps:[
    "<code>public</code> (default) — accessible anywhere; you never need to write it.",
    "<code>private</code> — only inside the class body, <b>not</b> in subclasses. Compile-time only.",
    "<code>protected</code> — the class and its subclasses. Also compile-time only.",
    "<code>readonly</code> — assignable only in the declaration or constructor. Again compile-time; the emitted JS has no protection.",
    "<b>Parameter properties</b>: <code>constructor(private readonly repo: Repo){}</code> declares the field, applies the modifier and assigns it — the standard NestJS dependency-injection shape.",
    "<code>#private</code> fields are <b>runtime-enforced</b>: unreachable from outside, invisible to <code>Object.getOwnPropertyNames</code>, and <code>#x in obj</code> is the idiomatic brand check.",
    "Getters and setters let you run logic behind plain property syntax; with <code>useDefineForClassFields</code> semantics, field initialisation order matters more than people expect.",
    "<code>abstract</code> members and <code>override</code> (with <code>noImplicitOverride</code>) give you compile-time guarantees that subclasses implement and correctly override what they claim to."
  ],
  code:`class Account {
  readonly id = crypto.randomUUID();
  #balance: number;                      <span class="cm">// true runtime privacy</span>

  constructor(
    public readonly owner: string,       <span class="cm">// parameter property</span>
    private readonly audit: AuditLog,    <span class="cm">// DI, NestJS-style</span>
    start = 0
  ){ this.#balance = start; }

  get balance(){ return this.#balance; }
  deposit(amount: number){
    if (amount &lt;= 0) throw new RangeError('amount must be positive');
    this.#balance += amount;
    this.audit.record(this.id, amount);
  }
  static isAccount(x: unknown){ return #balance in (x as object); }
}`,
  traps:[
    "TS <code>private</code> gives no runtime protection: <code>(obj as any).secret</code> or <code>obj['secret']</code> reads it fine, and it's visible in the compiled output and in <code>JSON.stringify</code>.",
    "<code>readonly</code> arrays/objects are shallow — <code>readonly items: string[]</code> still allows <code>items.push()</code>. Use <code>readonly string[]</code> or <code>ReadonlyArray<T></code>.",
    "Field initialisers run <b>after</b> <code>super()</code>, so a base-class constructor calling an overridden method sees the subclass's fields still undefined.",
    "<code>#private</code> fields break under Proxy wrapping and after <code>structuredClone</code> — the brand check fails.",
    "Mixing parameter properties with explicit field declarations of the same name is a silent double-assignment."
  ],
  cards:[
    {q:"TypeScript <code>private</code> vs JavaScript <code>#private</code>?", a:"TS <code>private</code> is erased — the property exists in the emitted JS and is reachable via bracket notation, <code>as any</code>, or JSON serialisation. <code>#private</code> is a real private slot enforced by the engine: unreachable from outside the class and invisible to reflection."},
    {q:"What is a parameter property?", a:"A constructor parameter annotated with an access modifier (<code>constructor(private repo: Repo){}</code>) that declares the field and assigns it automatically. It's the standard shape for NestJS constructor injection."},
    {q:"Why is <code>readonly</code> not enough for immutability?", a:"It's compile-time only and shallow. <code>readonly items: string[]</code> prevents reassigning <code>items</code> but not mutating it. Use <code>readonly string[]</code> / <code>ReadonlyArray</code>, and remember nothing stops runtime mutation from untyped code."}
  ],
  quiz:[
    {q:"Which of these actually prevents outside access at runtime?", options:["<code>#balance</code>","<code>private balance</code>","<code>readonly balance</code>","<code>protected balance</code>"], answer:0,
     why:"Only <code>#private</code> is enforced by the JavaScript engine. All the TypeScript modifiers are erased during compilation."}
  ],
  cheat:[
    "<code>public</code>(default) / <code>private</code> / <code>protected</code> / <code>readonly</code> = <b>compile-time only, erased</b>.",
    "<code>#private</code> = runtime-enforced; <code>#x in obj</code> = brand check; breaks under Proxy/structuredClone.",
    "Parameter properties: <code>constructor(private readonly svc: Svc){}</code> — the NestJS DI shape.",
    "<code>readonly</code> is shallow → use <code>readonly T[]</code>/<code>ReadonlyArray&lt;T&gt;</code>.",
    "Field initialisers run after <code>super()</code> → beware base ctors calling overridden methods.",
    "<code>abstract</code> + <code>override</code> (<code>noImplicitOverride</code>) for enforced contracts."
  ]
},

{ id:'ts-inherit', group:'Classes & OOP', title:'Inheritance, abstract classes & composition', animate:'inherit',
  lede:"Inheritance shares implementation; interfaces share contracts. Knowing when to prefer composition is the senior-level part.",
  say:"An abstract class defines a partial contract with shared implementation that subclasses must complete; an interface defines a contract with no implementation and can be implemented many times over. TypeScript has single inheritance for classes, so anything needing multiple behaviours uses interfaces plus composition — and in practice I default to composition and dependency injection because it's far easier to test and doesn't couple classes to a hierarchy.",
  steps:[
    "<code>class Dog extends Animal</code> inherits fields and methods; <code>super()</code> must run before <code>this</code> is used in a derived constructor.",
    "<code>super.method()</code> calls the parent's implementation — the way to extend rather than replace behaviour.",
    "An <b>abstract class</b> cannot be instantiated; it exists to be extended. It can mix abstract members (signature only) with fully implemented ones.",
    "<b>Abstract methods</b> are compile-time contracts: every concrete subclass must implement them or fail to compile.",
    "Abstract classes vs interfaces: abstract classes can carry state and shared implementation and support access modifiers; interfaces carry no implementation but can be implemented multiple times and merged.",
    "TypeScript has <b>single inheritance</b> for classes. Multiple behaviours come from implementing several interfaces, from mixins, or — usually better — from composition.",
    "<b>Prefer composition</b>: injecting collaborators keeps classes shallow, avoids fragile base classes, and makes unit testing trivial (swap the collaborator, no subclass required).",
    "<code>override</code> plus <code>noImplicitOverride</code> catches the classic bug where a parent renames a method and the child silently stops overriding anything."
  ],
  code:`abstract class Repository&lt;T&gt; {
  constructor(protected readonly db: Db){}
  abstract table(): string;                                    <span class="cm">// must implement</span>
  async findById(id: string): Promise&lt;T | null&gt; {              <span class="cm">// shared</span>
    return this.db.query(\`select * from \${this.table()} where id = $1\`, [id]);
  }
}
class UserRepo extends Repository&lt;User&gt; {
  override table(){ return 'users'; }
}

<span class="cm">// composition — usually the better default</span>
class OrderService {
  constructor(
    private readonly orders: OrderRepo,
    private readonly payments: PaymentGateway,
    private readonly events: EventBus
  ){}
  <span class="cm">// each collaborator is trivially swappable in tests</span>
}`,
  traps:[
    "Deep inheritance hierarchies are the classic maintenance trap: a change in a base class ripples unpredictably (the 'fragile base class' problem).",
    "Calling an overridable method from a constructor runs the subclass version before the subclass's fields are initialised.",
    "Extending a framework base class to get behaviour you could have injected couples you to that framework permanently.",
    "<code>protected</code> members are part of your public contract for subclasses — changing them is a breaking change for anyone who extended you.",
    "Mixins lose <code>private</code> visibility guarantees and can confuse type inference in complex chains."
  ],
  cards:[
    {q:"Abstract class vs interface — when do you pick each?", a:"Abstract class when you have shared <b>implementation</b> and state to inherit alongside the contract. Interface when you only need a contract, want multiple implementations of unrelated shapes, or need declaration merging. A class can implement many interfaces but extend only one class."},
    {q:"Why prefer composition over inheritance?", a:"Injected collaborators are swappable in tests, avoid the fragile-base-class problem, don't force a single hierarchy, and keep each class shallow with one responsibility. Inheritance couples the subclass to the parent's internals permanently."},
    {q:"What does <code>noImplicitOverride</code> protect against?", a:"Silent de-overriding: if a parent renames or removes a method, a child that intended to override it becomes a new unrelated method. With the flag, overrides must be marked <code>override</code> and the compiler errors if there's nothing to override."}
  ],
  quiz:[
    {q:"What is logged?", code:`class Base { constructor(){ this.init(); } init(){ console.log('base'); } }\nclass Child extends Base { name = 'x'; override init(){ console.log(this.name); } }\nnew Child();`,
     options:["undefined — fields initialise after super()","'x'","'base'","TypeError"], answer:0,
     why:"The base constructor runs first and calls the overridden <code>init</code>, but <code>Child</code>'s field initialisers haven't run yet, so <code>this.name</code> is <code>undefined</code>. This is why calling overridable methods from constructors is a known hazard."}
  ],
  cheat:[
    "<code>super()</code> before <code>this</code>. <code>super.m()</code> to extend rather than replace.",
    "Abstract class = contract + shared implementation + state. Interface = contract only, multiple, mergeable.",
    "Single class inheritance; many interfaces; mixins as <code>(Base) =&gt; class extends Base</code>.",
    "<b>Prefer composition + DI</b> — testable, shallow, no fragile base class.",
    "<code>override</code> + <code>noImplicitOverride</code> catches silent de-overriding.",
    "Never call overridable methods from a constructor (fields not yet initialised)."
  ]
},

{ id:'ts-interface', group:'Classes & OOP', title:'Interfaces, polymorphism & SOLID in practice', animate:'polymorph',
  lede:"Interfaces define contracts; polymorphism is many types honouring one contract — and it's how you make code open for extension.",
  say:"Coding against an interface rather than a concrete class means new implementations can be added without touching consumers — open/closed. In a Node backend the practical payoff is dependency inversion: my service depends on a <code>PaymentGateway</code> interface, not on Stripe, so tests inject a fake and switching providers touches one file. Interfaces also describe function types and index signatures, not just class contracts.",
  steps:[
    "An <b>interface</b> describes a required shape — properties and method signatures — with no implementation and no runtime footprint.",
    "<code>class X implements Y</code> is a compile-time check only; it emits nothing and adds no behaviour.",
    "A class can <code>implement</code> <b>multiple</b> interfaces, unlike <code>extends</code>.",
    "<b>Polymorphism</b>: code written against the interface works with any implementation, without knowing the concrete type.",
    "That's the <b>open/closed principle</b> — add a new implementation without modifying existing consumers.",
    "<b>Dependency inversion</b>: high-level modules depend on abstractions. Your <code>OrderService</code> takes a <code>PaymentGateway</code> interface, not Stripe's SDK; the composition root wires the real one.",
    "<b>Interface segregation</b>: many small focused interfaces beat one fat one — implementers shouldn't be forced to stub methods they don't use.",
    "Interfaces can describe <b>function types</b>, <b>construct signatures</b> and <b>index signatures</b>, not only object shapes.",
    "Because TypeScript is structural, <code>implements</code> is optional — anything with the right shape is assignable. Use it anyway for intent and earlier errors."
  ],
  code:`interface PaymentGateway {
  charge(amountCents: number, token: string): Promise&lt;{ id: string }&gt;;
  refund(chargeId: string): Promise&lt;void&gt;;
}

class StripeGateway implements PaymentGateway { /* … */ }
class FakeGateway   implements PaymentGateway {          <span class="cm">// test double</span>
  charges: number[] = [];
  async charge(a: number){ this.charges.push(a); return { id: 'fake' }; }
  async refund(){ }
}

class OrderService {
  constructor(private readonly payments: PaymentGateway){}   <span class="cm">// depends on the abstraction</span>
  async place(order: Order){ return this.payments.charge(order.totalCents, order.token); }
}

<span class="cm">// index &amp; call signatures</span>
interface Cache { [key: string]: unknown }
interface Middleware { (req: Req, res: Res, next: () =&gt; void): void }`,
  traps:[
    "Because typing is structural, a class can accidentally satisfy an interface it never meant to — <b>branded types</b> restore nominal behaviour when that matters.",
    "A fat interface forces every implementer to stub irrelevant methods; split it (interface segregation).",
    "Interfaces don't exist at runtime, so you can't <code>instanceof</code> one or dispatch on it — use a discriminant property or a registry.",
    "Index signatures widen everything: <code>{[k:string]: unknown}</code> makes typos type-check. Prefer <code>Record&lt;KnownKeys, T&gt;</code> or a Map.",
    "<code>implements</code> doesn't infer parameter types — the class must annotate them itself."
  ],
  cards:[
    {q:"What does <code>implements</code> actually do?", a:"Nothing at runtime. It's a compile-time assertion that the class satisfies the interface, giving earlier and clearer errors. Because TypeScript is structural, the class would be assignable anyway — <code>implements</code> documents intent and catches drift."},
    {q:"How does dependency inversion look in a Node service?", a:"Define an interface for the collaborator (<code>PaymentGateway</code>, <code>UserRepo</code>, <code>Clock</code>), have the service take it via constructor injection, and wire the concrete implementation only at the composition root. Tests inject a fake; swapping providers touches one file."},
    {q:"What can interfaces describe besides object shapes?", a:"Call signatures (function types), construct signatures (<code>new (…) => T</code>), index signatures, and readonly/optional members. They can also extend multiple other interfaces."}
  ],
  quiz:[
    {q:"Which SOLID principle is being applied here?", code:`class OrderService {\n  constructor(private payments: PaymentGateway){}\n}`,
     options:["Dependency inversion — depend on an abstraction","Single responsibility","Liskov substitution","Interface segregation"], answer:0,
     why:"The high-level service depends on the <code>PaymentGateway</code> abstraction rather than a concrete implementation like Stripe, which is exactly dependency inversion."}
  ],
  cheat:[
    "Interface = contract, zero runtime. <code>implements</code> = compile-time check, optional (structural typing).",
    "Many interfaces per class; one <code>extends</code>.",
    "Polymorphism ⇒ <b>open/closed</b>: add implementations without touching consumers.",
    "<b>Dependency inversion</b>: service takes <code>PaymentGateway</code>, composition root injects Stripe/fake.",
    "<b>Interface segregation</b>: small focused contracts.",
    "Interfaces can be call/construct/index signatures too. Can't <code>instanceof</code> them."
  ]
},

{ id:'ts-decorators', group:'Classes & OOP', title:'Decorators & metadata (the NestJS engine)', animate:'dicontainer',
  lede:"Decorators are how NestJS, TypeORM and class-validator turn declarations into runtime behaviour.",
  say:"A decorator is a function applied to a class, method, property or parameter at definition time. With <code>emitDecoratorMetadata</code>, TypeScript also emits the parameter types into <code>reflect-metadata</code> — and that's precisely how NestJS knows what to inject into a constructor without you naming the tokens. Note there are two systems now: TypeScript's legacy experimental decorators, which NestJS uses, and the ES standard decorators in TS 5.0+, which have a different signature and no parameter decorators yet.",
  steps:[
    "A decorator is a <b>function</b> that runs when the class is defined, receiving the target and (depending on kind) a key and descriptor.",
    "Kinds: <b>class</b>, <b>method</b>, <b>accessor</b>, <b>property</b>, <b>parameter</b>. Evaluation order: parameter → method/accessor/property (bottom-up within a class), then class last.",
    "<b>Legacy (experimental) decorators</b> require <code>\"experimentalDecorators\": true</code> and are what NestJS/TypeORM/class-validator use today.",
    "<b>ES standard decorators</b> (TS 5.0+) have a different signature (<code>(value, context)</code>) and no parameter decorators — the two systems are not interchangeable.",
    "<code>\"emitDecoratorMetadata\": true</code> makes the compiler emit <code>design:type</code>, <code>design:paramtypes</code> and <code>design:returntype</code> via <code>reflect-metadata</code>.",
    "That emitted <code>design:paramtypes</code> is <b>how NestJS DI works</b>: it reads the constructor parameter types and resolves each from its container by that token.",
    "This is why interfaces can't be injected — they're erased, so there's no runtime token. You inject a class, or use a string/Symbol token with <code>@Inject()</code>.",
    "Common patterns: <code>@Controller</code>/<code>@Get</code> register routes, <code>@Injectable</code> marks a provider, <code>@UseGuards</code> attaches authorisation, and class-validator decorators drive DTO validation through a <code>ValidationPipe</code>."
  ],
  code:`import 'reflect-metadata';

<span class="cm">// a simple method decorator: log slow calls</span>
function Timed(thresholdMs = 100): MethodDecorator {
  return (_t, key, desc: any) =&gt; {
    const original = desc.value;
    desc.value = async function (...args: unknown[]) {
      const t0 = performance.now();
      try { return await original.apply(this, args); }
      finally {
        const ms = performance.now() - t0;
        if (ms &gt; thresholdMs) logger.warn({ method: String(key), ms }, 'slow');
      }
    };
    return desc;
  };
}

@Injectable()
class OrderService {
  constructor(private readonly repo: OrderRepo){}   <span class="cm">// resolved via design:paramtypes</span>
  @Timed(50) async place(o: Order){ /* … */ }

<span class="cm">// interfaces are erased → use a token</span>
const PAYMENTS = Symbol('PAYMENTS');
constructor(@Inject(PAYMENTS) private readonly payments: PaymentGateway){}`,
  traps:[
    "Forgetting <code>import 'reflect-metadata'</code> once at the entry point breaks all metadata-based DI with confusing errors.",
    "<b>You cannot inject an interface</b> — it doesn't exist at runtime. Use a class, an abstract class as a token, or an explicit <code>@Inject(TOKEN)</code>.",
    "Circular imports between modules break DI token resolution; NestJS needs <code>forwardRef()</code>.",
    "Mixing legacy and standard decorators in one project doesn't work — the signatures differ and <code>emitDecoratorMetadata</code> only applies to the legacy system.",
    "Decorators run at <b>class definition time</b>, not per instance — putting per-request logic directly in a decorator body is a common mistake."
  ],
  cards:[
    {q:"How does NestJS know what to inject into a constructor?", a:"With <code>emitDecoratorMetadata</code>, TypeScript emits <code>design:paramtypes</code> — the runtime constructor parameter types — into <code>reflect-metadata</code>. Nest reads that array and resolves each type from its DI container as a token."},
    {q:"Why can't you inject an interface in NestJS?", a:"Interfaces are erased at compile time, so there's no runtime value to use as a token. Inject a class, use an abstract class as the token, or register a Symbol/string token and use <code>@Inject(TOKEN)</code>."},
    {q:"What are the two decorator systems in TypeScript?", a:"Legacy/experimental decorators (<code>experimentalDecorators</code>) — what NestJS, TypeORM and class-validator use, with parameter decorators and <code>emitDecoratorMetadata</code>; and ES standard decorators (TS 5.0+) with a <code>(value, context)</code> signature and no parameter decorators. They're not interchangeable."},
    {q:"When do decorators execute?", a:"At class definition time — once, when the module is evaluated — not per instance or per call. A method decorator typically wraps the original function so the per-call logic runs inside that wrapper."}
  ],
  quiz:[
    {q:"A NestJS provider fails with 'Nest can't resolve dependencies'. The constructor takes an interface. Fix?", options:["Use a class or an @Inject(TOKEN) — interfaces are erased","Add @Injectable() to the interface","Enable strictNullChecks","Import reflect-metadata in that file"], answer:0,
     why:"There's no runtime representation of an interface, so <code>design:paramtypes</code> records <code>Object</code>. Inject a concrete/abstract class, or register an explicit token and use <code>@Inject()</code>."}
  ],
  cheat:[
    "Decorator = function run at <b>class definition time</b>. Kinds: class/method/accessor/property/parameter.",
    "Order: params → members (bottom-up) → class.",
    "<code>experimentalDecorators</code> + <code>emitDecoratorMetadata</code> + <code>reflect-metadata</code> = NestJS DI.",
    "<code>design:paramtypes</code> is <b>how Nest resolves constructor injection</b>.",
    "<b>Interfaces can't be injected</b> (erased) → class or <code>@Inject(Symbol)</code>.",
    "TS 5 standard decorators: <code>(value, context)</code>, no parameter decorators, not interchangeable with legacy."
  ]
},

/* ==================== TYPE-LEVEL ==================== */
{ id:'ts-generics', group:'Type-level programming', title:'Generics & constraints', animate:'generic',
  lede:"Write a function once and keep exact type information for whatever is passed in — without falling back to any.",
  say:"A type parameter is a placeholder the compiler fills in at the call site, so <code>identity(5)</code> returns <code>number</code> rather than <code>any</code>. Constraints (<code>T extends { id: string }</code>) let you use properties inside the body while still preserving the caller's specific type on the way out. The senior-level detail is knowing when <i>not</i> to use a generic — if a type parameter appears only once in a signature, it isn't doing any work.",
  steps:[
    "A <b>type parameter</b> <code>&lt;T&gt;</code> is a placeholder resolved per call or per instantiation, usually <b>inferred</b> from the arguments.",
    "Generics preserve the relationship between inputs and outputs — that's the whole point, and it's what <code>any</code> destroys.",
    "<b>Constraints</b> (<code>&lt;T extends HasId&gt;</code>) let you access members inside the body while still returning the caller's exact type.",
    "<b>Default type parameters</b> (<code>&lt;T = string&gt;</code>) make a generic usable without explicit arguments.",
    "Multiple parameters express relationships between arguments: <code>function pick&lt;T, K extends keyof T&gt;(o: T, keys: K[]): Pick&lt;T, K&gt;</code>.",
    "Generic <b>classes</b> and <b>interfaces</b> parameterise state: <code>Repository&lt;T&gt;</code>, <code>Result&lt;T, E&gt;</code>, <code>Map&lt;K, V&gt;</code>.",
    "<b>Inference is positional</b>: TypeScript infers from arguments left to right and picks the best common type. Supply the parameter explicitly when inference goes wrong or produces a union you didn't want.",
    "<b>Rule of thumb</b>: if a type parameter appears only once in a signature, it isn't relating anything — replace it with <code>unknown</code> or a concrete type."
  ],
  code:`function firstElement&lt;T&gt;(arr: T[]): T | undefined { return arr[0]; }
firstElement([1,2,3]);          <span class="cm">// number | undefined</span>

function pick&lt;T extends object, K extends keyof T&gt;(o: T, keys: K[]): Pick&lt;T, K&gt; {
  return Object.fromEntries(keys.map(k =&gt; [k, o[k]])) as Pick&lt;T, K&gt;;
}
pick({ id: 1, name: 'a', secret: 'x' }, ['id','name']);   <span class="cm">// { id: number; name: string }</span>

class Repository&lt;T extends { id: string }&gt; {
  private items = new Map&lt;string, T&gt;();
  save(item: T){ this.items.set(item.id, item); return item; }
  find(id: string): T | undefined { return this.items.get(id); }
}

<span class="cm">// generic constrained by another parameter</span>
function getProp&lt;T, K extends keyof T&gt;(obj: T, key: K): T[K] { return obj[key]; }`,
  traps:[
    "A single-use type parameter is noise: <code>function log&lt;T&gt;(x: T): void</code> should just take <code>unknown</code>.",
    "Over-constraining kills reuse; under-constraining means you can't touch the value inside the body.",
    "Inference from a literal widens: <code>identity('a')</code> gives <code>string</code> unless you constrain <code>T extends string</code> or pass <code>as const</code>.",
    "Deeply nested generics produce error messages that are genuinely hard to read — extract named intermediate types.",
    "Generic defaults plus inference can silently pick the default when inference fails, hiding the real problem."
  ],
  cards:[
    {q:"Why use a generic instead of <code>any</code>?", a:"A generic <b>preserves the relationship</b> between input and output types, so the caller keeps full type information and autocomplete. <code>any</code> throws that away and disables checking downstream."},
    {q:"What does <code>K extends keyof T</code> buy you?", a:"It ties the key parameter to the object parameter, so only real keys are accepted and the return type can be <code>T[K]</code> — the exact type of that property rather than a union of all of them."},
    {q:"When is a type parameter unnecessary?", a:"When it appears only once in the signature. It's relating nothing, so it's equivalent to <code>unknown</code> (for a parameter) or an unsafe assertion (for a return). Golden rule: type parameters should link at least two positions."}
  ],
  quiz:[
    {q:"What is the return type?", code:`function getProp&lt;T, K extends keyof T&gt;(o: T, k: K){ return o[k]; }\nconst r = getProp({ a: 1, b: 'x' }, 'b');`,
     options:["string","string | number","unknown","any"], answer:0,
     why:"<code>K</code> infers as the literal <code>'b'</code>, so the return type <code>T[K]</code> resolves to the type of <code>b</code> alone — <code>string</code>."}
  ],
  cheat:[
    "<code>&lt;T&gt;</code> = placeholder inferred at the call site; preserves input↔output relationships.",
    "Constraints <code>T extends X</code> let you use members inside while keeping the caller's exact type.",
    "<code>K extends keyof T</code> + return <code>T[K]</code> = the canonical safe-property-access generic.",
    "Defaults <code>&lt;T = string&gt;</code>; multiple params express relationships.",
    "<b>If a type parameter appears once, delete it.</b>",
    "Explicit args when inference widens or picks the wrong common type."
  ]
},

{ id:'ts-utility', group:'Type-level programming', title:'Utility types', animate:'utility',
  lede:"The built-in transformations you'll use daily — and they're all just mapped and conditional types you could write yourself.",
  say:"Partial, Required, Readonly, Pick, Omit, Record, Exclude, Extract, ReturnType, Parameters, Awaited and NonNullable cover almost everything. The ones I use most in a backend are <code>Omit</code> to strip server-generated fields from a create DTO, <code>Record</code> to force a value per union member, and <code>Awaited&lt;ReturnType&lt;typeof fn&gt;&gt;</code> to derive a type from existing logic instead of duplicating it.",
  steps:[
    "<code>Partial&lt;T&gt;</code> / <code>Required&lt;T&gt;</code> — make every property optional / mandatory. Partial is the natural shape for an update payload.",
    "<code>Readonly&lt;T&gt;</code> — every property read-only (shallow).",
    "<code>Pick&lt;T, K&gt;</code> / <code>Omit&lt;T, K&gt;</code> — keep or drop named keys. <code>Omit&lt;User,'id'|'createdAt'&gt;</code> is the classic create-DTO.",
    "<code>Record&lt;K, V&gt;</code> — a typed dictionary. With a union key it <b>forces exhaustiveness</b>: miss a member and it's a compile error.",
    "<code>Exclude&lt;U, X&gt;</code> / <code>Extract&lt;U, X&gt;</code> — filter a union. <code>NonNullable&lt;T&gt;</code> removes null and undefined.",
    "<code>ReturnType&lt;typeof fn&gt;</code>, <code>Parameters&lt;typeof fn&gt;</code>, <code>ConstructorParameters</code>, <code>InstanceType</code> — derive types from existing values rather than restating them.",
    "<code>Awaited&lt;T&gt;</code> unwraps nested promises — <code>Awaited&lt;ReturnType&lt;typeof loadUser&gt;&gt;</code> gives the resolved type.",
    "They're not magic: <code>Partial&lt;T&gt;</code> is <code>{ [P in keyof T]?: T[P] }</code>, and <code>Omit</code> is <code>Pick&lt;T, Exclude&lt;keyof T, K&gt;&gt;</code>. Knowing that lets you write your own."
  ],
  code:`interface User { id: number; name: string; email: string; createdAt: Date }

type NewUser    = Omit&lt;User, 'id' | 'createdAt'&gt;;      <span class="cm">// create DTO</span>
type UserUpdate = Partial&lt;NewUser&gt;;                     <span class="cm">// patch DTO</span>
type UserCard   = Pick&lt;User, 'id' | 'name'&gt;;

type Status = 'idle' | 'loading' | 'error';
const labels: Record&lt;Status, string&gt; = {               <span class="cm">// miss one → compile error</span>
  idle: 'Waiting', loading: 'Working', error: 'Broken'
};

async function loadUser(id: number){ return db.users.find(id); }
type LoadedUser = Awaited&lt;ReturnType&lt;typeof loadUser&gt;&gt;;

<span class="cm">// deep versions aren't built in — write them:</span>
type DeepPartial&lt;T&gt; = T extends object ? { [K in keyof T]?: DeepPartial&lt;T[K]&gt; } : T;`,
  traps:[
    "<code>Omit</code> does <b>not</b> validate its keys — <code>Omit&lt;User,'emial'&gt;</code> silently compiles and removes nothing. Use a constrained helper if that matters.",
    "<code>Partial</code> and <code>Readonly</code> are shallow. Nested objects need a recursive type.",
    "<code>Record&lt;string, T&gt;</code> claims every string key exists — with <code>noUncheckedIndexedAccess</code> off, a typo returns <code>T</code> instead of <code>undefined</code>.",
    "<code>Omit</code> on a union distributes badly — it collapses to the common keys. Use a distributive helper (<code>T extends any ? Omit<T,K> : never</code>).",
    "Applying <code>Partial</code> to a DTO used for creation quietly allows an empty object — validate at runtime too."
  ],
  table:{title:'The ones worth memorising', head:['Utility','Does','Typical use'], rows:[
    ['<code>Partial&lt;T&gt;</code>','All optional','PATCH / update payloads'],
    ['<code>Omit&lt;T,K&gt;</code>','Drop keys','Create DTO without id/timestamps'],
    ['<code>Pick&lt;T,K&gt;</code>','Keep keys','Narrow view models'],
    ['<code>Record&lt;K,V&gt;</code>','Dictionary','Per-union-member config, exhaustive'],
    ['<code>Exclude/Extract</code>','Filter a union','Remove/keep variants'],
    ['<code>ReturnType/Parameters</code>','Derive from a function','Avoid restating types'],
    ['<code>Awaited&lt;T&gt;</code>','Unwrap promises','Async return types'],
    ['<code>NonNullable&lt;T&gt;</code>','Strip null/undefined','After a guard']
  ]},
  cards:[
    {q:"How would you type a create-DTO from an entity?", a:"<code>Omit&lt;User, 'id' | 'createdAt' | 'updatedAt'&gt;</code> — derive it from the entity so adding a field to the entity automatically flows through, rather than maintaining a parallel interface."},
    {q:"Why is <code>Record&lt;UnionKey, V&gt;</code> useful beyond typing a dictionary?", a:"It enforces exhaustiveness: every member of the union must have an entry, so adding a new union member immediately breaks compilation at every config map that needs updating."},
    {q:"Write <code>Partial</code> and <code>Omit</code> from scratch.", a:"<code>type Partial&lt;T&gt; = { [P in keyof T]?: T[P] }</code> and <code>type Omit&lt;T,K&gt; = Pick&lt;T, Exclude&lt;keyof T, K&gt;&gt;</code>, where <code>Pick&lt;T,K&gt; = { [P in K]: T[P] }</code>."}
  ],
  quiz:[
    {q:"What does this allow?", code:`type Status = 'a' | 'b';\nconst m: Record&lt;Status, number&gt; = { a: 1 };`,
     options:["Compile error — 'b' is missing","Compiles fine","Only with strict off","Runtime error"], answer:0,
     why:"<code>Record</code> over a union requires every member. The missing <code>b</code> is a compile error — which is exactly why it's a good exhaustiveness tool."}
  ],
  cheat:[
    "<code>Partial/Required/Readonly</code> · <code>Pick/Omit</code> · <code>Record</code> · <code>Exclude/Extract/NonNullable</code> · <code>ReturnType/Parameters/InstanceType</code> · <code>Awaited</code>.",
    "Create DTO = <code>Omit&lt;Entity,'id'|'createdAt'&gt;</code>. Patch DTO = <code>Partial&lt;CreateDTO&gt;</code>.",
    "<code>Record&lt;Union, V&gt;</code> ⇒ free exhaustiveness.",
    "All shallow — write recursive <code>DeepPartial</code>/<code>DeepReadonly</code> yourself.",
    "<code>Omit</code> doesn't check its keys and distributes badly over unions.",
    "They're just mapped+conditional types: <code>Partial&lt;T&gt; = {[P in keyof T]?: T[P]}</code>."
  ]
},

{ id:'ts-mapped', group:'Type-level programming', title:'Mapped types, conditional types & infer', animate:'utility',
  lede:"The type-level programming layer — how every utility type is built and how libraries produce types from your data.",
  say:"A mapped type iterates over keys to build a new type; a conditional type branches on assignability with <code>T extends U ? X : Y</code>; and <code>infer</code> captures a type from within a pattern, which is how <code>ReturnType</code> and <code>Awaited</code> work. The two behaviours to know cold are <b>distribution</b> — a naked type parameter in a conditional distributes over unions — and modifiers, where <code>-?</code> and <code>-readonly</code> strip optionality and readonly-ness.",
  steps:[
    "<b>Mapped type</b>: <code>{ [K in keyof T]: F&lt;T[K]&gt; }</code> — iterate keys and transform values.",
    "<b>Modifiers</b>: <code>?</code> and <code>readonly</code> can be added, or <b>removed</b> with <code>-?</code> and <code>-readonly</code> — that's exactly how <code>Required</code> and a mutable-ising helper work.",
    "<b>Key remapping</b> (TS 4.1+): <code>{ [K in keyof T as NewKey]: … }</code> lets you rename keys, and mapping to <code>never</code> <b>filters them out</b>.",
    "<b>Conditional type</b>: <code>T extends U ? X : Y</code> — a compile-time branch on assignability.",
    "<b>Distribution</b>: when the checked type is a <i>naked</i> type parameter, a conditional distributes over each union member. <code>Exclude</code> relies on this. Wrap in a tuple (<code>[T] extends [U]</code>) to switch it off.",
    "<code>infer</code> declares a type variable inside the <code>extends</code> clause and captures whatever matches: <code>T extends Promise&lt;infer U&gt; ? U : T</code>.",
    "Recursive conditional types enable deep transformations (<code>DeepPartial</code>, <code>DeepReadonly</code>, path types), with a compiler recursion limit around 50 levels.",
    "Keep it readable: extract named helper types, and remember that clever type-level code slows the compiler and produces terrible error messages for whoever hits it later."
  ],
  code:`<span class="cm">// mapped: strip readonly and optionality</span>
type Mutable&lt;T&gt; = { -readonly [K in keyof T]-?: T[K] };

<span class="cm">// key remapping: only the function-valued keys, renamed</span>
type Handlers&lt;T&gt; = {
  [K in keyof T as T[K] extends Function ? \`on\${Capitalize&lt;string &amp; K&gt;}\` : never]: T[K]
};

<span class="cm">// conditional + infer: how ReturnType is written</span>
type MyReturnType&lt;T&gt; = T extends (...a: any[]) =&gt; infer R ? R : never;
type Unwrap&lt;T&gt; = T extends Promise&lt;infer U&gt; ? Unwrap&lt;U&gt; : T;   <span class="cm">// recursive</span>

<span class="cm">// distribution</span>
type NoNull&lt;T&gt; = T extends null | undefined ? never : T;
type A = NoNull&lt;string | null&gt;;        <span class="cm">// string   (distributed)</span>
type IsUnion&lt;T&gt; = [T] extends [infer _] ? true : false;   <span class="cm">// tuple = no distribution</span>

<span class="cm">// deep partial</span>
type DeepPartial&lt;T&gt; = T extends object ? { [K in keyof T]?: DeepPartial&lt;T[K]&gt; } : T;`,
  traps:[
    "Forgetting distribution: <code>T extends any ? … : …</code> silently runs per union member, which is sometimes what you want and sometimes catastrophically not.",
    "<code>DeepPartial</code> applied to arrays, Dates, Maps and functions produces nonsense unless you special-case them.",
    "Recursion depth limits produce 'Type instantiation is excessively deep and possibly infinite' — a sign to simplify, not to add <code>any</code>.",
    "Heavy type-level code measurably slows <code>tsc</code> and your editor; measure with <code>--extendedDiagnostics</code>.",
    "Conditional types on <code>any</code> resolve to <b>both</b> branches (a union), which is a genuinely surprising edge case."
  ],
  cards:[
    {q:"What is a distributive conditional type?", a:"When the checked type is a naked type parameter, <code>T extends U ? X : Y</code> is applied to <i>each member</i> of a union separately and the results are unioned. That's how <code>Exclude</code> and <code>NonNullable</code> work. Wrap both sides in tuples — <code>[T] extends [U]</code> — to disable it."},
    {q:"What does <code>infer</code> do?", a:"Declares a type variable inside an <code>extends</code> clause that captures whatever matches at that position. <code>T extends (...a:any[]) => infer R ? R : never</code> is <code>ReturnType</code>; <code>T extends Promise&lt;infer U&gt;</code> unwraps a promise."},
    {q:"How do you remove <code>readonly</code> and <code>?</code> in a mapped type?", a:"With the subtractive modifiers: <code>{ -readonly [K in keyof T]-?: T[K] }</code>. <code>Required&lt;T&gt;</code> is exactly the <code>-?</code> half."},
    {q:"How do you filter keys out of a mapped type?", a:"Key remapping with <code>as</code>, mapping unwanted keys to <code>never</code>: <code>{ [K in keyof T as Condition ? K : never]: T[K] }</code>. Keys mapped to <code>never</code> are dropped."}
  ],
  quiz:[
    {q:"What is <code>R</code>?", code:`type F&lt;T&gt; = T extends string ? 'S' : 'N';\ntype R = F&lt;string | number&gt;;`,
     options:["'S' | 'N'","'N'","'S'","never"], answer:0,
     why:"<code>T</code> is a naked type parameter, so the conditional distributes over the union: <code>F&lt;string&gt; | F&lt;number&gt;</code> = <code>'S' | 'N'</code>."}
  ],
  cheat:[
    "Mapped: <code>{ [K in keyof T]: … }</code>; modifiers <code>?</code>/<code>readonly</code>, remove with <code>-?</code>/<code>-readonly</code>.",
    "Key remap: <code>[K in keyof T as NewK]</code>; map to <code>never</code> to <b>filter</b>.",
    "Conditional: <code>T extends U ? X : Y</code>. <b>Naked T distributes over unions</b>; <code>[T] extends [U]</code> stops it.",
    "<code>infer</code> captures inside the pattern → <code>ReturnType</code>, <code>Awaited</code>, <code>Parameters</code>.",
    "Recursive conditionals for Deep* types; ~50-level limit.",
    "Cost: compiler time + unreadable errors. Name intermediate types."
  ]
},

{ id:'ts-template', group:'Type-level programming', title:'Template literal types & satisfies', animate:'typeflow',
  lede:"Type-level string manipulation, plus the operator that finally solved 'check it but don't widen it'.",
  say:"Template literal types let you build and pattern-match string types — typed route params, event names, CSS units. And <code>satisfies</code> is the one I now use constantly: it checks a value against a type without widening it, so you keep literal inference and exhaustiveness at the same time, which neither a type annotation nor <code>as const</code> alone gives you.",
  steps:[
    "A <b>template literal type</b> composes string types: <code>type Event = \\`on\\${Capitalize&lt;Name&gt;}\\`</code>.",
    "Combining with unions produces the <b>cross product</b>: <code>\\`\\${'get'|'set'}_\\${'a'|'b'}\\`</code> is four literal types. This explodes quickly — keep the inputs small.",
    "Intrinsic helpers: <code>Uppercase</code>, <code>Lowercase</code>, <code>Capitalize</code>, <code>Uncapitalize</code>.",
    "With <code>infer</code>, template literals become <b>pattern matching on strings</b> — extracting route parameters from <code>'/users/:id/orders/:orderId'</code> at the type level.",
    "<code>satisfies</code> (TS 4.9) checks that an expression conforms to a type <b>without changing its inferred type</b> — you keep literal types and exact keys while still getting the check.",
    "That solves the old dilemma: annotating <code>const x: Record&lt;K,V&gt;</code> widens the values and loses key precision; omitting the annotation loses the check. <code>satisfies</code> gives both.",
    "Practical uses: exhaustive config objects whose values stay narrowly typed, typed route tables, typed event maps, and theme/token objects.",
    "Keep type-level string work proportionate — a 10,000-member union from a cross product will make your editor crawl."
  ],
  code:`type Method = 'get' | 'post';
type Path   = '/users' | '/orders';
type Route  = \`\${Method} \${Path}\`;     <span class="cm">// 'get /users' | 'get /orders' | 'post /users' | ...</span>

<span class="cm">// extract params from a path — pattern matching with infer</span>
type Params&lt;S extends string&gt; =
  S extends \`\${string}:\${infer P}/\${infer Rest}\` ? P | Params&lt;\`/\${Rest}\`&gt;
  : S extends \`\${string}:\${infer P}\` ? P
  : never;
type P = Params&lt;'/users/:id/orders/:orderId'&gt;;   <span class="cm">// 'id' | 'orderId'</span>

<span class="cm">// satisfies: checked AND narrow</span>
const config = {
  retries: 3,
  mode: 'strict',
  hosts: ['a', 'b']
} satisfies { retries: number; mode: 'strict' | 'lax'; hosts: string[] };

config.mode;    <span class="cm">// 'strict'  ← literal preserved (an annotation would widen it)</span>
config.hosts[0].toUpperCase();   <span class="cm">// still string[]</span>`,
  traps:[
    "Cross-product unions explode: three unions of ten members each is 1,000 types and a slow editor.",
    "<code>satisfies</code> still widens where inference naturally widens — combine with <code>as const</code> when you need deep literal/readonly preservation.",
    "Template literal <code>infer</code> patterns are order-sensitive and fail silently to <code>never</code> when they don't match — test them.",
    "Using <code>satisfies</code> where you actually want the wider type (e.g. a value passed to a function expecting the interface) can cause excess-property surprises."
  ],
  cards:[
    {q:"What does <code>satisfies</code> do that a type annotation doesn't?", a:"It validates the expression against the type but leaves the <i>inferred</i> type intact. An annotation replaces the inferred type with the declared one, widening literals and erasing exact keys; <code>satisfies</code> gives you the check plus the narrow inference."},
    {q:"Give a practical use of template literal types.", a:"Typed route tables and route params (<code>Params&lt;'/users/:id'&gt;</code> → <code>'id'</code>), typed event names (<code>`on${Capitalize&lt;E&gt;}`</code>), typed CSS units, and typed API keys — anywhere a string's <i>shape</i> carries meaning."},
    {q:"Why can template literal types hurt compile performance?", a:"Combining unions produces their cross product. Three ten-member unions is 1,000 literal types, and recursive pattern matching multiplies that — the language server slows noticeably."}
  ],
  quiz:[
    {q:"What is the type of <code>c.mode</code>?", code:`const c = { mode: 'dark', size: 10 } satisfies { mode: 'dark'|'light'; size: number };`,
     options:["'dark'","'dark' | 'light'","string","never"], answer:0,
     why:"<code>satisfies</code> checks conformance without replacing the inferred type, so <code>mode</code> keeps its literal type <code>'dark'</code>. A <code>: {mode:'dark'|'light'}</code> annotation would have widened it to the union."}
  ],
  cheat:[

{ id:'ts-variance', group:'Type-level programming', title:'Variance, branded types & type-level safety', animate:'narrow',
  lede:"Why arrays are unsound, why callback parameters behave oddly, and how to get nominal typing back when you need it.",
  say:"TypeScript is mostly covariant, and deliberately unsound in two well-known places: arrays are covariant, and method parameters are bivariant, both for ergonomics. Function <i>type</i> parameters are contravariant under <code>strictFunctionTypes</code>. When structural typing is genuinely dangerous — mixing up a UserId and an OrderId, or a raw string and a sanitised one — I use branded types to get nominal behaviour with zero runtime cost.",
  steps:[
    "<b>Covariance</b>: if <code>Dog extends Animal</code>, then <code>Dog[]</code> is assignable to <code>Animal[]</code>. Intuitive — and <b>unsound</b>, because you could then push a <code>Cat</code> into it.",
    "TypeScript accepts that unsoundness deliberately: sound array types would be far more annoying than the bugs they prevent.",
    "<b>Contravariance</b>: a function accepting a <i>wider</i> parameter type is assignable where one accepting a narrower type is expected — <code>(a: Animal) =&gt; void</code> can stand in for <code>(d: Dog) =&gt; void</code>.",
    "<code>strictFunctionTypes</code> enforces contravariance for <b>function-type</b> properties, but <b>method</b> parameters stay bivariant for compatibility (that's why <code>Array&lt;T&gt;</code>'s methods behave loosely).",
    "<b>readonly arrays</b> (<code>readonly T[]</code>) are the safe covariant option — you can't push into them, so the unsoundness disappears.",
    "<b>Branded (nominal) types</b>: intersect a base type with a phantom property to make structurally identical types incompatible.",
    "Branding costs nothing at runtime — the brand is erased — and gives you compile-time guarantees for IDs, currency amounts, validated/sanitised strings and units.",
    "Pair a brand with a validating constructor so the only way to obtain a branded value is to pass the check: 'parse, don't validate'."
  ],
  code:`<span class="cm">// covariance is unsound but allowed</span>
const dogs: Dog[] = [new Dog()];
const animals: Animal[] = dogs;   <span class="cm">// OK</span>
animals.push(new Cat());          <span class="cm">// compiles — dogs now contains a Cat 💥</span>
const safe: readonly Animal[] = dogs;   <span class="cm">// sound: no push available</span>

<span class="cm">// branded / nominal types</span>
declare const brand: unique symbol;
type Brand&lt;T, B&gt; = T &amp; { readonly [brand]: B };

type UserId  = Brand&lt;string, 'UserId'&gt;;
type OrderId = Brand&lt;string, 'OrderId'&gt;;

function toUserId(s: string): UserId {
  if (!/^usr_/.test(s)) throw new Error('bad user id');
  return s as UserId;                       <span class="cm">// the ONLY assertion, inside the validator</span>
}
declare function getUser(id: UserId): User;

getUser(toUserId('usr_1'));   <span class="cm">// ✔</span>
getUser('usr_1');             <span class="cm">// ✘ plain string not assignable</span>
getUser(orderId);             <span class="cm">// ✘ different brand</span>`,
  traps:[
    "Array covariance means a function taking <code>Animal[]</code> can mutate a <code>Dog[]</code> you passed it. Accept <code>readonly T[]</code> in parameters unless you need to mutate.",
    "Method bivariance means an event-handler signature mismatch can slip through — declare handler properties as function types (arrow syntax) to get strict checking.",
    "Branding requires one assertion inside the constructor; keeping it in exactly one place is the discipline that makes the pattern safe.",
    "Brands survive to nothing at runtime, so a branded value coming from JSON is just a string — you still need runtime validation at the boundary.",
    "Over-branding every string makes code noisy; brand the ones that are genuinely confusable or security-relevant."
  ],
  cards:[
    {q:"Why are TypeScript arrays unsound?", a:"They're covariant: <code>Dog[]</code> is assignable to <code>Animal[]</code>, after which you can push a <code>Cat</code> into what is really an array of Dogs. TypeScript accepts this deliberately for ergonomics. Use <code>readonly T[]</code> in parameters to make it sound."},
    {q:"What is a branded type and why use it?", a:"A structural type intersected with a phantom marker (<code>string & {__brand:'UserId'}</code>) so that two structurally identical types become incompatible. It gives nominal typing with zero runtime cost — for IDs, money, validated strings, units."},
    {q:"What does <code>strictFunctionTypes</code> change?", a:"It makes function-<i>type</i> parameter positions checked contravariantly instead of bivariantly. Method declarations are exempt for backwards compatibility, so declaring a callback as a property with arrow syntax gets you the strict check and method syntax doesn't."}
  ],
  quiz:[
    {q:"Why does this compile?", code:`const dogs: Dog[] = [];\nconst animals: Animal[] = dogs;\nanimals.push(new Cat());`,
     options:["Arrays are covariant — deliberately unsound","Cat extends Dog","push is untyped","It doesn't compile"], answer:0,
     why:"Array covariance lets <code>Dog[]</code> be treated as <code>Animal[]</code>, which then permits pushing any Animal. TypeScript accepts this known unsoundness for practicality; <code>readonly Animal[]</code> avoids it."}
  ],
  cheat:[
    "Covariant: <code>Dog[]</code> → <code>Animal[]</code> (unsound, deliberate). <b>Use <code>readonly T[]</code> in params.</b>",
    "Contravariant params under <code>strictFunctionTypes</code> — but <b>methods stay bivariant</b>.",
    "Branded type: <code>type UserId = string &amp; { readonly __b: 'UserId' }</code> → nominal, zero runtime.",
    "One assertion, inside a validating constructor (\"parse, don't validate\").",
    "Brands don't survive JSON — still validate at boundaries."
  ]
},
