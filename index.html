    "<b>Closure</b> = function + live reference to its defining environment; keeps those variables off the GC.",
    "Each <i>call</i> makes a new scope → factories produce independent state.",
    "<code>var</code> function-scoped & hoisted; <code>let/const</code> block-scoped with per-iteration bindings in <code>for</code>.",
    "Uses: private state, memoisation, once/debounce/throttle, partial application, module pattern.",
    "Cost: closures pin memory. Long-lived callback + big captured object = leak."
  ]
},

{ id:'hoist', group:'Scope & functions', title:'Hoisting & the temporal dead zone', animate:'hoist',
  lede:"Hoisting is a side effect of the creation phase — nothing is physically moved.",
  say:"During the creation phase the engine registers declarations before any code runs. <code>var</code> is initialised to <code>undefined</code>; function declarations are hoisted with their whole body; <code>let</code>, <code>const</code> and <code>class</code> are hoisted but uninitialised, so touching them before their declaration line throws a ReferenceError — that gap is the temporal dead zone.",
  steps:[
    "In the <b>creation phase</b>, the engine scans the scope and registers all declarations in memory before executing a line.",
    "<code>var</code> is initialised to <code>undefined</code> immediately — readable but empty before its line runs.",
    "<b>Function declarations</b> are hoisted with their full body, so they're callable before they appear.",
    "<code>let</code>/<code>const</code>/<code>class</code> are hoisted too, but remain <b>uninitialised</b> in the <b>temporal dead zone</b> until their declaration executes — access throws <code>ReferenceError: Cannot access 'x' before initialization</code>.",
    "A <b>function expression</b> assigned to <code>var</code> is not hoisted with its body — only <code>var f</code> is, so calling it early gives <code>TypeError: f is not a function</code>.",
    "When a function declaration and a <code>var</code> share a name, the <b>function wins</b> during hoisting (it's registered after and overwrites the placeholder).",
    "The TDZ is <b>per block</b>. In a <code>switch</code>, all cases share one block — a <code>let</code> declared in a later case is in the TDZ for the earlier ones.",
    "<code>typeof x</code> is safe for undeclared identifiers but <b>throws</b> for a TDZ variable — the one place <code>typeof</code> isn't exception-proof."
  ],
  code:`console.log(x);   <span class="cm">// undefined — var is hoisted & initialised</span>
var x = 5;

console.log(y);   <span class="cm">// ReferenceError — TDZ</span>
let y = 5;

sayHi();          <span class="cm">// 'hi' — declaration hoisted with body</span>
function sayHi(){ console.log('hi'); }

nope();           <span class="cm">// TypeError: nope is not a function</span>
var nope = function(){};`,
  traps:[
    "<code>TypeError: x is not a function</code> vs <code>ReferenceError: Cannot access 'x'</code> — the first means <code>var</code>-hoisted-but-undefined, the second means TDZ. The error type tells you which declaration form was used.",
    "Default parameters have their own TDZ left-to-right: <code>function f(a = b, b = 1){}</code> throws when called with no args.",
    "Class declarations are <b>not</b> hoisted usefully — <code>new Foo()</code> before <code>class Foo{}</code> throws.",
    "In non-strict sloppy mode, assigning to an undeclared identifier creates an implicit global. Modules and <code>'use strict'</code> make that a ReferenceError — always run strict."
  ],
  terms:[
    {term:"Hoisting", desc:"Declarations processed before execution; only var initialises to undefined.", detail:"Function declarations are hoisted with their entire body attached, which is why you can call a helper defined further down the same file.", code:`sayHi();  <span class="cm">// works</span>\nfunction sayHi(){ console.log('hi'); }`},
    {term:"Temporal dead zone", desc:"The span from scope start to the declaration line where let/const exist but can't be read.", detail:"The TDZ exists so that <code>const</code> can be guaranteed never to be observed uninitialised — a stronger guarantee than <code>var</code>'s silent <code>undefined</code>.", code:`{\n  <span class="cm">// TDZ for a starts here</span>\n  console.log(typeof a);  <span class="cm">// ReferenceError — even typeof!</span>\n  let a = 10;\n}`}
  ],
  cards:[
    {q:"What's hoisted and how?", a:"<code>var</code> → hoisted + initialised to <code>undefined</code>. <b>Function declarations</b> → hoisted with body. <code>let/const/class</code> → hoisted but uninitialised (TDZ). Function <i>expressions</i> and arrows follow their variable's rules."},
    {q:"How can you tell TDZ from var-hoisting by the error alone?", a:"TDZ gives <code>ReferenceError: Cannot access 'x' before initialization</code>. A var-hoisted function expression gives <code>TypeError: x is not a function</code> because the binding exists but holds <code>undefined</code>."},
    {q:"Is <code>typeof</code> always safe?", a:"No. It's safe for completely undeclared identifiers (returns <code>'undefined'</code>), but it throws for a <code>let</code>/<code>const</code> still in its temporal dead zone."}
  ],
  quiz:[
    {q:"What happens?", code:`function f(){\n  console.log(v);\n  var v = 1;\n  console.log(v);\n}\nf();`,
     options:["undefined, then 1","ReferenceError","1, then 1","undefined, then undefined"], answer:0,
     why:"<code>var v</code> is hoisted and initialised to <code>undefined</code> at creation; the assignment happens on its own line during execution."},
    {q:"Result?", code:`{\n  foo();\n  function foo(){ console.log('a'); }\n}\nfoo();`,
     options:["'a', then ReferenceError in strict mode/modules","'a', 'a'","ReferenceError twice","TypeError"], answer:0,
     why:"In strict mode/ESM, block-level function declarations are block-scoped: the inner call works, the outer one fails. In sloppy mode legacy web-compat semantics leak it to the function scope, which is exactly why this pattern is best avoided."}
  ],
  cheat:[
    {t:'table', head:['Declaration','Hoisted?','Initialised','Access before line'], rows:[
      ['<code>var</code>','Yes','<code>undefined</code>','<code>undefined</code>'],
      ['<code>function</code> decl','Yes','Full body','Callable'],
      ['<code>let</code> / <code>const</code>','Yes','No (TDZ)','ReferenceError'],
      ['<code>class</code>','Yes','No (TDZ)','ReferenceError'],
      ['<code>var f = function(){}</code>','Only <code>f</code>','<code>undefined</code>','TypeError on call']
    ]},
    "TDZ is <b>per block</b>; all <code>switch</code> cases share one block.",
    "<code>typeof</code> throws inside a TDZ — the only place it isn't safe.",
    "Function declaration beats <code>var</code> of the same name during hoisting."
  ]
},

{ id:'this', group:'Scope & functions', title:"The 'this' keyword & binding rules", animate:'thisflip',
  lede:"'this' is decided by how a function is called, not where it's written — except for arrow functions, which have none of their own.",
  say:"There are four binding rules, checked in this precedence order: <code>new</code> binding, then explicit binding via call/apply/bind, then implicit binding from the object left of the dot, then default binding (undefined in strict mode, globalThis in sloppy). Arrow functions have no <code>this</code> at all — they close over the enclosing lexical <code>this</code>, which is why they're the right choice for callbacks inside class methods.",
  steps:[
    "<b>Default binding</b> — <code>fn()</code>: <code>this</code> is <code>undefined</code> in strict mode/modules, or <code>globalThis</code> in sloppy mode.",
    "<b>Implicit binding</b> — <code>obj.fn()</code>: <code>this</code> is whatever is left of the dot <i>at the call site</i>.",
    "<b>Explicit binding</b> — <code>fn.call(o)</code>, <code>fn.apply(o, args)</code>, <code>fn.bind(o)</code>. <code>call</code>/<code>apply</code> invoke immediately (list vs array args); <code>bind</code> returns a new function with <code>this</code> permanently fixed.",
    "<b>new binding</b> — <code>new Fn()</code>: <code>this</code> is the freshly created object. This has the highest precedence and <code>bind</code> can't override it.",
    "<b>Arrow functions</b> have no own <code>this</code>, <code>arguments</code>, <code>super</code> or <code>new.target</code> — they inherit <code>this</code> lexically and permanently. <code>call/apply/bind</code> cannot change it.",
    "Precedence: <code>new</code> &gt; explicit (<code>bind</code>/<code>call</code>) &gt; implicit (dot) &gt; default.",
    "Losing the binding is the classic bug: <code>const f = obj.method; f()</code> drops the implicit binding. Same thing happens with <code>setTimeout(obj.method, 0)</code> or passing a method as a callback.",
    "Class fields defined as arrows (<code>handleClick = () =&gt; {}</code>) are per-instance and auto-bound; regular class methods live on the prototype and are not."
  ],
  code:`const obj = {
  name: 'A',
  normal(){ return this.name; },        <span class="cm">// 'A' — obj called it</span>
  arrow: () =&gt; this?.name               <span class="cm">// undefined — lexical this</span>
};

const detached = obj.normal;
detached();                              <span class="cm">// undefined (strict) — binding lost</span>
detached.call(obj);                      <span class="cm">// 'A'</span>

class Btn {
  label = 'save';
  onClick = () =&gt; this.label;            <span class="cm">// auto-bound field</span>
  onClickBad(){ return this.label; }     <span class="cm">// loses this if detached</span>
}`,
  traps:[
    "<code>bind</code> is permanent — <code>f.bind(a).bind(b)</code> is still bound to <code>a</code>. Only <code>new</code> overrides it.",
    "Arrow functions as <b>object methods</b> are almost always wrong: <code>this</code> is the enclosing scope (module → <code>undefined</code>, browser script → <code>window</code>), not the object.",
    "Arrow functions as <b>prototype methods</b> break inheritance and add a copy per instance if written as class fields — fine for handlers, wasteful for large classes.",
    "In a DOM event handler declared with <code>function</code>, <code>this</code> is the element; with an arrow it's the enclosing scope. Use <code>event.currentTarget</code> to be explicit either way.",
    "<code>this</code> inside a plain nested function in a method is <b>not</b> the object — the classic pre-ES6 <code>const self = this</code> workaround, now solved by arrows."
  ],
  terms:[
    {term:"Implicit binding & its loss", desc:"'this' comes from the object left of the dot — and vanishes the moment you detach the method.", detail:"Detaching happens more often than people expect: assigning to a variable, passing as a callback, destructuring off an object, or extracting into an array of handlers.", code:`const { normal } = obj;   <span class="cm">// destructuring detaches too</span>\nnormal();                  <span class="cm">// this is undefined</span>\nsetTimeout(obj.normal, 0); <span class="cm">// also detached</span>\nsetTimeout(() =&gt; obj.normal(), 0);  <span class="cm">// fixed</span>`},
    {term:"call / apply / bind", desc:"Explicit binding: two invoke now, one returns a bound copy.", detail:"<code>call</code> takes args as a list, <code>apply</code> as an array (mnemonic: <b>A</b>pply = <b>A</b>rray), <code>bind</code> returns a new function and also supports partial application of leading arguments.", code:`function greet(greeting, punct){ return greeting + ' ' + this.name + punct; }\ngreet.call(obj, 'Hi', '!');\ngreet.apply(obj, ['Hi', '!']);\nconst hi = greet.bind(obj, 'Hi');\nhi('!');   <span class="cm">// partial application</span>`},
    {term:"new binding", desc:"What `new` actually does, in four steps.", detail:"1) create an empty object; 2) set its <code>[[Prototype]]</code> to <code>Fn.prototype</code>; 3) call <code>Fn</code> with <code>this</code> = that object; 4) return it, unless the constructor explicitly returns another object.", code:`function myNew(Fn, ...args){\n  const o = Object.create(Fn.prototype);\n  const r = Fn.apply(o, args);\n  return (r &amp;&amp; typeof r === 'object') ? r : o;\n}`}
  ],
  cards:[
    {q:"Name the four <code>this</code> binding rules in precedence order.", a:"1) <code>new</code> binding. 2) Explicit binding (<code>call</code>/<code>apply</code>/<code>bind</code>). 3) Implicit binding (object left of the dot at the call site). 4) Default binding (<code>undefined</code> in strict mode, <code>globalThis</code> in sloppy)."},
    {q:"Why can't <code>call</code> change an arrow function's <code>this</code>?", a:"Arrow functions have no own <code>this</code> binding at all. The identifier resolves lexically up the scope chain, exactly like any other variable, so there's nothing for <code>call</code> to set."},
    {q:"When are class-field arrows worth the cost?", a:"For handlers you pass around (React callbacks, listeners) where losing the binding is likely. The cost is one function object per instance instead of one shared on the prototype — fine for a few handlers, wasteful for a large method surface."},
    {q:"Difference between <code>call</code> and <code>apply</code>?", a:"Only how arguments are passed: <code>call(thisArg, a, b)</code> takes a list, <code>apply(thisArg, [a, b])</code> takes an array. <b>A</b>pply = <b>A</b>rray."}
  ],
  quiz:[
    {q:"What does this log?", code:`const o = {\n  v: 42,\n  reg(){ return (function(){ return this?.v; })(); },\n  arw(){ return (() =&gt; this.v)(); }\n};\nconsole.log(o.reg(), o.arw());`,
     options:["undefined 42","42 42","undefined undefined","42 undefined"], answer:0,
     why:"The inner <code>function</code> is called plainly → default binding → <code>this</code> is undefined in strict mode. The arrow inherits <code>this</code> from <code>arw</code>, which was called as <code>o.arw()</code>, so it sees <code>o</code>."},
    {q:"Result?", code:`function F(){ this.x = 1; }\nconst B = F.bind({ x: 99 });\nconst inst = new B();\nconsole.log(inst.x);`,
     options:["1 — new beats bind","99 — bind wins","undefined","TypeError"], answer:0,
     why:"<code>new</code> has the highest precedence: it creates a fresh object and ignores the bound <code>this</code>. Bound arguments are still applied, but the bound <code>this</code> is discarded."}
  ],
  cheat:[
    "<b>Precedence:</b> <code>new</code> &gt; <code>bind/call/apply</code> &gt; <code>obj.fn()</code> &gt; plain call (undefined in strict).",
    "Arrows: no own <code>this</code>/<code>arguments</code>/<code>super</code>/<code>new.target</code>; lexical & unchangeable by call/apply/bind; can't be <code>new</code>'d.",
    "<b>A</b>pply = <b>A</b>rray. <code>bind</code> returns a new fn + supports partial application.",
    "Binding is lost by: assignment, destructuring, passing as callback, <code>setTimeout(obj.m)</code>.",
    "<code>new</code> = create obj → link prototype → call with this → return obj unless ctor returns an object.",
    {t:'mnemonic', text:"<b>“N-E-I-D”</b> — <b>N</b>ew, <b>E</b>xplicit, <b>I</b>mplicit, <b>D</b>efault. Walk the list top-down at the call site and you always get the right answer."}
  ]
},

{ id:'funcs', group:'Scope & functions', title:'Higher-order functions, currying & memoization', animate:'chain',
  lede:"Functions are values. Everything from middleware to React hooks to retry wrappers is built on that one fact.",
  say:"A higher-order function takes or returns a function. Currying turns <code>f(a,b,c)</code> into <code>f(a)(b)(c)</code> so you can specialise early; partial application just pre-fills some arguments. Memoization caches results by argument key — the important production detail is bounding that cache and choosing a correct key, otherwise it's a memory leak with extra steps.",
  steps:[
    "A <b>higher-order function</b> takes a function as an argument, returns one, or both. <code>map</code>, <code>filter</code>, <code>reduce</code>, Express middleware and React HOCs are all instances.",
    "<b>Partial application</b> pre-fills some arguments and returns a function awaiting the rest: <code>bind</code> does this natively.",
    "<b>Currying</b> transforms an n-ary function into a chain of unary functions. It composes beautifully but adds allocations — use it where it reads better, not everywhere.",
    "<b>Composition</b> (<code>compose</code>/<code>pipe</code>) chains single-argument transforms: <code>pipe(a, b, c)(x) === c(b(a(x)))</code>.",
    "<b>Memoization</b> wraps a pure function with a cache keyed on the arguments — pure is the key requirement, since caching a side-effecting function changes behaviour.",
    "Key design matters: <code>JSON.stringify(args)</code> is easy but is order-sensitive for object keys and can't represent functions or cycles. For single-object arguments a <code>WeakMap</code> keyed on the object is both faster and self-cleaning.",
    "An unbounded memo cache in a long-lived process is a leak. Bound it with an LRU (max size + eviction) or a TTL.",
    "<code>reduce</code> is the general fold — <code>map</code>, <code>filter</code> and <code>flatMap</code> can all be expressed with it, which is a common whiteboard question."
  ],
  code:`const pipe = (...fns) =&gt; x =&gt; fns.reduce((v, f) =&gt; f(v), x);
const slugify = pipe(s =&gt; s.trim(), s =&gt; s.toLowerCase(), s =&gt; s.replace(/\\s+/g,'-'));

function curry(fn){
  return function next(...args){
    return args.length &gt;= fn.length ? fn(...args) : (...more) =&gt; next(...args, ...more);
  };
}
const add3 = curry((a,b,c) =&gt; a+b+c);
add3(1)(2)(3);  <span class="cm">// 6</span>

function memoize(fn, { max = 500 } = {}){
  const cache = new Map();
  return (...args) =&gt; {
    const k = JSON.stringify(args);
    if (cache.has(k)) { const v = cache.get(k); cache.delete(k); cache.set(k, v); return v; } <span class="cm">// LRU touch</span>
    const v = fn(...args);
    cache.set(k, v);
    if (cache.size &gt; max) cache.delete(cache.keys().next().value);   <span class="cm">// evict oldest</span>
    return v;
  };
}`,
  traps:[
    "Memoizing an <b>impure</b> or time-dependent function silently freezes stale results. Memoize pure computation, cache I/O separately with a TTL.",
    "<code>JSON.stringify</code> keys are order-sensitive: <code>{a:1,b:2}</code> and <code>{b:2,a:1}</code> produce different keys for the same logical input.",
    "Memoizing an async function should cache the <b>promise</b>, not the resolved value — that also de-duplicates concurrent calls (request coalescing). But remember to evict on rejection or you cache the failure forever.",
    "<code>fn.length</code> (used by naive curry implementations) ignores rest and default parameters, so currying such functions misbehaves."
  ],
  terms:[
    {term:"Async memoization / request coalescing", desc:"Cache the in-flight promise so N concurrent callers make one call.", detail:"This is the single-process version of the cache-stampede fix: the first caller starts the work, everyone else awaits the same promise. Deleting the entry on rejection prevents a permanent poisoned cache.", code:`function memoAsync(fn){\n  const inflight = new Map();\n  return (k) =&gt; {\n    if (inflight.has(k)) return inflight.get(k);\n    const p = fn(k).finally(() =&gt; inflight.delete(k));\n    inflight.set(k, p);\n    return p;\n  };\n}`},
    {term:"reduce as the universal fold", desc:"map/filter/flatMap/groupBy are all reduce with a different accumulator.", detail:"Being able to reimplement map and filter with reduce on the spot is a very common interview micro-exercise, and it demonstrates you understand accumulators.", code:`const map = (a, f) =&gt; a.reduce((acc, x, i) =&gt; (acc.push(f(x, i)), acc), []);\nconst filter = (a, p) =&gt; a.reduce((acc, x) =&gt; (p(x) &amp;&amp; acc.push(x), acc), []);\nconst groupBy = (a, k) =&gt; a.reduce((acc, x) =&gt; ((acc[k(x)] ??= []).push(x), acc), {});`}
  ],
  cards:[
    {q:"Currying vs partial application?", a:"Currying converts <code>f(a,b,c)</code> into a chain of unary calls <code>f(a)(b)(c)</code>. Partial application fixes <i>some</i> arguments and returns a function taking the rest — <code>f.bind(null, a)</code>. Currying is a transformation of the function's shape; partial application is a single specialisation."},
    {q:"What must be true for memoization to be safe?", a:"The function must be pure (same inputs → same output, no observable side effects), the cache key must faithfully represent the inputs, and the cache must be bounded (LRU/TTL) in a long-lived process."},
    {q:"Why memoize the promise rather than the value in async code?", a:"Because it de-duplicates concurrent callers — the second caller awaits the same in-flight promise instead of firing another request. Just remember to evict on rejection so a transient failure isn't cached forever."}
  ],
  quiz:[
    {q:"What does this return?", code:`const pipe = (...f) =&gt; x =&gt; f.reduce((v, g) =&gt; g(v), x);\nconsole.log(pipe(n =&gt; n + 1, n =&gt; n * 2)(3));`,
     options:["8","7","9","6"], answer:0,
     why:"pipe applies left-to-right: <code>3 + 1 = 4</code>, then <code>4 * 2 = 8</code>. (<code>compose</code> would be right-to-left and give 7.)"}
  ],
  cheat:[
    "HOF = takes and/or returns a function. map/filter/reduce, middleware, decorators, hooks.",
    "<code>pipe</code> = left→right, <code>compose</code> = right→left.",
    "Curry: <code>f(a,b,c)</code> → <code>f(a)(b)(c)</code>. Partial: pre-fill some args (<code>bind</code>).",
    "Memoize pure fns only. Key carefully. <b>Always bound the cache</b> (LRU/TTL) in a server.",
    "Async memo → cache the <b>promise</b> (coalesces concurrent calls); delete on rejection.",
    "<code>reduce</code> can express map/filter/flatMap/groupBy — be ready to write them."
  ]
},

{ id:'proto', group:'Scope & functions', title:'Prototypes, classes & inheritance', animate:'protochain',
  lede:"JS has no classical inheritance — objects link to other objects, and `class` is sugar over that link.",
  say:"Every object has an internal <code>[[Prototype]]</code> link. Property lookup walks that chain until it finds the key or hits null. <code>class</code> is syntactic sugar: methods go on <code>Fn.prototype</code> and are shared across instances, <code>extends</code> wires the chain, and <code>super()</code> runs the parent constructor. The distinction interviewers probe is <code>__proto__</code> (the instance's link) versus <code>.prototype</code> (the object that <i>future</i> instances of a constructor will link to).",
  steps:[
    "Every object has an internal <code>[[Prototype]]</code> link, read with <code>Object.getPrototypeOf(o)</code> (legacy accessor: <code>__proto__</code>).",
    "Property access checks the object itself, then walks the <b>prototype chain</b> until found or <code>null</code>. The chain ends at <code>Object.prototype</code> → <code>null</code>.",
    "<code>Fn.prototype</code> is <b>not</b> Fn's prototype — it's the object that instances created with <code>new Fn()</code> will link to. <code>Fn.__proto__</code> is <code>Function.prototype</code>.",
    "<code>class</code> is sugar over this: methods land on <code>Class.prototype</code> (shared, one copy), fields land on the instance (one copy each).",
    "<code>extends</code> sets both links: <code>Child.prototype.__proto__ = Parent.prototype</code> (instance methods) and <code>Child.__proto__ = Parent</code> (static methods).",
    "<code>super()</code> must run before <code>this</code> is used in a derived constructor — in a derived class <code>this</code> literally doesn't exist until the parent constructor returns it.",
    "<code>hasOwnProperty</code> (or the safer <code>Object.hasOwn</code>) checks only the object itself, ignoring the chain — how you tell 'defined here' from 'inherited'.",
    "<b>Shadowing</b>: assigning to an inherited property creates an own property on the instance rather than modifying the prototype (except for inherited setters, which do run)."
  ],
  code:`function Dog(name){ this.name = name; }
Dog.prototype.bark = function(){ return this.name + ' barks'; };
const d = new Dog('Rex');
d.bark();                              <span class="cm">// found on Dog.prototype</span>
Object.getPrototypeOf(d) === Dog.prototype;  <span class="cm">// true</span>
d.hasOwnProperty('bark');              <span class="cm">// false — inherited</span>

class Animal {
  static kingdom = 'Animalia';
  constructor(name){ this.name = name; }
  speak(){ return this.name + ' makes a sound'; }
}
class Dog2 extends Animal {
  constructor(name){ super(name); this.legs = 4; }   <span class="cm">// super() first</span>
  speak(){ return super.speak() + ' (a bark)'; }
}
Dog2.kingdom;   <span class="cm">// 'Animalia' — statics inherit via Child.__proto__ = Parent</span>`,
  traps:[
    "Adding a method to <code>Array.prototype</code> pollutes every array in the process and can break <code>for…in</code> loops in libraries. Never monkey-patch built-ins in shared code.",
    "<code>Object.create(null)</code> makes a prototype-less dictionary — no <code>toString</code>, no <code>hasOwnProperty</code>. Safe against prototype-pollution attacks, but you must use <code>Object.hasOwn(o, k)</code> rather than <code>o.hasOwnProperty(k)</code>.",
    "<b>Prototype pollution</b> is a real vulnerability: a deep-merge that copies a key called <code>__proto__</code> from untrusted JSON can add properties to <code>Object.prototype</code> for the whole process. Reject <code>__proto__</code>/<code>constructor</code>/<code>prototype</code> keys in merges.",
    "Arrow functions have no <code>prototype</code> property and can't be constructed. Class methods aren't enumerable, so <code>for…in</code> won't see them but <code>Object.keys(instance)</code> won't either (they're not own).",
    "Class bodies are always strict mode, and class declarations are in the TDZ — you can't <code>new</code> one before its definition line."
  ],
  terms:[
    {term:"__proto__ vs prototype", desc:"The instance's link vs the constructor's blueprint object.", detail:"Only functions have a <code>.prototype</code> property. Every object has a <code>[[Prototype]]</code> link. The interview one-liner: '<code>.prototype</code> is what instances <i>will</i> get; <code>__proto__</code> is what this object <i>has</i>.'", code:`function F(){}\nconst i = new F();\ni.__proto__ === F.prototype;            <span class="cm">// true</span>\nF.__proto__ === Function.prototype;     <span class="cm">// true</span>\nF.prototype.__proto__ === Object.prototype;  <span class="cm">// true</span>`},
    {term:"Object.create(null)", desc:"A dictionary with no prototype chain at all.", detail:"Useful for maps keyed by untrusted strings — no accidental hits on inherited keys like <code>constructor</code> or <code>toString</code>, and immune to prototype pollution via those keys.", code:`const dict = Object.create(null);\n'toString' in dict;   <span class="cm">// false</span>\nObject.hasOwn(dict, 'x');   <span class="cm">// safe check</span>`},
    {term:"Mixins", desc:"Composing behaviour without single-inheritance limits.", detail:"Because <code>extends</code> accepts any expression returning a class, a mixin is just a function from class to class — the standard way to share behaviour across unrelated hierarchies.", code:`const Serializable = (Base) =&gt; class extends Base {\n  toJSON(){ return { ...this }; }\n};\nclass User extends Serializable(Object) {}`}
  ],
  cards:[
    {q:"Explain <code>__proto__</code> vs <code>prototype</code> in one line each.", a:"<code>__proto__</code> (i.e. <code>[[Prototype]]</code>) is the link an object follows during property lookup. <code>.prototype</code> is a property on <i>functions</i> holding the object that instances created with <code>new</code> will link to."},
    {q:"What exactly does <code>extends</code> wire up?", a:"Two links: <code>Child.prototype.[[Prototype]] = Parent.prototype</code> (so instances inherit instance methods) and <code>Child.[[Prototype]] = Parent</code> (so static members are inherited)."},
    {q:"Why must <code>super()</code> come before <code>this</code> in a derived constructor?", a:"In a derived class, <code>this</code> is created by the base constructor. Until <code>super()</code> returns, the binding is in a TDZ-like uninitialised state and touching it throws a ReferenceError."},
    {q:"What is prototype pollution and how do you prevent it?", a:"An attacker supplies JSON with a <code>__proto__</code> (or <code>constructor.prototype</code>) key that a naive recursive merge copies onto <code>Object.prototype</code>, affecting every object in the process. Prevent it by rejecting those keys, using <code>Object.create(null)</code> for parsed maps, freezing <code>Object.prototype</code>, or using a validated schema."}
  ],
  quiz:[
    {q:"What is logged?", code:`class A { greet(){ return 'A'; } }\nclass B extends A { greet(){ return super.greet() + 'B'; } }\nconsole.log(new B().greet(), Object.hasOwn(new B(), 'greet'));`,
     options:["'AB' false","'AB' true","'B' false","'BA' false"], answer:0,
     why:"<code>super.greet()</code> calls A's version then appends 'B'. Methods live on the prototype, not the instance, so <code>hasOwn</code> is false."},
    {q:"What does this print?", code:`function F(){}\nconst i = new F();\nconsole.log(F.prototype === Object.getPrototypeOf(i), F.__proto__ === F.prototype);`,
     options:["true false","true true","false false","false true"], answer:0,
     why:"The instance's prototype is <code>F.prototype</code> → true. But <code>F</code> itself is a function, so its own prototype link is <code>Function.prototype</code>, not <code>F.prototype</code> → false."}
  ],
  cheat:[
    "Lookup walks <code>[[Prototype]]</code> until match or <code>null</code>. Chain ends: <code>obj → Ctor.prototype → Object.prototype → null</code>.",
    "<code>Fn.prototype</code> = blueprint for future instances. <code>obj.__proto__</code> = this object's link. Only functions have <code>.prototype</code>.",
    "<code>class</code> = sugar. Methods → prototype (shared). Fields → instance (per copy). Class bodies are strict + TDZ.",
    "<code>extends</code> links <b>both</b> instance chain and static chain. <code>super()</code> before <code>this</code>.",
    "<code>Object.hasOwn(o,k)</code> &gt; <code>o.hasOwnProperty(k)</code>. <code>Object.create(null)</code> for untrusted dictionaries.",
    "Security: <b>prototype pollution</b> via <code>__proto__</code> in deep merge — block those keys."
  ]
},

{ id:'descriptors', group:'Scope & functions', title:'Property descriptors, getters & static/private members', animate:'access',
  lede:"Every property has hidden metadata — writable, enumerable, configurable — and that metadata explains a lot of otherwise surprising behaviour.",
  say:"Properties aren't just key/value; each has a descriptor with writable, enumerable and configurable flags, or get/set accessors. Object literal properties default all three to true; <code>defineProperty</code> defaults them all to false. That's why class methods don't show up in <code>Object.keys</code> — they're non-enumerable — and it's the mechanism behind read-only fields, computed properties and library-level API design.",
  steps:[
    "A <b>data descriptor</b> has <code>value</code>, <code>writable</code>, <code>enumerable</code>, <code>configurable</code>. An <b>accessor descriptor</b> has <code>get</code>, <code>set</code>, <code>enumerable</code>, <code>configurable</code>. A property is one or the other, never both.",
    "Literal/assignment-created properties default to <code>writable: true, enumerable: true, configurable: true</code>. <code>Object.defineProperty</code> defaults every omitted flag to <b>false</b>.",
    "<code>enumerable: false</code> hides a property from <code>for…in</code>, <code>Object.keys</code>, spread and <code>JSON.stringify</code> — but it's still readable and still found by <code>Object.getOwnPropertyNames</code>.",
    "<b>Class methods are non-enumerable</b> by design (unlike object-literal methods) so they don't pollute iteration over instances.",
    "<code>configurable: false</code> locks the descriptor: you can't delete the property or change its flags (you can still write to it if <code>writable</code> is true).",
    "<b>Getters/setters</b> run code on property access with plain-property syntax — useful for computed values, validation and lazy initialisation, but they hide cost behind what looks like a field read.",
    "<code>static</code> members live on the constructor, not the prototype — inherited through the constructor chain, not through instances.",
    "<code>#private</code> fields are true runtime privacy enforced by the engine: unreachable from outside the class body, invisible to reflection, and <code>#x in obj</code> is the standard brand check."
  ],
  code:`const o = {};
Object.defineProperty(o, 'id', { value: 1 });          <span class="cm">// all flags default FALSE</span>
o.id = 99;            <span class="cm">// silently ignored (throws in strict mode)</span>
Object.keys(o);       <span class="cm">// [] — not enumerable</span>
JSON.stringify(o);    <span class="cm">// '{}'</span>

class Temp {
  #celsius = 0;                                     <span class="cm">// true private</span>
  get fahrenheit(){ return this.#celsius * 9/5 + 32; }
  set fahrenheit(f){ this.#celsius = (f - 32) * 5/9; }
  static isTemp(x){ return #celsius in x; }         <span class="cm">// brand check</span>
}
Object.keys(new Temp());          <span class="cm">// [] — accessors are on the prototype</span>`,
  traps:[
    "Silent failure: writing to a non-writable property does nothing in sloppy mode and throws only in strict mode/modules. Modules are always strict, so behaviour differs between a script tag and an import.",
    "Spread and <code>Object.assign</code> <b>invoke getters</b> and copy the resulting values as plain data properties — the accessor itself is not copied.",
    "<code>JSON.stringify</code> skips non-enumerable props, functions, and <code>undefined</code> values, and calls <code>toJSON()</code> if present.",
    "A getter that does real work (a network call, heavy computation) is a footgun — callers reasonably assume property access is cheap."
  ],
  terms:[
    {term:"Object.freeze / seal / preventExtensions", desc:"Three levels of locking, all shallow.", detail:"<code>preventExtensions</code>: no new properties. <code>seal</code>: that plus non-configurable (no delete). <code>freeze</code>: that plus non-writable. All shallow, all reversible only by never having done them.", code:`const o = { a: 1, nested: {} };\nObject.isFrozen(o);            <span class="cm">// false</span>\nObject.freeze(o);\ndelete o.a;                    <span class="cm">// false / throws in strict</span>\no.nested.b = 1;                <span class="cm">// still works — shallow</span>`},
    {term:"#private fields", desc:"Engine-enforced privacy, unlike TypeScript's compile-time `private`.", detail:"They're stored in a private slot, not a property, so they don't appear in <code>Object.getOwnPropertyNames</code>, can't be reached via bracket notation, and survive minification/compilation intact.", code:`class A { #s = 1; static has(o){ return #s in o; } }\nconst a = new A();\nObject.getOwnPropertyNames(a);  <span class="cm">// [] — invisible</span>\nA.has(a);   <span class="cm">// true</span>\nA.has({});  <span class="cm">// false — no exception, clean brand check</span>`}
  ],
  cards:[
    {q:"Why don't class methods appear in <code>Object.keys(instance)</code>?", a:"Two reasons: they live on the prototype (not own properties), and class methods are defined as <b>non-enumerable</b>, unlike object-literal methods."},
    {q:"What do the flags default to?", a:"Properties created by literal or assignment: all three <code>true</code>. Properties created with <code>Object.defineProperty</code>: every omitted flag defaults to <code>false</code> — a very common surprise."},
    {q:"TypeScript <code>private</code> vs JavaScript <code>#private</code>?", a:"TS <code>private</code> is compile-time only — the field exists in the emitted JS and is reachable via bracket notation or <code>as any</code>. <code>#private</code> is enforced by the engine at runtime and is genuinely unreachable from outside the class body."}
  ],
  quiz:[
    {q:"What is logged?", code:`const o = {};\nObject.defineProperty(o, 'x', { value: 1 });\no.x = 5;\nconsole.log(o.x, Object.keys(o).length);`,
     options:["1 0","5 1","1 1","5 0"], answer:0,
     why:"defineProperty defaults <code>writable</code> and <code>enumerable</code> to false, so the assignment is ignored (sloppy mode) and the key is invisible to <code>Object.keys</code>."}
  ],
  cheat:[
    "Descriptor flags: <b>writable, enumerable, configurable</b> (data) or <b>get/set</b> (accessor).",
    "Literal → all true. <code>defineProperty</code> → omitted flags <b>false</b>.",
    "Class methods = on prototype + <b>non-enumerable</b> → invisible to keys/spread/JSON.",
    "<code>preventExtensions</code> ⊂ <code>seal</code> ⊂ <code>freeze</code>. All shallow.",
    "<code>#private</code> = runtime-enforced; TS <code>private</code> = compile-time only. <code>#x in obj</code> = brand check.",
    "Spread/assign <b>call getters</b> and flatten them to data properties."
  ]
},

/* ==================== ASYNC ==================== */
{ id:'loop-js', group:'Asynchrony', title:'The event loop in the browser', animate:'loop',
  lede:"The JS engine runs your code on one stack; the browser supplies everything the engine itself can't do.",
  say:"V8 gives you the call stack and heap but no timers, no network, no DOM. The host — browser or Node — provides those and an event loop. When an async operation completes, its callback is queued; the loop pushes it onto the stack only when the stack is empty, and it drains the entire microtask queue after every single task before taking the next macrotask.",
  steps:[
    "The <b>JS engine</b> (V8) runs your code on a single call stack — it has no networking, timers or DOM of its own.",
    "Async work (<code>fetch</code>, <code>setTimeout</code>, DOM listeners) is handed to <b>Web APIs</b> provided by the browser, which run outside the JS thread.",
    "On completion, callbacks are queued into the <b>macrotask queue</b> (timers, I/O, events) or the <b>microtask queue</b> (promises, <code>queueMicrotask</code>, MutationObserver).",
    "The <b>event loop</b> pushes a queued callback onto the stack only when the stack is empty — and drains <b>all</b> microtasks (including newly queued ones) before the next macrotask.",
    "Per turn the browser does roughly: run one macrotask → drain microtasks → run <code>requestAnimationFrame</code> callbacks → style/layout/paint if needed.",
    "<code>requestAnimationFrame</code> is a third scheduling point: after microtasks, just before the next repaint — the right place for visual updates.",
    "<code>requestIdleCallback</code> runs low-priority work in leftover frame time, and <code>MessageChannel</code> is the classic way to get a macrotask with no clamped delay.",
    "A long synchronous loop <b>freezes the page</b> — clicks, scrolling and painting all wait behind whatever is on the stack. That's why long tasks (&gt;50ms) are a Core Web Vitals problem."
  ],
  code:`console.log('A');
setTimeout(() =&gt; console.log('B'), 0);            <span class="cm">// macrotask</span>
Promise.resolve().then(() =&gt; console.log('C'));   <span class="cm">// microtask</span>
requestAnimationFrame(() =&gt; console.log('D'));    <span class="cm">// before next paint</span>
console.log('E');
<span class="cm">// A, E, C, D, B   (D before B because rAF runs before the next macrotask turn)</span>`,
  traps:[
    "<code>setTimeout(fn, 0)</code> is clamped to a minimum (~4ms after 5 nested timers in browsers), so it is never truly immediate.",
    "Timers guarantee a <b>minimum</b> delay, not an exact one — a busy stack delays them arbitrarily.",
    "Microtask starvation is real: a promise chain that re-queues itself will block rendering and timers indefinitely.",
    "The event loop is a <b>host</b> feature, not part of ECMAScript. That's why Node's differs from the browser's."
  ],
  terms:[
    {term:"Web APIs", desc:"Browser-provided capabilities (DOM, fetch, timers) outside the JS engine.", detail:"They run on the browser's own threads or in the network stack, which is exactly why they don't block your JS while waiting.", code:`fetch('/api/data')            <span class="cm">// browser network stack</span>\n  .then(r =&gt; r.json())        <span class="cm">// callback queued as a microtask</span>\n  .then(console.log);`},
    {term:"Long task", desc:"Any task blocking the main thread for over 50ms.", detail:"Long tasks are what INP (Interaction to Next Paint) measures against. The fix is to break work into chunks that yield — <code>await scheduler.yield()</code>, or slicing across <code>setTimeout</code>/<code>MessageChannel</code>.", code:`async function chunked(items, fn){\n  for (let i = 0; i &lt; items.length; i++){\n    fn(items[i]);\n    if (i % 100 === 0) await new Promise(r =&gt; setTimeout(r));  <span class="cm">// yield</span>\n  }\n}`}
  ],
  cards:[
    {q:"Is the event loop part of the JavaScript language?", a:"No. ECMAScript only specifies the job queue for promises. The event loop, timers, and I/O are supplied by the <b>host environment</b> — the browser (HTML spec) or Node (libuv). That's why their ordering rules differ."},
    {q:"Where does <code>requestAnimationFrame</code> sit relative to the two queues?", a:"After the current task and its microtask drain, before style/layout/paint — so rAF callbacks run before the next macrotask turn."},
    {q:"Why is <code>setTimeout(fn, 0)</code> not actually 0ms?", a:"Timers specify a minimum delay, the loop must finish the current task and drain microtasks first, and browsers clamp nested timers to about 4ms."}
  ],
  quiz:[
    {q:"Output order?", code:`console.log(1);\nsetTimeout(() =&gt; console.log(2));\nPromise.resolve().then(() =&gt; console.log(3));\nqueueMicrotask(() =&gt; console.log(4));\nconsole.log(5);`,
     options:["1 5 3 4 2","1 5 2 3 4","1 3 4 5 2","1 5 4 3 2"], answer:0,
     why:"Sync first (1, 5). Then the microtask queue drains in FIFO order (3 was queued before 4). The timer macrotask (2) runs last."}
  ],
  cheat:[
    "V8 = stack + heap only. Host supplies timers/network/DOM + the loop.",
    "Turn = one macrotask → <b>drain all microtasks</b> → rAF → style/layout/paint.",
    "Micro: promises, <code>queueMicrotask</code>, MutationObserver. Macro: timers, I/O, events, MessageChannel.",
    "Microtasks drain after <b>every</b> task, including newly queued ones → starvation is possible.",
    "<code>setTimeout(…,0)</code> clamped ~4ms when nested. Timers = minimum delay only.",
    "Long task = &gt;50ms blocking → INP/responsiveness problem. Chunk and yield."
  ]
},

{ id:'tasks', group:'Asynchrony', title:'Microtasks vs macrotasks', animate:'taskqueue',
  lede:"This single distinction accounts for most 'predict the output' interview questions.",
  say:"Macrotasks are timers, I/O and events — one per loop turn. Microtasks are promise reactions and <code>queueMicrotask</code>, and the entire microtask queue drains after every task, including microtasks queued while draining. So a promise chain always finishes before a 0ms timer, and <code>await</code> resumes as a microtask.",
  steps:[
    "<b>Macrotasks</b>: <code>setTimeout</code>, <code>setInterval</code>, I/O, UI events, <code>MessageChannel</code>. One is taken per loop iteration.",
    "<b>Microtasks</b>: promise <code>.then/.catch/.finally</code>, <code>await</code> continuations, <code>queueMicrotask</code>, <code>MutationObserver</code>.",
    "After <b>every single task</b> — not once per loop — the engine drains the microtask queue completely, including microtasks queued during the drain.",
    "So a chain of <code>.then()</code>s runs to completion before a 0ms <code>setTimeout</code> ever fires.",
    "<code>async/await</code> is built on the same queue: everything after an <code>await</code> is a microtask continuation.",
    "<code>await</code> on a non-promise value still yields — it wraps in a resolved promise and resumes on the next microtask tick.",
    "In Node, <code>process.nextTick</code> sits in a <b>separate, higher-priority</b> queue drained before promise microtasks.",
    "Unbounded microtask recursion starves rendering and timers; unbounded macrotask recursion doesn't (each gets its own turn)."
  ],
  code:`Promise.resolve().then(() =&gt; {
  console.log('1');
  Promise.resolve().then(() =&gt; console.log('2'));   <span class="cm">// queued during the drain</span>
});
setTimeout(() =&gt; console.log('3'), 0);
<span class="cm">// 1, 2, 3 — nested microtasks still beat the timer</span>

async function f(){ console.log('a'); await null; console.log('b'); }
f(); console.log('c');
<span class="cm">// a, c, b — 'await null' still defers the rest to a microtask</span>`,
  traps:[
    "<code>await</code> a plain value is not free — it still costs one microtask tick, which changes ordering.",
    "<code>async function</code> bodies run <b>synchronously up to the first await</b>. People often assume the whole body is deferred.",
    "In Node, <code>process.nextTick</code> beats promises; recursive nextTick blocks the loop entirely.",
    "<code>setInterval</code> doesn't guarantee spacing — if a callback overruns the interval, callbacks queue up. Prefer a self-rescheduling <code>setTimeout</code>."
  ],
  terms:[
    {term:"Starvation", desc:"Endlessly chained microtasks delay all rendering, timers and I/O.", detail:"Not theoretical: a promise chain that re-queues itself visibly freezes a page while the thread stays 'busy'. Macrotask recursion (setTimeout) does not starve, because each iteration takes only one turn.", code:`function loopForever(){ Promise.resolve().then(loopForever); }\nloopForever();\nsetTimeout(() =&gt; console.log('never runs'), 0);`},
    {term:"async function timing", desc:"Runs synchronously until the first await, then resumes as a microtask.", detail:"This is why 'is my async function actually deferred?' is a trick question — the code before the first await runs immediately in the caller's turn.", code:`async function f(){\n  console.log(1);      <span class="cm">// sync — runs now</span>\n  await x;\n  console.log(2);      <span class="cm">// microtask — runs later</span>\n}\nf(); console.log(3);   <span class="cm">// 1, 3, 2</span>`}
  ],
  cards:[
    {q:"How often does the microtask queue drain?", a:"After <b>every</b> task — and it drains completely, including microtasks queued while draining. Not once per event-loop turn."},
    {q:"How much of an async function runs synchronously?", a:"Everything up to and including the expression of the first <code>await</code>. The remainder is scheduled as a microtask continuation."},
    {q:"What's the ordering in Node between nextTick, promises and timers?", a:"<code>process.nextTick</code> queue first, then the promise microtask queue, then the event loop's phases (timers, poll, check…). Both micro-queues drain after every callback in every phase."}
  ],
  quiz:[
    {q:"Output?", code:`async function a(){ console.log(1); await b(); console.log(2); }\nasync function b(){ console.log(3); }\na();\nPromise.resolve().then(() =&gt; console.log(4));\nconsole.log(5);`,
     options:["1 3 5 2 4","1 3 5 4 2","1 3 2 5 4","1 5 3 2 4"], answer:0,
     why:"<code>a()</code> logs 1, calls <code>b()</code> which logs 3 synchronously and returns a promise. <code>await</code> schedules the continuation. Then <code>.then(4)</code> is queued <i>after</i> that continuation. Sync log 5. Microtasks drain FIFO: 2 then 4."}
  ],
  cheat:[
    "<b>Macro</b>: setTimeout/setInterval/I-O/events/MessageChannel — one per turn.",
    "<b>Micro</b>: promise reactions, await continuations, queueMicrotask, MutationObserver — full drain after <i>every</i> task.",
    "Node adds <code>process.nextTick</code> <b>above</b> promises.",
    "async fn body runs sync up to first <code>await</code>; <code>await</code> of a plain value still costs one tick.",
    "Microtask recursion starves the loop; macrotask recursion doesn't.",
    {t:'mnemonic', text:"<b>“Sync → nextTick → Promises → Timers → Poll → Check.”</b> Say it out loud once and most ordering questions answer themselves."}
  ]
},

{ id:'promises', group:'Asynchrony', title:'Promise internals: states, chaining & error propagation', animate:'combinator',
  lede:"A promise is a state machine with exactly three states and one-way transitions — everything else follows from that.",
  say:"A promise is pending, fulfilled or rejected, and once settled it's immutable. <code>.then</code> always returns a <i>new</i> promise, which is what makes chaining and error propagation work: a value returned from a handler fulfils the next promise, a thrown error rejects it, and a returned promise is adopted. Errors skip forward to the nearest <code>.catch</code>, and a <code>.catch</code> that returns normally <b>recovers</b> the chain.",
  steps:[
    "Three states: <b>pending → fulfilled</b> (with a value) or <b>pending → rejected</b> (with a reason). Transitions happen once and are irreversible — 'settled' means fulfilled or rejected.",
    "The executor passed to <code>new Promise</code> runs <b>synchronously</b>, immediately. Only the reactions are async.",
    "<code>.then(onFulfilled, onRejected)</code> returns a <b>brand-new promise</b>. What that promise settles to depends on the handler: return a value → fulfilled with it; throw → rejected; return a promise → <b>adopted</b> (the chain waits for it).",
    "A missing handler <b>passes through</b>: a rejection skips every <code>.then</code> until it finds a rejection handler or <code>.catch</code>.",
    "<code>.catch(fn)</code> is exactly <code>.then(undefined, fn)</code>. If it returns normally, the chain is <b>recovered</b> and continues fulfilled — a very common source of 'why did my error disappear'.",
    "<code>.finally(fn)</code> runs on either outcome, receives no argument, and passes the original settlement through — unless it throws or returns a rejected promise.",
    "A <b>thenable</b> is any object with a <code>.then</code> method; promises assimilate them, which is how interop with old libraries works.",
    "Promises are <b>eager</b>: the work starts when the promise is created, not when you <code>await</code> it. That's why <code>Promise.all([a(), b()])</code> runs in parallel but two sequential <code>await</code>s don't."
  ],
  code:`new Promise((resolve, reject) =&gt; {
  console.log('executor runs NOW, synchronously');
  resolve(1);
  resolve(2);            <span class="cm">// ignored — already settled</span>
})
.then(v =&gt; { throw new Error('boom'); })
.then(v =&gt; console.log('skipped'))       <span class="cm">// no rejection handler → passes through</span>
.catch(e =&gt; { console.log('caught', e.message); return 'recovered'; })
.then(v =&gt; console.log(v))               <span class="cm">// 'recovered' — catch healed the chain</span>
.finally(() =&gt; console.log('always'));

<span class="cm">// eager, not lazy:</span>
const p = fetchUser();   <span class="cm">// request already in flight</span>
await somethingElse();
await p;                 <span class="cm">// just waiting on work already started</span>`,
  traps:[
    "Forgetting to <code>return</code> inside a <code>.then</code> breaks the chain — the next handler receives <code>undefined</code> and doesn't wait.",
    "<code>.catch</code> that returns a value silently converts a failure into a success. If you meant to log and keep failing, re-throw.",
    "Creating a promise inside a <code>forEach</code> and expecting sequencing — <code>forEach</code> ignores returned promises entirely. Use <code>for…of</code> with <code>await</code>, or <code>Promise.all(map(...))</code>.",
    "The <b>explicit construction antipattern</b>: wrapping an already-promise-returning API in <code>new Promise</code>. Just return the promise.",
    "An unhandled rejection in Node crashes the process by default since v15."
  ],
  terms:[
    {term:"Chaining & adoption", desc:"Returning a promise from a handler makes the outer chain wait for it.", detail:"This 'adoption'/assimilation is the whole reason flat chains work instead of nesting. Returning a non-promise value fulfils immediately with that value.", code:`getUser(id)\n  .then(u =&gt; getOrders(u.id))     <span class="cm">// returns a promise → adopted</span>\n  .then(orders =&gt; orders.length)  <span class="cm">// plain value → fulfils</span>\n  .catch(handle);`},
    {term:"Sequential vs parallel", desc:"Two awaits in a row are sequential; creating both promises first is parallel.", detail:"This is one of the most common real performance bugs in Node services — two independent 200ms calls awaited in sequence cost 400ms instead of 200ms.", code:`<span class="cm">// 400ms</span>\nconst a = await callA();\nconst b = await callB();\n\n<span class="cm">// 200ms</span>\nconst [a2, b2] = await Promise.all([callA(), callB()]);`},
    {term:"Deferred / withResolvers", desc:"Getting resolve/reject out of the executor for event-driven code.", detail:"<code>Promise.withResolvers()</code> (ES2024, Node 22+) standardises the old 'deferred' pattern — useful when the settling happens in a callback registered elsewhere, e.g. a WebSocket reply.", code:`const { promise, resolve, reject } = Promise.withResolvers();\nws.once('message', resolve);\nsetTimeout(() =&gt; reject(new Error('timeout')), 5000);\nawait promise;`}
  ],
  cards:[
    {q:"What are the three promise states and which transitions are legal?", a:"Pending, fulfilled, rejected. Only pending→fulfilled and pending→rejected, exactly once each. Once settled the state and value are immutable — later <code>resolve</code>/<code>reject</code> calls are ignored."},
    {q:"What determines the state of the promise returned by <code>.then</code>?", a:"The handler: returning a value fulfils it with that value; throwing rejects it; returning a promise/thenable makes it <b>adopt</b> that promise's eventual state."},
    {q:"Why does a <code>.catch</code> sometimes 'swallow' errors?", a:"Because <code>.catch</code> returns a new promise. If the handler returns normally (even <code>undefined</code>), the chain is considered recovered and continues in the fulfilled state. Re-throw if you want the failure to propagate."},
    {q:"Are promises lazy?", a:"No — eager. The work starts when the promise is created. <code>await</code> only decides when you observe the result, which is why creating promises up front then awaiting is how you get parallelism."}
  ],
  quiz:[
    {q:"What is logged?", code:`Promise.reject(new Error('x'))\n  .catch(e =&gt; 'handled')\n  .then(v =&gt; console.log('then:', v))\n  .catch(() =&gt; console.log('catch2'));`,
     options:["then: handled","catch2","then: undefined","Nothing — unhandled rejection"], answer:0,
     why:"The <code>.catch</code> returns a value, which fulfils the next promise with <code>'handled'</code>. The chain is recovered, so the second catch never runs."},
    {q:"How long does this take?", code:`const a = () =&gt; new Promise(r =&gt; setTimeout(r, 200));\nconst b = () =&gt; new Promise(r =&gt; setTimeout(r, 200));\nconst p = a(); \nawait b();\nawait p;`,
     options:["~200ms — both started before the first await","~400ms","~0ms","~600ms"], answer:0,
     why:"Promises are eager: <code>a()</code> started its timer immediately. By the time <code>b()</code> resolves at 200ms, <code>p</code> has already settled."}
  ],
  cheat:[
    "States: <b>pending → fulfilled | rejected</b>, once, irreversible. Executor runs <b>synchronously</b>.",
    "<code>.then</code> returns a NEW promise. return value→fulfil · throw→reject · return promise→adopt.",
    "Rejections skip forward to the nearest rejection handler. <code>.catch</code> = <code>.then(undefined, fn)</code>.",
    "A <code>.catch</code> returning normally <b>recovers</b> the chain — re-throw to keep failing.",
    "<code>.finally</code> passes settlement through; gets no argument.",
    "<b>Eager not lazy</b> → create promises first for parallelism; sequential awaits serialise.",
    "Antipattern: wrapping a promise-returning call in <code>new Promise</code>."
  ]
},

{ id:'asyncawait', group:'Asynchrony', title:'async/await internals & concurrency patterns', animate:'moduleflow',
  lede:"async/await is syntax over promises and generators — knowing the desugaring makes every ordering and error question easy.",
  say:"An async function always returns a promise, runs synchronously to the first <code>await</code>, then suspends and resumes as a microtask — effectively a generator driven by a promise-aware runner. <code>try/catch</code> works because a rejected awaited promise throws at the resume point. The two things I watch for in production are accidental sequential awaits in a loop, and unbounded <code>Promise.all</code> over a big array, which needs a concurrency limit.",
  steps:[
    "An <code>async</code> function <b>always returns a promise</b>, even if you return a plain value or nothing.",
    "It runs <b>synchronously up to the first <code>await</code></b>, then suspends; the continuation is scheduled as a microtask when the awaited promise settles.",
    "Conceptually it's a generator plus a driver: <code>await</code> ≈ <code>yield</code>, and a runner repeatedly calls <code>.next(value)</code> as promises resolve. Babel literally compiles it that way.",
    "<code>try/catch/finally</code> works because a rejected awaited promise <b>throws</b> at the resume point — the same control flow as synchronous code.",
    "<code>await</code> in a <code>for…of</code> loop is <b>sequential by design</b>. That's correct when each step depends on the last, and a latency bug when they're independent.",
    "For independent work use <code>Promise.all</code> — but over a large array that opens N connections at once. Use a <b>concurrency limit</b> (pool of workers, or p-limit).",
    "<b>Top-level await</b> works in ES modules only, and it blocks that module's evaluation — and every importer's — so use it for genuine startup dependencies, not convenience.",
    "<code>for await…of</code> consumes an async iterable — the natural way to consume streams, paginated APIs and LLM token streams."
  ],
  code:`<span class="cm">// sequential — 3 × latency</span>
for (const id of ids) results.push(await fetchOne(id));

<span class="cm">// parallel but unbounded — can open 10,000 sockets</span>
const all = await Promise.all(ids.map(fetchOne));

<span class="cm">// bounded concurrency — the production answer</span>
async function mapLimit(items, limit, fn){
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: limit }, async () =&gt; {
    while (i &lt; items.length){ const idx = i++; out[idx] = await fn(items[idx]); }
  }));
  return out;
}
const results = await mapLimit(ids, 10, fetchOne);`,
  note:{type:'warn', text:"<b>The bug interviewers look for:</b> <code>array.forEach(async (x) =&gt; { await save(x); })</code>. <code>forEach</code> ignores the returned promises entirely, so the function returns before any save completes, errors become unhandled rejections, and there's no way to await the whole thing. Use <code>for…of</code> with <code>await</code> for sequential, or <code>Promise.all(array.map(...))</code> for parallel."},
  traps:[
    "<code>forEach</code> with an async callback is never awaited. Same for <code>map</code> if you forget to <code>Promise.all</code> the result.",
    "<code>return await x</code> inside a <code>try</code> is meaningful (it keeps the frame alive so <code>catch</code> can see the rejection); outside a try it's a redundant extra tick.",
    "<code>await</code> inside a <code>finally</code> block delays the settlement of the whole function.",
    "Awaiting inside a database transaction loop holds the transaction open far longer than expected — a top cause of lock contention.",
    "Errors thrown <i>before</i> the first <code>await</code> still reject the returned promise rather than throwing synchronously — so a caller that doesn't <code>await</code> or <code>.catch</code> gets an unhandled rejection, not a synchronous crash."
  ],
  terms:[
    {term:"Desugaring to generators", desc:"await ≈ yield, plus a promise-aware driver loop.", detail:"Seeing this makes suspension obvious: the function's state lives in a closure, and each resumption is a fresh microtask. It also explains why you cannot await inside a non-async callback.", code:`function run(gen){\n  const it = gen();\n  return new Promise((res, rej) =&gt; {\n    (function step(v){\n      const { value, done } = it.next(v);\n      if (done) return res(value);\n      Promise.resolve(value).then(step, e =&gt; rej(it.throw(e)));\n    })();\n  });\n}`},
    {term:"Bounded concurrency", desc:"Run at most N async operations at once.", detail:"Unbounded <code>Promise.all</code> over thousands of items exhausts sockets, hits provider rate limits, and can knock over a downstream service. A worker-pool pattern (or p-limit / p-map) is the standard fix.", code:`<span class="cm">// with p-limit</span>\nconst limit = pLimit(10);\nawait Promise.all(ids.map(id =&gt; limit(() =&gt; fetchOne(id))));`},
    {term:"for await…of", desc:"Consuming an async iterable, one chunk at a time.", detail:"Natural fit for paginated APIs, Node streams (which are async iterables) and LLM token streams — and it gives you backpressure for free, since the producer doesn't advance until you finish the body.", code:`async function* pages(url){\n  let next = url;\n  while (next){ const r = await fetch(next).then(r =&gt; r.json()); yield* r.items; next = r.next; }\n}\nfor await (const item of pages('/api/orders')) process(item);`}
  ],
  cards:[
    {q:"What does an async function return, and when does it start running?", a:"Always a promise. The body runs <b>synchronously up to the first <code>await</code></b>; the rest resumes as a microtask after the awaited promise settles."},
    {q:"Why doesn't <code>forEach</code> work with async callbacks?", a:"<code>forEach</code> discards the return value of the callback, so the promises are never awaited or aggregated. The loop finishes immediately, errors become unhandled rejections, and you can't await completion."},
    {q:"How do you run 5,000 async tasks without opening 5,000 connections?", a:"Bounded concurrency: a pool of N workers each pulling the next item from a shared index, or a library like p-limit/p-map. <code>Promise.all(map(...))</code> alone gives unbounded parallelism."},
    {q:"When is <code>return await promise</code> not redundant?", a:"Inside a <code>try</code> block. Without <code>await</code>, the function returns the promise and the frame pops, so a later rejection isn't caught by that <code>catch</code>. With <code>await</code>, the rejection throws inside the try."}
  ],
  quiz:[
    {q:"What is the output?", code:`async function f(){\n  console.log('1');\n  await null;\n  console.log('2');\n}\nf();\nconsole.log('3');`,
     options:["1 3 2","1 2 3","3 1 2","1 3 (2 never runs)"], answer:0,
     why:"The body runs synchronously to the <code>await</code> (logs 1). <code>await null</code> wraps in a resolved promise and defers the rest to a microtask. Sync code continues (3), then the microtask runs (2)."},
    {q:"How long does this take, roughly?", code:`const ids = [1,2,3];               <span class="cm">// each fetch takes 100ms</span>\nids.forEach(async id =&gt; { await fetchOne(id); });\nconsole.log('done');`,
     options:["Logs 'done' immediately — nothing is awaited","300ms","100ms","Throws"], answer:0,
     why:"<code>forEach</code> doesn't await anything. The three async callbacks start and the loop returns instantly, so 'done' logs before any fetch completes."}
  ],
  cheat:[
    "async fn → always returns a promise; runs <b>sync to the first await</b>, then microtask resumption.",
    "Desugars to generator + promise driver. <code>await</code> ≈ <code>yield</code>.",
    "Sequential: <code>for…of</code> + await. Parallel: <code>Promise.all(map())</code>. Production: <b>bounded</b> (p-limit / worker pool).",
    "<b>Never</b> <code>forEach(async …)</code>.",
    "<code>return await</code> matters inside <code>try</code>; redundant outside.",
    "Top-level await = ESM only, blocks importers.",
    "<code>for await…of</code> for streams/pagination — gives backpressure free."
  ]
},

{ id:'combinators', group:'Asynchrony', title:'Promise combinators: all, allSettled, race, any', animate:'combinator',
  lede:"Four ways to wait on multiple promises — picking the wrong one causes both real bugs and interview stumbles.",
  say:"<code>all</code> fails fast and gives you an array; <code>allSettled</code> never rejects and gives you per-item status; <code>race</code> settles on the first to settle either way, which is how you build timeouts; <code>any</code> resolves on the first success and only rejects with an AggregateError when every one fails. None of them cancel the losers — you need an AbortController for that.",
  steps:[
    "<code>Promise.all(ps)</code> — fulfils with an array in input order when all fulfil; <b>rejects immediately</b> on the first rejection, discarding the rest.",
    "Use <code>all</code> when every result is required and partial success is meaningless.",
    "<code>Promise.allSettled(ps)</code> — never rejects; resolves with <code>{status:'fulfilled', value}</code> or <code>{status:'rejected', reason}</code> per item.",
    "Use <code>allSettled</code> when partial success is acceptable: fanning out to three independent services, or a batch where you want a per-item report.",
    "<code>Promise.race(ps)</code> — settles with the first promise to <b>settle</b>, fulfilled or rejected. The timeout pattern.",
    "<code>Promise.any(ps)</code> — fulfils with the first to <b>fulfil</b>; rejects only when all reject, bundling errors in an <code>AggregateError</code> (<code>err.errors</code>).",
    "None of them <b>cancel</b> the losers. race/any stop waiting; the underlying work continues (and can still throw an unhandled rejection) unless you abort it.",
    "All four take any iterable and start nothing themselves — the promises are already running by the time you pass them in.",
    "An empty array: <code>all</code>/<code>allSettled</code> resolve immediately; <code>race</code> stays pending forever; <code>any</code> rejects immediately with an empty AggregateError."
  ],
  code:`const results  = await Promise.all([a(), b()]);         <span class="cm">// fail fast</span>
const outcomes = await Promise.allSettled([a(), b()]);  <span class="cm">// per-item status</span>
const firstOk  = await Promise.any([mirror1(), mirror2()]);

<span class="cm">// timeout, with real cancellation</span>
async function withTimeout(fn, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(() =&gt; ctrl.abort(), ms);
  try { return await fn(ctrl.signal); }
  finally { clearTimeout(timer); }
}
await withTimeout(signal =&gt; fetch(url, { signal }), 3000);

<span class="cm">// AbortSignal.timeout() does the same in one line (Node 17.3+)</span>
await fetch(url, { signal: AbortSignal.timeout(3000) });`,
  traps:[
    "<code>Promise.all</code> rejecting doesn't tell you <i>which</i> one failed or give you the successful results — if you need those, use <code>allSettled</code> and filter.",
    "Using <code>allSettled</code> everywhere 'to be safe' hides real failures; pick based on whether a partial result is genuinely useful.",
    "A rejected promise that <code>race</code> ignored can still trigger an unhandled rejection warning if nothing else attaches a handler.",
    "<code>Promise.race([])</code> never settles — a silent hang.",
    "<code>AggregateError</code> from <code>any</code> puts the individual errors in <code>err.errors</code>, not <code>err.message</code>."
  ],
  table:{title:'Choosing a combinator', head:['','Settles when','Rejects when','Result shape'], rows:[
    ['<code>all</code>','All fulfil','First rejection','Array of values'],
    ['<code>allSettled</code>','All settle','Never','Array of {status, value|reason}'],
    ['<code>race</code>','First settles','If the first to settle rejects','Single value / reason'],
    ['<code>any</code>','First fulfils','All reject','Single value / AggregateError']
  ]},
  terms:[
    {term:"AbortController", desc:"The standard cancellation primitive; race alone doesn't cancel.", detail:"Pass its <code>signal</code> into fetch, Node streams, DB drivers that support it, or check <code>signal.aborted</code> in your own loops. <code>AbortSignal.timeout(ms)</code> and <code>AbortSignal.any([...])</code> compose signals.", code:`const ctrl = new AbortController();\nctrl.signal.addEventListener('abort', () =&gt; cleanup());\nsetTimeout(() =&gt; ctrl.abort(new Error('too slow')), 3000);\nawait fetch(url, { signal: ctrl.signal });   <span class="cm">// throws AbortError</span>`},
    {term:"Partial-failure reporting", desc:"allSettled + filter is the honest fan-out pattern.", detail:"Report which calls failed rather than silently dropping them — an alert on 'inventory service failed for 3 of 20 items' is far more useful than a generic 500.", code:`const rs = await Promise.allSettled(calls);\nconst ok = rs.filter(r =&gt; r.status === 'fulfilled').map(r =&gt; r.value);\nconst failed = rs.filter(r =&gt; r.status === 'rejected').map(r =&gt; r.reason);\nif (failed.length) logger.warn({ failed: failed.length }, 'partial failure');`}
  ],
  cards:[
    {q:"Difference between <code>race</code> and <code>any</code>?", a:"<code>race</code> settles on the first promise to <b>settle</b> — a fast rejection wins. <code>any</code> waits for the first to <b>fulfil</b> and only rejects if every one rejects, with an <code>AggregateError</code>."},
    {q:"Do the combinators cancel the losing promises?", a:"No. They only stop waiting. The underlying operations keep running and consuming resources unless you cancel them explicitly with an AbortController."},
    {q:"What does <code>Promise.race([])</code> do?", a:"Stays pending forever. <code>all</code>/<code>allSettled</code> on an empty array resolve immediately; <code>any</code> on an empty array rejects immediately."}
  ],
  quiz:[
    {q:"What happens?", code:`const p = Promise.all([\n  Promise.resolve(1),\n  Promise.reject(new Error('x')),\n  new Promise(r =&gt; setTimeout(() =&gt; r(3), 1000))\n]);`,
     options:["Rejects immediately; the 1s promise keeps running","Waits 1s then rejects","Resolves to [1, undefined, 3]","Resolves to [1, 3]"], answer:0,
     why:"<code>all</code> fails fast on the first rejection. It does not cancel the third promise — that timer still fires, its result is simply discarded."}
  ],
  cheat:[
    "<code>all</code> = all-or-nothing, array of values, fail fast.",
    "<code>allSettled</code> = never rejects, per-item {status,value|reason}.",
    "<code>race</code> = first to <b>settle</b> (timeouts).",
    "<code>any</code> = first to <b>fulfil</b>; all fail → <code>AggregateError.errors</code>.",
    "<b>None cancel</b> — use <code>AbortController</code> / <code>AbortSignal.timeout(ms)</code>.",
    "Empty array: all/allSettled resolve, race hangs forever, any rejects.",
    {t:'mnemonic', text:"<b>all</b> = <i>and</i>. <b>any</b> = <i>or</i>. <b>race</b> = <i>whoever finishes, good or bad</i>. <b>allSettled</b> = <i>tell me about everyone</i>."}
  ]
},

{ id:'iterators', group:'Asynchrony', title:'Iterators, generators & async iterators', animate:'stream',
  lede:"The protocol behind for…of, spread, destructuring — and the machinery async/await is built on.",
  say:"An iterable has a <code>Symbol.iterator</code> returning an iterator with a <code>next()</code> that yields <code>{value, done}</code>. Generators are the easy way to write one: they suspend at each <code>yield</code> and keep their local state. Async generators plus <code>for await…of</code> are the natural model for streaming — paginated APIs, Node streams, LLM tokens — and they give you backpressure for free because the producer can't run ahead of the consumer.",
  steps:[
    "<b>Iterable protocol</b>: an object with <code>[Symbol.iterator]()</code> returning an <b>iterator</b> — an object with <code>next()</code> returning <code>{ value, done }</code>.",
    "<code>for…of</code>, spread, array destructuring, <code>Array.from</code>, <code>Promise.all</code> and <code>yield*</code> all consume that protocol. Implement it and your object works with all of them.",
    "A <b>generator function</b> (<code>function*</code>) returns an object that is both an iterator and an iterable. Calling it runs <b>nothing</b> — the body starts on the first <code>next()</code>.",
    "<code>yield</code> suspends and hands a value out; the argument to the <i>next</i> <code>next(v)</code> becomes the result of that <code>yield</code> expression — a two-way channel.",
    "<code>it.return()</code> runs <code>finally</code> blocks for cleanup; <code>it.throw()</code> injects an exception at the suspension point. Breaking out of a <code>for…of</code> early calls <code>return()</code> automatically.",
    "Generators enable <b>lazy/infinite sequences</b> — you only compute what you consume, which is how you take the first 10 primes without generating a list first.",
    "<b>Async iterators</b> use <code>Symbol.asyncIterator</code> and <code>next()</code> returns a promise. <code>async function*</code> writes them; <code>for await…of</code> consumes them.",
    "Node streams are async iterables, so <code>for await (const chunk of readable)</code> is the modern way to read them — with automatic backpressure, because the stream pauses while your body runs."
  ],
  code:`function* idGen(){ let i = 0; while (true) yield i++; }   <span class="cm">// infinite, lazy</span>
const ids = idGen();
ids.next().value;  <span class="cm">// 0</span>
ids.next().value;  <span class="cm">// 1</span>

<span class="cm">// custom iterable</span>
class Range {
  constructor(a, b){ this.a = a; this.b = b; }
  *[Symbol.iterator](){ for (let i = this.a; i &lt; this.b; i++) yield i; }
}
[...new Range(1, 4)];   <span class="cm">// [1, 2, 3]</span>

<span class="cm">// async generator: paginated API as a flat stream</span>
async function* allOrders(){
  let cursor = null;
  do {
    const page = await api.orders({ cursor });
    yield* page.items;
    cursor = page.next;
  } while (cursor);
}
for await (const order of allOrders()) await process(order);   <span class="cm">// natural backpressure</span>`,
  traps:[
    "A generator object is <b>single-use</b> — once exhausted it stays done. Make the <i>class</i> iterable (a method returning a fresh generator) if you need to iterate twice.",
    "Calling a generator function does not run it. Nothing happens until the first <code>next()</code>, which surprises people writing side effects before the first yield.",
    "<code>for await…of</code> over an array of promises awaits them <b>sequentially</b>. If you wanted parallelism you still need <code>Promise.all</code>.",
    "Not cleaning up: if you <code>break</code> out of a <code>for await</code> over a stream, make sure your generator's <code>finally</code> destroys the underlying resource.",
    "Spreading an infinite generator hangs the process."
  ],
  terms:[
    {term:"Two-way communication", desc:"next(v) injects a value back into the paused generator.", detail:"This is exactly the mechanism async/await runs on: the driver resolves the yielded promise and passes the value back in via <code>next(value)</code>, which becomes the result of the <code>await</code> expression.", code:`function* conversation(){\n  const name = yield 'What is your name?';\n  const age  = yield \`Hi \${name}, age?\`;\n  return \`\${name} is \${age}\`;\n}\nconst c = conversation();\nc.next().value;        <span class="cm">// 'What is your name?'</span>\nc.next('Gayan').value; <span class="cm">// 'Hi Gayan, age?'</span>\nc.next(30).value;      <span class="cm">// 'Gayan is 30'</span>`},
    {term:"Backpressure for free", desc:"The consumer's pace controls the producer's.", detail:"With <code>for await…of</code>, the next chunk isn't requested until the loop body completes. That is real backpressure without any manual pause/resume — one of the strongest reasons to prefer async iteration over 'data' event handlers.", code:`for await (const chunk of req){\n  await slowWrite(chunk);   <span class="cm">// stream is paused while this runs</span>\n}`},
    {term:"Cleanup with return()", desc:"finally blocks run when iteration ends early.", detail:"Breaking, throwing, or returning inside a for-of calls <code>iterator.return()</code>, which resumes the generator at a <code>finally</code>. Put resource release there.", code:`async function* readFile(path){\n  const fh = await fs.open(path);\n  try { for await (const line of fh.readLines()) yield line; }\n  finally { await fh.close(); }   <span class="cm">// runs even on early break</span>\n}`}
  ],
  cards:[
    {q:"What makes an object iterable?", a:"A <code>[Symbol.iterator]()</code> method returning an iterator: an object with <code>next()</code> that returns <code>{value, done}</code>. That's all <code>for…of</code>, spread, destructuring and <code>Array.from</code> need."},
    {q:"How do generators relate to async/await?", a:"async/await is a generator suspended at each <code>await</code> plus a driver that resolves the yielded promise and calls <code>next(value)</code> to resume. Babel's async transform literally emits a generator plus a runner."},
    {q:"Why does <code>for await…of</code> give backpressure?", a:"Because the next value isn't pulled until the loop body finishes. The producer physically cannot run ahead of the consumer — no manual pause/resume needed."},
    {q:"How do you guarantee cleanup when a consumer breaks out early?", a:"Put the release in a <code>finally</code> inside the generator. Early exit from <code>for…of</code>/<code>for await…of</code> calls <code>iterator.return()</code>, which resumes the generator at that <code>finally</code>."}
  ],
  quiz:[
    {q:"What is logged?", code:`function* g(){ console.log('start'); yield 1; console.log('mid'); yield 2; }\nconst it = g();\nconsole.log('created');\nconsole.log(it.next().value);`,
     options:["created, start, 1","start, created, 1","created, start, mid, 1","start, 1, created"], answer:0,
     why:"Calling a generator function runs none of its body — it just creates the iterator. 'start' only logs on the first <code>next()</code>."}
  ],
  cheat:[
    "Iterable = <code>[Symbol.iterator]()</code> → iterator with <code>next() → {value, done}</code>.",
    "Consumers: <code>for…of</code>, spread, destructuring, <code>Array.from</code>, <code>yield*</code>, <code>Promise.all</code>.",
    "<code>function*</code> body starts on first <code>next()</code>; <code>next(v)</code> is a two-way channel; single-use.",
    "<code>return()</code> → runs <code>finally</code> (cleanup); <code>throw()</code> → injects at suspension point.",
    "Async: <code>Symbol.asyncIterator</code>, <code>async function*</code>, <code>for await…of</code>. Node streams are async iterables.",
    "<code>for await…of</code> = <b>free backpressure</b>; also sequential — use <code>Promise.all</code> for parallel."
  ]
},

{ id:'errors-js', group:'Asynchrony', title:'Error handling: custom errors, cause & async boundaries', animate:'errorflow',
