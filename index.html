{ id:'ts-config', group:'Config & practice', title:'tsconfig, compilation & module resolution', animate:'moduleflow',
  lede:"The flags that actually change how your code behaves — and why your build works but your runtime doesn't.",
  say:"The flags I always turn on are <code>strict</code>, <code>noUncheckedIndexedAccess</code> and <code>noImplicitOverride</code>. <code>target</code> controls downlevelling, <code>module</code> plus <code>moduleResolution</code> control how imports are resolved and emitted — and for modern Node that's <code>module: nodenext</code>. The key thing to say out loud is that <code>tsc</code> only type-checks and emits; it never bundles, and transpile-only tools like esbuild and swc skip type checking entirely, so CI must run <code>tsc --noEmit</code> separately.",
  steps:[
    "<code>strict: true</code> enables the whole family: <code>noImplicitAny</code>, <code>strictNullChecks</code>, <code>strictFunctionTypes</code>, <code>strictBindCallApply</code>, <code>strictPropertyInitialization</code>, <code>useUnknownInCatchVariables</code>, <code>alwaysStrict</code>.",
    "Worth adding beyond strict: <code>noUncheckedIndexedAccess</code> (array/index access yields <code>T | undefined</code> — catches a whole class of real bugs), <code>noImplicitOverride</code>, <code>exactOptionalPropertyTypes</code>, <code>noFallthroughCasesInSwitch</code>.",
    "<code>target</code> sets the JS output level (downlevelling <code>async</code>, classes, optional chaining). Modern Node → <code>ES2022</code> or later; no reason to downlevel on a server.",
    "<code>module</code> + <code>moduleResolution</code> decide how imports resolve and what's emitted. For Node with ESM: <code>module: \"nodenext\"</code>, which implies the matching resolution and enforces file extensions in relative imports.",
    "<code>isolatedModules</code> guarantees each file can be transpiled independently — required by esbuild/swc/Babel, and why <code>const enum</code> and non-<code>type</code>-marked type re-exports break.",
    "<code>verbatimModuleSyntax</code> (modern replacement for <code>importsNotUsedAsValues</code>) requires <code>import type</code> for type-only imports, making emit predictable.",
    "<b><code>tsc</code> does not bundle.</b> It type-checks and emits per file. Bundling is esbuild/rollup/webpack's job; <code>tsc --noEmit</code> is your type-check step.",
    "<code>paths</code> aliases are a <b>compile-time</b> feature — the emitted JS still contains the alias, so the runtime needs matching config (tsconfig-paths, bundler alias, or <code>imports</code> in package.json) or it fails at runtime."
  ],
  code:`{
  "compilerOptions": {
    "target": "ES2022",
    "module": "nodenext",
    "moduleResolution": "nodenext",
    "strict": true,
    "noUncheckedIndexedAccess": true,
    "noImplicitOverride": true,
    "exactOptionalPropertyTypes": true,
    "verbatimModuleSyntax": true,
    "isolatedModules": true,
    "skipLibCheck": true,
    "sourceMap": true,
    "outDir": "dist",
    "paths": { "@app/*": ["./src/*"] }
  },
  "include": ["src"]
}

<span class="cm"># type-check in CI, build with a fast transpiler</span>
tsc --noEmit &amp;&amp; esbuild src/index.ts --bundle --platform=node --outfile=dist/index.js`,
  traps:[
    "<code>paths</code> works at compile time only — the emitted <code>require('@app/x')</code> fails at runtime without a resolver. This surprises people the first time they deploy.",
    "Turning off <code>strict</code> to 'get it building' hides the exact bugs TypeScript exists to catch; migrate file by file instead with <code>// @ts-expect-error</code> markers.",
    "esbuild/swc <b>don't type-check</b>. A green build means nothing about type correctness — run <code>tsc --noEmit</code> in CI.",
    "<code>skipLibCheck: false</code> makes builds slow and fails on other people's <code>.d.ts</code> bugs; almost everyone sets it true.",
    "<code>noUncheckedIndexedAccess</code> is high-value but noisy to adopt in an existing codebase — expect a lot of <code>!</code> or guards on first enable.",
    "<code>@ts-ignore</code> hides an error forever, even after it's fixed. Use <code>@ts-expect-error</code>, which errors once the underlying problem goes away."
  ],
  cards:[
    {q:"What does <code>strict: true</code> actually turn on?", a:"<code>noImplicitAny</code>, <code>strictNullChecks</code>, <code>strictFunctionTypes</code>, <code>strictBindCallApply</code>, <code>strictPropertyInitialization</code>, <code>useUnknownInCatchVariables</code>, <code>alwaysStrict</code>. The most consequential is <code>strictNullChecks</code>."},
    {q:"Why does a build succeed with esbuild but fail type-checking?", a:"esbuild/swc/Babel only transpile — they strip types without checking them, which is what makes them fast. You must run <code>tsc --noEmit</code> separately in CI as the type-check gate."},
    {q:"Why do <code>paths</code> aliases fail at runtime?", a:"They're a compile-time resolution feature. <code>tsc</code> emits the alias unchanged, so Node can't resolve it. You need a bundler alias, <code>tsconfig-paths</code>, or the <code>imports</code> field in package.json."},
    {q:"What does <code>noUncheckedIndexedAccess</code> do and why enable it?", a:"Makes indexed access (<code>arr[i]</code>, <code>rec[key]</code>) return <code>T | undefined</code>, forcing you to handle the miss. It catches a large class of real runtime errors that <code>strictNullChecks</code> alone doesn't."},
    {q:"<code>@ts-ignore</code> vs <code>@ts-expect-error</code>?", a:"<code>@ts-ignore</code> suppresses forever, including after the code is fixed — the comment rots. <code>@ts-expect-error</code> errors if there's no longer an error on the next line, so it self-cleans."}

     why:"Transpile-only tools strip types without checking them. Type checking must be its own CI step."}

    "Node modern: <code>target: ES2022</code>, <code>module/moduleResolution: nodenext</code>, <code>verbatimModuleSyntax</code>, <code>isolatedModules</code>, <code>skipLibCheck</code>.",
    "<b><code>tsc</code> doesn't bundle.</b> esbuild/swc <b>don't type-check</b> → CI needs <code>tsc --noEmit</code>.",

  ]
},

{ id:'ts-patterns', group:'Config & practice', title:'Backend patterns: DTOs, Result types & typed APIs', animate:'polymorph',
  lede:"How the type system actually earns its keep in a service — at the boundaries, not in the middle.",
  say:"The pattern I use everywhere is: define the schema once, derive the type, validate at the boundary, and keep the interior fully typed with no assertions. Beyond that, a discriminated <code>Result</code> type makes expected failures part of the signature instead of hidden control flow, and sharing types between client and server — via a shared package, tRPC or generated OpenAPI types — removes a whole category of integration bugs.",
  steps:[
    "<b>Schema first</b>: define request/response shapes with zod, derive types with <code>z.infer</code>, and validate in the handler. One definition governs both runtime and compile time.",
    "<b>Separate entity from DTO</b>: the database row, the create payload, and the API response are three different shapes. Derive them (<code>Omit</code>/<code>Pick</code>) so they can't drift, and never return the entity directly — that's how password hashes leak.",
    "<b>Result types</b>: <code>type Result&lt;T, E&gt; = { ok: true; value: T } | { ok: false; error: E }</code> makes expected failures visible in the signature and exhaustively handled. Keep exceptions for genuinely exceptional cases.",
    "<b>Exhaustiveness everywhere</b>: discriminated unions plus an <code>assertNever</code> default means adding a new state breaks compilation at every place that must handle it.",
    "<b>Typed config</b>: parse <code>process.env</code> through a schema at boot into a frozen, typed object; never read <code>process.env</code> outside that module.",
    "<b>Share types across the boundary</b>: a shared package, tRPC for a TS-to-TS monorepo, or generated types from an OpenAPI/GraphQL schema. Hand-maintained duplicate interfaces always drift.",
    "<b>Type the errors too</b>: a union of error codes lets clients branch safely, and keeps your error contract honest.",
    "<b>Keep the interior assertion-free</b>: if you need <code>as</code> in business logic, the boundary validation is missing or the model is wrong."
  ],
  code:`<span class="cm">// 1. one schema → runtime + types</span>
const CreateOrder = z.object({
  items: z.array(z.object({ sku: z.string(), qty: z.number().int().positive() })).min(1),
  currency: z.enum(['USD','LKR','SGD'])
});
type CreateOrder = z.infer&lt;typeof CreateOrder&gt;;

<span class="cm">// 2. entity vs DTO — derived, can't drift</span>
type OrderRow      = { id: string; userId: string; total: number; internalNotes: string };
type OrderResponse = Omit&lt;OrderRow, 'internalNotes'&gt;;

<span class="cm">// 3. Result type: failures in the signature</span>
type Result&lt;T, E&gt; = { ok: true; value: T } | { ok: false; error: E };
type PlaceError = 'OUT_OF_STOCK' | 'PAYMENT_DECLINED' | 'INVALID_CURRENCY';

async function placeOrder(input: CreateOrder): Promise&lt;Result&lt;OrderResponse, PlaceError&gt;&gt; { /* … */ }

const r = await placeOrder(dto);
if (!r.ok) {
  switch (r.error) {
    case 'OUT_OF_STOCK':      return res.status(409).json({ code: r.error });
    case 'PAYMENT_DECLINED':  return res.status(402).json({ code: r.error });
    case 'INVALID_CURRENCY':  return res.status(400).json({ code: r.error });
    default:                  return assertNever(r.error);   <span class="cm">// exhaustive</span>
  }
}`,
  traps:[
    "Returning the ORM entity straight from a handler leaks fields (password hashes, internal notes, soft-delete flags) the moment someone adds a column.",
    "Duplicating request/response interfaces by hand between client and server guarantees drift; derive or generate them.",
    "Using <code>Result</code> for genuinely exceptional failures (out of memory, bug) buries them — reserve it for expected, actionable outcomes.",
    "Validating only at the HTTP layer and not at queue consumers or scheduled jobs leaves the back door open.",
    "<code>z.infer</code> on a schema with transforms gives the <i>output</i> type — use <code>z.input</code> when you need the pre-transform shape."
  ],
  cards:[
    {q:"Why derive DTOs from the entity instead of writing them separately?", a:"So they can't drift. <code>Omit&lt;OrderRow,'internalNotes'&gt;</code> updates automatically when the entity changes, and the compiler forces you to decide what to do with a new field rather than silently leaking it."},
    {q:"When is a <code>Result</code> type better than throwing?", a:"For <b>expected</b> outcomes the caller must handle — out of stock, payment declined, validation failure. It puts them in the type signature so they're exhaustively handled. Keep exceptions for unexpected/programmer errors."},
    {q:"How do you keep client and server types in sync?", a:"Single source of truth: a shared types package in a monorepo, tRPC for end-to-end TS inference, or generated types from an OpenAPI/GraphQL schema. Never two hand-maintained copies."},
    {q:"Where exactly should validation live?", a:"At every trust boundary where data enters the process: HTTP handlers, queue/stream consumers, scheduled jobs, third-party webhooks, config loading, and LLM tool-call arguments. Not scattered through business logic."}
  ],
  quiz:[
    {q:"A handler does <code>const body = req.body as CreateOrder</code>. What's the risk?", options:["No runtime check — malformed input crashes deeper in the stack","None, TypeScript validates it","It's slower than parsing","It widens the type"], answer:0,
     why:"<code>as</code> is erased. Nothing verifies the shape, so bad input propagates until something explodes far from the entry point, with a useless stack trace."}
  ],
  cheat:[
    "<b>Schema → type → validate at the boundary → assertion-free interior.</b>",
    "Entity ≠ create DTO ≠ response DTO. Derive with <code>Omit</code>/<code>Pick</code>; never return the entity raw.",
    "<code>Result&lt;T,E&gt;</code> discriminated union for <b>expected</b> failures; exceptions for the rest.",
    "<code>assertNever</code> default ⇒ adding a state breaks every switch that must change.",
    "Config parsed once at boot into a typed frozen object.",
    "Share types via a package / tRPC / generated OpenAPI — never two hand-written copies.",
    "Validate at HTTP <b>and</b> queue consumers, jobs, webhooks, LLM tool args."
  ]
}
];

{ id:'fw-express', group:'Node frameworks', title:'Express: the middleware pipeline', animate:'middleware',
  lede:"Express is a thin function pipeline — understanding the ordering rules explains almost every Express bug.",
  say:"An Express app is an ordered array of <code>(req, res, next)</code> functions. Each either ends the response or calls <code>next()</code>; calling neither hangs the request, and calling both after sending causes 'Cannot set headers after they are sent'. Error middleware is identified purely by having four parameters and must be registered last. In Express 4, async handlers that throw don't reach it — you need a wrapper.",
  steps:[
    "Middleware runs <b>in registration order</b>. Each one either sends a response or calls <code>next()</code> to pass control on.",
    "Order matters concretely: body parsing before handlers that read <code>req.body</code>; auth before protected routes; static assets before catch-alls; the 404 handler after all routes.",
    "<b>Error-handling middleware has four parameters</b> <code>(err, req, res, next)</code>. Express identifies it by arity alone, so a missing parameter silently turns it into ordinary middleware.",
    "Register error middleware <b>last</b>; <code>next(err)</code> from anywhere skips the remaining normal middleware and jumps to it.",
    "In <b>Express 4</b>, a rejected promise in an async handler is not caught — wrap handlers (<code>Promise.resolve(fn(...)).catch(next)</code>) or use <code>express-async-errors</code>. Express 5 handles it natively.",
    "<code>res.locals</code> carries per-request data to later middleware and views; attaching to <code>req</code> directly requires module augmentation in TypeScript.",
    "A <b>Router</b> is itself middleware, so you can mount sub-apps and apply middleware per router — the standard way to version an API or scope auth.",
    "Common production stack: <code>helmet</code> → <code>cors</code> → request-id → structured logger → rate limiter → body parser (with a size limit) → routes → 404 → error handler."
  ],
  code:`const app = express();
app.use(helmet());
app.use(cors({ origin: allowlist }));
app.use((req, _res, next) =&gt; { req.id = crypto.randomUUID(); next(); });
app.use(pinoHttp({ genReqId: req =&gt; req.id }));
app.use(express.json({ limit: '1mb' }));           <span class="cm">// always bound the body</span>

const wrap = (fn) =&gt; (req, res, next) =&gt; Promise.resolve(fn(req, res, next)).catch(next);
app.get('/orders/:id', wrap(async (req, res) =&gt; {
  const order = await service.get(req.params.id);
  if (!order) throw new AppError('not found', { code:'NOT_FOUND', status:404 });
  res.json(order);
}));

app.use((req, res) =&gt; res.status(404).json({ error: { code: 'NOT_FOUND' } }));
app.use((err, req, res, _next) =&gt; {                <span class="cm">// 4 args = error handler</span>
  req.log.error({ err });
  res.status(err.status ?? 500).json({ error: { code: err.code ?? 'INTERNAL' } });
});`,
  traps:[
    "Forgetting <code>next()</code> and not responding hangs the request until the client times out — with no error anywhere.",
    "An error handler written with three parameters is registered as normal middleware and silently never runs.",
    "Registering the error handler before the routes means it never sees their errors.",

    "Webhook signature verification needs the <b>raw body</b> — mount <code>express.raw()</code> on that route before the global JSON parser."
  ],
  cards:[
    {q:"How does Express recognise error-handling middleware?", a:"By arity: a function with exactly four parameters <code>(err, req, res, next)</code>. Three parameters makes it ordinary middleware, which is why a typo here silently breaks error handling."},
    {q:"Why don't async errors reach the error handler in Express 4?", a:"Express 4 only catches synchronous throws. An async handler returns a rejected promise that nothing observes, so it becomes an unhandled rejection. Wrap handlers with <code>Promise.resolve(fn(...)).catch(next)</code>, use <code>express-async-errors</code>, or upgrade to Express 5."},

{ id:'fw-nest', group:'Node frameworks', title:'NestJS architecture: modules, providers & DI', animate:'dicontainer',
  lede:"Nest is Angular's architecture applied to the server — modules, a DI container, and decorators wiring it together.",
  say:"Nest organises code into modules that declare controllers and providers, and a DI container resolves constructor dependencies using the parameter types TypeScript emits via reflect-metadata. Providers are singletons by default and scoped to the module that declares them — you export them to share, and import the module to consume. The mental model that unlocks it: everything is a token in a container, and modules define token visibility.",
  steps:[
    "A <b>module</b> (<code>@Module</code>) groups related code and declares four things: <code>imports</code> (other modules), <code>controllers</code>, <code>providers</code>, and <code>exports</code> (what other modules may use).",
    "A <b>provider</b> is anything the container can inject — a service, repository, factory, or plain value. <code>@Injectable()</code> marks a class as one.",
    "<b>Providers are module-scoped</b>: to use one elsewhere, the declaring module must <code>export</code> it and the consumer must <code>import</code> that module. This is the single most common source of 'Nest can't resolve dependencies'.",
    "Default scope is <b>singleton</b> — one instance for the whole application lifetime, shared across requests.",
    "DI works through <code>emitDecoratorMetadata</code>: TypeScript writes the constructor parameter types into <code>design:paramtypes</code>, and Nest resolves each as a token.",
    "Because interfaces are erased, you inject <b>classes</b> or use explicit tokens (<code>@Inject('TOKEN')</code>) with <code>useValue</code>/<code>useClass</code>/<code>useFactory</code> providers.",
    "<b>Dynamic modules</b> (<code>forRoot</code>/<code>forRootAsync</code>/<code>registerAsync</code>) let a module be configured at import time — how <code>ConfigModule</code>, <code>TypeOrmModule</code> and <code>JwtModule</code> work.",
    "<code>@Global()</code> makes a module's exports available everywhere without importing — convenient for config/logging, but overuse destroys the explicit dependency graph."
  ],
  code:`@Injectable()
export class OrdersService {
  constructor(
    private readonly repo: OrdersRepository,
    @Inject(PAYMENTS) private readonly payments: PaymentGateway,   <span class="cm">// interface → token</span>

}

@Module({
  imports: [TypeOrmModule.forFeature([Order]), PaymentsModule],
  controllers: [OrdersController],
  providers: [
    OrdersService,
    OrdersRepository,
    { provide: PAYMENTS, useClass: StripeGateway },                 <span class="cm">// swap in tests</span>
    { provide: 'FEATURE_FLAGS', useFactory: (c: ConfigService) =&gt; loadFlags(c), inject: [ConfigService] }
  ],
  exports: [OrdersService]                                          <span class="cm">// visible to importers</span>
})
export class OrdersModule {}`,
  traps:[
    "'Nest can't resolve dependencies of X' almost always means: the provider isn't in <code>providers</code>, or isn't <code>export</code>ed, or its module isn't <code>import</code>ed.",
    "Injecting an <b>interface</b> fails — it's erased. Use a class, abstract class, or a string/Symbol token.",
    "<b>Circular module dependencies</b> need <code>forwardRef()</code> on both sides; better still, extract the shared piece into a third module.",

    "<code>@Global()</code> everywhere turns the dependency graph into implicit magic and makes testing modules in isolation hard.",

  cards:[
    {q:"Why does 'Nest can't resolve dependencies of OrdersService' happen?", a:"One of three things: the dependency isn't listed in any module's <code>providers</code>, the declaring module doesn't <code>export</code> it, or the consuming module doesn't <code>import</code> that module. (Or you tried to inject an interface, which has no runtime token.)"},
    {q:"What's the default provider scope and why does it matter?", a:"Singleton — one instance for the app's lifetime, shared across all concurrent requests. So providers must be stateless with respect to a request; storing per-request data on one leaks it between users."},
    {q:"How do you inject something that isn't a class?", a:"With a custom provider and an explicit token: <code>{ provide: TOKEN, useValue | useClass | useFactory }</code>, injected with <code>@Inject(TOKEN)</code>. Use a Symbol or exported const for the token, not a magic string."},
    {q:"What is a dynamic module?", a:"A module whose configuration is supplied at import time via a static method returning a <code>DynamicModule</code> — <code>forRoot()</code>, <code>forRootAsync()</code>, <code>register()</code>. It's how ConfigModule, TypeOrmModule and JwtModule accept options."}

  quiz:[

    "Custom providers: <code>useValue</code> / <code>useClass</code> / <code>useFactory</code> (+ <code>inject</code>).",
    "Default scope = <b>singleton</b> ⇒ no per-request state on providers.",
    "Dynamic modules: <code>forRoot</code>/<code>forRootAsync</code>/<code>registerAsync</code>.",

{ id:'fw-nest-req', group:'Node frameworks', title:'NestJS request lifecycle: guards, pipes, interceptors, filters', animate:'middleware',
  lede:"Five extension points in a fixed order — knowing that order answers most Nest questions.",
  say:"The order is middleware → guards → interceptors (before) → pipes → handler → interceptors (after) → exception filters. Guards answer 'is this allowed', pipes transform and validate input, interceptors wrap the call for cross-cutting concerns like logging, caching and response shaping, and filters turn thrown exceptions into responses. The detail people miss is that pipes run <i>after</i> guards, so authorisation happens before validation.",
  steps:[
    "<b>1. Middleware</b> — Express/Fastify-level, runs first, no DI-scoped request context. Good for raw-body capture and low-level concerns.",
    "<b>2. Guards</b> (<code>canActivate</code>) — authentication and authorisation. Return <code>false</code> or throw to reject with 403. This is where <code>@Roles()</code> metadata is read via <code>Reflector</code>.",
    "<b>3. Interceptors (pre)</b> — wrap the handler; can start timers, add context, or short-circuit with a cached response.",
    "<b>4. Pipes</b> — transform and validate arguments. <code>ValidationPipe</code> plus class-validator DTOs is the standard; <code>ParseIntPipe</code> and friends coerce params.",
    "<b>5. Route handler</b> — your controller method.",
    "<b>6. Interceptors (post)</b> — map/transform the response, add caching, wrap in an envelope, record metrics.",
    "<b>7. Exception filters</b> — catch thrown exceptions and convert them into HTTP responses; a global filter gives you a consistent error contract.",
    "Each can be applied at <b>method, controller or global</b> scope; globals registered with <code>app.useGlobalGuards()</code> can't inject dependencies unless registered via a provider with <code>APP_GUARD</code>."
  ],
  code:`@Injectable()
export class RolesGuard implements CanActivate {
  constructor(private reflector: Reflector){}
  canActivate(ctx: ExecutionContext){
    const required = this.reflector.getAllAndOverride&lt;string[]&gt;('roles', [ctx.getHandler(), ctx.getClass()]);
    if (!required) return true;
    const { user } = ctx.switchToHttp().getRequest();
    return required.some(r =&gt; user?.roles?.includes(r));
  }
}

@Injectable()
export class TimingInterceptor implements NestInterceptor {
  intercept(ctx: ExecutionContext, next: CallHandler){
    const t0 = Date.now();
    return next.handle().pipe(tap(() =&gt; metrics.histogram('handler.ms', Date.now() - t0)));
  }
}

@Catch()
export class AllExceptionsFilter implements ExceptionFilter {
  catch(err: unknown, host: ArgumentsHost){
    const res = host.switchToHttp().getResponse();
    const status = err instanceof HttpException ? err.getStatus() : 500;
    res.status(status).json({ error: { code: (err as any).code ?? 'INTERNAL' } });
  }
}

<span class="cm">// global with DI</span>
providers: [{ provide: APP_GUARD, useClass: RolesGuard },
            { provide: APP_PIPE,  useValue: new ValidationPipe({ whitelist: true, transform: true }) }]`,
  traps:[
    "Guards run <b>before</b> pipes, so <code>req.body</code> is still unvalidated inside a guard — never trust it there.",
    "<code>app.useGlobalGuards(new X())</code> creates the instance yourself, so it gets <b>no dependency injection</b>. Use the <code>APP_GUARD</code> provider token instead.",
    "<code>ValidationPipe</code> without <code>whitelist: true</code> lets unknown properties through into your DTO — enable <code>forbidNonWhitelisted</code> to reject them loudly.",
    "<code>transform: true</code> is required for class-transformer to actually instantiate your DTO class; without it you get a plain object and <code>@Type()</code> conversions don't happen.",
    "Interceptors operate on RxJS observables — forgetting to return <code>next.handle()</code> silently hangs the request.",
    "An exception filter that swallows the error without logging makes production debugging impossible."
  ],
  table:{title:'Which extension point?', head:['Need','Use'], rows:[
    ['Is this user allowed?','<b>Guard</b>'],
    ['Validate / coerce input','<b>Pipe</b> (ValidationPipe + DTO)'],
    ['Timing, logging, caching, response shaping','<b>Interceptor</b>'],
    ['Turn an exception into a response','<b>Exception filter</b>'],
    ['Raw body, low-level HTTP concerns','<b>Middleware</b>']
  ]},
  cards:[
    {q:"What is the NestJS request lifecycle order?", a:"Middleware → Guards → Interceptors (pre) → Pipes → Handler → Interceptors (post) → Exception filters. Note guards run before pipes, so authorisation happens on unvalidated input."},
    {q:"Why does a globally registered guard sometimes fail to inject dependencies?", a:"Because <code>app.useGlobalGuards(new RolesGuard(...))</code> instantiates it outside the DI container. Register it as a provider with the <code>APP_GUARD</code> token instead, and Nest constructs it with injection."},
    {q:"What do <code>whitelist</code> and <code>transform</code> do on ValidationPipe?", a:"<code>whitelist: true</code> strips properties with no validation decorator (and <code>forbidNonWhitelisted</code> rejects them instead). <code>transform: true</code> instantiates the DTO class and applies <code>@Type()</code> conversions — without it you get a plain object."},
    {q:"Guard vs interceptor — how do you choose?", a:"Guard when the answer is a yes/no access decision made before the handler. Interceptor when you need to wrap the call: timing, logging, caching, transforming the response, or mapping errors."}
  ],
  quiz:[
    {q:"A guard reads <code>req.body.role</code> to authorise. What's wrong?", options:["Guards run before pipes — the body is unvalidated and untransformed","Guards can't access the request","It should be an interceptor","Nothing"], answer:0,
     why:"Pipes (and therefore ValidationPipe) run after guards, so at guard time the body is raw client input. Authorise from a verified token/session, not from the request body."}
  ],
  cheat:[
    "<b>Middleware → Guards → Interceptors(pre) → Pipes → Handler → Interceptors(post) → Filters.</b>",
    "Guard = authz (before pipes ⇒ body unvalidated) · Pipe = validate/transform · Interceptor = wrap (timing/cache/shape) · Filter = exception → response.",
    "Global <b>with DI</b>: <code>APP_GUARD</code> / <code>APP_PIPE</code> / <code>APP_INTERCEPTOR</code> / <code>APP_FILTER</code> providers.",
    "<code>ValidationPipe({ whitelist: true, forbidNonWhitelisted: true, transform: true })</code>.",
    "Interceptors return observables — always return <code>next.handle()</code>.",
    "<code>Reflector</code> reads <code>@SetMetadata</code>/<code>@Roles</code> in guards."
  ]
},

{ id:'fw-graphql', group:'API styles', title:'GraphQL: schema, resolvers & the pitfalls', animate:'apidesign',
  lede:"One endpoint, a typed schema, and the client asks for exactly the fields it needs — with a distinct set of operational problems.",
  say:"GraphQL solves over- and under-fetching: the client specifies the shape, so you don't ship a fixed REST payload. The cost is that every convenience becomes a server-side concern — N+1 queries need DataLoader, arbitrary query depth needs depth and complexity limits, HTTP caching mostly stops working because everything is a POST to one URL, and errors come back 200 with an <code>errors</code> array.",
  steps:[
    "The <b>schema</b> is the contract: types, queries, mutations, subscriptions. It's strongly typed and introspectable, which is what powers tooling and codegen.",
    "A <b>resolver</b> resolves one field. The signature is <code>(parent, args, context, info)</code>; the <code>context</code> is built per request and is where you put auth, loaders and tracing.",
    "Resolvers are called <b>per field per object</b> — a list of 50 users with a <code>posts</code> field triggers 50 resolver calls, which is where <b>N+1</b> comes from.",
    "<b>DataLoader</b> batches those calls within a tick and caches per request — the standard fix (its own topic).",
    "<b>Authorisation belongs in resolvers or the service layer</b>, not in the schema alone. A field-level check is needed because a client can reach a field through many paths.",
    "<b>Depth and complexity limits</b> are mandatory in public APIs — nested recursion can otherwise generate an enormous query. Add persisted queries/allow-lists for production clients.",
    "<b>Caching is harder</b>: everything is a POST to one URL, so CDN/HTTP caching doesn't apply out of the box. You cache at the resolver/data-source level, or use persisted queries with GET.",
    "<b>Errors</b> return HTTP 200 with an <code>errors</code> array; partial success is normal. Design an error extension shape with stable codes rather than leaking messages."
  ],
  code:`type Query { orders(first: Int = 20, after: String): OrderConnection! }
type Order { id: ID!, total: Int!, customer: User! }

const resolvers = {
  Query: {
    orders: (_p, { first, after }, ctx) =&gt; {
      if (!ctx.user) throw new GraphQLError('UNAUTHENTICATED', { extensions: { code: 'UNAUTHENTICATED' } });
      return ctx.db.orders.page({ userId: ctx.user.id, first, after });
    }
  },
  Order: {
    <span class="cm">// called once per order → N+1 without a loader</span>
    customer: (order, _a, ctx) =&gt; ctx.loaders.userById.load(order.customerId)
  }
};

const server = new ApolloServer({
  typeDefs, resolvers,
  validationRules: [depthLimit(8), complexityLimit(1000)],
  context: ({ req }) =&gt; ({ user: auth(req), loaders: createLoaders(), db })
});`,
  traps:[
    "<b>N+1 by default</b> — a nested field on a list is one query per item unless you batch it.",
    "No depth limit means a client can send a recursive query that expands into millions of resolver calls — a trivial DoS.",
    "Exposing the whole database as a schema (auto-generated CRUD) leaks fields and makes authorisation impossible to reason about.",
    "<b>Loaders must be created per request</b>. A module-level DataLoader caches across users and leaks data between them.",
    "Returning raw error messages in <code>extensions</code> leaks stack traces and SQL; map to stable codes.",
    "Introspection enabled in production hands attackers your full schema — disable it or gate it."
  ],
  table:{title:'REST vs GraphQL vs gRPC', head:['','REST','GraphQL','gRPC'], rows:[
    ['Transport','HTTP/1.1+','HTTP POST (usually)','HTTP/2'],
    ['Payload','JSON','JSON','Protobuf (binary)'],
    ['Shape control','Server fixed','Client chooses','Server fixed'],
    ['Caching','HTTP native','Hard (POST)','Manual'],
    ['Streaming','SSE/WS','Subscriptions','Native bidi streams'],
    ['Best for','Public APIs, CRUD','Aggregating for varied clients','Internal service-to-service']
  ]},
  cards:[
    {q:"What problem does GraphQL solve, and what does it cost?", a:"It solves over-fetching and under-fetching by letting the client specify the response shape, which is especially valuable with many client types. It costs you: N+1 risk, no free HTTP caching, the need for depth/complexity limits, and more complex authorisation and observability."},
    {q:"Where should authorisation live in a GraphQL API?", a:"In resolvers or the service layer beneath them, at field granularity — because a client can reach the same field through many query paths. Schema shape alone is not access control."},
    {q:"Why must DataLoader instances be per request?", a:"They cache by key for their lifetime. A module-level loader would serve one user's cached record to another request — a data-leak bug. Create loaders in the per-request context factory."},
    {q:"How do errors work in GraphQL?", a:"The HTTP status is normally 200 and failures appear in an <code>errors</code> array alongside possibly-partial <code>data</code>. Use <code>extensions.code</code> for stable machine-readable codes and never leak internal messages."}
  ],
  quiz:[
    {q:"A query returns 50 orders each with a <code>customer</code> field. Without DataLoader, how many customer queries run?", options:["50 — one per order (N+1)","1","2","0"], answer:0,
     why:"Field resolvers run once per parent object. Fifty orders means fifty <code>customer</code> resolver invocations, each issuing its own query — the classic N+1."}
  ],
  cheat:[
    "Schema = contract; resolver <code>(parent, args, context, info)</code>, one call <b>per field per object</b>.",
    "<b>N+1 is the default</b> → per-request DataLoader.",
    "Mandatory in public APIs: <b>depth + complexity limits</b>, persisted queries/allow-list, introspection off in prod.",
    "AuthZ in resolvers/services at field level — not in the schema shape.",
    "Errors: HTTP 200 + <code>errors[]</code> + <code>extensions.code</code>; partial data is normal.",
    "Caching is manual (POST to one URL) — cache at data-source level."
  ]
},

{ id:'fw-dataloader', group:'API styles', title:'The N+1 problem & DataLoader', animate:'nplusone',
  lede:"The single most common performance bug in ORM and GraphQL codebases — invisible in dev, fatal in production.",
  say:"N+1 is one query to fetch a list, then one more per item to fetch a relation. It's invisible with ten rows in development and catastrophic with ten thousand in production. The fixes are: a JOIN or eager load in SQL, batching IDs into a single <code>WHERE id IN (…)</code>, or DataLoader — which collects every <code>.load(id)</code> within one tick, issues a single batched query, and caches per request.",
  steps:[
    "<b>N+1</b>: one query for the list, then one query per item for a related record. 200 orders = 201 round trips.",
    "It's <b>invisible in development</b> because a small dataset makes 201 fast queries look fine. It only bites at production volume.",
    "<b>Fix 1 — join / eager load</b>: <code>include</code> in Prisma, <code>relations</code> in TypeORM, a <code>JOIN</code> in raw SQL. One query, but a wider result set.",
    "<b>Fix 2 — batch</b>: collect the ids and issue one <code>WHERE id IN (...)</code>, then map back in memory. Two queries total.",
    "<b>Fix 3 — DataLoader</b>: you keep writing <code>load(id)</code> per item, and it coalesces every call made in the same event-loop tick into one batch function call.",
    "DataLoader also <b>caches per key</b> for its lifetime — which is why the instance must be created <b>per request</b>, never shared across users.",
    "The batch function must return results <b>in the same order as the keys</b>, with a null/error placeholder for misses — getting this wrong silently returns the wrong record for the wrong key.",
    "Detect it by logging query counts per request, or turning on ORM query logging in a load test — 'requests with more than 20 queries' is a great alert."
  ],
  code:`<span class="cm">// N+1</span>
const orders = await db.orders.findMany();                       <span class="cm">// 1</span>
for (const o of orders) o.customer = await db.users.find(o.customerId);   <span class="cm">// N</span>

<span class="cm">// batched</span>
const ids = [...new Set(orders.map(o =&gt; o.customerId))];
const users = await db.users.findMany({ where: { id: { in: ids } } });    <span class="cm">// 1</span>
const byId = new Map(users.map(u =&gt; [u.id, u]));
orders.forEach(o =&gt; { o.customer = byId.get(o.customerId); });

<span class="cm">// DataLoader — order of results MUST match order of keys</span>
const userLoader = new DataLoader&lt;string, User | null&gt;(async (ids) =&gt; {
  const rows = await db.users.findMany({ where: { id: { in: [...ids] } } });
  const map = new Map(rows.map(r =&gt; [r.id, r]));
  return ids.map(id =&gt; map.get(id) ?? null);      <span class="cm">// same length, same order</span>
});

<span class="cm">// per-request context — never module scope</span>
context: () =&gt; ({ loaders: { userById: new DataLoader(batchUsers) } })`,
  traps:[
    "A <b>module-level</b> DataLoader caches across requests and users — a correctness and privacy bug, not just a stale-data one.",
    "Returning results in a different order or a different length from the keys array silently mismatches records.",
    "DataLoader batches only within one tick — an <code>await</code> between <code>.load()</code> calls breaks the batching.",
    "Eager-loading everything to 'avoid N+1' creates the opposite problem: huge cartesian result sets from multiple joins.",
    "Caching errors in a loader poisons that key for the rest of the request; clear the key on failure (<code>loader.clear(key)</code>)."
  ],
  cards:[
    {q:"What is the N+1 query problem?", a:"One query to fetch a collection, then one additional query per item to fetch a related record — N+1 round trips where 1 or 2 would do. It's invisible with small dev datasets and severe at production scale."},
    {q:"How does DataLoader fix it?", a:"It defers every <code>.load(key)</code> call made within the same event-loop tick, then invokes your batch function once with all the keys. You keep the per-item code style but issue a single query. It also caches by key for its (per-request) lifetime."},
    {q:"Why must the batch function preserve order?", a:"DataLoader maps results back to callers positionally. Returning a different order or length hands the wrong record to the wrong caller — a silent correctness bug. Always map over the keys array and return a placeholder for misses."},
    {q:"How do you detect N+1 in production?", a:"Instrument query count per request (ORM hooks or APM), and alert on requests exceeding a threshold. Distributed traces also show it clearly as a long fan of identical small spans."}
  ],
  quiz:[
    {q:"Why is this DataLoader dangerous?", code:`const userLoader = new DataLoader(batchUsers);   <span class="cm">// module scope</span>\napp.use((req,_r,next) =&gt; { req.loaders = { userLoader }; next(); });`,
     options:["It caches across requests — one user can receive another's cached data","It's slower","Batching won't work","Nothing is wrong"], answer:0,
     why:"DataLoader caches by key for its lifetime. A module-scoped instance lives for the process, so cached rows are shared between all users and never refresh."}
  ],
  cheat:[
    "N+1 = 1 list query + 1 per item. Invisible in dev, fatal in prod.",
    "Fixes: <b>JOIN / eager load</b> · <b>batch <code>WHERE id IN (…)</code></b> · <b>DataLoader</b>.",
    "DataLoader batches per <b>tick</b>, caches per key. <b>Instantiate per request.</b>",
    "Batch fn must return <b>same length, same order</b> as keys; null for misses.",
    "An <code>await</code> between loads breaks batching. Clear the key on error.",
    "Detect: query-count-per-request metric + traces showing a fan of identical spans."
  ]
},

{ id:'fw-ws', group:'API styles', title:'WebSockets & real-time at scale', animate:'transportcompare',
  lede:"Persistent connections change every assumption: routing, scaling, deploys and backpressure.",
  say:"WebSockets give full-duplex over one connection, which you need when the client must send something mid-stream — a 'stop generating' signal, for instance. SSE is simpler and auto-reconnects but is server-to-client only. The hard part isn't the protocol, it's scale: connections are stateful, so you need sticky routing or a shared pub/sub layer like Redis, plus heartbeats to detect dead peers and a drain strategy for deploys.",
  steps:[
    "<b>Long polling</b>: repeated requests held open until data arrives. Works everywhere, high overhead, not truly real-time.",
    "<b>SSE</b>: one long-lived HTTP response streaming events server→client. Plain HTTP, native auto-reconnect with <code>Last-Event-ID</code>, but <b>one-way</b>.",
    "<b>WebSockets</b>: full-duplex over a single upgraded connection. Needed when the client sends messages mid-stream.",
    "For an LLM chat UI, tokens flow server→client but the client also needs to send 'stop' and typing signals — that bidirectionality is what tips the choice to WebSockets. SSE plus a separate POST is a valid simpler alternative.",
    "<b>Scaling</b>: a connection lives on one server, so a message produced elsewhere must be routed to it. Solutions: sticky sessions plus <b>Redis pub/sub</b> (the common one), or a dedicated connection layer / managed service (API Gateway WebSockets, Ably, Pusher).",
    "<b>Heartbeats</b> (ping/pong) are required — TCP won't reliably tell you a client vanished, so you accumulate zombie connections holding memory.",
    "<b>Backpressure applies</b>: check <code>ws.bufferedAmount</code> before sending more; a slow client otherwise grows the send buffer without limit.",
    "<b>Deploys</b>: on SIGTERM, send a close frame with a reason so clients reconnect elsewhere, rather than dropping thousands of sockets at once. Stagger it to avoid a reconnect thundering herd."
  ],
  code:`<span class="cm">// heartbeat + dead-peer detection</span>
wss.on('connection', (ws) =&gt; {
  ws.isAlive = true;
  ws.on('pong', () =&gt; { ws.isAlive = true; });
});
setInterval(() =&gt; {
  for (const ws of wss.clients){
    if (!ws.isAlive) { ws.terminate(); continue; }   <span class="cm">// zombie</span>
    ws.isAlive = false; ws.ping();
  }
}, 30_000).unref();

<span class="cm">// backpressure while streaming tokens</span>
async function sendToken(ws, token){
  if (ws.bufferedAmount &gt; 1_000_000) await sleep(50);   <span class="cm">// let the client catch up</span>
  ws.send(token);
}

<span class="cm">// fan-out across instances</span>
redisSub.subscribe('room:42');
redisSub.on('message', (_ch, msg) =&gt; localSockets.get('room:42')?.forEach(s =&gt; s.send(msg)));

<span class="cm">// graceful drain</span>
process.on('SIGTERM', () =&gt; {
  for (const ws of wss.clients) ws.close(1001, 'server restarting');   <span class="cm">// 1001 = going away</span>
});`,
  traps:[
    "Load balancers must support connection upgrade and long-lived connections; a short idle timeout silently kills sockets (set the LB idle timeout above your heartbeat interval).",
    "No heartbeat = zombie connections that hold memory and appear connected forever.",
    "In-memory room/connection maps break the moment you scale past one instance.",
    "Killing the process on deploy drops every socket at once, and they all reconnect simultaneously — a thundering herd. Stagger reconnects with jitter on the client.",
    "Ignoring <code>bufferedAmount</code> during token streaming grows memory per slow connection.",
    "Authenticating only at connect time means a revoked token stays valid for the life of the connection — re-check periodically for long sessions."
  ],
  cards:[
    {q:"SSE vs WebSockets — how do you choose?", a:"SSE if the flow is server→client only: it's plain HTTP, passes through proxies easily, and auto-reconnects natively. WebSockets when the client must send messages over the same connection mid-stream (a stop signal, typing indicators, interactive protocols)."},
    {q:"How do you scale WebSockets beyond one instance?", a:"Connections are stateful and pinned to one server. Either use sticky routing plus a shared pub/sub (Redis) so any instance can deliver to a connection held elsewhere, or move connection management to a dedicated layer (API Gateway WebSockets, Ably, a socket service)."},
    {q:"Why are heartbeats necessary?", a:"TCP doesn't reliably report a peer that disappeared (laptop sleeps, phone loses signal). Without ping/pong you accumulate zombie connections consuming memory and connection slots, and you send messages into a void."},
    {q:"How should a WebSocket server handle SIGTERM?", a:"Send a close frame with code 1001 ('going away') so clients know to reconnect elsewhere, stop accepting new connections, allow a brief drain, then exit. Clients should reconnect with exponential backoff and jitter to avoid a thundering herd."}
  ],
  quiz:[
    {q:"A chat app works on one instance but messages are lost after scaling to three. Cause?", options:["Connections live on one instance; there's no shared pub/sub layer","WebSockets don't scale","Missing heartbeats","TLS termination"], answer:0,
     why:"A socket is held by exactly one process. A message published on instance B can't reach a socket on instance A without a shared broker (Redis pub/sub) or a dedicated connection layer."}
  ],
  cheat:[
    "Long polling (overhead) · <b>SSE</b> (HTTP, one-way, auto-reconnect) · <b>WS</b> (full-duplex).",
    "LLM chat: tokens down + stop/typing up ⇒ WS (or SSE + POST).",
    "Scale: sticky + <b>Redis pub/sub</b>, or a managed connection layer. In-memory maps break at 2 instances.",
    "<b>Heartbeat ping/pong</b> or you accumulate zombies. LB idle timeout &gt; heartbeat interval.",
    "Backpressure: check <code>bufferedAmount</code> before sending.",
    "Deploy: close(1001) + client reconnect with backoff <b>and jitter</b>.",
    "Re-verify auth periodically on long-lived connections."
  ]
},

{ id:'fw-orm', group:'Data access', title:'ORMs, migrations & transactions in Node', animate:'dbcompare',
  lede:"Where application code meets the database — and where most data-integrity bugs are introduced.",
  say:"An ORM is a productivity tool, not a database abstraction — you still need to know the SQL it generates. The three things I care about are: keeping transactions short and explicit so locks aren't held across network calls, running migrations as a separate deploy step that's backwards-compatible with the currently-running code, and always being able to see the generated query when something is slow.",
  steps:[
    "<b>Data mapper vs active record</b>: Prisma and TypeORM's repository pattern separate entity from persistence (easier to test); active-record style puts <code>save()</code> on the entity (faster to write, harder to isolate).",
    "<b>Always be able to see the SQL.</b> Enable query logging in development and in load tests; an ORM that hides a 6-way join or an N+1 from you is a liability.",
    "<b>Transactions</b>: wrap a unit of work so it commits or rolls back atomically. Keep them <b>short</b> — never make an HTTP call or await user input inside one.",
    "A transaction holds locks for its whole duration; a slow transaction is how you get lock contention, connection-pool exhaustion and deadlocks under load.",
    "<b>Connection pooling</b> is mandatory: a pool per process, sized so that <code>instances × pool size</code> stays under the database's <code>max_connections</code>. In serverless, add a proxy (RDS Proxy/PgBouncer).",
    "<b>Migrations</b> are code: version-controlled, reviewed, forward-only in production, and run as a separate step before or after deploy — not on application boot in a multi-instance environment (they'd race).",
    "<b>Expand/contract</b> for zero-downtime schema change: add the new column nullable → backfill → write to both → switch reads → stop writing the old → drop it in a later release. Never a breaking change in one step.",
    "<b>Repository layer</b>: keep query construction out of controllers and services so it can be tested, cached and optimised in one place."
  ],
  code:`<span class="cm">// short, explicit transaction — no network calls inside</span>
await prisma.$transaction(async (tx) =&gt; {
  const order = await tx.order.create({ data: dto });
  await tx.inventory.updateMany({
    where: { sku: { in: skus } },
    data: { reserved: { increment: 1 } }
  });
  return order;
}, { timeout: 5000, isolationLevel: 'ReadCommitted' });

<span class="cm">// the payment call happens AFTER commit, with an idempotency key</span>
await payments.charge(order.id, order.total, { idempotencyKey: order.id });

<span class="cm">// expand/contract migration, step 1 of 5</span>
ALTER TABLE users ADD COLUMN email_normalised text;      <span class="cm">-- nullable, non-breaking</span>
CREATE INDEX CONCURRENTLY idx_users_email_norm ON users(email_normalised);`,
  traps:[
    "<b>Calling an external API inside a transaction</b> holds locks for the duration of a network round trip — a top cause of production lock storms. Commit first, then call, with an idempotency key.",
    "Running migrations on application startup races across replicas; use a dedicated job or an init container with a lock.",
    "A destructive migration (drop column, rename) deployed alongside code breaks the old instances still running during a rolling deploy. Use expand/contract.",
    "Lazy-loaded relations in a loop are N+1 in disguise — the ORM makes it look like a property access.",
    "Pool size × instance count silently exceeding the database's connection limit produces 'too many connections' under autoscaling, not under normal load.",
    "<code>CREATE INDEX</code> without <code>CONCURRENTLY</code> locks the table for writes in Postgres."
  ],
  cards:[
    {q:"Why must transactions be short?", a:"They hold locks and a pooled connection for their entire duration. A long transaction — especially one containing a network call — causes lock contention, deadlocks and pool exhaustion under load. Commit, then do the external work with an idempotency key."},
    {q:"Describe expand/contract migration.", a:"Add the new structure in a backwards-compatible way (nullable column, new table) → backfill → have the app write to both → switch reads to the new → stop writing the old → drop the old in a <i>later</i> release. Every step is safe with both old and new code running."},
    {q:"Why not run migrations on application boot?", a:"With multiple replicas they race, and a rolling deploy means old code is still running against the new schema. Run them as a separate, single-instance step (job/init container) with a lock, and keep the schema compatible with both versions."},
    {q:"How do you size a connection pool?", a:"So that <code>replicas × pool size + admin headroom</code> stays below the database's <code>max_connections</code>. Postgres connections are processes and expensive — prefer a smaller pool plus a proxy (PgBouncer/RDS Proxy) over a large one, especially with serverless or autoscaling."}
  ],
  quiz:[
    {q:"An endpoint creates an order then charges Stripe, all inside one DB transaction. What's the main risk?", options:["Locks held across a network call → contention and pool exhaustion","Stripe will reject it","The transaction can't be rolled back","Nothing"], answer:0,
     why:"The transaction stays open for the whole Stripe round trip (hundreds of ms, or seconds if Stripe is slow), holding row locks and a connection. Commit first, then charge with an idempotency key, and reconcile failures."}
  ],
  cheat:[
    "Know the generated SQL — enable query logging in dev and load tests.",
    "<b>Short transactions.</b> No HTTP calls inside. Commit → then external call with an <b>idempotency key</b>.",
    "Pool per process; <code>replicas × pool ≤ max_connections</code>; serverless ⇒ proxy (RDS Proxy/PgBouncer).",
    "Migrations = versioned code, separate step, <b>never on boot</b> across replicas.",
    "<b>Expand/contract</b> for zero-downtime schema change; <code>CREATE INDEX CONCURRENTLY</code> in Postgres.",
    "Lazy relations in loops = hidden N+1."
  ]
},

{ id:'aws-lambda', group:'Lambda', title:'Lambda execution model & lifecycle', animate:'coldstart',
  lede:"Everything about Lambda behaviour follows from one fact: the execution environment is reused, but you never control when.",
  say:"Lambda runs your handler inside a micro-VM execution environment. The first invocation pays <b>Init</b> — download code, start the runtime, run everything outside the handler — then <b>Invoke</b>. Subsequent invocations reuse that warm environment and skip Init entirely. So anything expensive and reusable goes outside the handler: SDK clients, DB pools, config. And because one environment serves exactly one request at a time, no in-environment state is ever shared between concurrent requests — but it <i>is</i> shared with the next request on the same environment.",
  steps:[
    "Three lifecycle phases: <b>Init</b> (download code, bootstrap the runtime, run module-level code), <b>Invoke</b> (run the handler), <b>Shutdown</b> (environment reclaimed, ~after minutes of idleness).",
    "<b>One execution environment handles one request at a time.</b> Concurrency scales by creating more environments, not by threading inside one.",
    "Module-level code runs <b>once per environment</b>, not per invocation — put SDK client creation, connection setup, config parsing and secret fetching there.",
    "Init has a <b>10 second</b> budget (for the standard init phase) and, importantly, in some cases init CPU is boosted — another reason to front-load work there.",
    "<b>Environments are reused</b>, so <code>/tmp</code> (512MB–10GB, configurable) and module-level variables persist between invocations on the same environment. That's a cache <i>and</i> a data-leak risk.",
    "You cannot rely on reuse and cannot control it. Never assume state survives; never leave sensitive data in a module-level variable.",
    "The <b>Shutdown</b> phase gives extensions a chance to flush; your handler code doesn't get a reliable shutdown hook, so never buffer data you can't afford to lose.",
    "<b>Memory is the only performance dial</b> — CPU, network and disk throughput scale proportionally with the configured memory. At 1,769MB you get roughly one full vCPU."
  ],
  code:`<span class="cm">// ✅ module scope — runs once per environment (Init)</span>
import { DynamoDBClient } from '@aws-sdk/client-dynamodb';
const ddb = new DynamoDBClient({});
const config = await loadConfig();          <span class="cm">// top-level await in ESM</span>
let warmPool = null;

export const handler = async (event) =&gt; {
  <span class="cm">// ❌ never create clients here — new TCP+TLS per invocation</span>
  warmPool ??= await createPool();          <span class="cm">// lazily init once, reuse after</span>
  return process(event, ddb, config);
};

<span class="cm">// ❌ leaks between invocations on the same environment</span>
let currentUser;                            <span class="cm">// DON'T</span>
export const bad = async (e) =&gt; { currentUser = e.user; /* … */ };`,
  traps:[
    "<b>Module-scope mutable state leaks between requests</b> served by the same environment — a real security bug if it holds user data.",
    "Creating the AWS SDK client inside the handler pays TLS handshake and credential resolution on every invocation.",
    "<code>/tmp</code> is not cleared between invocations on the same environment; a function that writes files there can fill it and fail with ENOSPC after thousands of warm invocations.",
    "Assuming a warm environment for correctness (e.g. an in-memory dedupe set) breaks the moment Lambda scales out.",
    "Unhandled promise rejections in the module scope can fail Init in ways that are hard to see — wrap top-level await work in try/catch and log.",
    "Setting memory 'to save money' often costs more: doubling memory can more than halve duration, making the invocation cheaper overall."
  ],
  terms:[
    {term:"Execution environment", desc:"The Firecracker micro-VM that runs your code, reused across invocations.", detail:"AWS keeps it warm for an unspecified period (empirically minutes) and may reclaim it at any time. It's an optimisation you benefit from but can never depend on for correctness.", code:`<span class="cm">// prove reuse: this counter increments on warm invocations</span>\nlet invocations = 0;\nexport const handler = async () =&gt; ({ invocations: ++invocations });`},
    {term:"Memory = CPU", desc:"The only lever; CPU and network scale linearly with memory.", detail:"~1,769MB ≈ 1 vCPU; above that you get multiple cores (useful only if your work is parallel). Use AWS Lambda Power Tuning to find the cost/latency sweet spot empirically rather than guessing.", code:`<span class="cm"># Power Tuning state machine sweeps memory settings</span>\n<span class="cm"># and plots duration vs cost — often 1024MB beats 512MB on BOTH</span>`},
    {term:"Init phase optimisation", desc:"Front-load work that can be reused; keep the package small.", detail:"Bundling with esbuild and tree-shaking cuts the download and module-parse time; importing only the specific AWS SDK v3 clients you need rather than the whole SDK can cut hundreds of milliseconds.", code:`<span class="cm">// ❌ import { DynamoDB } from 'aws-sdk';       // v2, whole SDK</span>\n<span class="cm">// ✅ v3, one client, tree-shakeable</span>\nimport { DynamoDBClient } from '@aws-sdk/client-dynamodb';`}
  ],
  cards:[
    {q:"What runs once per environment vs once per invocation?", a:"Module-level (outside the handler) code runs once per execution environment during Init — SDK clients, config, connection pools belong there. The handler body runs on every invocation."},
    {q:"How many requests does one Lambda execution environment handle at a time?", a:"Exactly one. Concurrency is achieved by creating more environments. So there's no in-process request interleaving — but state <i>does</i> persist to the <i>next</i> request on the same environment."},
    {q:"Why is module-scope mutable state dangerous?", a:"Because the environment is reused, a variable holding request data (user, tenant, auth context) is still there for the next invocation — potentially a different customer. It's a data-leak bug, not just a stale-cache one."},
    {q:"What does increasing Lambda memory actually change?", a:"CPU, network and disk throughput scale proportionally with memory. ~1,769MB is about one vCPU. Increasing memory often reduces duration enough that total cost falls — measure with Power Tuning rather than assuming less memory is cheaper."}
  ],
  quiz:[
    {q:"Where should a database connection pool be created in a Lambda?", options:["Module scope, outside the handler — reused across invocations","Inside the handler, per invocation","In a Lambda layer","It shouldn't be pooled"], answer:0,
     why:"Module-level code runs once per execution environment, so the pool is created during Init and reused by every subsequent warm invocation, avoiding a connection handshake per request."}
  ],
  cheat:[
    "Phases: <b>Init</b> (download, runtime bootstrap, module code) → <b>Invoke</b> (handler) → Shutdown.",
    "<b>1 environment = 1 concurrent request.</b> Scale = more environments.",
    "Module scope = once per environment → SDK clients, pools, config, secrets.",
    "Environment + <code>/tmp</code> reused ⇒ cache opportunity <b>and</b> leak risk. Never store request state at module scope.",
    "<b>Memory is the only dial</b> — CPU/network scale with it; ~1769MB ≈ 1 vCPU. Power-tune it.",
    "Never depend on warmth for correctness."
  ]
},

{ id:'aws-coldstart', group:'Lambda', title:'Cold starts: causes and the real fixes', animate:'coldstart',
  lede:"A cold start is the Init phase made visible — and there are exactly four levers that move it.",
  say:"A cold start happens when no warm environment exists: first request, scale-out, or after a deploy. The duration is download + runtime bootstrap + your init code. The levers are: shrink the package (esbuild bundling, tree-shaking, SDK v3 modular clients), do less at init, raise memory so init runs faster, and for latency-critical paths use Provisioned Concurrency or SnapStart. In my last platform that combination cut cold starts by about 60%.",
  steps:[
    "A cold start occurs when a request arrives and no warm environment is available: first invocation, scale-out to a new concurrency level, after a config/code deploy, or after idle reclamation.",
    "Cold start duration = <b>download code</b> + <b>bootstrap runtime</b> + <b>run your init code</b>. Only the last two are usually in your control, and package size drives the first.",
    "<b>Lever 1 — package size.</b> Bundle with esbuild, tree-shake, exclude dev deps, use AWS SDK v3 modular clients instead of the monolithic v2 SDK. Smaller artifact = faster download and parse.",
    "<b>Lever 2 — do less at init.</b> Lazily initialise anything not needed on every path; avoid fetching secrets synchronously at init when a cached layer/extension can serve them.",
    "<b>Lever 3 — memory.</b> More memory means more CPU, so init code runs faster. Often the cheapest win.",
    "<b>Lever 4 — Provisioned Concurrency</b>: pre-initialised environments that are always warm. Eliminates cold starts for that many concurrent executions, at a fixed hourly cost. Apply it only to latency-critical functions and put it on an <b>alias</b>, with autoscaling on a schedule.",
    "<b>SnapStart</b> (Java, and now other runtimes) snapshots the initialised environment and restores from it — a different mechanism with the same goal.",
    "Runtime matters: compiled runtimes (Go, Rust) and lightweight ones start faster than JVM/.NET. Node and Python sit in the middle; Node with a bundled, tree-shaken artifact is competitive.",
    "<b>Ping/warmer schedules are a weak workaround</b> — they keep one environment warm but do nothing for scale-out cold starts, which are the ones users actually hit during a traffic spike."
  ],
  code:`<span class="cm"># esbuild — bundle + tree-shake + minify (CDK NodejsFunction does this for you)</span>
esbuild src/handler.ts --bundle --minify --platform=node --target=node20 \\
  --external:@aws-sdk/* --outfile=dist/handler.js

<span class="cm">// lazy-init anything not needed on every path</span>
let heavy;
const getHeavy = async () =&gt; (heavy ??= await import('./report-generator.js'));

<span class="cm">// CDK: provisioned concurrency on an alias, with scheduled autoscaling</span>
const alias = fn.addAlias('live', { provisionedConcurrentExecutions: 5 });
alias.addAutoScaling({ minCapacity: 2, maxCapacity: 50 })
     .scaleOnSchedule('BusinessHours', {
       schedule: appscaling.Schedule.cron({ hour: '8', minute: '0' }), minCapacity: 20
     });`,
  note:{type:'info', text:"<b>How to frame this from experience:</b> “We cut cold starts about 60% with three changes: switching from the v2 SDK to modular v3 clients and bundling with esbuild, which shrank the artifact substantially; moving non-essential setup out of the init path; and applying Provisioned Concurrency only to the handful of latency-critical, user-facing functions — on an alias with scheduled scaling so we weren't paying for it overnight.” Naming what you <i>didn't</i> apply it to is what makes it sound real."},
  traps:[
    "Provisioned Concurrency on <code>$LATEST</code> doesn't work — it must be on a version or alias, and each deploy needs the alias shifted.",
    "PC costs money whether used or not; applying it everywhere is a large, silent bill. Scope it and schedule it.",
    "Warmer pings only keep <i>one</i> environment warm. A spike to 50 concurrent executions still cold-starts 49 of them.",
    "Putting a Lambda in a VPC used to add seconds; since Hyperplane ENIs that's largely fixed — but a VPC still adds network-path considerations and NAT costs.",
    "Bundling the whole <code>aws-sdk</code> v2 into the artifact when the runtime already provides it inflates the package for nothing.",
    "Measuring cold starts from CloudWatch averages hides them — look at the <code>Init Duration</code> field in REPORT lines and at p99, not the mean."
  ],
  cards:[
    {q:"What are the four levers on cold start duration?", a:"1) Package size — bundle/tree-shake, modular SDK v3 clients. 2) Less work at init (lazy-load). 3) More memory (faster CPU during init). 4) Provisioned Concurrency or SnapStart for latency-critical paths."},
    {q:"Why aren't warmer pings a real solution?", a:"They keep a small number of environments warm. Cold starts that hurt users happen during <b>scale-out</b> — a spike to 50 concurrent invocations still initialises 49 new environments regardless of your pings."},
    {q:"What's the catch with Provisioned Concurrency?", a:"It bills hourly whether used or not, must be attached to a version/alias (not <code>$LATEST</code>), and needs the alias updated on deploy. Scope it to the few latency-critical functions and use scheduled autoscaling so you're not paying at 3am."},
    {q:"How do you actually measure cold starts?", a:"The <code>REPORT</code> log line includes <code>Init Duration</code> only for cold invocations. Query those in CloudWatch Logs Insights, and track the cold-start <i>rate</i> and p99 <i>duration</i> — averages hide them because most invocations are warm."}
  ],
  quiz:[
    {q:"Which change most reliably reduces Node.js Lambda cold starts?", options:["Bundling with esbuild and using modular AWS SDK v3 clients","Adding a 5-minute warmer ping","Lowering memory to 128MB","Adding more environment variables"], answer:0,
     why:"Package size directly drives download and module-parse time. Lowering memory makes init slower, and warmers don't help scale-out cold starts at all."}
  ],
  cheat:[
    "Cold start = download + runtime bootstrap + your init code. Happens on first call, <b>scale-out</b>, and after deploy.",
    "Levers: <b>smaller package</b> (esbuild + SDK v3 modular) · <b>less init work</b> (lazy) · <b>more memory</b> · <b>Provisioned Concurrency / SnapStart</b>.",
    "PC: on an <b>alias</b>, scoped to latency-critical fns, with scheduled autoscaling. Bills when idle.",
    "Warmer pings ≠ a fix (don't help scale-out).",
    "Measure via <code>Init Duration</code> in REPORT lines; track cold-start rate + p99.",
    {t:'nums', items:[{v:'~1769MB',l:'≈ 1 vCPU'},{v:'10s',l:'init phase budget'},{v:'p99',l:'the number that matters, not the mean'}]}
  ]
