/* ============================================================
   Interview Reference — application
   Modes: learn | cards | quiz | cheat
   ============================================================ */
(function(){
'use strict';

/* ---------------- storage ---------------- */
var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem('irp:'+k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem('irp:'+k, JSON.stringify(v)); }catch(e){} }
};

var state = {
  tab:  LS.get('tab','js'),
  idx:  LS.get('idx',0),
  mode: LS.get('mode','learn'),
  theme:LS.get('theme','light'),
  fs:   LS.get('fs','m'),
  deckScope: LS.get('deckScope','due'),
  quizScope: LS.get('quizScope','tab')
};
var progress = LS.get('progress',{});   // "tab/id" -> 1
var srs      = LS.get('srs',{});        // "tab/id/n" -> {d:dueMs, i:intervalDays, e:ease, r:reps, l:lapses}
var quizLog  = LS.get('quizLog',{});    // "tab/id/n" -> {ok:n, no:n}

function saveProgress(){ LS.set('progress',progress); }
function saveSrs(){ LS.set('srs',srs); }
function saveQuiz(){ LS.set('quizLog',quizLog); }

/* ---------------- data access ---------------- */
function tabDef(k){ for(var i=0;i<TABS.length;i++) if(TABS[i].k===k) return TABS[i]; return TABS[0]; }
function topics(k){ return tabDef(k).topics; }
function curTopics(){ return topics(state.tab); }
function curTopic(){ var t=curTopics(); return t[Math.min(state.idx, t.length-1)]; }
function tabIndex(k){ for(var i=0;i<TABS.length;i++) if(TABS[i].k===k) return i; return 0; }

/* ---------------- helpers ---------------- */
function el(id){ return document.getElementById(id); }
function h(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function stripTags(s){ return String(s||'').replace(/<[^>]*>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var DAY = 86400000;

/* ---------------- theme / font ---------------- */
function applyChrome(){
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-fs', state.fs);
  var tb = el('themeBtn'); if(tb) tb.textContent = state.theme==='dark' ? 'Light' : 'Dark';
  var fb = el('fsBtn'); if(fb) fb.textContent = 'A ' + state.fs.toUpperCase();
}
window.__toggleTheme = function(){ state.theme = state.theme==='dark'?'light':'dark'; LS.set('theme',state.theme); applyChrome(); };
window.__cycleFs = function(){ var o=['s','m','l','xl']; state.fs = o[(o.indexOf(state.fs)+1)%o.length]; LS.set('fs',state.fs); applyChrome(); };

/* ============================================================
   SRS
   ============================================================ */
function cardKey(tab, tid, n){ return tab+'/'+tid+'/'+n; }
function cardState(k){ return srs[k] || null; }
function isDue(k){ var s=srs[k]; return !s || s.d <= Date.now(); }
function gradeCard(k, g){
  var s = srs[k] || {d:0,i:0,e:2.5,r:0,l:0};
  if(g===0){ s.l++; s.r=0; s.i=0; s.e=Math.max(1.3, s.e-0.2); s.d = Date.now() + 60000; }
  else {
    s.r++;
    if(g===1){ s.e=Math.max(1.3, s.e-0.15); s.i = s.i? Math.max(1, s.i*1.2) : 1; }
    else if(g===2){ s.i = s.i? s.i*s.e : 1; }
    else { s.e=Math.min(3.0, s.e+0.15); s.i = s.i? s.i*s.e*1.35 : 3; }
    s.d = Date.now() + Math.round(s.i*DAY);
  }
  srs[k]=s; saveSrs();
}
function allCards(scope){
  var out=[], list = scope==='all' ? TABS : [tabDef(state.tab)];
  list.forEach(function(T){
    T.topics.forEach(function(t){
      if(!t.cards) return;
      t.cards.forEach(function(c,n){
        out.push({tab:T.k, tabLabel:T.label, topic:t, n:n, card:c, key:cardKey(T.k,t.id,n)});
      });
    });
  });
  return out;
}
function deckFor(scope){
  if(scope==='due')  return allCards('all').filter(function(c){ return isDue(c.key); });
  if(scope==='tab')  return allCards('tab');
  if(scope==='weak') return allCards('all').filter(function(c){ var s=srs[c.key]; return s && s.l>0; })
                       .sort(function(a,b){ return (srs[b.key].l||0)-(srs[a.key].l||0); });
  return allCards('all');
}

/* ============================================================
   RENDER — top chrome
   ============================================================ */
function renderTabs(){
  var wrap = el('tabs'); wrap.innerHTML='';
  TABS.forEach(function(T){
    var b = h('button','tab '+T.k+(T.k===state.tab?' active':''), T.label);
    b.onclick = function(){ if(state.tab===T.k) return; state.tab=T.k; state.idx=0; persist(); renderAll(); };
    wrap.appendChild(b);
  });
}
function renderModes(){
  var wrap = el('modes'); wrap.innerHTML='';
  [['learn','Learn'],['cards','Cards'],['quiz','Quiz'],['cheat','Cheat sheet']].forEach(function(m){
    var b = h('button','mode'+(state.mode===m[0]?' on':''), m[1]);
    b.onclick = function(){ state.mode=m[0]; persist(); renderAll(); };
    wrap.appendChild(b);
  });
}
function renderStats(){
  var T = tabDef(state.tab);
  var done=0, total=0;
  T.topics.forEach(function(t){ if(t.type!=='demo'){ total++; if(progress[state.tab+'/'+t.id]) done++; } });
  var due = allCards('all').filter(function(c){ return isDue(c.key); }).length;
  el('statTopics').innerHTML = 'Read <b>'+done+'/'+total+'</b>';
  el('statDue').innerHTML = 'Cards due <b>'+due+'</b>';
}
function persist(){ LS.set('tab',state.tab); LS.set('idx',state.idx); LS.set('mode',state.mode); }

/* ============================================================
   RENDER — sidebar
   ============================================================ */
function renderSidebar(){
  var wrap = el('sidebar'); wrap.innerHTML='';
  if(state.mode==='cards' || state.mode==='quiz' || state.mode==='cheat'){
    var g = h('div','side-group','Track');
    wrap.appendChild(g);
    TABS.forEach(function(T){
      var b = h('button','side-item '+(T.k===state.tab?'active '+T.k:''),'<span class="lbl">'+T.label+'</span>');
      b.onclick = function(){ state.tab=T.k; state.idx=0; persist(); renderAll(); };
      wrap.appendChild(b);
    });
    return;
  }
  var list = curTopics(), lastGroup=null;
  list.forEach(function(t,i){
    if(t.group && t.group!==lastGroup){ lastGroup=t.group; wrap.appendChild(h('div','side-group', t.group)); }
    var pk = state.tab+'/'+t.id;
    var dotCls = progress[pk] ? 'dot done' : 'dot';
    var b = h('button','side-item '+(i===state.idx?'active '+state.tab:''),
      '<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="lbl">'+t.title+
      (t.type==='demo'?'<span class="play-badge">▶ demo</span>':'')+'</span>'+
      (t.type==='demo'?'':'<span class="'+dotCls+'"></span>'));
    b.onclick = function(){ state.idx=i; persist(); renderMain(); renderSidebar(); window.scrollTo({top:0,behavior:'smooth'}); };
    wrap.appendChild(b);
  });
}

/* ============================================================
   RENDER — LEARN mode
   ============================================================ */
function cheatBlock(items){
  var out = '';
  items.forEach(function(it){
    if(typeof it === 'string'){ out += '<li>'+it+'</li>'; return; }
  });
  return out;
}
function renderCheatItems(items){
  var html='', bullets=[];
  function flush(){ if(bullets.length){ html += '<ul class="cheat-list">'+bullets.join('')+'</ul>'; bullets=[]; } }
  items.forEach(function(it){
    if(typeof it === 'string'){ bullets.push('<li>'+it+'</li>'); return; }
    flush();
    if(it.t==='table'){
      html += '<div class="tbl-wrap"><table class="cmp"><thead><tr>'+
        it.head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+
        it.rows.map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>'; }).join('')+
        '</tbody></table></div>';
    } else if(it.t==='mnemonic'){
      html += '<div class="mnemonic"><b>Memory hook —</b> '+it.text+'</div>';
    } else if(it.t==='nums'){
      html += '<div class="numbers">'+it.items.map(function(n){
        return '<div class="numchip"><b>'+n.v+'</b><span>'+n.l+'</span></div>'; }).join('')+'</div>';
    }
  });
  flush();
  return html;
}

function renderLearn(){
  var t = curTopic(), tabk = state.tab, T = tabDef(tabk);
  if(t.type==='demo'){ renderDemoTopic(t); return; }
  var pk = tabk+'/'+t.id, done = !!progress[pk];
  var html = '';
  html += '<div class="eyebrow '+tabk+'">'+T.label+' · topic '+(state.idx+1)+' of '+curTopics().length+
          (t.group?' · '+t.group:'')+'</div>';
  html += '<h2>'+t.title+'</h2>';
  html += '<p class="lede">'+t.lede+'</p>';
  if(t.animate && ANIM[t.animate]) html += '<div class="visual">'+ANIM[t.animate]+'</div>';
  if(t.say) html += '<div class="say"><div class="say-h">▸ Say this in the interview</div><p>'+t.say+'</p></div>';
  if(t.steps && t.steps.length){
    html += '<h3>How it works</h3><ul class="steps">'+t.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';
  }
  if(t.code) html += '<h3>Example</h3><pre><code>'+t.code+'</code></pre>';
  if(t.note) html += '<div class="callout '+t.note.type+'"><b class="callout-label">Note</b> '+t.note.text+'</div>';
  if(t.table){
    html += '<h3>'+(t.table.title||'Comparison')+'</h3>'+renderCheatItems([{t:'table',head:t.table.head,rows:t.table.rows}]);
  }
  if(t.traps && t.traps.length){
    html += '<h3>Traps &amp; gotchas</h3><ul class="traps">'+t.traps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';
  }
  if(t.terms && t.terms.length){
    html += '<h3>Key terms</h3><div class="term-grid">'+t.terms.map(function(tm){
      return '<details class="term"><summary><span class="t-head"><b>'+tm.term+'</b></span><span class="t-desc">'+tm.desc+'</span></summary>'+
             '<div class="term-expand"><p>'+tm.detail+'</p>'+(tm.code?'<pre><code>'+tm.code+'</code></pre>':'')+'</div></details>';
    }).join('')+'</div>';
  }
  if(t.cards && t.cards.length){
    html += '<h3>Recall check</h3><div class="term-grid">'+t.cards.map(function(c,i){
      return '<details class="term"><summary><span class="t-head"><b>Q'+(i+1)+'</b></span><span class="t-desc">'+c.q+'</span></summary>'+
             '<div class="term-expand"><p>'+c.a+'</p></div></details>';
    }).join('')+'</div>';
  }
  html += '<div class="markdone"><button id="doneBtn" class="'+(done?'on':'')+'">'+(done?'✓ Marked as learned':'Mark as learned')+'</button></div>';
  el('sections').innerHTML = html;
  el('doneBtn').onclick = function(){
    if(progress[pk]) delete progress[pk]; else progress[pk]=1;
    saveProgress(); renderLearn(); renderSidebar(); renderStats();
  };
  showFooter(true);
}

/* ============================================================
   RENDER — CARDS mode
   ============================================================ */
var deck = { list:[], i:0, revealed:false, done:0 };
function buildDeck(){
  deck.list = deckFor(state.deckScope);
  // stable-ish shuffle for due/all
  if(state.deckScope!=='tab'){ deck.list.sort(function(a,b){ return (srs[a.key]?srs[a.key].d:0) - (srs[b.key]?srs[b.key].d:0); }); }
  deck.i=0; deck.revealed=false; deck.done=0;
}
function renderCards(){
  showFooter(false);
  var scopes=[['due','Due now'],['tab','This track'],['all','Everything'],['weak','Weak spots']];
  var html = '<div class="deck-head"><div class="deck-scope">'+scopes.map(function(s){
      return '<button data-s="'+s[0]+'" class="'+(state.deckScope===s[0]?'on':'')+'">'+s[1]+'</button>';
    }).join('')+'</div><span class="stat-pill">Deck <b>'+deck.list.length+'</b></span>'+
    '<button class="mini-btn" id="deckShuffle">⇄ Shuffle</button></div>';

  if(!deck.list.length){
    html += '<div class="deck-empty"><b>Nothing due right now.</b>Switch scope to “This track” or “Everything” to keep drilling, or come back later — spaced repetition works best with gaps.</div>';
    el('sections').innerHTML = html; wireDeckHead(); return;
  }
  var c = deck.list[Math.min(deck.i, deck.list.length-1)];
  var s = srs[c.key];
  var meta = s ? ('seen '+s.r+'× · lapses '+s.l+' · next '+(s.i<1?'<1d':Math.round(s.i)+'d')) : 'new card';
  html += '<div class="card-shell"><div class="flash">'+
    '<div class="fc-tag">'+c.tabLabel+' · '+c.topic.title+'</div>'+
    '<div class="fc-q">'+c.card.q+'</div>'+
    (deck.revealed? '<div class="fc-a">'+c.card.a+'</div>' : '')+
    '</div>';
  if(!deck.revealed){
    html += '<div class="flash-actions"><button class="reveal" id="revealBtn">Show answer &nbsp;<span style="opacity:.7">space</span></button></div>';
  } else {
    html += '<div class="flash-actions">'+
      '<button class="grade-again" data-g="0">Again <span style="opacity:.6">1</span></button>'+
      '<button class="grade-hard"  data-g="1">Hard <span style="opacity:.6">2</span></button>'+
      '<button class="grade-good"  data-g="2">Good <span style="opacity:.6">3</span></button>'+
      '<button class="grade-easy"  data-g="3">Easy <span style="opacity:.6">4</span></button></div>';
  }
  html += '<div class="deck-meta"><span>'+(deck.i+1)+' / '+deck.list.length+'</span><span>'+meta+'</span></div>';
  html += '<div class="dp-progress"><div class="dp-progress-fill" style="width:'+(((deck.i)/deck.list.length)*100)+'%"></div></div></div>';
  el('sections').innerHTML = html;
  wireDeckHead();
  var rb = el('revealBtn'); if(rb) rb.onclick = function(){ deck.revealed=true; renderCards(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-g]'), function(b){
    b.onclick = function(){ doGrade(Number(b.dataset.g)); };
  });
}
function doGrade(g){
  var c = deck.list[deck.i]; if(!c) return;
  gradeCard(c.key, g);
  if(g===0){ deck.list.push(c); }             // requeue at end of session
  deck.i++; deck.done++;
  if(deck.i>=deck.list.length){ deck.i=0; buildDeck(); }
  deck.revealed=false; renderCards(); renderStats();
}
function wireDeckHead(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-s]'), function(b){
    b.onclick = function(){ state.deckScope=b.dataset.s; LS.set('deckScope',state.deckScope); buildDeck(); renderCards(); };
  });
  var sh = el('deckShuffle');
  if(sh) sh.onclick = function(){
    for(var i=deck.list.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=deck.list[i]; deck.list[i]=deck.list[j]; deck.list[j]=t; }
    deck.i=0; deck.revealed=false; renderCards();
  };
}

/* ============================================================
   RENDER — QUIZ mode
   ============================================================ */
var quiz = { list:[], answered:{}, ok:0, no:0 };
function buildQuiz(){
  var src = state.quizScope==='all' ? TABS : [tabDef(state.tab)];
  var out=[];
  src.forEach(function(T){ T.topics.forEach(function(t){
    if(!t.quiz) return;
    t.quiz.forEach(function(q,n){ out.push({tab:T.k,tabLabel:T.label,topic:t,q:q,key:T.k+'/'+t.id+'/'+n}); });
  });});
  for(var i=out.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=out[i]; out[i]=out[j]; out[j]=tmp; }
  quiz.list = out.slice(0, 25); quiz.answered={}; quiz.ok=0; quiz.no=0;
}
function renderQuiz(){
  showFooter(false);
  var html = '<div class="quiz-score">'+
    '<div class="deck-scope">'+
      '<button data-qs="tab" class="'+(state.quizScope==='tab'?'on':'')+'">This track</button>'+
      '<button data-qs="all" class="'+(state.quizScope==='all'?'on':'')+'">Everything</button>'+
    '</div>'+
    '<span class="sc">Correct <b>'+quiz.ok+'</b></span><span class="sc">Wrong <b>'+quiz.no+'</b></span>'+
    '<button class="mini-btn" id="quizNew">↻ New set of 25</button></div>';
  if(!quiz.list.length){ html += '<div class="deck-empty"><b>No questions in this track yet.</b>Try “Everything”.</div>'; }
  quiz.list.forEach(function(item, qi){
    var a = quiz.answered[qi];
    html += '<div class="quiz-card">'+
      '<div class="fc-tag" style="font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin-bottom:7px">'+item.tabLabel+' · '+item.topic.title+'</div>'+
      '<div class="quiz-q">'+item.q.q+'</div>'+
      (item.q.code? '<pre><code>'+item.q.code+'</code></pre>':'')+
      '<div class="quiz-opts">'+item.q.options.map(function(o,oi){
        var cls='quiz-opt';
        if(a!=null){ if(oi===item.q.answer) cls+=' correct'; else if(oi===a) cls+=' wrong'; }
        return '<button class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'"'+(a!=null?' disabled':'')+'>'+
               '<span class="ltr">'+'ABCDEF'[oi]+'</span><span>'+o+'</span></button>';
      }).join('')+'</div>'+
      (a!=null? '<div class="quiz-why"><b>'+(a===item.q.answer?'Correct.':'Not quite.')+'</b> '+item.q.why+'</div>':'')+
      '</div>';
  });
  el('sections').innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('[data-qs]'), function(b){
    b.onclick = function(){ state.quizScope=b.dataset.qs; LS.set('quizScope',state.quizScope); buildQuiz(); renderQuiz(); };
  });
  el('quizNew').onclick = function(){ buildQuiz(); renderQuiz(); window.scrollTo({top:0}); };
  Array.prototype.forEach.call(document.querySelectorAll('.quiz-opt'), function(b){
    b.onclick = function(){
      var qi=Number(b.dataset.q), oi=Number(b.dataset.o);
      if(quiz.answered[qi]!=null) return;
      quiz.answered[qi]=oi;
      var item=quiz.list[qi], k=item.key, rec=quizLog[k]||{ok:0,no:0};
      if(oi===item.q.answer){ quiz.ok++; rec.ok++; } else { quiz.no++; rec.no++; }
      quizLog[k]=rec; saveQuiz();
      renderQuiz();
    };
  });
}

/* ============================================================
   RENDER — CHEAT mode
   ============================================================ */
function renderCheat(){
  showFooter(false);
  var T = tabDef(state.tab);
  var html = '<div class="eyebrow '+state.tab+'">'+T.label+' — rapid review</div>'+
    '<h2>'+T.label+' cheat sheet</h2>'+
    '<p class="lede">Every topic in this track, compressed to what you must be able to say. Read top-to-bottom the night before.</p>'+
    '<div class="cheat-toolbar"><button class="mini-btn" onclick="window.print()">⎙ Print / save PDF</button>'+
    '<span class="stat-pill">'+T.topics.filter(function(t){return t.type!=='demo';}).length+' topics</span></div>';
  var n=0;
  T.topics.forEach(function(t){
    if(t.type==='demo') return;
    n++;
    html += '<div class="cheat-sec"><div class="cheat-h"><span class="cn">'+String(n).padStart(2,'0')+'</span>'+t.title+'</div>';
    if(t.say) html += '<ul class="cheat-list"><li>'+t.say+'</li></ul>';
    if(t.cheat && t.cheat.length) html += renderCheatItems(t.cheat);
    else if(t.steps) html += '<ul class="cheat-list">'+t.steps.slice(0,4).map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>';
    html += '</div>';
  });
  el('sections').innerHTML = html;
}

/* ============================================================
   FOOTER NAV
   ============================================================ */
function showFooter(v){ el('navFooter').style.display = v? 'flex':'none'; }
function renderFooter(){
  var list = curTopics();
  var isFirst = state.idx===0 && state.tab===TABS[0].k;
  var isLast  = state.idx===list.length-1 && state.tab===TABS[TABS.length-1].k;
  el('prevSec').disabled = isFirst;
  el('nextSec').disabled = isLast;
  el('nextSec').textContent = isLast ? 'End of reference' : 'Next topic →';
}
function goPrev(){
  if(state.idx>0) state.idx--;
  else { var i=tabIndex(state.tab); if(i>0){ state.tab=TABS[i-1].k; state.idx=topics(state.tab).length-1; } }
  persist(); renderAll(); window.scrollTo({top:0,behavior:'smooth'});
}
function goNext(){
  var list=curTopics();
  if(state.idx<list.length-1) state.idx++;
  else { var i=tabIndex(state.tab); if(i<TABS.length-1){ state.tab=TABS[i+1].k; state.idx=0; } }
  persist(); renderAll(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   SEARCH
   ============================================================ */
var searchIndex=[];
function buildSearch(){
  searchIndex=[];
  TABS.forEach(function(T,ti){
    T.topics.forEach(function(t,i){
      var blob = [t.title, t.lede, t.say,
        (t.steps||[]).join(' '),
        (t.traps||[]).join(' '),
        (t.terms||[]).map(function(x){return x.term+' '+x.desc;}).join(' '),
        (t.cards||[]).map(function(x){return x.q;}).join(' '),
        (t.cheat||[]).map(function(x){ return typeof x==='string'? x : (x.text|| (x.head||[]).join(' ')); }).join(' ')
      ].join(' ');
      searchIndex.push({tab:T.k, tabLabel:T.label, idx:i, title:t.title, blob:stripTags(blob).toLowerCase()});
    });
  });
}
function doSearch(q){
  var box = el('searchres');
  q = q.trim().toLowerCase();
  if(q.length<2){ box.innerHTML=''; return; }
  var words = q.split(/\s+/);
  var hits = searchIndex.map(function(r){
    var score=0;
    words.forEach(function(w){
      if(r.title.toLowerCase().indexOf(w)>=0) score+=8;
      var c = r.blob.split(w).length-1; score += Math.min(c,6);
    });
    return {r:r, s:score};
  }).filter(function(x){ return x.s>0; }).sort(function(a,b){ return b.s-a.s; }).slice(0,12);
  box.innerHTML = hits.map(function(x,i){
    return '<div class="sr-item'+(i===0?' sel':'')+'" data-tab="'+x.r.tab+'" data-idx="'+x.r.idx+'"><b>'+x.r.title+'</b><span class="sr-tab">'+x.r.tabLabel+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.sr-item'), function(it){
    it.onclick = function(){ jumpTo(it.dataset.tab, Number(it.dataset.idx)); };
  });
}
function jumpTo(tab, idx){
  state.tab=tab; state.idx=idx; state.mode='learn'; persist();
  el('searchInput').value=''; el('searchres').innerHTML='';
  renderAll(); window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   DEMO PLAYER (generic, column-declarative)
   ============================================================ */
function Fd(cls,label,ref){ return '<div class="dp-frame '+cls+'"><span>'+label+'</span>'+(ref?'<span class="ref">'+ref+'</span>':'')+'</div>'; }
window.Fd = Fd;
var DP_EMPTY = '<div class="dp-empty">empty</div>';
var demoRT = {};   // group -> {si, i, playing, timer}

function renderDemoTopic(t){
  var group = t.demoGroup, list = DEMOS[group] || [];
  if(!demoRT[group]) demoRT[group] = {si:0, i:0, playing:false, timer:null};
  var rt = demoRT[group];
  if(rt.si >= list.length) rt.si = 0;
  var sc = list[rt.si];
  var T = tabDef(state.tab);
  var html = '<div class="eyebrow '+state.tab+'">'+T.label+' — interactive demo</div><h2>'+t.title+'</h2>'+
    '<p class="lede">'+(t.lede||'Step through real code and watch every subsystem move together. Use <b>Play</b> to watch, or <b>Next</b> to control the pace.')+'</p>'+
    '<div class="scenario-picker">'+list.map(function(s,i){
      return '<button class="scenario-chip'+(i===rt.si?' active':'')+'" data-si="'+i+'">'+s.label+'</button>';
    }).join('')+'</div>'+
    '<div class="dp-layout"><div class="dp-code" id="dpCode"></div><div>'+
      '<div class="dp-ring" id="dpRing"></div>'+
      '<div class="dp-grid" id="dpGrid"></div>'+
      '<div class="dp-console" id="dpConsole"></div>'+
      '<div class="dp-note" id="dpNote"></div>'+
      '<div class="dp-progress"><div class="dp-progress-fill" id="dpProgress"></div></div>'+
      '<div class="dp-controls">'+
        '<button id="dpPrev">Back</button><button id="dpNext" class="primary">Next</button>'+
        '<button id="dpPlay">▶ Play</button><button id="dpReset">Reset</button>'+
        '<span class="dp-step-count" id="dpCount"></span></div>'+
    '</div></div>';
  if(sc.takeaway) html += '<div class="callout info"><b class="callout-label">Takeaway</b> '+sc.takeaway+'</div>';
  el('sections').innerHTML = html;
  el('dpCode').innerHTML = sc.code.map(function(l,i){ return '<div class="dp-code-line" data-i="'+i+'">'+(l||'&nbsp;')+'</div>'; }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-si]'), function(b){
    b.onclick = function(){ stopDemo(group); rt.si=Number(b.dataset.si); rt.i=0; renderDemoTopic(t); };
  });
  el('dpPrev').onclick = function(){ stopDemo(group); stepDemo(group,-1); };
  el('dpNext').onclick = function(){ stopDemo(group); stepDemo(group,1); };
  el('dpReset').onclick= function(){ stopDemo(group); rt.i=0; paintDemo(group); };
  el('dpPlay').onclick = function(){ rt.playing ? stopDemo(group) : startDemo(group); };
  paintDemo(group);
  showFooter(true);
}
function curDemoScenario(group){ var rt=demoRT[group]; return DEMOS[group][rt.si]; }
function stepDemo(group, dir){
  var rt=demoRT[group], sc=curDemoScenario(group);
  rt.i = Math.max(0, Math.min(sc.steps.length-1, rt.i+dir));
  paintDemo(group);
  if(rt.i===sc.steps.length-1) stopDemo(group);
}
function startDemo(group){
  var rt=demoRT[group]; rt.playing=true;
  var b=el('dpPlay'); if(b) b.textContent='⏸ Pause';
  rt.timer=setInterval(function(){
    var sc=curDemoScenario(group);
    if(rt.i>=sc.steps.length-1){ stopDemo(group); return; }
    stepDemo(group,1);
  }, 2200);
}
function stopDemo(group){
  var rt=demoRT[group]; if(!rt) return;
  rt.playing=false; clearInterval(rt.timer);
  var b=el('dpPlay'); if(b) b.textContent='▶ Play';
}
var PHASE_COLOR = {run:'accent',idle:'sub',micro:'micro',macro:'js',timers:'js',pending:'pool',poll:'node',check:'tick',close:'micro',
  cold:'aws',warm:'node',invoke:'accent',err:'tick',commit:'node',read:'db',write:'aws',gen:'ai',ret:'ai'};
function paintDemo(group){
  var rt=demoRT[group], sc=curDemoScenario(group), step=sc.steps[rt.i];
  Array.prototype.forEach.call(document.querySelectorAll('#dpCode .dp-code-line'), function(e){
    e.classList.toggle('active', Number(e.dataset.i)===step.line);
  });
  el('dpRing').innerHTML = (sc.phases||[]).map(function(p){
    var on = p.k===step.phase, c = p.c || PHASE_COLOR[p.k] || 'accent';
    return '<div class="dp-phase'+(on?' on':'')+'" style="'+(on?'background:var(--'+c+');':'')+'">'+p.label+'</div>';
  }).join('');
  el('dpGrid').innerHTML = sc.cols.map(function(col){
    var items = (step.cols && step.cols[col.k]) || [];
    var workers = '';
    if(col.workers && step.w){
      workers = '<div class="dp-workers">'+step.w.map(function(b,i){ return '<div class="dp-worker '+(b?'busy':'')+'">W'+(i+1)+(b?' •':'')+'</div>'; }).join('')+'</div>';
    }
    return '<div class="dp-card"><h4><span class="dp-dot" style="background:var(--'+(col.c||'accent')+')"></span>'+col.label+'</h4>'+
           workers+'<div class="dp-items">'+(items.length? items.join('') : DP_EMPTY)+'</div></div>';
  }).join('');
  el('dpConsole').innerHTML = (step.out && step.out.length)
    ? step.out.map(function(o,i){ return '<div class="r">&gt; <span>'+o+'</span></div>'; }).join('')
    : '<div class="r" style="opacity:.5">output will appear here</div>';
  el('dpNote').innerHTML = step.note;
  el('dpCount').textContent = 'Step '+(rt.i+1)+' / '+sc.steps.length;
  el('dpProgress').style.width = (((rt.i+1)/sc.steps.length)*100)+'%';
  el('dpPrev').disabled = rt.i===0;
  el('dpNext').disabled = rt.i===sc.steps.length-1;
}

/* ============================================================
   MASTER RENDER
   ============================================================ */
function renderMain(){
  Object.keys(demoRT).forEach(stopDemo);
  if(state.mode==='learn') renderLearn();
  else if(state.mode==='cards'){ buildDeck(); renderCards(); }
  else if(state.mode==='quiz'){ buildQuiz(); renderQuiz(); }
  else renderCheat();
}
function renderAll(){
  applyChrome(); renderTabs(); renderModes(); renderSidebar(); renderMain(); renderFooter(); renderStats();
}

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'){
    if(e.key==='Escape'){ e.target.blur(); el('searchres').innerHTML=''; }
    if(e.key==='Enter'){ var f=document.querySelector('.sr-item'); if(f) f.click(); }
    return;
  }
  if(e.key==='/'){ e.preventDefault(); el('searchInput').focus(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(state.mode==='cards'){
    if(e.key===' '){ e.preventDefault(); if(!deck.revealed && deck.list.length){ deck.revealed=true; renderCards(); } return; }
    if(deck.revealed && ['1','2','3','4'].indexOf(e.key)>=0){ doGrade(Number(e.key)-1); return; }
  }
  if(e.key==='j'){ goNext(); }
  else if(e.key==='k'){ goPrev(); }
  else if(e.key==='l'){ state.mode='learn'; persist(); renderAll(); }
  else if(e.key==='c'){ state.mode='cards'; persist(); renderAll(); }
  else if(e.key==='q'){ state.mode='quiz'; persist(); renderAll(); }
  else if(e.key==='s'){ state.mode='cheat'; persist(); renderAll(); }
  else if(e.key==='t'){ window.__toggleTheme(); }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  if(!tabDef(state.tab)) state.tab='js';
  el('prevSec').onclick = goPrev;
  el('nextSec').onclick = goNext;
  el('themeBtn').onclick = window.__toggleTheme;
  el('fsBtn').onclick = window.__cycleFs;
  el('resetBtn').onclick = function(){
    if(!confirm('Reset all progress, card scheduling and quiz history?')) return;
    progress={}; srs={}; quizLog={}; saveProgress(); saveSrs(); saveQuiz(); renderAll();
  };
  var si = el('searchInput');
  si.addEventListener('input', function(){ doSearch(si.value); });
  document.addEventListener('click', function(e){
    if(!e.target.closest || !e.target.closest('.searchwrap')) el('searchres').innerHTML='';
  });
  buildSearch();
  renderAll();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
